name: Author comment reply checks
on:
  pull_request:
    paths:
      - 'core/library/book-comments.js'
      - 'applications/library/page-ui/comment-editor.js'
      - 'applications/library/page-ui/reader-end.js'
      - 'applications/library/library-css/reader-comments.css'
      - 'applications/library/design/author-comment-replies*'
      - 'applications/library/tests/author-comment-replies-browser.mjs'
      - 'core/tests/library/book-comments.test.js'
      - 'core/tests/library/author-comment-replies-ui.mjs'
      - '.github/workflows/author-comment-replies-tests.yml'
permissions:
  contents: read
jobs:
  unit-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test core/tests/library/book-comments.test.js
      - run: npm install --prefix "$RUNNER_TEMP/chapter-reactions" jsdom@26
      - run: node --experimental-vm-modules --test core/tests/library/author-comment-replies-ui.mjs
        env:
          JSDOM_MODULE: ${{ runner.temp }}/chapter-reactions/node_modules/jsdom
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/chapter-reaction-browser" playwright@1.61.1
      - run: '"$RUNNER_TEMP/chapter-reaction-browser/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}'
      - run: node applications/library/tests/author-comment-replies-browser.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/chapter-reaction-browser/node_modules/playwright/index.mjs
          REACTION_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comment-replies-${{ matrix.browser }}
          path: test-results/comment-replies/
