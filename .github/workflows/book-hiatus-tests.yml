name: Book inactivity and hiatus checks
on:
  pull_request:
    paths:
      - 'core/library/hiatus*'
      - 'core/notifications/client.js'
      - 'core/tests/library/hiatus*'
      - 'applications/library/page-ui/hiatus.js'
      - 'applications/library/page-ui/book.js'
      - 'applications/library/pages/book.html'
      - 'applications/library/library-css/book.css'
      - 'applications/library/tests/hiatus-browser.mjs'
      - 'supabase/live-site/supabase-book-hiatus.sql'
      - '.github/workflows/book-hiatus-tests.yml'
permissions:
  contents: read
jobs:
  hiatus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test core/tests/library/*.test.js core/tests/notifications/*.test.js
      - run: npm install --prefix "$RUNNER_TEMP/hiatus" --no-audit --no-fund @electric-sql/pglite@0.5.11 jsdom@26 playwright@1.61.1
      - run: node --test core/tests/library/hiatus-ui.mjs
        env:
          JSDOM_MODULE: ${{ runner.temp }}/hiatus/node_modules/jsdom/lib/api.js
      - run: node --test core/tests/library/hiatus-database.mjs
        env:
          PGLITE_MODULE: ${{ runner.temp }}/hiatus/node_modules/@electric-sql/pglite/dist/index.js
      - run: '"$RUNNER_TEMP/hiatus/node_modules/.bin/playwright" install --with-deps chromium'
      - run: node applications/library/tests/hiatus-browser.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/hiatus/node_modules/playwright/index.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-hiatus-screenshots
          path: test-results/hiatus
