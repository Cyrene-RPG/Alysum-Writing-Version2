name: Editor mobile tools
on:
  pull_request:
    paths:
      - 'applications/editor/pages/editor.html'
      - 'applications/editor/page-ui/page/chrome.js'
      - 'applications/editor/page-ui/pending-recovery.js'
      - 'applications/editor/page-ui/daily-goal.js'
      - 'applications/editor/editor-css/page/main.css'
      - 'applications/editor/page-ui/page/typewriter.js'
      - 'applications/editor/page-ui/page.js'
      - 'applications/editor/page-ui/toolbar.js'
      - 'applications/editor/editor-css/page/shell.css'
      - 'applications/editor/editor-css/page/typewriter.css'
      - 'applications/editor/tests/mobile-tools.mjs'
      - '.github/workflows/editor-mobile-tools.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/editor-tools" --no-audit --no-fund playwright@1.61.1
      - run: '"$RUNNER_TEMP/editor-tools/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}'
      - run: node applications/editor/tests/mobile-tools.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/editor-tools/node_modules/playwright/index.mjs
          EDITOR_TOOLS_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-mobile-tools-${{ matrix.browser }}
          path: test-results/editor-mobile-tools/
