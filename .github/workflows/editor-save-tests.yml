name: Editor save protection
on:
  pull_request:
    paths:
      - 'applications/editor/page-ui/autosave.js'
      - 'applications/editor/page-ui/page.js'
      - 'applications/editor/page-ui/page/persist-hooks.js'
      - 'applications/editor/pages/editor.html'
      - 'applications/editor/tests/autosave.test.js'
      - 'applications/editor/tests/save-exit.mjs'
      - 'applications/editor/page-ui/pending-recovery.js'
      - 'applications/editor/tests/pending-recovery.mjs'
      - 'core/synchronization-engine/pending-copies.js'
      - 'core/synchronization-engine/books.js'
      - 'core/tests/collaboration/**'
      - 'core/authentication/client.js'
      - 'core/tests/authentication/**'
      - 'core/writing-engine/book-backup.js'
      - 'applications/studio/page-ui/manuscript-*.js'
      - 'applications/studio/tests/backup-import.mjs'
      - 'applications/editor/page-ui/page/preview-session.js'
      - 'core/synchronization-engine/cloud-adapter.js'
      - 'core/synchronization-engine/conflict-resolver.js'
      - '.github/workflows/editor-save-tests.yml'
permissions:
  contents: read
jobs:
  save-protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test applications/editor/tests/autosave.test.js core/tests/collaboration/*.test.js core/tests/writing-engine/*.test.js
      - run: npm install --prefix "$RUNNER_TEMP/editor-save" jsdom@26
      - run: node --experimental-vm-modules --test applications/editor/tests/save-exit.mjs applications/editor/tests/pending-recovery.mjs applications/studio/tests/backup-import.mjs core/tests/authentication/transport.mjs
        env:
          JSDOM_MODULE: ${{ runner.temp }}/editor-save/node_modules/jsdom/lib/api.js
