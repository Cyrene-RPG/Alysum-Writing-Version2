name: Moderation design checks
on:
  pull_request:
    paths:
      - 'applications/moderation/design/**'
      - '.github/workflows/moderation-design-tests.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/moderation-design" playwright@1.61.1
      - run: '"$RUNNER_TEMP/moderation-design/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}'
      - run: node applications/moderation/design/browser.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/moderation-design/node_modules/playwright/index.mjs
          DESIGN_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moderation-design-${{ matrix.browser }}
          path: test-results/moderation-design/
