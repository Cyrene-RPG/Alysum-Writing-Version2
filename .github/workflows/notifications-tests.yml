name: Notification inbox checks
on:
  push:
    branches: [feature/private-notification-inbox, feature/book-subscriptions, feature/notification-confirmations, feature/private-connections]
  pull_request:
    paths:
      - 'core/notifications/**'
      - 'core/account/connections.js'
      - 'applications/connections/**'
      - 'core/library/author-follow.js'
      - 'supabase/live-site/supabase-private-connections.sql'
      - 'core/library/subscriptions.js'
      - 'applications/library/page-ui/subscription.js'
      - 'core/tests/notifications/**'
      - 'applications/notifications/**'
      - 'site-appearance/js-runtime/notification-bell.js'
      - 'supabase/live-site/supabase-notifications-inbox.sql'
      - 'supabase/live-site/supabase-book-subscriptions.sql'
      - 'supabase/live-site/supabase-notification-confirmations.sql'
      - 'supabase/live-site/supabase-comment-notifications.sql'
      - '.github/workflows/notifications-tests.yml'
permissions:
  contents: read
jobs:
  inbox:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notifications_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notifications_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript behavior
        run: node --test core/tests/notifications/*.test.js core/tests/library/author-follow.test.js
      - name: Create disposable Supabase-like schemas
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f core/tests/notifications/setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/live-site/supabase-author-follows.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/live-site/supabase-updates-announcements.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f core/tests/notifications/baseline.sql
      - name: Check migrations, delivery and privacy against PostgreSQL
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/live-site/supabase-notifications-inbox.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/live-site/supabase-notifications-inbox.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f core/tests/notifications/inbox.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f core/tests/notifications/reading-baseline.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/live-site/supabase-book-subscriptions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/live-site/supabase-book-subscriptions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f core/tests/notifications/reading.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/live-site/supabase-notification-confirmations.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/live-site/supabase-notification-confirmations.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f core/tests/notifications/confirmations.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f core/tests/notifications/connections-baseline.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/live-site/supabase-private-connections.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/live-site/supabase-private-connections.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f core/tests/notifications/connections.sql

  comment-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/comment-notifications" @electric-sql/pglite@0.5.11
      - run: node --test core/tests/notifications/comment-notifications-database.mjs
        env:
          PGLITE_MODULE: ${{ runner.temp }}/comment-notifications/node_modules/@electric-sql/pglite/dist/index.js
