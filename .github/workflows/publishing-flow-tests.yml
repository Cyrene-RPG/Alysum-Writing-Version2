name: Publishing flow
on:
  pull_request:
    paths:
      - 'applications/studio/**'
      - 'applications/library/page-ui/book.js'
      - 'core/publishing/**'
      - 'core/library/author-profile.js'
      - 'core/tests/publishing/**'
      - '.github/workflows/publishing-flow-tests.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/publish-browser" --no-audit --no-fund playwright@1.61.1
      - run: '"$RUNNER_TEMP/publish-browser/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}'
      - run: node applications/studio/tests/publishing-flow-browser.mjs
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/publish-browser/node_modules/playwright/index.mjs
          PUBLISH_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publishing-flow-${{ matrix.browser }}
          path: test-results/publishing-flow/
