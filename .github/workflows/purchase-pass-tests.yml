name: Purchase Pass test lab
on:
  pull_request:
    paths:
      - 'core/purchase-passes/**'
      - 'core/tests/purchase-passes/**'
      - 'core/server/http-handlers/pass-test.mjs'
      - 'functions/api/pass-test.js'
      - 'applications/studio/page-ui/pass-lab*'
      - 'applications/studio/pages/pass-test.html'
      - 'applications/studio/studio-css/pass-lab.css'
      - 'applications/studio/tests/pass-lab-browser.mjs'
      - 'supabase/live-site/supabase-purchase-pass-test.sql'
      - 'applications/main-site/public/sw.js'
      - '.github/workflows/purchase-pass-tests.yml'
permissions:
  contents: read
jobs:
  passes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/pass-lab" --no-audit --no-fund playwright@1.61.1 @electric-sql/pglite@0.3.14
      - run: node --test core/tests/purchase-passes/passes.test.mjs
        env:
          PGLITE_MODULE: ${{ runner.temp }}/pass-lab/node_modules/@electric-sql/pglite/dist/index.js
      - run: '"$RUNNER_TEMP/pass-lab/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}'
      - run: node applications/studio/tests/pass-lab-browser.mjs
        env:
          PGLITE_MODULE: ${{ runner.temp }}/pass-lab/node_modules/@electric-sql/pglite/dist/index.js
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/pass-lab/node_modules/playwright/index.mjs
          PASS_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purchase-pass-${{ matrix.browser }}
          path: test-results/pass-lab/
