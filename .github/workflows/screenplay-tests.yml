name: Screenplay foundation checks
on:
  push:
    branches: [feature/screenplay-editor]
  pull_request:
    paths:
      - 'core/screenplays/**'
      - 'core/tests/screenplays/**'
      - 'applications/studio/**'
      - 'supabase/live-site/supabase-screenplays.sql'
      - '.github/workflows/screenplay-tests.yml'
permissions:
  contents: read
jobs:
  screenplay-data:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: screenplay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/screenplay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test core/tests/screenplays/*.test.js
      - name: Private scripts, version conflicts and rerunnable setup
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f core/tests/screenplays/setup.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/live-site/supabase-screenplays.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/live-site/supabase-screenplays.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f core/tests/screenplays/database.sql
  screenplay-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/script-browser" --no-audit --no-fund playwright@1.61.1
          "$RUNNER_TEMP/script-browser/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Real screenplay and native Studio
        run: EDITOR_BROWSER="${{ matrix.browser }}" PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/script-browser/node_modules/playwright/index.mjs" node applications/studio/tests/screenplays.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenplay-${{ matrix.browser }}
          path: test-results/screenplays
