name: Studio refresh and offline checks
on:
  pull_request:
    paths:
      - 'applications/main-site/public/sw.js'
      - 'core/tests/offline/**'
      - '.github/workflows/studio-refresh.yml'
permissions:
  contents: read
jobs:
  studio-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test core/tests/offline/*.test.js
