<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020b18" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="dark light">
    <meta name="application-name" content="Alysum">
    <link rel="icon" type="image/png" href="Alysum-3.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story Bible New — Alysum</title>
    <script src="js/alysum-appearance-boot.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #050b16;
            --card: #0f1729;
            --text: #e6ecff;
            --muted: #9aa8ca;
            --accent: #7c3aed;
            --ok: #34d399;
            --warn: #f59e0b;
            --danger: #fb7185;
            --line: rgba(140, 160, 220, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1b2a4f 0%, var(--bg) 60%);
            color: var(--text);
            font: 16px/1.4 "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        }

        .build-banner,
        .sbn-shell {
            width: min(1000px, calc(100% - 32px));
        }

        .build-banner {
            margin: 24px auto 0;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--card);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .build-banner strong {
            letter-spacing: 0.01em;
        }

        .mode-toggle {
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            padding: 10px 14px;
            white-space: nowrap;
        }

        .mode-toggle:hover {
            filter: brightness(1.1);
        }

        .sbn-shell {
            margin: 14px auto 30px;
            display: grid;
            gap: 14px;
        }

        .sbn-card {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--card);
            padding: 14px;
        }

        .sbn-card h2 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        .sbn-grid {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .sbn-field {
            display: grid;
            gap: 6px;
        }

        .sbn-field label {
            font-size: 13px;
            color: var(--muted);
        }

        .sbn-input,
        .sbn-textarea,
        .sbn-select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(4, 11, 24, 0.8);
            color: var(--text);
            padding: 10px 12px;
            font: inherit;
        }

        .sbn-textarea {
            min-height: 130px;
            resize: vertical;
        }

        .sbn-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .sbn-btn {
            border: 0;
            border-radius: 10px;
            padding: 9px 12px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .sbn-btn.primary {
            background: var(--accent);
            color: #fff;
        }

        .sbn-btn.ok {
            background: var(--ok);
            color: #052414;
        }

        .sbn-btn.warn {
            background: var(--warn);
            color: #201302;
        }

        .sbn-btn.ghost {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--line);
        }

        .sbn-status {
            min-height: 20px;
            color: var(--muted);
        }

        .sbn-status.error {
            color: var(--danger);
        }

        .sbn-pill {
            display: inline-block;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 4px 10px;
            margin: 0 6px 6px 0;
            font-size: 13px;
            color: var(--muted);
        }

        .sbn-review-list {
            display: grid;
            gap: 10px;
        }

        .sbn-review-item {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px;
            background: rgba(4, 11, 24, 0.45);
        }

        .sbn-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .sbn-review-meta {
            margin: 6px 0 0;
            font-size: 13px;
            color: var(--muted);
        }

        .sbn-conflict {
            margin-top: 8px;
            border: 1px solid rgba(245, 158, 11, 0.45);
            border-radius: 10px;
            padding: 8px;
            background: rgba(245, 158, 11, 0.08);
            display: none;
        }

        .sbn-conflict.open {
            display: block;
        }

        .sbn-facts-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .sbn-facts-table th,
        .sbn-facts-table td {
            border-bottom: 1px solid var(--line);
            padding: 7px 6px;
            text-align: left;
            vertical-align: top;
        }

        .sbn-facts-empty {
            color: var(--muted);
        }

        @media (max-width: 760px) {
            .sbn-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="build-banner">
        <strong>Webpage build in progress</strong>
        <a id="modeToggleBtn" class="mode-toggle" href="story-bible-legacy.html">Switch to Legacy</a>
    </header>
    <main class="sbn-shell">
        <section class="sbn-card">
            <h2>Rule-based Character Fact Extraction</h2>
            <div id="sbnStatus" class="sbn-status"></div>
            <div id="sbnKnownChars"></div>
        </section>

        <section class="sbn-card">
            <h2>Selection intake</h2>
            <div class="sbn-grid">
                <div class="sbn-field">
                    <label for="sbnSourceChapter">Source chapter</label>
                    <input id="sbnSourceChapter" class="sbn-input" type="text" placeholder="Chapter title or ID" />
                </div>
                <div class="sbn-field">
                    <label for="sbnSourceParagraph">Source paragraph</label>
                    <input id="sbnSourceParagraph" class="sbn-input" type="text" placeholder="Paragraph index" />
                </div>
                <div class="sbn-field" style="grid-column: 1 / -1">
                    <label for="sbnDefaultCharacter">Fallback character (used only when text has no explicit known name)</label>
                    <select id="sbnDefaultCharacter" class="sbn-select">
                        <option value="">None</option>
                    </select>
                </div>
                <div class="sbn-field" style="grid-column: 1 / -1">
                    <label for="sbnManualCharacter">Manual fallback character name</label>
                    <input id="sbnManualCharacter" class="sbn-input" type="text" placeholder="Type a character name if none is loaded yet" />
                </div>
            </div>
            <div id="sbnDetectedNames" style="margin-top: 10px"></div>
            <div class="sbn-field" style="margin-top: 10px">
                <label for="sbnSelectionText">Selected manuscript text</label>
                <textarea id="sbnSelectionText" class="sbn-textarea" placeholder="Paste highlighted manuscript text here, or open from Editor with text selected."></textarea>
            </div>
            <div class="sbn-actions">
                <button id="sbnAnalyzeBtn" type="button" class="sbn-btn primary">Analyze selection (deterministic)</button>
                <button id="sbnClearSelectionBtn" type="button" class="sbn-btn ghost">Clear text</button>
            </div>
        </section>

        <section class="sbn-card">
            <h2>Candidate fact review</h2>
            <div class="sbn-actions" style="margin-top: 0">
                <button id="sbnAcceptCheckedBtn" type="button" class="sbn-btn ok">Accept checked</button>
                <button id="sbnRejectCheckedBtn" type="button" class="sbn-btn warn">Reject checked</button>
            </div>
            <div id="sbnReviewList" class="sbn-review-list" style="margin-top: 10px"></div>
        </section>

        <section class="sbn-card">
            <h2>Stored character facts (audit trail)</h2>
            <div id="sbnFactsMount"></div>
        </section>
    </main>

    <script type="module" src="./js/story-bible-new-page.js?v=4"></script>
</body>
</html>
