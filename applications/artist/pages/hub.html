<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script type="importmap">
    { "imports": {
        "@alysum/site-appearance/": "/site-appearance/",
        "@alysum/authentication/": "/core/authentication/",
        "@alysum/account/": "/core/account/",
        "@alysum/desktop/": "/core/desktop/",
        "@alysum/artist/": "/core/artist/"
    } }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/site-appearance/css-styles/theme.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes/index.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes-dim/index.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/typography.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/surface-styles/index.css">
    <script src="/site-appearance/js-runtime/body-background-presets-data.js"></script>
    <script src="/site-appearance/js-runtime/text-ink-data.js"></script>
    <script src="/site-appearance/js-runtime/boot.js"></script>
    <script src="/site-appearance/js-runtime/body-background-sync.js"></script>
    <script src="/site-appearance/js-runtime/gradient-theme-sync.js" defer></script>
    <link rel="stylesheet" href="/css/site-responsive.css">
    <link rel="stylesheet" href="/css/workspace-nav.css?v=40">
    <link rel="stylesheet" href="/css/artist/page.css">
    <title>Characters — Alysum</title>
    <meta name="robots" content="noindex, nofollow">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="wd-welcome-bar ui-bar" aria-label="Welcome">
    <div class="wd-welcome-inner">
        <div class="wd-pfp-menu" id="welcomePfpMenu">
            <button type="button" class="wd-pfp-btn" id="welcomePfpBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="welcomePfpDropdown" aria-label="Account menu">
                <span class="wd-pfp" id="welcomePfp">
                    <img id="welcomePfpImg" alt="" hidden />
                    <span class="wd-pfp-initial" id="welcomePfpInitial" aria-hidden="true">A</span>
                </span>
            </button>
            <div class="wd-pfp-dropdown" id="welcomePfpDropdown" role="menu" hidden>
                <a role="menuitem" href="/artist" data-close-pfp-menu>Characters</a>
                <a role="menuitem" href="/settings" data-close-pfp-menu>Settings</a>
                <button type="button" role="menuitem" data-logout-btn data-close-pfp-menu>Log out</button>
            </div>
        </div>
        <div class="wd-welcome-copy">
            <h1 class="wd-welcome-title" id="welcomeTitle">Artist</h1>
        </div>
        <div id="account-mode-toggle-root"></div>
    </div>
</header>
<nav class="wd-nav-wrap ui-bar" aria-label="Artist">
    <div class="wd-nav">
        <a href="/artist" class="is-active">Characters</a>
        <a href="/artist-gallery">Gallery</a>
        <a href="/studio">Studio</a>
        <a href="/library">Library</a>
    </div>
</nav>
<main id="main" class="artist-wrap">
    <p id="artist-gate" class="artist-status">Loading…</p>
    <section id="artist-focus" hidden>
        <p class="artist-kicker">Start here</p>
        <div class="artist-head"><h1>How will you use Artist?</h1></div>
        <div class="artist-focus" id="artist-focus-grid"></div>
    </section>
    <section id="artist-hub" hidden>
        <p class="artist-kicker" id="artist-focus-label">Roster</p>
        <div class="artist-head">
            <h1>Your characters</h1>
            <span class="artist-count" id="artist-count">0</span>
        </div>
        <div class="artist-shelf" id="artist-shelf"></div>
        <p class="artist-status" id="artist-status" role="status"></p>
        <div class="artist-stats" id="artist-stats"></div>
        <section>
            <p class="artist-kicker">Public page</p>
            <div class="artist-head"><h1>About you</h1><a class="artist-link" id="artist-public-link" href="/artist-profile">View</a></div>
            <label class="artist-field">Short bio
                <textarea id="artist-bio" maxlength="2000" placeholder="What you draw, species you design, commission status."></textarea>
            </label>
            <div class="artist-actions"><button type="button" class="artist-primary" id="artist-save-bio">Save bio</button></div>
        </section>
    </section>
</main>
<dialog class="artist-dialog" id="artist-create">
    <form id="artist-create-form">
        <h2>New character</h2>
        <label class="artist-field">Name<input name="name" required maxlength="120" autocomplete="off"></label>
        <label class="artist-field">Kind
            <select name="kind">
                <option value="oc">Original character</option>
                <option value="adoptable">Adoptable</option>
                <option value="cast">Story cast</option>
                <option value="sona">Persona / sona</option>
            </select>
        </label>
        <div class="artist-actions">
            <button type="button" id="artist-create-cancel">Cancel</button>
            <button type="submit">Create</button>
        </div>
    </form>
</dialog>
<script type="module" src="/js/artist/shell.js"></script>
<script type="module" src="/js/artist/hub.js"></script>
</body>
</html>
