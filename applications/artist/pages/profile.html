<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script type="importmap">{ "imports": {
        "@alysum/site-appearance/": "/site-appearance/",
        "@alysum/authentication/": "/core/authentication/",
        "@alysum/account/": "/core/account/",
        "@alysum/desktop/": "/core/desktop/",
        "@alysum/artist/": "/core/artist/"
    } }</script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/site-appearance/css-styles/theme.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes/index.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes-dim/index.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/typography.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/surface-styles/index.css">
    <script src="/site-appearance/js-runtime/boot.js"></script>
    <link rel="stylesheet" href="/css/workspace-nav.css?v=40">
    <link rel="stylesheet" href="/css/artist/page.css">
    <title>Artist — Alysum</title>
</head>
<body>
<header class="wd-welcome-bar ui-bar">
    <div class="wd-welcome-inner">
        <div class="wd-pfp-menu" id="welcomePfpMenu">
            <button type="button" class="wd-pfp-btn" id="welcomePfpBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="welcomePfpDropdown" aria-label="Account menu">
                <span class="wd-pfp" id="welcomePfp">
                    <img id="welcomePfpImg" alt="" hidden />
                    <span class="wd-pfp-initial" id="welcomePfpInitial" aria-hidden="true">A</span>
                </span>
            </button>
            <div class="wd-pfp-dropdown" id="welcomePfpDropdown" role="menu" hidden>
                <a role="menuitem" href="/library" data-close-pfp-menu>Home</a>
                <a role="menuitem" href="/overview" data-close-pfp-menu>Profile</a>
                <a role="menuitem" href="/artist" data-close-pfp-menu>My characters</a>
                <a role="menuitem" href="/artist-gallery" data-close-pfp-menu>My art</a>
                <a role="menuitem" href="/studio" data-close-pfp-menu>Studio</a>
                <a role="menuitem" href="/reader" data-close-pfp-menu>Reader</a>
                <a role="menuitem" href="/settings" data-close-pfp-menu>Settings</a>
                <button type="button" role="menuitem" class="settings-nav-logout" data-logout-btn data-close-pfp-menu>Log out</button>
            </div>
        </div>
        <div class="wd-welcome-copy">
            <h1 class="wd-welcome-title" id="name">Artist</h1>
            <p class="artist-mast-handle" id="handle"></p>
        </div>
        <div id="account-mode-toggle-root"></div>
    </div>
</header>
<nav class="wd-nav-wrap ui-bar" aria-label="Artist page">
    <div class="wd-nav" id="visitor-nav">
        <a href="/artist-profile" id="profile-link" class="is-active">Profile</a>
        <a href="/artist-shop" data-artist-shop>Gallery</a>
    </div>
    <div class="wd-nav" id="owner-nav" hidden>
        <a href="/artist">My characters</a>
        <a href="/artist-gallery">My art</a>
        <a href="/artist-shop" data-artist-shop>Gallery</a>
    </div>
</nav>
<main class="artist-wrap">
    <p class="artist-status" id="status">Loading…</p>
    <article id="sheet" hidden>
        <p class="artist-prose artist-bio-panel" id="bio" hidden></p>
        <section id="characters">
            <p class="artist-kicker">Roster</p>
            <div class="artist-head"><h2>Characters</h2></div>
            <div class="artist-shelf" id="shelf"></div>
        </section>
        <section id="listed" hidden>
            <p class="artist-kicker">Gallery</p>
            <div class="artist-head"><h2>Listed now</h2></div>
            <div class="artist-shelf" id="shop"></div>
        </section>
    </article>
</main>
<script type="module" src="/js/artist/shell.js"></script>
<script type="module" src="/js/artist/profile.js"></script>
</body>
</html>
