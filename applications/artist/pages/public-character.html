<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script type="importmap">{ "imports": { "@alysum/artist/": "/core/artist/", "@alysum/authentication/": "/core/authentication/" } }</script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/site-appearance/css-styles/theme.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes/index.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes-dim/index.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/typography.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/surface-styles/index.css">
    <script src="/site-appearance/js-runtime/boot.js"></script>
    <link rel="stylesheet" href="/css/workspace-nav.css?v=40">
    <link rel="stylesheet" href="/css/artist/page.css">
    <title>Character — Alysum</title>
</head>
<body>
<header class="wd-welcome-bar ui-bar">
    <div class="wd-welcome-inner">
        <div class="wd-pfp-menu">
            <a class="wd-pfp-btn" id="artist-pfp-link" href="/artist-profile" aria-label="Artist profile">
                <span class="wd-pfp" id="welcomePfp">
                    <img id="welcomePfpImg" alt="" hidden />
                    <span class="wd-pfp-initial" id="welcomePfpInitial" aria-hidden="true">A</span>
                </span>
            </a>
        </div>
        <div class="wd-welcome-copy">
            <h1 class="wd-welcome-title" id="name">Character</h1>
            <p class="artist-mast-handle" id="owner"></p>
        </div>
    </div>
</header>
<nav class="wd-nav-wrap ui-bar" aria-label="Artist page">
    <div class="wd-nav" id="visitor-nav">
        <a href="/artist-profile" id="profile-link">Profile</a>
        <a href="/artist-shop" id="gallery-link">Gallery</a>
    </div>
    <div class="wd-nav" id="owner-nav" hidden>
        <a href="/artist">My characters</a>
        <a href="/artist-gallery">My art</a>
        <a href="/artist-shop" id="owner-gallery-link">Gallery</a>
    </div>
</nav>
<main class="artist-wrap">
    <p class="artist-status" id="status">Loading…</p>
    <article id="sheet" hidden>
        <div class="artist-editor">
            <div class="artist-portrait" id="portrait"></div>
            <div>
                <p class="artist-status" id="summary"></p>
                <p class="artist-prose" id="body"></p>
                <p class="artist-status" id="trade"></p>
                <div id="offer"></div>
            </div>
        </div>
        <div class="artist-grid" id="grid"></div>
    </article>
</main>
<script type="module" src="/js/artist/public-character.js"></script>
</body>
</html>
