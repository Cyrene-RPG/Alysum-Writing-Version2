<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script type="importmap">{ "imports": { "@alysum/artist/": "/core/artist/", "@alysum/authentication/": "/core/authentication/" } }</script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/site-appearance/css-styles/theme.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes/index.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes-dim/index.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/typography.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/surface-styles/index.css">
    <script src="/site-appearance/js-runtime/boot.js"></script>
    <link rel="stylesheet" href="/css/workspace-nav.css?v=40">
    <link rel="stylesheet" href="/css/artist/page.css">
    <title>Gallery — Alysum</title>
</head>
<body>
<header class="wd-welcome-bar ui-bar">
    <div class="wd-welcome-inner">
        <div class="wd-pfp-menu">
            <a class="wd-pfp-btn" id="artist-pfp-link" href="/artist-profile" aria-label="Artist profile">
                <span class="wd-pfp" id="welcomePfp">
                    <img id="welcomePfpImg" alt="" hidden />
                    <span class="wd-pfp-initial" id="welcomePfpInitial" aria-hidden="true">A</span>
                </span>
            </a>
        </div>
        <div class="wd-welcome-copy">
            <h1 class="wd-welcome-title" id="name">Gallery</h1>
            <p class="artist-mast-handle" id="handle"></p>
        </div>
    </div>
</header>
<nav class="wd-nav-wrap ui-bar" aria-label="Artist page">
    <div class="wd-nav">
        <a href="/artist-profile" id="back">Profile</a>
        <a href="/artist-shop" id="shop-tab" class="is-active">Gallery</a>
    </div>
</nav>
<main class="artist-wrap">
    <p class="artist-status" id="status">Loading…</p>
    <article id="sheet" hidden>
        <div class="artist-empty-panel" id="empty" hidden>
            <h2>Nothing listed</h2>
            <p id="empty-copy">Nothing is listed for adoption, sale, or commission.</p>
        </div>
        <section id="commission" class="artist-panel" hidden>
            <p class="artist-kicker">Commission</p>
            <div class="artist-head"><h2>Open for commissions</h2></div>
            <p class="artist-prose" id="commission-summary"></p>
            <p class="artist-status" id="commission-prices"></p>
            <p class="artist-status" id="commission-slots"></p>
            <p class="artist-status" id="commission-wait" hidden>This artist has not added a request link yet.</p>
            <a class="artist-primary" id="commission-link" hidden>Request a commission</a>
            <p class="artist-status">Payment is completed on the artist’s own page.</p>
        </section>
        <section id="adopt-section" hidden>
            <p class="artist-kicker">Adopt</p>
            <div class="artist-head"><h2>Up for adoption</h2></div>
            <div class="artist-shelf" id="adopt"></div>
        </section>
        <section id="buy-section" hidden>
            <p class="artist-kicker">Buy</p>
            <div class="artist-head"><h2>For sale</h2></div>
            <div class="artist-shelf" id="buy"></div>
        </section>
    </article>
</main>
<script type="module" src="/js/artist/shop.js"></script>
</body>
</html>
