/* Alysum Writing visual language — presentation only, no reader behavior changes. */
:root{color-scheme:dark;--alysum-bg:#15151e;--alysum-panel:#24222f;--alysum-surface:#302b3d;--alysum-border:#50465e;--alysum-text:#f5f0eb;--alysum-muted:#c8bdd3;--alysum-lavender:#d7c1ff;--alysum-accent:#a88adf}

<body><main id="app"><h1>Beta Read</h1><p>Loading…</p></main>
<script type="module">
import { supabase } from "@alysum/authentication/client.js";
import { mountBetaFeedback } from "/applications/editor/page-ui/beta-read-feedback.js";
import { mountBetaReadGate } from "/applications/editor/page-ui/beta-read-gate.js";
const app=document.getElementById("app");
const token=new URL(location.href).searchParams.get("token");
const error=(message)=>{app.replaceChildren();const p=document.createElement("p");p.textContent=message;app.append(p);};
async function call(action,body={}){
 const {data:{session}}=await supabase.auth.getSession();
 const response=await fetch("/api/beta-reads",{method:"POST",headers:{"Content-Type":"application/json",...(session?.access_token?{Authorization:"Bearer "+session.access_token}:{})},body:JSON.stringify({action,token,...body}),cache:"no-store"});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||"Could not load beta read.");
 return data;
}
function node(tag,text){const element=document.createElement(tag);element.textContent=text;return element;}
function renderChapterMarkup(html){
 const root=document.createElement("div");
 root.className="chapter-prose";
 const parsed=new DOMParser().parseFromString(String(html||""),"text/html");
 const allowed=new Set(["P","BR","I","EM","B","STRONG","U","S","DEL","BLOCKQUOTE","H1","H2","H3","UL","OL","LI","DIV","SPAN","HR","SUP","SUB"]);
 const blocked=new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","FORM","INPUT","BUTTON","SVG","MATH","VIDEO","AUDIO","IMG","LINK","META","TEMPLATE"]);
 function clean(source,target){
  for(const child of Array.from(source.childNodes)){
   if(child.nodeType===Node.TEXT_NODE){target.append(document.createTextNode(child.textContent));continue;}
   if(child.nodeType!==Node.ELEMENT_NODE)continue;
   if(blocked.has(child.tagName))continue;
   if(!allowed.has(child.tagName)){clean(child,target);continue;}
   const element=document.createElement(child.tagName.toLowerCase());
   if(child.classList.contains("alysum-indent"))element.classList.add("alysum-indent");
   clean(child,element);
   target.append(element);
  }
 }
 clean(parsed.body,root);
 return root;
}
let guestToken = "";
async function renderReader(){
 const key = "alysum-beta-guest:" + token;
 try { guestToken = localStorage.getItem(key) || ""; } catch {}
 const guest = await call("join", {guestToken});
 guestToken = guest.guestToken;
 try { localStorage.setItem(key, guestToken); } catch {}
 const data=await call("read",{guestToken});
 app.replaceChildren();app.classList.add("beta-document");
 const header=document.createElement("header");header.className="beta-document-header";
 const symbol=node("span","✦");symbol.className="doc-symbol";symbol.setAttribute("aria-hidden","true");
 const identity=document.createElement("div");identity.className="doc-identity";
 identity.append(node("h1",data.title||"Beta Read"),node("p","by "+data.authorUsername+" · You are Guest "+guest.guestNumber));
 const state=node("span","Read-only beta copy");state.className="doc-status";
 header.append(symbol,identity,state);
 const layout=document.createElement("div");layout.className="beta-document-layout";
 const body=document.createElement("div");body.className="beta-document-body";
 const controls=document.createElement("div");controls.className="beta-document-controls";
 const chapterLabel=node("label","Chapter");chapterLabel.htmlFor="beta-chapter-select";
 const selector=document.createElement("select");
 selector.id="beta-chapter-select";
 selector.setAttribute("aria-label","Choose chapter");
 (data.chapters||[]).forEach((chapter,i)=>{const option=document.createElement("option");option.value=String(i);option.textContent=chapter.title;selector.append(option);});
 const article=node("article","");article.className="reader-chapter";
 const comments=document.createElement("section");comments.className="reader-comments";
 async function show(){
  const chapter=data.chapters[Number(selector.value)||0];if(!chapter)return;
  article.replaceChildren(node("h2",chapter.title),renderChapterMarkup(chapter.content));
  const prose = article.querySelector(".chapter-prose");
  comments.replaceChildren();
  const threads=await call("chapter-threads",{chapterId:chapter.id,guestToken});
  mountBetaFeedback({host:comments,prose,chapter,threads:threads.threads||[],suggestions:threads.suggestions||[],send:(action,payload)=>call(action,{...payload,guestToken}),reload:show});
 }
 selector.addEventListener("change",()=>void show().catch(e=>error(e.message)));
 controls.append(chapterLabel,selector);
 body.append(controls,article);layout.append(body,comments);
 app.append(header,layout);
 await show();
}
async function askAccount(next) {
 const {data:{session}}=await supabase.auth.getSession();
 if(session?.user){await next();return;}
 const panel=document.createElement("section");panel.className="beta-read-gate beta-account-gate";
 panel.append(node("h1","Welcome to Beta Reading"),node("p","Would you like to sign in to your Alysum account? Your comments will show your username instead of Guest. You can also continue without an account."));
 const signIn=node("button","Yes, sign in");signIn.type="button";
 const guest=node("button","No, continue as guest");guest.type="button";
 const form=document.createElement("form");form.hidden=true;form.className="beta-account-form";
 const email=document.createElement("input");email.type="email";email.placeholder="Email";email.required=true;email.autocomplete="email";
 const password=document.createElement("input");password.type="password";password.placeholder="Password";password.required=true;password.autocomplete="current-password";
 const submit=node("button","Sign in");submit.type="submit";
 const google=node("button","Continue with Google");google.type="button";
 const status=node("p","");status.setAttribute("role","status");
 form.append(email,password,submit,google,status);
 signIn.addEventListener("click",()=>{form.hidden=false;email.focus();});
 guest.addEventListener("click",()=>void next());
 form.addEventListener("submit",async event=>{
  event.preventDefault();submit.disabled=true;status.textContent="Signing in…";
  const {error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});
  submit.disabled=false;
  if(error){status.textContent=error.message;return;}
  await next();
 });
 google.addEventListener("click",async()=>{
  const {error}=await supabase.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.href}});
  if(error)status.textContent=error.message;
 });
 const actions=document.createElement("div");actions.className="beta-account-actions";actions.append(signIn,guest);
 panel.append(actions,form);app.replaceChildren(panel);
}
async function start(){
 if(!token||! /^[A-Za-z0-9_-]{32,256}$/.test(token)){error("Invalid beta reading link.");return;}
 try{
  const meta=await call("preview");
  if(meta.status!=="active"){error("This beta read is closed.");return;}
  await askAccount(()=>mountBetaReadGate({host:app,betaReadId:meta.id,authorUsername:meta.authorUsername,onAccept:()=>void renderReader().catch(e=>error(e.message))}));
 }catch(e){error(e.message);}
}
void start();
</script></body></html>
