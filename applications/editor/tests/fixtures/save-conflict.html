<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save conflict test — invented manuscripts</title><link rel="stylesheet" href="/site-appearance/css-styles/theme.css"><link rel="stylesheet" href="/applications/editor/editor-css/draft-revisions.css"><style>body{margin:24px;background:#171717;color:#eee;font-family:Arial,sans-serif}</style></head><body><h1>Save conflict test</h1><p>Invented manuscripts only. This page never contacts an account or database.</p><div id="recovery"></div><p id="result" role="status"></p><script type="module">
import {mountSaveConflict} from '/applications/editor/page-ui/save-conflict.js';
const local={id:'invented-book',title:'The Lantern — this tab',words:12,media_format:'novel',sections:{front:[],body:[{id:'c',title:'The harbor',content:'<p>The lantern waited by the harbor. This is the writing in this tab.</p>',notes:[{id:'n',kind:'note',title:'Planning note',content:'Keep the lantern blue.'}]}],back:[]}};
const online={...local,title:'The Lantern — online',_cloudUpdated:12,sections:{front:[],body:[{id:'c',title:'The harbor',content:'<p>The lantern lit the old pier. This is the online version.</p>'}],back:[]}};
mountSaveConflict({api:{readOnlineBook:async()=>online,resolveSaveConflict:async(_id,book,options)=>{if(new URLSearchParams(location.search).has('fail'))throw Error('The online version changed again. Reload the online preview before choosing a version.');return{...book,title:options.choice==='local'?book.title:online.title,_synced:true};}},bookId:local.id,container:document.getElementById('recovery'),prepare:async()=>local,onReviewing:()=>{},onResolved:saved=>{document.getElementById('result').textContent='Confirmed '+saved.title;}});
</script></body></html>
