<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library layout preview — Alysum</title><style>*{box-sizing:border-box}body{margin:0;background:#111318;color:#eee;font:14px system-ui}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid #ffffff20}h1{font-size:17px;margin:0}p{font-size:12px;color:#aaa}button,a{color:inherit;background:#222632;border:1px solid #ffffff30;border-radius:7px;padding:10px;cursor:pointer}main{overflow:auto;padding:22px}iframe{display:block;margin:0 auto;border:1px solid #ffffff30;width:390px;height:1100px;border-radius:10px;background:#111}nav{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><header><div><h1>Library layout preview</h1><p>Invented sample books. No live account changes.</p></div><nav><button data-width="390">Phone</button><button data-width="768">Tablet</button><button data-width="1440">Desktop</button><a href="/library?preview=1">Full page</a></nav></header><main><iframe title="Library preview" src="/library?preview=1"></iframe></main><script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('iframe').style.width=button.dataset.width+'px'}));</script></body></html>
