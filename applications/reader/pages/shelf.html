<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script type="importmap">
    {
      "imports": {
        "@alysum/site-appearance/": "/site-appearance/",
        "@alysum/writing-engine/": "/core/writing-engine/",
        "@alysum/synchronization-engine/": "/core/synchronization-engine/",
        "@alysum/authentication/": "/core/authentication/",
        "@alysum/account/": "/core/account/",
        "@alysum/desktop/": "/core/desktop/",
        "@alysum/library/": "/core/library/",
        "@alysum/publishing/": "/core/publishing/",
        "@alysum/encyclopedia/": "/core/encyclopedia/",
        "@alysum/collaboration/": "/core/collaboration/",
        "@alysum/statistics/": "/core/statistics/"
      }
    }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/site-appearance/css-styles/theme.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes/index.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes-dim/index.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/typography.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/surface-styles/index.css">
    <script src="/site-appearance/js-runtime/body-background-presets-data.js"></script>
    <script src="/site-appearance/js-runtime/text-ink-data.js"></script>
    <script src="/site-appearance/js-runtime/boot.js"></script>
    <script src="/site-appearance/js-runtime/body-background-sync.js"></script>
    <script src="/site-appearance/js-runtime/gradient-theme-sync.js" defer></script>
    <link rel="stylesheet" href="/css/site-responsive.css">
    <link rel="stylesheet" href="/css/workspace-nav.css">
    <link rel="stylesheet" href="/applications/reader/reader-css/page.css">
    <title>Shelf — Alysum Reader</title>
    <meta name="robots" content="noindex, nofollow">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>
    <header class="wd-welcome-bar ui-bar" aria-label="Welcome">
        <div class="wd-welcome-inner">
            <div class="wd-pfp-menu" id="welcomePfpMenu">
                <button type="button" class="wd-pfp-btn" id="welcomePfpBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="welcomePfpDropdown" aria-label="Account menu">
                    <span class="wd-pfp" id="welcomePfp">
                        <img id="welcomePfpImg" alt="" hidden />
                        <span class="wd-pfp-initial" id="welcomePfpInitial" aria-hidden="true">A</span>
                    </span>
                </button>
                <div class="wd-pfp-dropdown" id="welcomePfpDropdown" role="menu" hidden>
                    <a role="menuitem" href="/reader" data-close-pfp-menu>Reader home</a>
                    <a role="menuitem" href="/overview" data-close-pfp-menu>Profile</a>
                    <a role="menuitem" href="/settings" data-close-pfp-menu>Settings</a>
                    <a role="menuitem" href="/studio" data-close-pfp-menu>Studio</a>
                    <button type="button" role="menuitem" class="settings-nav-logout" data-logout-btn data-close-pfp-menu>Log out</button>
                </div>
            </div>
            <div class="wd-welcome-copy">
                <h1 class="wd-welcome-title" id="welcomeTitle">Alysum <span class="wd-name">Reader</span></h1>
                <p class="wd-welcome-sub" id="welcomeSubtitle"></p>
            </div>
        </div>
    </header>
    <nav class="wd-nav-wrap ui-bar" aria-label="Workspace">
        <div class="wd-nav">
            <a href="/reader">Reader</a>
            <a href="/library">Library</a>
            <a href="/updates">What’s New</a>
            <a href="/studio">Studio</a>
        </div>
    </nav>

<main id="main" class="reader-page" data-reader-page="shelf">
    <p class="reader-eyebrow">Alysum Reader</p>
    <h1 class="reader-title">Shelf</h1>
    <p class="reader-lead">Your reading stacks — not Studio projects.</p>
    <div id="reader-tabs"></div>
    <p id="reader-status" class="reader-status" role="status">Loading your shelf…</p>
    <p id="reader-sign-in" class="reader-sign-in" hidden><a href="/login?next=%2Freader%2Fshelf">Sign in to open your shelf</a></p>
    <div id="reader-root" hidden></div>
</main>

<div id="reader-bottom"></div>
<script type="module" src="/applications/reader/page-ui/shell.js"></script>
<script type="module" src="/applications/reader/page-ui/shelf.js"></script>
</body></html>
