<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <title>Shared snippet — Alysum</title>
    <link rel="stylesheet" href="/site-appearance/css-styles/theme.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes/index.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes-dim/index.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/typography.css">
    <link rel="stylesheet" href="/site-appearance/css-styles/surface-styles/index.css">
    <script src="/site-appearance/js-runtime/body-background-presets-data.js"></script>
    <script src="/site-appearance/js-runtime/text-ink-data.js"></script>
    <script src="/site-appearance/js-runtime/boot.js"></script>
    <link rel="stylesheet" href="/applications/snippets/snippets-css/page.css">
</head>
<body class="snippet-reader-page">
    <main class="snippet-reader">
        <nav class="snippet-reader-nav" aria-label="Alysum"><a href="/library">ALYSUM</a><span class="snippet-readonly">Read only</span></nav>
        <section id="snippet-loading" aria-live="polite"><p class="snippet-hint">Opening snippet…</p></section>
        <section id="snippet-unavailable" class="snippet-reader-empty" hidden aria-labelledby="snippet-unavailable-title"><h1 id="snippet-unavailable-title">Snippet unavailable</h1><p id="snippet-unavailable-message"></p></section>
        <article id="snippet-content" hidden aria-labelledby="snippet-reader-title">
            <p class="snippet-label">Work in progress · Excerpt</p>
            <h1 id="snippet-reader-title"></h1>
            <p id="snippet-reader-byline" class="snippet-byline"></p>
            <p id="snippet-reader-meta" class="snippet-reader-meta"></p>
            <p id="snippet-reader-note" class="snippet-reader-note" hidden></p>
            <div id="snippet-reader-excerpt" class="snippet-prose"></div>
            <footer>This is a shared excerpt, not the full manuscript. Author and title are supplied by the person who created the link.</footer>
        </article>
    </main>
    <script type="module" src="/applications/snippets/page-ui/read.js"></script>
</body>
</html>
