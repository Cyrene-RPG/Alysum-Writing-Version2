<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><script type="importmap">{"imports":{"@alysum/authentication/":"/core/authentication/"}}</script><title>Beta Reads · Studio</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 95% 0%,#30253c 0%,transparent 45%),#15151d;color:#f4f0e8;font:16px/1.55 system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:clamp(22px,5vw,55px) 18px 90px}
a{color:#d9c7ff}a:hover{text-decoration:none}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;margin-bottom:32px}
h1{font:700 clamp(2.3rem,7vw,3.8rem)/1.1 Georgia,serif;letter-spacing:-.035em;margin:0 0 16px}
.intro{color:#c9c2d1;font-size:1.05rem;margin:0 0 36px;max-width:600px}
#reads{display:grid;gap:18px}
article{background:#24232f;border:1px solid #45404f;border-radius:18px;padding:clamp(18px,4vw,28px);box-shadow:0 12px 30px #0002;min-width:0}
article h2{font:700 clamp(1.5rem,5vw,2rem)/1.25 Georgia,serif;margin:0 0 10px}
article p{color:#d0c9d9;margin:8px 0}
article small{display:block;color:#b6adc4;margin:8px 0 18px}
button{font:600 0.95rem system-ui;cursor:pointer;border:1px solid #77668f;border-radius:11px;background:#d8c9f8;color:#211b2a;padding:12px 16px;margin:6px 10px 6px 0;min-height:44px}
button+button{background:transparent;color:#eee2ff}
button:disabled{opacity:.6;cursor:wait}
blockquote{border-left:3px solid #ad92e8;background:#302b3d;border-radius:0 8px 8px 0;padding:12px 15px;margin:18px 0;overflow-wrap:anywhere}
article section{margin-top:22px;border-top:1px solid #4d4559;padding-top:15px}
article section h3{font:700 1.25rem Georgia,serif;margin:18px 0 8px}
#reads>p{background:#24232f;border-radius:14px;padding:22px;color:#d9d0e2}
@media(max-width:480px){main{padding:25px 16px 70px}.back{margin-bottom:26px}article{padding:18px}button{width:100%;margin:6px 0}}
</style></head>
<body><main><a class="back" href="/studio">← Back to Studio</a><h1>Beta Reads</h1><p class="intro">Your private reading copies, guest feedback, and archived sessions—all in one place.</p><div id="reads">Loading…</div></main>
<script type="module">
import { supabase } from "@alysum/authentication/client.js";
import { createBetaReadApi } from "/applications/editor/page-ui/beta-read-api.js";
const api=createBetaReadApi(supabase),root=document.getElementById("reads");
root.textContent="Loading your beta reads…";
function element(tag,text){const el=document.createElement(tag);el.textContent=text;return el;}
async function refresh(){
 try {
  const {reads}=await api.list();root.replaceChildren();
  if(!reads.length){root.append(element("p","No beta reads yet. Create one from Snippet Share in the editor."));return;}
  for(const read of reads){
   const card=element("article","");
   card.append(element("h2",read.title),element("p",read.status==="closed"?"Archived · Link closed":"Active · No automatic expiration"),element("small","by "+read.author_username));
   const review=element("button","Review feedback");
   review.addEventListener("click",async()=>{
    review.disabled=true;
    try{
     const {chapters}=await api.threads(read.id);
     card.querySelectorAll("[data-feedback]").forEach(el=>el.remove());
     const section=element("section","");section.dataset.feedback="yes";
     for(const chapter of chapters){
      section.append(element("h3",chapter.title));
      for(const thread of chapter.threads){
       const block=element("blockquote",thread.quote);
       section.append(block);
       for(const comment of thread.comments)section.append(element("p",comment.authorLabel+": "+comment.body));
       const toggle=element("button",thread.resolvedAt?"Reopen":"Resolve");
       toggle.addEventListener("click",async()=>{await api.moderate(read.id,thread.id,thread.resolvedAt?"reopen":"resolve");await review.click();});
       section.append(toggle);
      }
     }
     card.append(section);
    }catch(e){card.append(element("p",e.message));}finally{review.disabled=false;}
   });
   card.append(review);
   if(read.status==="active"){
    const close=element("button","Close and archive");
    close.addEventListener("click",async()=>{if(!confirm("Close this link? Feedback will be preserved."))return;close.disabled=true;try{await api.close(read.id);await refresh();}catch(e){alert(e.message);close.disabled=false;}});
    card.append(close);
   }
   root.append(card);
  }
 }catch(e){root.replaceChildren(element("p",e.message));}
}
void refresh();
</script></body></html>
