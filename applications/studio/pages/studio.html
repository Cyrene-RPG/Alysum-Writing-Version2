<!DOCTYPE html><html lang="en">
<head>
    <script type="importmap">
    {
      "imports": {
        "@alysum/site-appearance/": "/site-appearance/",
        "@alysum/writing-engine/": "/core/writing-engine/",
        "@alysum/synchronization-engine/": "/core/synchronization-engine/",
        "@alysum/authentication/": "/core/authentication/",
        "@alysum/account/": "/core/account/",
        "@alysum/desktop/": "/core/desktop/",
        "@alysum/library/": "/core/library/",
        "@alysum/publishing/": "/core/publishing/",
        "@alysum/encyclopedia/": "/core/encyclopedia/",
        "@alysum/collaboration/": "/core/collaboration/",
        "@alysum/statistics/": "/core/statistics/"
      }
    }
    </script>
    <link rel="stylesheet" href="/site-appearance/css-styles/theme.css?v=6" />
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes/index.css" />
    <link rel="stylesheet" href="/site-appearance/css-styles/typography.css?v=7" />
    <link rel="stylesheet" href="/site-appearance/css-styles/surface-styles/index.css" />
    <script src="/site-appearance/js-runtime/body-background-presets-data.js?v=3"></script>
    <script src="/site-appearance/js-runtime/text-ink-data.js?v=5"></script>
    <script src="/site-appearance/js-runtime/boot.js?v=7"></script>
    <script src="/site-appearance/js-runtime/body-background-sync.js"></script>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow">
    <title>Studio — Alysum</title>
    <link rel="stylesheet" href="/css/site-responsive.css?v=1" />
    <link rel="stylesheet" href="/css/workspace-nav.css?v=29" />
    <link rel="stylesheet" href="/css/studio/page.css?v=6" />
    <script src="/site-appearance/js-runtime/gradient-theme-sync.js?v=3" defer></script>
</head>
<body>
    <header class="wd-welcome-bar ui-bar" aria-label="Welcome">
        <div class="wd-welcome-inner">
            <div class="wd-pfp-menu" id="welcomePfpMenu">
                <button type="button" class="wd-pfp-btn" id="welcomePfpBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="welcomePfpDropdown" aria-label="Account menu">
                    <span class="wd-pfp" id="welcomePfp">
                        <img id="welcomePfpImg" alt="" hidden />
                        <span class="wd-pfp-initial" id="welcomePfpInitial" aria-hidden="true">A</span>
                    </span>
                </button>
                <div class="wd-pfp-dropdown" id="welcomePfpDropdown" role="menu" hidden>
                    <a role="menuitem" href="studio.html" data-close-pfp-menu>Studio</a>
                    <a role="menuitem" href="overview.html" data-close-pfp-menu>Overview</a>
                    <a role="menuitem" href="settings.html" data-close-pfp-menu>Settings</a>
                    <button type="button" role="menuitem" class="settings-nav-logout" data-logout-btn data-close-pfp-menu>Log out</button>
                </div>
            </div>
            <div class="wd-welcome-copy">
                <h1 class="wd-welcome-title" id="welcomeTitle">Writing <span class="wd-name">Studio</span></h1>
                <p class="wd-welcome-sub" id="welcomeSubtitle"></p>
            </div>
        </div>
    </header>
    <nav class="wd-nav-wrap ui-bar" aria-label="Workspace">
        <div class="wd-nav">
            <a href="studio.html" class="is-active">Studio</a>
            <a href="word-wars-lobby.html">Word Wars</a>
        </div>
    </nav>
    <div class="wrap">
        <div class="studio-loading" id="loadingPanel">Loading studio…</div>
        <div class="studio-app hidden" id="studioShell">
            <div class="studio-topbar">
                <div>
                    <h1>Studio</h1>
                    <p>Open a book and keep writing.</p>
                </div>
                <a class="studio-gear" href="settings.html" aria-label="Settings" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </a>
            </div>
            <div class="studio-section-head">
                <div>
                    <h2>Your books</h2>
                    <p class="studio-sub">Swipe or use the arrows to see more.</p>
                </div>
                <span class="studio-shelf-count" id="shelfCount">0 books</span>
            </div>
            <div class="studio-shelf-wrap">
                <button type="button" class="studio-shelf-nav prev" id="shelfPrev" aria-label="Previous books">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <button type="button" class="studio-shelf-nav next" id="shelfNext" aria-label="More books">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
                </button>
                <div class="studio-shelf" id="bookShelf"></div>
            </div>
            <div class="studio-dots" id="shelfDots"></div>
            <div class="studio-stats">
                <div class="studio-stat">
                    <span class="studio-stat-num" id="statTotalWords">0</span>
                    <span class="studio-stat-label">Total words across all books</span>
                </div>
                <div class="studio-stat">
                    <span class="studio-stat-num" id="statBooks">0</span>
                    <span class="studio-stat-label">Books</span>
                </div>
                <div class="studio-stat">
                    <span class="studio-stat-num" id="statLoginStreak">0</span>
                    <span class="studio-stat-label">Daily login streak</span>
                </div>
                <div class="studio-stat">
                    <span class="studio-stat-num" id="statGoalStreak">0</span>
                    <span class="studio-stat-label">Daily word goal streak</span>
                </div>
            </div>
            <div class="studio-goal">
                <div class="studio-goal-top">
                    <span>Word goal today</span>
                    <span class="studio-goal-pill" id="goalPill">0 / 2,000</span>
                </div>
                <div class="studio-goal-track">
                    <div class="studio-goal-fill" id="goalFill"></div>
                </div>
            </div>
            <p class="studio-status" id="studioStatus" role="status"></p>
        </div>
    </div>
    <script type="module" src="/js/studio/page.js?v=6"></script>
</body>
</html>
