<!DOCTYPE html><html lang="en">
<head>
    <script type="importmap">
    {
      "imports": {
        "@alysum/site-appearance/": "/site-appearance/",
        "@alysum/writing-engine/": "/core/writing-engine/",
        "@alysum/synchronization-engine/": "/core/synchronization-engine/",
        "@alysum/authentication/": "/core/authentication/",
        "@alysum/account/": "/core/account/",
        "@alysum/desktop/": "/core/desktop/",
        "@alysum/library/": "/core/library/",
        "@alysum/publishing/": "/core/publishing/",
        "@alysum/encyclopedia/": "/core/encyclopedia/",
        "@alysum/collaboration/": "/core/collaboration/",
        "@alysum/statistics/": "/core/statistics/"
      }
    }
    </script>
    <link rel="stylesheet" href="/site-appearance/css-styles/theme.css?v=8" />
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes/index.css" />
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes-dim/index.css" />
    <link rel="stylesheet" href="/site-appearance/css-styles/typography.css?v=10" />
    <link rel="stylesheet" href="/site-appearance/css-styles/surface-styles/index.css?v=12" />
    <script src="/site-appearance/js-runtime/body-background-presets-data.js?v=3"></script>
    <script src="/site-appearance/js-runtime/text-ink-data.js?v=7"></script>
    <script src="/site-appearance/js-runtime/boot.js?v=7"></script>
    <script src="/site-appearance/js-runtime/body-background-sync.js"></script>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow">
    <title>Writing history — Alysum</title>
    <link rel="stylesheet" href="/css/site-responsive.css?v=1">
    <link rel="stylesheet" href="/css/workspace-nav.css?v=40">
    <link rel="stylesheet" href="/css/studio/page.css?v=19">
    <link rel="stylesheet" href="/css/studio/phone.css">
    <link rel="stylesheet" href="/css/studio/writing-history.css?v=2">
    <script src="/site-appearance/js-runtime/gradient-theme-sync.js?v=3" defer></script>
</head>
<body>
    <header class="wd-welcome-bar ui-bar" aria-label="Welcome">
        <div class="wd-welcome-inner">
            <div class="wd-pfp-menu" id="welcomePfpMenu">
                <button type="button" class="wd-pfp-btn" id="welcomePfpBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="welcomePfpDropdown" aria-label="Account menu">
                    <span class="wd-pfp" id="welcomePfp">
                        <img id="welcomePfpImg" alt="" hidden />
                        <span class="wd-pfp-initial" id="welcomePfpInitial" aria-hidden="true">A</span>
                    </span>
                </button>
                <div class="wd-pfp-dropdown" id="welcomePfpDropdown" role="menu" hidden>
                    <a role="menuitem" href="/library" data-close-pfp-menu>Home</a>
                    <a role="menuitem" href="/overview.html" data-close-pfp-menu>Profile</a>
                    <a role="menuitem" href="/settings.html" data-close-pfp-menu>Settings</a>
                    <button type="button" role="menuitem" class="settings-nav-logout" data-logout-btn data-close-pfp-menu>Log out</button>
                </div>
            </div>
            <div class="wd-welcome-copy">
                <h1 class="wd-welcome-title" id="welcomeTitle">Writing <span class="wd-name">Studio</span></h1>
                <p class="wd-welcome-sub" id="welcomeSubtitle"></p>
            </div>
        </div>
    </header>
    <nav class="wd-nav-wrap ui-bar" aria-label="Workspace">
        <div class="wd-nav">
            <a href="/studio" class="is-active">Studio</a>
            <a href="/word-wars-lobby">Word Wars</a>
            <a href="/library">Library</a>
            <a href="/updates">What’s New</a>
            <a href="/write-update">Write an update</a>
        </div>
    </nav>
    <main class="wrap">
        <section class="panel" id="studioShell" aria-labelledby="historyTitle">
            <div class="studio-section-head">
                <h1 id="historyTitle">Writing history</h1>
                <div class="studio-head-actions" role="group" aria-label="Group writing history by">
                    <button class="studio-action" type="button" data-period="day">Day</button>
                    <button class="studio-action" type="button" data-period="week">Week</button>
                    <button class="studio-action" type="button" data-period="month">Month</button>
                    <button class="studio-action" type="button" data-period="year">Year</button>
                </div>
            </div>
            <p id="status" class="studio-status" role="status">Loading writing history…</p>
            <ul id="historyList" class="studio-stats" aria-label="Net words written by period" hidden></ul>
            <div class="studio-head-actions history-footer">
                <button id="older" class="studio-action" type="button" hidden>Show earlier periods</button>
            </div>
        </section>
    </main>
    <script type="module" src="/js/studio/writing-history.js?v=2"></script>
</body>
</html>
