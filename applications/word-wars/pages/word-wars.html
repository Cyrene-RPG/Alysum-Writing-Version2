<!DOCTYPE html><html lang="en">
<head>
    <script type="importmap">
    {
      "imports": {
        "@alysum/site-appearance/": "/site-appearance/",
        "@alysum/writing-engine/": "/core/writing-engine/",
        "@alysum/synchronization-engine/": "/core/synchronization-engine/",
        "@alysum/authentication/": "/core/authentication/",
        "@alysum/account/": "/core/account/",
        "@alysum/desktop/": "/core/desktop/",
        "@alysum/library/": "/core/library/",
        "@alysum/publishing/": "/core/publishing/",
        "@alysum/encyclopedia/": "/core/encyclopedia/",
        "@alysum/collaboration/": "/core/collaboration/",
        "@alysum/statistics/": "/core/statistics/",
        "@alysum/community/": "/core/community/"
      }
    }
    </script>
    <link rel="stylesheet" href="/site-appearance/css-styles/theme.css?v=6" />
    <link rel="stylesheet" href="/site-appearance/css-styles/gradient-themes/index.css" />
    <link rel="stylesheet" href="/site-appearance/css-styles/typography.css?v=7" />
    <link rel="stylesheet" href="/site-appearance/css-styles/surface-styles/index.css?v=4" />
    <script src="/site-appearance/js-runtime/body-background-presets-data.js?v=3"></script>
    <script src="/site-appearance/js-runtime/text-ink-data.js?v=5"></script>
    <script src="/site-appearance/js-runtime/boot.js?v=7"></script>
    <script src="/site-appearance/js-runtime/body-background-sync.js"></script>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow">
    <title>Word War — Alysum</title>
    <link rel="stylesheet" href="/css/site-responsive.css?v=1" />
    <link rel="stylesheet" href="/css/workspace-nav.css?v=27" />
    <link rel="stylesheet" href="/css/editor/page.css?v=42" />
    <link rel="stylesheet" href="/css/editor/document.css?v=11" />
    <link rel="stylesheet" href="/css/editor/editor-fonts.css?v=1" />
    <link rel="stylesheet" href="/css/editor/scene-breaks.css?v=1" />
    <link rel="stylesheet" href="/css/word-wars/room.css?v=2" />
    <script src="/site-appearance/js-runtime/gradient-theme-sync.js?v=3" defer></script>
</head>
<body class="ww-body">
    <header class="wd-welcome-bar ui-bar" aria-label="Welcome">
        <div class="wd-welcome-inner">
            <div class="wd-pfp-menu" id="welcomePfpMenu">
                <button type="button" class="wd-pfp-btn" id="welcomePfpBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="welcomePfpDropdown" aria-label="Account menu">
                    <span class="wd-pfp" id="welcomePfp">
                        <img id="welcomePfpImg" alt="" hidden />
                        <span class="wd-pfp-initial" id="welcomePfpInitial" aria-hidden="true">A</span>
                    </span>
                </button>
                <div class="wd-pfp-dropdown" id="welcomePfpDropdown" role="menu" hidden>
                    <a role="menuitem" href="studio.html" data-close-pfp-menu>Studio</a>
                    <a role="menuitem" href="overview.html" data-close-pfp-menu>Overview</a>
                    <a role="menuitem" href="settings.html" data-close-pfp-menu>Settings</a>
                    <button type="button" role="menuitem" class="settings-nav-logout" data-logout-btn data-close-pfp-menu>Log out</button>
                </div>
            </div>
            <div class="wd-welcome-copy">
                <h1 class="wd-welcome-title" id="welcomeTitle">Word War</h1>
                <p class="wd-welcome-sub" id="welcomeSubtitle"></p>
            </div>
        </div>
    </header>
    <nav class="wd-nav-wrap ui-bar" aria-label="Workspace">
        <div class="wd-nav">
            <a href="studio.html">Studio</a>
            <a href="word-wars-lobby.html" class="is-active">Word Wars</a>
        </div>
    </nav>

    <div class="ww-loading" id="loadingPanel">Loading war…</div>
    <div class="ww-room hidden" id="roomShell">
        <aside class="ww-chapters" aria-label="Chapters">
            <p class="ww-label">Chapters</p>
            <ul id="chapterList"></ul>
        </aside>
        <section class="ww-stage" id="stage">
            <div class="ww-stage-bar">
                <span id="timerEl">—</span>
                <span id="wordEl">0 words</span>
                <span id="saveStatus"></span>
                <button type="button" class="ww-finish hidden" id="finishBtn">Finish</button>
                <button type="button" class="ww-leave" id="leaveBtn">Leave</button>
            </div>
            <div class="ww-spectate hidden" id="spectatePane">
                <p class="ww-spectate-name" id="spectateName"></p>
                <div class="writer-page" id="spectatePage"></div>
            </div>
            <div class="ww-editor" id="editorPane">
                <div class="writer-toolbar" id="writerToolbar"></div>
                <div class="writer-main-scroll">
                    <div class="writer-page" id="pageEditor" contenteditable="true"></div>
                </div>
            </div>
        </section>
        <aside class="ww-tiles" aria-label="Writers">
            <p class="ww-label">Writers</p>
            <div id="tileList"></div>
        </aside>
    </div>
    <script type="module" src="/js/word-wars/room.js?v=1"></script>
</body>
</html>
