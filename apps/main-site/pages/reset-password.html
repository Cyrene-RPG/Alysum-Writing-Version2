    <title>Reset Password — Alysum</title>

            color: #14532d;

<body>

<div class="card">
    <h2>Choose a new password</h2>

    <div id="reset-form" hidden>
        <p class="intro">Enter a new password for your Alysum account.</p>

        <input id="password" type="password" placeholder="New password" autocomplete="new-password">
        <input id="confirm-password" type="password" placeholder="Confirm new password" autocomplete="new-password">

        <button type="button" id="save-btn">Update password</button>

        <p id="error-msg" role="alert"></p>
        <p id="success-msg" role="status"></p>
    </div>

    <div id="invalid-panel" hidden>
        <p class="intro">This reset link is invalid or has expired. Request a new one from the login page.</p>
        <p id="invalid-error" class="intro" style="color:#7f1d1d;"></p>
        <div class="link-row">
            <a href="login.html">Back to login</a>
        </div>
    </div>

    <p class="support-footnote">
        Need help?
        <a href="mailto:alysum.support@gmail.com">alysum.support@gmail.com</a>
        ·
        <a href="https://discord.gg/ue7uSCWU9w" target="_blank" rel="noopener noreferrer">Join Discord</a>
    </p>
</div>

<script type="module">
import { supabase } from "@alysum/identity/client.js";

const formEl = document.getElementById("reset-form");
const invalidEl = document.getElementById("invalid-panel");
const invalidErrorEl = document.getElementById("invalid-error");
const passwordEl = document.getElementById("password");
const confirmEl = document.getElementById("confirm-password");
const saveBtn = document.getElementById("save-btn");
const errorEl = document.getElementById("error-msg");
const successEl = document.getElementById("success-msg");

let recoveryReady = false;
let saveInFlight = false;

function hashType() {
    const raw = (window.location.hash || "").replace(/^#/, "");
    if (!raw) return null;
    try {
        return new URLSearchParams(raw).get("type");
    } catch {
        return null;
    }
}

function isRecoveryUrl() {
    return hashType() === "recovery";
}

function showError(text) {
    successEl.textContent = "";
    successEl.classList.remove("visible");
    errorEl.textContent = text;
    errorEl.classList.add("visible");
}

function showSuccess(text) {
    errorEl.textContent = "";
    errorEl.classList.remove("visible");
    successEl.textContent = text;
    successEl.classList.add("visible");
}

function showForm() {
    recoveryReady = true;
    invalidEl.hidden = true;
    formEl.hidden = false;
}

function showInvalid(message) {
    if (recoveryReady || saveInFlight) return;
    formEl.hidden = true;
    invalidEl.hidden = false;
    if (message) invalidErrorEl.textContent = message;
}

function markRecoveryReady(session, event) {
    if (!session) return;
    if (event === "PASSWORD_RECOVERY" || isRecoveryUrl()) {
        showForm();
    }
}

supabase.auth.onAuthStateChange((event, session) => {
    markRecoveryReady(session, event);
});

const { data: initialSession } = await supabase.auth.getSession();
markRecoveryReady(initialSession.session, isRecoveryUrl() ? "PASSWORD_RECOVERY" : null);

if (!recoveryReady) {
    window.setTimeout(async () => {
        if (recoveryReady) return;
        const { data } = await supabase.auth.getSession();
        if (data.session && isRecoveryUrl()) {
            showForm();
            return;
        }
        showInvalid();
    }, 1200);
}

saveBtn.addEventListener("click", async () => {
    if (saveInFlight) return;

    const password = passwordEl.value;
    const confirm = confirmEl.value;

    if (!password || !confirm) {
        showError("Enter and confirm your new password.");
        return;
    }
    if (password.length < 6) {
        showError("Password must be at least 6 characters.");
        return;
    }
    if (password !== confirm) {
        showError("Passwords do not match.");
        return;
    }

    const { data: sessionData } = await supabase.auth.getSession();
    if (!sessionData.session) {
        showInvalid("Your session expired. Request a new reset email.");
        return;
    }

    saveInFlight = true;
    saveBtn.disabled = true;
    showError("");
    errorEl.classList.remove("visible");

    try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;

        showSuccess("Password updated. Taking you to login…");
        await supabase.auth.signOut();
        window.setTimeout(() => {
            window.location.href = "login.html?reset=success";
        }, 900);
    } catch (err) {
        showError((err && err.message) || "Could not update password.");
        saveBtn.disabled = false;
        saveInFlight = false;
    }
});

function submitOnEnter(ev) {
    if (ev.key === "Enter") {
        ev.preventDefault();
        saveBtn.click();
    }
}

passwordEl.addEventListener("keydown", submitOnEnter);
confirmEl.addEventListener("keydown", submitOnEnter);
</script>

</body>
