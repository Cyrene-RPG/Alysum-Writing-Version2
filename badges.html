<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ALYSUM:PWA:START -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020b18" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="dark light">
    <meta name="application-name" content="Alysum">
    <meta name="msapplication-TileColor" content="#7c3aed">
    <meta name="msapplication-TileImage" content="Alysum-3.png">
    <link rel="icon" type="image/png" sizes="any" href="Alysum-3.png">
    <link rel="apple-touch-icon" href="Alysum-3.png">
    <link rel="apple-touch-icon" sizes="180x180" href="Alysum-3.png">
    <script src="js/pwa-register.js" defer></script>
    <!-- ALYSUM:PWA:END -->

    <!-- ALYSUM:ANALYTICS:START -->
    <script type="module" src="js/vercel-analytics.js"></script>
    <!-- ALYSUM:ANALYTICS:END -->

    <meta charset="UTF-8" />
    <title>Alysum Achievements</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="js/alysum-appearance-boot.js"></script>
    <link rel="stylesheet" href="css/site-responsive.css?v=1" />
    <link rel="stylesheet" href="css/gradient-themes.css?v=4" />
    <script src="js/gradient-theme-sync.js" defer></script>

<style>
* { box-sizing: border-box; }

:root {
    --bg: #030712;
    --panel: rgba(15,23,42,0.88);
    --text: #ffffff;
    --muted: #9ca3af;
    --blue: #3b82f6;
    --purple: #7c3aed;
    --gold: #fbbf24;
    --border: rgba(255,255,255,0.14);
    --shadow: 0 24px 70px rgba(0,0,0,0.5);
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    background:
        radial-gradient(circle at 15% 0%, rgba(59,130,246,0.28), transparent 28%),
        radial-gradient(circle at 85% 8%, rgba(124,58,237,0.34), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(251,191,36,0.08), transparent 32%),
        var(--bg);
    color: var(--text);
    min-height: 100vh;
}

.header {
    position: sticky;
    top: 0;
    z-index: 50;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(3,7,18,0.82);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 16px 36px rgba(0,0,0,0.35);
}

.header-title {
    font-size: 24px;
    font-weight: 950;
    letter-spacing: -0.03em;
}

.back-btn {
    position: absolute;
    left: 16px;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.container {
    max-width: 1180px;
    margin: auto;
    padding: 26px 18px 44px;
}

.hero {
    margin-bottom: 22px;
    padding: 24px;
    border-radius: 30px;
    background:
        radial-gradient(circle at top left, rgba(96,165,250,0.3), transparent 32%),
        linear-gradient(145deg, rgba(15,23,42,0.96), rgba(2,6,23,0.96));
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}

.hero-kicker {
    color: #93c5fd;
    font-size: 12px;
    font-weight: 950;
    text-transform: uppercase;
    letter-spacing: 0.16em;
}

.hero h1 {
    margin: 8px 0 6px;
    font-size: clamp(30px, 5vw, 54px);
    line-height: 0.95;
    letter-spacing: -0.06em;
}

.hero p {
    margin: 0;
    max-width: 660px;
    color: rgba(255,255,255,0.72);
    line-height: 1.5;
    font-weight: 650;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 22px;
}

.stat {
    min-width: 0;
    background: rgba(15,23,42,0.78);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.28);
}

.stat h3 {
    margin: 0;
    font-size: 28px;
    font-weight: 950;
    letter-spacing: -0.04em;
}

.stat p {
    margin: 7px 0 0;
    font-size: 12px;
    color: var(--muted);
    font-weight: 850;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.achievements-hint {
    margin: 0 0 18px;
    padding: 13px 15px;
    border-radius: 18px;
    background: rgba(251,191,36,0.1);
    border: 1px solid rgba(251,191,36,0.35);
    color: #fcd34d;
    font-size: 13px;
    line-height: 1.45;
}

.achievements-hint.hidden { display: none; }

.badges {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
    gap: 18px;
}

.badge {
    position: relative;
    overflow: hidden;
    min-height: 245px;
    display: flex;
    flex-direction: column;
    padding: 20px;
    border-radius: 30px;
    background:
        radial-gradient(circle at 15% 8%, rgba(255,255,255,0.1), transparent 28%),
        linear-gradient(145deg, rgba(15,23,42,0.96), rgba(2,6,23,0.98));
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: var(--shadow);
    transition: transform 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
}

.badge:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.28);
}

.badge.locked {
    opacity: 0.5;
    filter: grayscale(0.7);
}

.badge.unlocked {
    opacity: 1;
    background:
        radial-gradient(circle at 12% 8%, rgba(96,165,250,0.42), transparent 30%),
        radial-gradient(circle at 86% 86%, rgba(251,191,36,0.22), transparent 34%),
        linear-gradient(145deg, #2563eb, #6d28d9 52%, #111827);
    border-color: rgba(255,255,255,0.36);
}

.badge.unlocked::after {
    content: "UNLOCKED";
    position: absolute;
    top: 18px;
    right: -38px;
    transform: rotate(38deg);
    background: rgba(255,255,255,0.96);
    color: #111827;
    font-size: 10px;
    font-weight: 950;
    padding: 5px 42px;
    letter-spacing: 0.1em;
}

.badge-top {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 17px;
}

.badge-icon {
    width: 66px;
    height: 66px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    font-size: 32px;
    background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,0.5), transparent 30%),
        linear-gradient(145deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06));
    border: 1px solid rgba(255,255,255,0.26);
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.12),
        0 12px 28px rgba(0,0,0,0.3);
}

.badge-kicker {
    font-size: 11px;
    color: #bfdbfe;
    font-weight: 950;
    text-transform: uppercase;
    letter-spacing: 0.12em;
}

.badge-title {
    margin-top: 4px;
    font-size: 21px;
    font-weight: 950;
    letter-spacing: -0.03em;
}

.badge-desc {
    font-size: 14px;
    color: rgba(255,255,255,0.8);
    line-height: 1.45;
    margin-bottom: 18px;
}

.progress-bar {
    height: 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.15);
    overflow: hidden;
    margin-top: auto;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #fbbf24);
    width: 0%;
    border-radius: inherit;
}

.progress-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    margin-top: 10px;
    color: rgba(255,255,255,0.82);
    font-weight: 900;
}

.achievement-toast-wrap {
    position: fixed;
    top: 88px;
    right: 18px;
    z-index: 9999;
    display: grid;
    gap: 12px;
    pointer-events: none;
}

.achievement-toast {
    width: min(420px, calc(100vw - 28px));
    display: flex;
    gap: 15px;
    align-items: center;
    padding: 17px;
    border-radius: 24px;
    background:
        radial-gradient(circle at top left, rgba(96,165,250,0.38), transparent 34%),
        linear-gradient(135deg, rgba(15,23,42,0.98), rgba(30,41,59,0.98));
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow: 0 24px 60px rgba(0,0,0,0.55);
    animation: trophyIn 0.45s ease, trophyOut 0.45s ease 5.5s forwards;
}

.toast-icon {
    width: 62px;
    height: 62px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    font-size: 31px;
    background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,0.5), transparent 28%),
        linear-gradient(145deg, #3b82f6, #7c3aed);
}

.toast-kicker {
    font-size: 11px;
    color: #93c5fd;
    font-weight: 950;
    text-transform: uppercase;
    letter-spacing: 0.1em;
}

.toast-title {
    margin-top: 4px;
    font-size: 18px;
    font-weight: 950;
}

.toast-desc {
    margin-top: 6px;
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    line-height: 1.35;
}

@keyframes trophyIn {
    from { transform: translateX(120%) scale(0.96); opacity: 0; }
    to { transform: translateX(0) scale(1); opacity: 1; }
}

@keyframes trophyOut {
    to { transform: translateX(120%) scale(0.96); opacity: 0; }
}

@media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 540px) {
    .header-title { font-size: 18px; }
    .container { padding: 14px 12px 32px; }
    .hero { padding: 20px; border-radius: 24px; }
    .stats { grid-template-columns: 1fr; }
    .badges { grid-template-columns: 1fr; }
    .achievement-toast-wrap {
        top: auto;
        right: 14px;
        left: 14px;
        bottom: 18px;
    }
    .achievement-toast { width: 100%; }
}
</style>
</head>

<body>

<div class="header">
    <button class="back-btn" id="backBtn">←</button>
    <div class="header-title">🏆 Achievements</div>
</div>

<div class="container">

    <section class="hero">
        <div class="hero-kicker">Alysum Trophy Case</div>
        <h1>Achievement Progress</h1>
        <p>Write words. Build streaks. Accidentally become emotionally responsible for fictional people.</p>
    </section>

    <div class="stats">
        <div class="stat"><h3 id="totalWords">0</h3><p>Total Words</p></div>
        <div class="stat"><h3 id="streak">0</h3><p>Streak 🔥</p></div>
        <div class="stat"><h3 id="books">0</h3><p>Books</p></div>
        <div class="stat"><h3 id="dailyGoalStreak">0</h3><p>Goal Streak 🎯</p></div>
    </div>

    <p id="achievementsHint" class="achievements-hint hidden" role="status"></p>

    <div class="badges" id="badgeGrid"></div>

</div>

<script type="module">
import { supabase } from "./firebase.js";
import { wireSupabaseSession } from "./js/supabase-session.js?v=2";
import {
    clampDailyWordGoal,
    computeGoalStreakFromTotals,
    DEFAULT_DAILY_WORD_GOAL
} from "./js/writing-day-stats.js?v=2";
import { countBookWords } from "./js/book-word-count.js?v=3";

const grid = document.getElementById("badgeGrid");
const wordsEl = document.getElementById("totalWords");
const streakEl = document.getElementById("streak");
const booksEl = document.getElementById("books");
const dailyGoalStreakEl = document.getElementById("dailyGoalStreak");

let profileChannel = null;
let booksChannel = null;
let userData = {};
let booksSnap = [];
let firstRenderComplete = false;

const BADGES = [
    { id: "words_500", icon: "🧩", title: "First Sparks", goal: 500, getValue: d => d.words, desc: "Congratulations! You wrote 500 words and successfully tricked the blank page into backing down." },
    { id: "words_1000", icon: "✍️", title: "Keyboard Initiate", goal: 1000, getValue: d => d.words, desc: "Congratulations! You crossed 1,000 words. The keyboard now recognizes you as one of its own." },
    { id: "words_10000", icon: "🔥", title: "Plot Ignition", goal: 10000, getValue: d => d.words, desc: "Congratulations! You hit 10,000 words. The story has officially escaped containment." },
    { id: "words_50000", icon: "🏆", title: "Novel Territory", goal: 50000, getValue: d => d.words, desc: "Congratulations! You reached 50,000 words. This is no longer a casual little document." },
    { id: "words_100000", icon: "💎", title: "Serious Writer", goal: 100000, getValue: d => d.words, desc: "Congratulations! You reached 100,000 words. Your fictional universe has requested zoning permits." },
    { id: "words_200000", icon: "🚀", title: "Word Engine", goal: 200000, getValue: d => d.words, desc: "Congratulations! You reached 200,000 words. The draft is now generating its own gravity." },
    { id: "words_500000", icon: "🧠", title: "Lore Architect", goal: 500000, getValue: d => d.words, desc: "Congratulations! You reached half a million words. Somewhere, a side character has a family tree." },
    { id: "words_1000000", icon: "👑", title: "Million Word Monarch", goal: 1000000, getValue: d => d.words, desc: "Congratulations! You reached 1,000,000 words. The blank page has surrendered unconditionally." },

    { id: "streak_1", icon: "🌱", title: "You Showed Up", goal: 1, getValue: d => d.streak, desc: "Congratulations! You wrote today. The streak flame has been lit." },
    { id: "streak_3", icon: "⚡", title: "Three-Day Charge", goal: 3, getValue: d => d.streak, desc: "Congratulations! You wrote for 3 days in a row. Momentum is beginning to look suspiciously like discipline." },
    { id: "streak_7", icon: "🥷", title: "Stealth Author", goal: 7, getValue: d => d.streak, desc: "Congratulations! You successfully avoided abandoning your book for 7 consecutive days without alerting a single chapter." },
    { id: "streak_14", icon: "💪", title: "Locked In", goal: 14, getValue: d => d.streak, desc: "Congratulations! You wrote for 14 days in a row. Your excuses are currently marked as missing." },
    { id: "streak_30", icon: "📅", title: "Monthly Menace", goal: 30, getValue: d => d.streak, desc: "Congratulations! You kept writing for 30 days. The calendar has filed a formal complaint." },
    { id: "streak_60", icon: "🧱", title: "Unbreakable Draft", goal: 60, getValue: d => d.streak, desc: "Congratulations! You wrote for 60 days in a row. This habit now has structural integrity." },
    { id: "streak_90", icon: "📈", title: "Three-Month Grind", goal: 90, getValue: d => d.streak, desc: "Congratulations! You reached a 90-day streak. Your discipline has entered boss-fight territory." },
    { id: "streak_100", icon: "🌀", title: "Century Scribe", goal: 100, getValue: d => d.streak, desc: "Congratulations! You wrote for 100 days in a row. Reality is now loosely based on your outline." },
    { id: "streak_180", icon: "🏔️", title: "Half-Year Hermit", goal: 180, getValue: d => d.streak, desc: "Congratulations! You reached 180 days. You may now refer to your writing routine as ancient magic." },
    { id: "streak_365", icon: "🎖️", title: "Yearlong Legend", goal: 365, getValue: d => d.streak, desc: "Congratulations! You wrote for 365 days. The archive keepers will speak of this." },

    { id: "books_1", icon: "📚", title: "World Builder", goal: 1, getValue: d => d.books, desc: "Congratulations! You created your first book. The fictional universe has been notified." },
    { id: "books_5", icon: "📦", title: "Shelf Starter", goal: 5, getValue: d => d.books, desc: "Congratulations! You created 5 books. Your ideas are no longer traveling light." },
    { id: "books_10", icon: "🏗️", title: "Library Contractor", goal: 10, getValue: d => d.books, desc: "Congratulations! You created 10 books. Someone should probably check the blueprints." },
    { id: "books_25", icon: "🏛️", title: "Archive Empire", goal: 25, getValue: d => d.books, desc: "Congratulations! You created 25 books. This is less a library and more a sovereign territory." },

    { id: "daily_goal_3", icon: "🎯", title: "Goal Getter", goal: 3, getValue: d => d.dailyGoalStreak, desc: "Congratulations! You hit your daily word goal 3 days in a row. The target never saw it coming." }
];

function badgeStorageKey() {
    const uid = userData?.id || userData?.user_id || "anonymous";
    return `alysum_unlocked_badges_${uid}`;
}

function getUnlockedBadgeIds() {
    try {
        return JSON.parse(localStorage.getItem(badgeStorageKey()) || "[]");
    } catch {
        return [];
    }
}

function saveUnlockedBadgeIds(ids) {
    localStorage.setItem(badgeStorageKey(), JSON.stringify([...new Set(ids)]));
}

function showAchievementToast(badge) {
    let wrap = document.querySelector(".achievement-toast-wrap");

    if (!wrap) {
        wrap = document.createElement("div");
        wrap.className = "achievement-toast-wrap";
        document.body.appendChild(wrap);
    }

    const toast = document.createElement("div");
    toast.className = "achievement-toast";

    toast.innerHTML = `
        <div class="toast-icon">${badge.icon}</div>
        <div>
            <div class="toast-kicker">Achievement Unlocked</div>
            <div class="toast-title">"${badge.title}"</div>
            <div class="toast-desc">${badge.desc}</div>
        </div>
    `;

    wrap.appendChild(toast);

    setTimeout(() => {
        toast.remove();
        if (!wrap.children.length) wrap.remove();
    }, 6300);
}

function renderAchievementsFromCache() {
    const snap = Array.isArray(booksSnap) ? booksSnap : [];

    let totalWords = 0;
    try {
        snap.forEach((row) => {
            totalWords += countBookWords(row);
        });
    } catch (e) {
        console.warn("Achievements word count:", e);
    }

    let dailyGoalStreak = 0;
    try {
        const dailyGoal = clampDailyWordGoal(
            userData.daily_word_goal ?? userData.dailyWordGoal ?? DEFAULT_DAILY_WORD_GOAL
        );

        dailyGoalStreak = computeGoalStreakFromTotals(
            userData.writing_day_totals ?? userData.writingDayTotals ?? {},
            dailyGoal
        );
    } catch (e) {
        console.warn("Achievements goal streak:", e);
    }

    const data = {
        words: totalWords,
        streak: userData.streak || 0,
        books: snap.length,
        dailyGoalStreak
    };

    wordsEl.textContent = data.words.toLocaleString();
    streakEl.textContent = data.streak.toLocaleString();
    booksEl.textContent = data.books.toLocaleString();
    dailyGoalStreakEl.textContent = data.dailyGoalStreak.toLocaleString();

    renderBadges(data);
}

function renderBadges(data) {
    if (!grid) return;

    grid.innerHTML = "";

    const previouslyUnlocked = getUnlockedBadgeIds();
    const nowUnlocked = [];

    BADGES.forEach((b) => {
        const raw = b.getValue(data);
        const value = typeof raw === "number" && Number.isFinite(raw) ? raw : 0;
        const percent = Math.min(value / b.goal, 1) * 100;
        const unlocked = value >= b.goal;

        if (unlocked && b.id) {
            nowUnlocked.push(b.id);

            if (firstRenderComplete && !previouslyUnlocked.includes(b.id)) {
                showAchievementToast(b);
            }
        }

        const el = document.createElement("div");
        el.className = "badge " + (unlocked ? "unlocked" : "locked");

        el.innerHTML = `
            <div class="badge-top">
                <div class="badge-icon">${b.icon}</div>
                <div>
                    <div class="badge-kicker">${unlocked ? "Achievement Unlocked" : "Achievement Locked"}</div>
                    <div class="badge-title">"${b.title}"</div>
                </div>
            </div>

            <div class="badge-desc">${b.desc}</div>

            <div class="progress-bar">
                <div class="progress-fill" style="width:${percent}%"></div>
            </div>

            <div class="progress-text">
                <span>Progress</span>
                <span>${Math.min(value, b.goal).toLocaleString()} / ${b.goal.toLocaleString()}</span>
            </div>
        `;

        grid.appendChild(el);
    });

    saveUnlockedBadgeIds([...previouslyUnlocked, ...nowUnlocked]);
    firstRenderComplete = true;
}

async function loadUserAndBooks(uid) {
    const hintEl = document.getElementById("achievementsHint");

    if (hintEl) {
        hintEl.classList.add("hidden");
        hintEl.textContent = "";
    }

    const [{ data: profile, error: pErr }, { data: books, error: bErr }] = await Promise.all([
        supabase.from("users").select("*").eq("id", uid).maybeSingle(),
        supabase.from("books").select("sections, words").eq("user_id", uid)
    ]);

    if (pErr) console.warn("Achievements profile:", pErr);
    if (bErr) console.warn("Achievements books:", bErr);

    userData = profile || { id: uid };
    booksSnap = books || [];

    if (hintEl) {
        if (pErr || bErr) {
            hintEl.textContent =
                "Could not load your stats: " + (pErr?.message || bErr?.message || "Unknown error.");
            hintEl.classList.remove("hidden");
        } else if (!booksSnap.length) {
            let msg =
                "No books are linked to this login. If you already had a library, those rows may still exist under a different user id.";

            if (profile?.firebase_uid || profile?.firebaseUid) {
                msg +=
                    " After a Firebase → Supabase migration, run node repair-books-ownership.js from the project folder, then refresh. Or set books.user_id to your user id in Supabase.";
            } else {
                msg += " Create a book from Studio, or sign in with the account that owns the books.";
            }

            hintEl.textContent = msg;
            hintEl.classList.remove("hidden");
        }
    }

    renderAchievementsFromCache();
}

function startAchievementsRealtime(uid) {
    if (profileChannel) supabase.removeChannel(profileChannel);
    if (booksChannel) supabase.removeChannel(booksChannel);

    profileChannel = supabase
        .channel("badges_profile_" + uid)
        .on("postgres_changes", { event: "*", schema: "public", table: "users", filter: `id=eq.${uid}` }, () => loadUserAndBooks(uid).catch(console.error))
        .subscribe();

    booksChannel = supabase
        .channel("badges_books_" + uid)
        .on("postgres_changes", { event: "*", schema: "public", table: "books", filter: `user_id=eq.${uid}` }, () => loadUserAndBooks(uid).catch(console.error))
        .subscribe();
}

wireSupabaseSession((session) => {
    const user = session?.user;

    if (!user) {
        if (profileChannel) supabase.removeChannel(profileChannel);
        if (booksChannel) supabase.removeChannel(booksChannel);

        profileChannel = null;
        booksChannel = null;
        location.href = "login.html";
        return;
    }

    if (profileChannel) supabase.removeChannel(profileChannel);
    if (booksChannel) supabase.removeChannel(booksChannel);

    profileChannel = null;
    booksChannel = null;
    userData = {};
    booksSnap = [];
    firstRenderComplete = false;

    void loadUserAndBooks(user.id)
        .then(() => startAchievementsRealtime(user.id))
        .catch((err) => {
            console.error("Achievements load failed:", err);

            const hintEl = document.getElementById("achievementsHint");

            if (hintEl) {
                hintEl.textContent =
                    "Could not load achievements (" +
                    (err?.message || String(err)) +
                    "). Check your connection, refresh, or open the browser console for details.";

                hintEl.classList.remove("hidden");
            }

            renderAchievementsFromCache();
        });

    document.getElementById("backBtn").onclick = () => {
        window.location.href = "writer-dashboard.html";
    };
});
</script>

</body>
</html>
