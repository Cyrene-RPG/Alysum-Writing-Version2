<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<title>Alysum Achievements</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
try {
  var __g = localStorage.getItem("alysum-gradient-theme");
  if (__g && __g !== "classic") document.documentElement.setAttribute("data-gradient-theme", __g);
} catch (e) {}
</script>
<link rel="stylesheet" href="css/site-responsive.css?v=1" />
<style>
* { box-sizing: border-box; }

:root {
    --bg: #0b1220;
    --panel: #111827;
    --panel-2: #1f2937;
    --text: #ffffff;
    --muted: #9ca3af;
    --purple: #6d28d9;
    --border: rgba(255,255,255,0.08);
    --shadow: 0 14px 28px rgba(0,0,0,0.35);
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
}

.header {
    position: sticky;
    top: 0;
    z-index: 50;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--purple-dark), var(--theme-header-mid));
}

.header-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    font-weight: 900;
}

.back-btn {
    position: absolute;
    left: 14px;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: none;
    background: rgba(0,0,0,0.25);
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.stats {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    flex: 1 1 140px;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    text-align: center;
}

.stat h3 {
    margin: 0;
    font-size: 22px;
    font-weight: 900;
}

.stat p {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--muted);
}

.badges {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 18px;
}

.badge {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    transition: 0.2s;
}

.badge.unlocked {
    background: linear-gradient(135deg, var(--purple), var(--purple-bright));
}

.badge.locked {
    opacity: 0.65;
}

.badge-icon {
    font-size: 28px;
    margin-bottom: 8px;
}

.badge-title {
    font-size: 15px;
    font-weight: 900;
}

.badge-desc {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
}

.progress-bar {
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--purple), var(--theme-header-end));
    width: 0%;
}

.progress-text {
    font-size: 12px;
    margin-top: 6px;
    color: var(--muted);
    font-weight: 700;
}

.achievements-hint {
    margin: 0 0 18px;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(251, 191, 36, 0.1);
    border: 1px solid rgba(251, 191, 36, 0.35);
    color: #fcd34d;
    font-size: 13px;
    line-height: 1.45;
}

.achievements-hint.hidden {
    display: none;
}

@media (max-width: 540px) {
    .stats {
        flex-direction: column;
    }

    .stat {
        flex: 1 1 auto;
    }

    .header-title {
        font-size: 17px;
        max-width: min(260px, 72vw);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .container {
        padding: 14px 12px;
    }
}
</style>
<link rel="stylesheet" href="css/gradient-themes.css?v=2" />
</head>

<body>

<div class="header">
<button class="back-btn" id="backBtn">←</button>
<div class="header-title">🏆 Achievements</div>
</div>

<div class="container">

<div class="stats">
<div class="stat">
<h3 id="totalWords">0</h3>
<p>Total Words</p>
</div>
<div class="stat">
<h3 id="streak">0</h3>
<p>Streak 🔥</p>
</div>
<div class="stat">
<h3 id="books">0</h3>
<p>Books</p>
</div>
<div class="stat">
<h3 id="dailyGoalStreak">0</h3>
<p>Daily goal streak 🎯</p>
</div>
</div>

<p id="achievementsHint" class="achievements-hint hidden" role="status"></p>

<div class="badges" id="badgeGrid"></div>

</div>

<script type="module">
import { supabase } from "./firebase.js";
import { wireSupabaseSession } from "./js/supabase-session.js?v=2";
import {
    clampDailyWordGoal,
    computeGoalStreakFromTotals,
    DEFAULT_DAILY_WORD_GOAL
} from "./js/writing-day-stats.js?v=2";
import { countBookWords } from "./js/book-word-count.js?v=2";

const grid = document.getElementById("badgeGrid");
const wordsEl = document.getElementById("totalWords");
const streakEl = document.getElementById("streak");
const booksEl = document.getElementById("books");
const dailyGoalStreakEl = document.getElementById("dailyGoalStreak");

let profileChannel = null;
let booksChannel = null;
let userData = {};
let booksSnap = [];

/* FULL BADGES */
const BADGES = [
    { icon: "🧩", title: "500 Words", goal: 500, getValue: (d) => d.words, desc: "First step" },
    { icon: "✍️", title: "1K Words", goal: 1000, getValue: (d) => d.words, desc: "Start writing" },
    { icon: "🔥", title: "10K Words", goal: 10000, getValue: (d) => d.words, desc: "Momentum" },
    { icon: "🏆", title: "50K Words", goal: 50000, getValue: (d) => d.words, desc: "Big milestone" },
    { icon: "💎", title: "100K Words", goal: 100000, getValue: (d) => d.words, desc: "Serious writer" },
    { icon: "🚀", title: "200K Words", goal: 200000, getValue: (d) => d.words, desc: "Elite output" },
    { icon: "🧠", title: "500K Words", goal: 500000, getValue: (d) => d.words, desc: "Half million" },
    { icon: "👑", title: "1M Words", goal: 1000000, getValue: (d) => d.words, desc: "Master writer" },

    { icon: "🌱", title: "Day 1", goal: 1, getValue: (d) => d.streak, desc: "You showed up" },
    { icon: "⚡", title: "3 Day Streak", goal: 3, getValue: (d) => d.streak, desc: "Consistency" },
    { icon: "🔥", title: "7 Day Streak", goal: 7, getValue: (d) => d.streak, desc: "Strong habit" },
    { icon: "💪", title: "14 Day Streak", goal: 14, getValue: (d) => d.streak, desc: "Locked in" },
    { icon: "📅", title: "30 Day Streak", goal: 30, getValue: (d) => d.streak, desc: "Monthly discipline" },
    { icon: "🧱", title: "60 Day Streak", goal: 60, getValue: (d) => d.streak, desc: "Unbreakable" },
    { icon: "📈", title: "90 Day Streak", goal: 90, getValue: (d) => d.streak, desc: "3 month grind" },
    { icon: "🌀", title: "100 Day Streak", goal: 100, getValue: (d) => d.streak, desc: "Rare discipline" },
    { icon: "🏔️", title: "180 Day Streak", goal: 180, getValue: (d) => d.streak, desc: "Half year" },
    { icon: "🎖️", title: "365 Day Streak", goal: 365, getValue: (d) => d.streak, desc: "1 year legend" },

    { icon: "📚", title: "First Book", goal: 1, getValue: (d) => d.books, desc: "You started" },
    { icon: "📦", title: "5 Books", goal: 5, getValue: (d) => d.books, desc: "Library growing" },
    { icon: "🏗️", title: "10 Books", goal: 10, getValue: (d) => d.books, desc: "Builder" },
    { icon: "🏛️", title: "25 Books", goal: 25, getValue: (d) => d.books, desc: "Empire" },

    {
        icon: "🎯",
        title: "3-Day Goal Streak",
        goal: 3,
        getValue: (d) => d.dailyGoalStreak,
        desc: "Hit your daily word goal three days in a row"
    }
];

function renderAchievementsFromCache() {
    const snap = Array.isArray(booksSnap) ? booksSnap : [];

    let totalWords = 0;
    try {
        snap.forEach((row) => {
            totalWords += countBookWords(row);
        });
    } catch (e) {
        console.warn("Achievements word count:", e);
    }

    let dailyGoalStreak = 0;
    try {
        const dailyGoal = clampDailyWordGoal(
            userData.daily_word_goal ?? userData.dailyWordGoal ?? DEFAULT_DAILY_WORD_GOAL
        );
        dailyGoalStreak = computeGoalStreakFromTotals(
            userData.writing_day_totals ?? userData.writingDayTotals ?? {},
            dailyGoal
        );
    } catch (e) {
        console.warn("Achievements goal streak:", e);
    }

    const data = {
        words: totalWords,
        streak: userData.streak || 0,
        books: snap.length,
        dailyGoalStreak
    };

    wordsEl.textContent = data.words.toLocaleString();
    streakEl.textContent = data.streak;
    booksEl.textContent = data.books;
    dailyGoalStreakEl.textContent = data.dailyGoalStreak.toLocaleString();

    try {
        renderBadges(data);
    } catch (e) {
        console.error("Achievements badges render:", e);
    }
}

/* RENDER */
function renderBadges(data) {
    if (!grid) return;
    grid.innerHTML = "";

BADGES.forEach((b) => {
        const raw = b.getValue(data);
        const value = typeof raw === "number" && Number.isFinite(raw) ? raw : 0;
        const percent = Math.min(value / b.goal, 1) * 100;
        const unlocked = value >= b.goal;

        const el = document.createElement("div");
        el.className = "badge " + (unlocked ? "unlocked" : "locked");

        el.innerHTML = `
<div class="badge-icon">${b.icon}</div>
<div class="badge-title">${b.title}</div>
<div class="badge-desc">${b.desc}</div>

<div class="progress-bar">
<div class="progress-fill" style="width:${percent}%"></div>
</div>

<div class="progress-text">
${Math.min(value, b.goal)} / ${b.goal}
</div>
`;

        grid.appendChild(el);
    });
}

async function loadUserAndBooks(uid) {
    const hintEl = document.getElementById("achievementsHint");
    if (hintEl) {
        hintEl.classList.add("hidden");
        hintEl.textContent = "";
    }

    const [{ data: profile, error: pErr }, { data: books, error: bErr }] = await Promise.all([
        supabase.from("users").select("*").eq("id", uid).maybeSingle(),
        supabase.from("books").select("sections, words").eq("user_id", uid)
    ]);
    if (pErr) console.warn("Achievements profile:", pErr);
    if (bErr) console.warn("Achievements books:", bErr);
    userData = profile || {};
    booksSnap = books || [];

    if (hintEl) {
        if (pErr || bErr) {
            hintEl.textContent =
                "Could not load your stats: " + (pErr?.message || bErr?.message || "Unknown error.");
            hintEl.classList.remove("hidden");
        } else if (!booksSnap.length) {
            let msg =
                "No books are linked to this login. If you already had a library, those rows may still exist under a different user id.";
            if (profile?.firebase_uid || profile?.firebaseUid) {
                msg +=
                    " After a Firebase → Supabase migration, run node repair-books-ownership.js from the project folder (then refresh), or set books.user_id to your user id in Supabase.";
            } else {
                msg += " Create a book from Studio, or sign in with the account that owns the books.";
            }
            hintEl.textContent = msg;
            hintEl.classList.remove("hidden");
        }
    }

    renderAchievementsFromCache();
}

function startAchievementsRealtime(uid) {
    if (profileChannel) supabase.removeChannel(profileChannel);
    if (booksChannel) supabase.removeChannel(booksChannel);

    profileChannel = supabase
        .channel("badges_profile_" + uid)
        .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "users", filter: `id=eq.${uid}` },
            () => loadUserAndBooks(uid).catch(console.error)
        )
        .subscribe();

    booksChannel = supabase
        .channel("badges_books_" + uid)
        .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "books", filter: `user_id=eq.${uid}` },
            () => loadUserAndBooks(uid).catch(console.error)
        )
        .subscribe();
}

wireSupabaseSession((session) => {
    const user = session?.user;
    if (!user) {
        if (profileChannel) supabase.removeChannel(profileChannel);
        if (booksChannel) supabase.removeChannel(booksChannel);
        profileChannel = null;
        booksChannel = null;
        location.href = "login.html";
        return;
    }

    if (profileChannel) supabase.removeChannel(profileChannel);
    if (booksChannel) supabase.removeChannel(booksChannel);
    profileChannel = null;
    booksChannel = null;

    userData = {};
    booksSnap = [];
    void loadUserAndBooks(user.id)
        .then(() => startAchievementsRealtime(user.id))
        .catch((err) => {
            console.error("Achievements load failed:", err);
            const hintEl = document.getElementById("achievementsHint");
            if (hintEl) {
                hintEl.textContent =
                    "Could not load achievements (" +
                    (err?.message || String(err)) +
                    "). Check your connection, refresh, or open the browser console for details.";
                hintEl.classList.remove("hidden");
            }
            renderAchievementsFromCache();
        });

    document.getElementById("backBtn").onclick = () => {
        window.location.href = "studio.html";
    };
});
</script>

</body>
</html>
