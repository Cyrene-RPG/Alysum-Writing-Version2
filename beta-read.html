:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 85% 0,#403052,transparent 45%),#17151f;color:#f7efff;font:16px/1.6 system-ui,sans-serif}
main{max-width:490px;width:100%;background:#272232;border:1px solid #6b577d;border-radius:22px;padding:clamp(25px,6vw,45px);box-shadow:0 20px 60px #0005;text-align:center}

</style></head><body><main><div class="symbol" aria-hidden="true">✦</div>
<h1>You're invited to beta read</h1>
<p>A private reading copy is waiting for you on Alysum Writing.</p>
<p id="status">Opening your invitation…</p>
<a id="continue" href="/studio">Visit Alysum Writing</a></main>
<script>
(function(){
 const token=new URL(location.href).searchParams.get("token");
 if(!token||!/^[a-f0-9]{64}$/i.test(token)){
  document.getElementById("status").textContent="This invitation link is invalid.";
  return;
 }
 const target="/applications/editor/pages/beta-read.html?token="+encodeURIComponent(token);
 const link=document.getElementById("continue");
 link.href=target;link.textContent="Open beta reading invitation";
 location.replace(target);
})();
</script></body></html>
