<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/alysum-appearance-boot.js"></script>
    <link rel="stylesheet" href="css/site-responsive.css?v=1" />
    <link rel="stylesheet" href="css/gradient-themes.css?v=5" />
    <script src="js/gradient-theme-sync.js" defer></script>
    <title>Beta share — Alysum</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0b1220;
            --panel: #111827;
            --text: #f9fafb;
            --muted: #9ca3af;
            --border: rgba(255,255,255,0.1);
            --purple: #7c3aed;
            --danger: #f87171;
        }
        body {
            margin: 0;
            min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(ellipse 120% 60% at 50% -10%, var(--theme-body-spot, rgba(124, 58, 237, 0.2)) 0%, transparent 55%),
                var(--bg);
            color: var(--text);
        }
        body.light { --bg: #f4f6fb; --panel: #fff; --text: #171717; --muted: #5f6470; --border: rgba(0,0,0,0.08); }
        .hidden { display: none !important; }
        .mini-nav {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: color-mix(in srgb, var(--bg) 90%, transparent);
            overflow-x: auto;
        }
        .mini-nav a {
            flex-shrink: 0;
            padding: 8px 12px;
            border-radius: 999px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }
        .mini-nav a:hover { color: var(--text); background: rgba(255,255,255,0.06); }
        .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 90%, transparent); position: sticky; top: 0; z-index: 10; }
        .topbar h1 { margin: 0; font-size: 18px; flex: 1; }
        .btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 10px; padding: 9px 14px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
        .btn.primary { background: linear-gradient(135deg, var(--theme-header-mid, #5b21b6), var(--theme-header-end, var(--purple))); border: none; color: #fff; }
        .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        main { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
        .card h2 { margin: 0 0 8px; font-size: 17px; }
        .hint { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.5; }
        .status { padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; }
        .status.error { background: rgba(248,113,113,0.12); color: #fecaca; }
        .status.ok { background: rgba(34,197,94,0.12); color: #bbf7d0; }
        body.light .status.error { color: #b91c1c; }
        body.light .status.ok { color: #15803d; }
        .chapter-list { border: 1px solid var(--border); border-radius: 12px; max-height: 280px; overflow: auto; margin-bottom: 12px; }
        .chapter-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .chapter-row:last-child { border-bottom: none; }
        label.row { display: flex; align-items: center; gap: 10px; cursor: pointer; width: 100%; }
        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
        .field input { width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); padding: 10px 12px; font-size: 14px; }
        .snapshot-item, .share-item { border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .snapshot-meta, .share-meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .share-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .invite-url { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-top: 8px; }
        .badge { display: inline-block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 999px; background: rgba(124,58,237,0.2); color: #c4b5fd; }
        .badge.pending { background: var(--theme-accent-soft-bg, rgba(124, 58, 237, 0.15)); color: var(--theme-brand-kicker, #c4b5fd); }
        .badge.revoked { background: rgba(248,113,113,0.15); color: #fca5a5; }
        .badge.expired { background: var(--theme-accent-soft-bg, rgba(124, 58, 237, 0.15)); color: var(--theme-brand-kicker, #c4b5fd); }
    </style>
</head>
<body>
    <nav class="mini-nav" aria-label="Workspace">
        <a href="writer-dashboard.html">Studio</a>
        <a href="beta-rooms.html">Beta rooms</a>
        <a href="library.html">Library</a>
    </nav>
    <header class="topbar">
        <a class="btn" id="backBtn" href="beta-rooms.html">← Beta rooms</a>
        <h1 id="pageTitle">Beta share</h1>
    </header>
    <main>
        <div id="schemaWarn" class="status error hidden"></div>
        <div id="pageStatus" class="status hidden" role="status"></div>

        <section class="card" id="snapshotCard">
            <h2>Create snapshot</h2>
            <p class="hint">Readers never see your live draft — only a frozen copy of the chapters you pick. You can keep editing while they review this version.</p>
            <div class="field">
                <label for="snapshotLabel">Version label (optional)</label>
                <input id="snapshotLabel" type="text" placeholder="e.g. Act I — March draft" maxlength="120" />
            </div>
            <div class="chapter-list" id="chapterList"></div>
            <button type="button" class="btn primary" id="createSnapshotBtn">Create snapshot</button>
        </section>

        <section class="card">
            <h2>Snapshots</h2>
            <div id="snapshotsList"><p class="hint">Loading…</p></div>
        </section>

        <section class="card">
            <h2>Invites &amp; beta rooms</h2>
            <div id="sharesList"><p class="hint">Loading…</p></div>
        </section>
    </main>

    <script type="module">
        import { supabase } from "./firebase.js";
        import { wireSupabaseSession } from "./js/supabase-session.js?v=1";
        import {
            createBetaSnapshot,
            createManuscriptInvite,
            listBetaSnapshots,
            listManuscriptShares,
            extendManuscriptInvite,
            revokeManuscriptShare,
            betaRoomInviteUrl,
            betaRoomShareUrl,
            isBetaRoomsSchemaMissing
        } from "./js/beta-rooms-api.js?v=2";

        const params = new URLSearchParams(window.location.search);
        const bookId = String(params.get("book") || "").trim();
        const backBtn = document.getElementById("backBtn");
        const pageTitle = document.getElementById("pageTitle");
        const schemaWarn = document.getElementById("schemaWarn");
        const pageStatus = document.getElementById("pageStatus");
        const chapterList = document.getElementById("chapterList");
        const snapshotLabel = document.getElementById("snapshotLabel");
        const createSnapshotBtn = document.getElementById("createSnapshotBtn");
        const snapshotsList = document.getElementById("snapshotsList");
        const sharesList = document.getElementById("sharesList");

        let currentUser = null;
        let bookRow = null;
        let bodyChapters = [];

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function setStatus(msg, kind = "") {
            if (!msg) { pageStatus.classList.add("hidden"); return; }
            pageStatus.textContent = msg;
            pageStatus.className = "status " + (kind || "");
            pageStatus.classList.remove("hidden");
        }

        function renderChapters() {
            if (!bodyChapters.length) {
                chapterList.innerHTML = '<p class="hint" style="padding:12px">No body chapters in this book yet.</p>';
                createSnapshotBtn.disabled = true;
                return;
            }
            chapterList.innerHTML = bodyChapters.map((ch) => `
                <div class="chapter-row">
                    <label class="row">
                        <input type="checkbox" class="ch-pick" value="${escapeHtml(ch.id)}" checked />
                        <span>${escapeHtml(ch.title || "Untitled")}</span>
                    </label>
                </div>
            `).join("");
            createSnapshotBtn.disabled = false;
        }

        function selectedChapterIds() {
            return [...chapterList.querySelectorAll(".ch-pick:checked")].map((el) => el.value);
        }

        function formatDate(iso) {
            if (!iso) return "—";
            try { return new Date(iso).toLocaleString(); } catch { return iso; }
        }

        function statusBadge(status) {
            const s = String(status || "");
            return `<span class="badge ${s === "pending" || s === "revoked" || s === "expired" ? s : ""}">${escapeHtml(s)}</span>`;
        }

        async function refreshSnapshots() {
            try {
                const rows = await listBetaSnapshots(bookId);
                if (!rows.length) {
                    snapshotsList.innerHTML = '<p class="hint">No snapshots yet. Create one above.</p>';
                    return;
                }
                snapshotsList.innerHTML = rows.map((s) => `
                    <div class="snapshot-item" data-snapshot-id="${escapeHtml(s.id)}">
                        <strong>${escapeHtml(s.label || s.title || "Snapshot")}</strong>
                        <div class="snapshot-meta">${escapeHtml(s.title)} · ${Number(s.word_count || 0).toLocaleString()} words · ${formatDate(s.created_at)}</div>
                        <div class="share-actions">
                            <button type="button" class="btn primary invite-btn">Create invite link</button>
                        </div>
                    </div>
                `).join("");
                snapshotsList.querySelectorAll(".invite-btn").forEach((btn) => {
                    btn.addEventListener("click", async () => {
                        const item = btn.closest(".snapshot-item");
                        const snapshotId = item?.dataset?.snapshotId;
                        if (!snapshotId) return;
                        btn.disabled = true;
                        try {
                            const share = await createManuscriptInvite(bookId, snapshotId);
                            setStatus("Invite link created — copy it from the list below.", "ok");
                            await refreshShares();
                            const url = window.location.origin + betaRoomInviteUrl(share.invite_token);
                            try { await navigator.clipboard.writeText(url); setStatus("Invite link copied to clipboard.", "ok"); } catch { /* ignore */ }
                        } catch (err) {
                            console.error(err);
                            setStatus(err?.message || "Could not create invite.", "error");
                        } finally {
                            btn.disabled = false;
                        }
                    });
                });
            } catch (err) {
                console.error(err);
                if (isBetaRoomsSchemaMissing(err)) showSchemaWarn();
                snapshotsList.innerHTML = '<p class="hint">Could not load snapshots.</p>';
            }
        }

        function formatExpiry(sh) {
            if (sh.status === "active") return "No expiry while active";
            if (!sh.expires_at) return "No expiry set";
            try {
                return `Expires ${new Date(sh.expires_at).toLocaleString()}`;
            } catch {
                return `Expires ${sh.expires_at}`;
            }
        }

        async function refreshShares() {
            try {
                const rows = await listManuscriptShares(bookId);
                if (!rows.length) {
                    sharesList.innerHTML = '<p class="hint">No invites yet.</p>';
                    return;
                }
                sharesList.innerHTML = rows.map((sh) => {
                    const snap = sh.beta_snapshots || {};
                    const inviteUrl = sh.invite_token && (sh.status === "pending" || sh.status === "active")
                        ? `<div class="invite-url">${escapeHtml(window.location.origin + betaRoomInviteUrl(sh.invite_token))}</div>`
                        : "";
                    const roomUrl = sh.status === "active"
                        ? `<a class="btn" href="${escapeHtml(betaRoomShareUrl(sh.id))}">Open beta room</a>`
                        : "";
                    const canExtend = sh.status === "pending" || sh.status === "active" || sh.status === "expired";
                    return `
                        <div class="share-item" data-share-id="${escapeHtml(sh.id)}">
                            <div>${statusBadge(sh.status)} <strong>${escapeHtml(snap.label || snap.title || "Snapshot")}</strong></div>
                            <div class="share-meta">Created ${formatDate(sh.created_at)}${sh.accepted_at ? ` · Accepted ${formatDate(sh.accepted_at)}` : ""} · ${escapeHtml(formatExpiry(sh))}</div>
                            ${inviteUrl}
                            <div class="share-actions">
                                ${roomUrl}
                                <button type="button" class="btn copy-invite-btn" ${sh.invite_token ? "" : "disabled"}>Copy invite</button>
                                ${canExtend ? '<button type="button" class="btn extend-btn">Extend 1 year</button>' : ""}
                                ${sh.status === "active" || sh.status === "pending" ? '<button type="button" class="btn danger revoke-btn">Revoke</button>' : ""}
                            </div>
                        </div>
                    `;
                }).join("");

                sharesList.querySelectorAll(".copy-invite-btn").forEach((btn) => {
                    btn.addEventListener("click", async () => {
                        const item = btn.closest(".share-item");
                        const shareId = item?.dataset?.shareId;
                        const row = rows.find((r) => r.id === shareId);
                        if (!row?.invite_token) return;
                        const url = window.location.origin + betaRoomInviteUrl(row.invite_token);
                        try {
                            await navigator.clipboard.writeText(url);
                            setStatus("Invite link copied.", "ok");
                        } catch {
                            setStatus(url, "ok");
                        }
                    });
                });

                sharesList.querySelectorAll(".extend-btn").forEach((btn) => {
                    btn.addEventListener("click", async () => {
                        const item = btn.closest(".share-item");
                        const shareId = item?.dataset?.shareId;
                        if (!shareId) return;
                        btn.disabled = true;
                        try {
                            await extendManuscriptInvite(shareId);
                            setStatus("Invite extended by 1 year.", "ok");
                            await refreshShares();
                        } catch (err) {
                            console.error(err);
                            setStatus(err?.message || "Could not extend invite.", "error");
                        } finally {
                            btn.disabled = false;
                        }
                    });
                });

                sharesList.querySelectorAll(".revoke-btn").forEach((btn) => {
                    btn.addEventListener("click", async () => {
                        const item = btn.closest(".share-item");
                        const shareId = item?.dataset?.shareId;
                        if (!shareId || !confirm("Revoke this invite? The reader will lose access.")) return;
                        btn.disabled = true;
                        try {
                            await revokeManuscriptShare(shareId);
                            setStatus("Share revoked.", "ok");
                            await refreshShares();
                        } catch (err) {
                            console.error(err);
                            setStatus(err?.message || "Could not revoke.", "error");
                        } finally {
                            btn.disabled = false;
                        }
                    });
                });
            } catch (err) {
                console.error(err);
                if (isBetaRoomsSchemaMissing(err)) showSchemaWarn();
                sharesList.innerHTML = '<p class="hint">Could not load shares.</p>';
            }
        }

        function showSchemaWarn() {
            schemaWarn.textContent = "Beta rooms tables are not in Supabase yet. Run supabase-beta-rooms.sql in the SQL Editor, then refresh.";
            schemaWarn.classList.remove("hidden");
        }

        async function loadBook() {
            const { data, error } = await supabase.from("books").select("id, title, sections").eq("id", bookId).eq("user_id", currentUser.id).maybeSingle();
            if (error) throw error;
            if (!data) throw new Error("Book not found.");
            bookRow = data;
            const sections = data.sections && typeof data.sections === "object" ? data.sections : {};
            bodyChapters = Array.isArray(sections.body) ? sections.body.map((ch, i) => ({
                id: String(ch?.id || `ch-${i}`),
                title: String(ch?.title || `Chapter ${i + 1}`)
            })) : [];
            pageTitle.textContent = `Beta share · ${data.title || "Untitled"}`;
            if (backBtn) backBtn.href = "beta-rooms.html";
            renderChapters();
        }

        createSnapshotBtn.addEventListener("click", async () => {
            const ids = selectedChapterIds();
            if (!ids.length) { setStatus("Select at least one chapter.", "error"); return; }
            createSnapshotBtn.disabled = true;
            try {
                await createBetaSnapshot(bookId, ids, snapshotLabel.value.trim());
                snapshotLabel.value = "";
                setStatus("Snapshot created.", "ok");
                await refreshSnapshots();
                await refreshShares();
            } catch (err) {
                console.error(err);
                if (isBetaRoomsSchemaMissing(err)) showSchemaWarn();
                setStatus(err?.message || "Could not create snapshot.", "error");
            } finally {
                createSnapshotBtn.disabled = false;
            }
        });

        wireSupabaseSession(async (session) => {
            currentUser = session?.user ?? null;
            if (!currentUser) {
                window.location.href = "login.html?next=" + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }
            if (!bookId) {
                setStatus("No book specified. Open this page from the editor.", "error");
                return;
            }
            try {
                await loadBook();
                await refreshSnapshots();
                await refreshShares();
            } catch (err) {
                console.error(err);
                setStatus(err?.message || "Could not load book.", "error");
            }
        });
    </script>
</body>
</html>
