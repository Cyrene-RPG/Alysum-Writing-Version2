<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collab room — Alysum</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0b1220; color: #e5e7eb; }
        .redirect-card { text-align: center; padding: 24px; max-width: 420px; line-height: 1.55; }
    </style>
</head>
<body>
    <div class="redirect-card" id="status">Opening collab room in the editor…</div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get("preview") === "1") {
            window.location.replace("collab-room-preview.html" + window.location.search);
        } else {
            const url = new URL("editor.html", window.location.href);
            for (const [key, value] of params.entries()) {
                url.searchParams.set(key, value);
            }
            if (params.get("invite")) {
                url.searchParams.set("collab", "edit");
            } else if (params.get("book") && params.get("chapter")) {
                url.searchParams.set("collab", "review");
            }
            window.location.replace(url.pathname + url.search);
        }
    </script>
</body>
</html>
