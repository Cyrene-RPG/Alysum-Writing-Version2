<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script type="importmap">
    { "imports": { "@alysum/artist/": "/core/artist/" } }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/applications/artist/artist-css/studio.css">
    <title>Draw preview</title>
</head>
<body>
<div id="draw-app" data-manual="1"></div>
<script type="module">
import { mountDrawApp } from "/applications/artist/page-ui/studio.js";
import { createPainter } from "/applications/artist/page-ui/studio-paint.js";
import { addLayer, brushById, createStudioDocument } from "/core/artist/studio.js";

const projects = new Map();
const pixels = new Map();
const store = {
    async list() { return [...projects.values()]; },
    async load(id) {
        const doc = projects.get(id);
        if (!doc) return null;
        const blobs = new Map();
        for (const layer of doc.layers) {
            const blob = pixels.get(`${id}:${layer.id}`);
            if (blob) blobs.set(layer.id, blob);
        }
        return { doc, blobs };
    },
    async save(doc, blobs, thumb) {
        const record = { ...doc, thumb, updatedAt: Date.now() };
        projects.set(doc.id, record);
        for (const [layerId, blob] of blobs) pixels.set(`${doc.id}:${layerId}`, blob);
        return record;
    },
    async remove(id) { projects.delete(id); },
};

localStorage.setItem("alysum-draw-help", "1");
const errors = [];
window.addEventListener("error", (event) => errors.push(String(event.message || event.error)));
await mountDrawApp(document.getElementById("draw-app"), {
    projectId: "",
    characterId: "",
    store,
    upload: async () => "Saved to My art as a private image.",
});

const params = new URLSearchParams(location.search);
if (params.get("setup") === "1") {
    document.querySelector("#draw-notice-dialog").close();
    document.querySelector("#draw-new").click();
    document.querySelector("#draw-presets button[data-preset='a4']").click();
    const dialog = document.querySelector("#draw-sheet");
    const sheet = document.querySelector("#draw-sheetlet").getBoundingClientRect();
    const dialogBox = dialog.getBoundingClientRect();
    const widthBox = document.querySelector("#draw-width-input").getBoundingClientRect();
    const heightBox = document.querySelector("#draw-height-input").getBoundingClientRect();
    const scroller = window.innerWidth < 700
        ? document.querySelector(".draw-create-body")
        : document.querySelector(".draw-create-settings");
    const last = document.querySelector("#draw-presets button:last-child");
    const lastBottom = last.getBoundingClientRect().bottom - scroller.getBoundingClientRect().top + scroller.scrollTop;
    const report = document.createElement("pre");
    report.id = "draw-layout";
    report.textContent = JSON.stringify({
        view: [window.innerWidth, window.innerHeight],
        dialogFits: dialogBox.right <= window.innerWidth + 1 && dialogBox.bottom <= window.innerHeight + 1,
        sheet: [Math.round(sheet.width), Math.round(sheet.height)],
        inputsClear: widthBox.right <= heightBox.left + 1,
        lastReachable: lastBottom <= scroller.scrollHeight + 2,
        columns: getComputedStyle(document.querySelector(".draw-create-body")).gridTemplateColumns.includes(" ") ? "split" : "stack",
    });
    document.body.append(report);
}
if (params.get("demo") === "1") {
    document.querySelector("#draw-notice-dialog").close();
    document.querySelector("#draw-notice").click();
    const noticeText = document.querySelector("#draw-notice-dialog p").textContent;
    document.querySelector("#draw-notice-dialog").close();
    document.querySelector("#draw-new").click();
    const setupPreview = document.querySelector("#draw-canvas-preview").textContent;
    const setupPresets = document.querySelectorAll("#draw-presets button").length;
    const setupSheet = document.querySelector("#draw-sheetlet").getBoundingClientRect();
    document.querySelector("#draw-presets button[data-preset='portrait']").click();
    const portraitPreview = document.querySelector("#draw-canvas-preview").textContent;
    document.querySelector("#draw-presets button[data-preset='sketch']").click();
    document.querySelector("#draw-create").requestSubmit();
    await new Promise((resolve) => setTimeout(resolve, 80));
    const size = document.querySelector("#draw-size");
    size.value = "72";
    size.dispatchEvent(new Event("input", { bubbles: true }));
    const viewport = document.querySelector("#draw-viewport");
    const rect = viewport.getBoundingClientRect();
    const startX = rect.left + rect.width * 0.38;
    const startY = rect.top + rect.height * 0.5;
    const steps = 36;
    viewport.dispatchEvent(new PointerEvent("pointerdown", { clientX: startX, clientY: startY, pointerId: 1, pointerType: "pen", pressure: 0.7, buttons: 1, bubbles: true }));
    for (let i = 1; i <= steps; i += 1) {
        const x = startX + i * 8;
        const y = startY + Math.sin(i / 3) * 18;
        viewport.dispatchEvent(new PointerEvent("pointermove", { clientX: x, clientY: y, pointerId: 1, pointerType: "pen", pressure: 0.4 + (i % 5) * 0.1, buttons: 1, bubbles: true }));
    }
    viewport.dispatchEvent(new PointerEvent("pointerup", { clientX: startX + steps * 8, clientY: startY, pointerId: 1, pointerType: "pen", pressure: 0, bubbles: true }));
    await new Promise((resolve) => setTimeout(resolve, 50));
    const canvas = document.querySelector("#draw-canvas");
    const ctx = canvas.getContext("2d");
    const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let ink = 0;
    for (let i = 0; i < data.length; i += 16) {
        if (data[i] < 36 && data[i + 3] > 200) ink += 1;
    }
    document.querySelector("#draw-cursor").hidden = true;
    const result = document.createElement("pre");
    result.id = "draw-result";
    const probe = document.createElement("canvas");
    const engine = createPainter(probe);
    const doc = createStudioDocument({ width: 240, height: 120, background: "#ffffff" });
    engine.setDocument(doc);
    engine.resizeView(240, 120);
    engine.fit();
    const brush = { ...brushById("studio-pen"), streamline: 0 };
    engine.beginStroke({ tool: "paint", brush, color: "#111111", size: 24, opacity: 1 });
    engine.extendStroke({ x: 20, y: 60 }, 1);
    engine.extendStroke({ x: 200, y: 60 }, 1);
    engine.commitStroke();
    engine.render();
    const probed = probe.getContext("2d").getImageData(0, 0, probe.width, probe.height).data;
    let engineInk = 0;
    for (let i = 0; i < probed.length; i += 4) if (probed[i] < 40) engineInk += 1;
    const darkAt = (x, y) => {
        const sx = Math.min(probe.width - 1, Math.max(0, Math.round(x * probe.width / 200)));
        const sy = Math.min(probe.height - 1, Math.max(0, Math.round(y * probe.height / 80)));
        const pixel = probe.getContext("2d").getImageData(sx, sy, 1, 1).data;
        return pixel[0] < 80 && pixel[3] > 180;
    };
    const lab = createStudioDocument({ width: 200, height: 80, background: "#ffffff" });
    const pen = { ...brushById("technical-pencil"), streamline: 0, scatter: 0, grain: 0 };
    engine.setDocument(lab);
    engine.resizeView(200, 80);
    engine.view.zoom = 1;
    engine.view.panX = 0;
    engine.view.panY = 0;
    engine.view.rotation = 0;
    engine.beginStroke({ tool: "paint", brush: pen, color: "#111111", size: 10, opacity: 1 });
    engine.extendStroke({ x: 20, y: 60 }, 1);
    engine.extendStroke({ x: 90, y: 60 }, 1);
    engine.commitStroke();
    const second = addLayer(lab);
    engine.syncDocument(second);
    engine.beginStroke({ tool: "paint", brush: pen, color: "#111111", size: 10, opacity: 1 });
    engine.extendStroke({ x: 20, y: 16 }, 1);
    engine.extendStroke({ x: 70, y: 16 }, 1);
    engine.commitStroke();
    const hidden = {
        ...second,
        layers: second.layers.map((layer) => layer.id === lab.layers[0].id ? { ...layer, visible: false } : layer),
    };
    engine.syncDocument(hidden);
    engine.render();
    const upperOnly = darkAt(40, 16) && !darkAt(40, 60);
    engine.syncDocument({ ...hidden, layers: hidden.layers.map((layer) => ({ ...layer, visible: true })), symmetry: "vertical" });
    engine.beginStroke({ tool: "paint", brush: pen, color: "#111111", size: 8, opacity: 1 });
    engine.extendStroke({ x: 24, y: 40 }, 1);
    engine.extendStroke({ x: 36, y: 40 }, 1);
    engine.commitStroke();
    engine.render();
    const mirrored = darkAt(30, 40) && darkAt(170, 40);
    engine.selectShape({ kind: "rect", x: 0, y: 0, w: 50, h: 80 }, "replace");
    engine.beginStroke({ tool: "paint", brush: pen, color: "#111111", size: 12, opacity: 1 });
    engine.extendStroke({ x: 10, y: 28 }, 1);
    engine.extendStroke({ x: 140, y: 28 }, 1);
    engine.commitStroke();
    engine.render();
    const clipped = darkAt(24, 28) && !darkAt(120, 28);
    engine.clearSelection();
    engine.beginStroke({ tool: "erase", brush: { ...brushById("hard-airbrush"), streamline: 0, scatter: 0 }, color: "#ff0000", size: 28, opacity: 1 });
    engine.extendStroke({ x: 10, y: 16 }, 1);
    engine.extendStroke({ x: 80, y: 16 }, 1);
    engine.commitStroke();
    engine.render();
    const erased = !darkAt(40, 16);
    result.textContent = JSON.stringify({
        title: document.querySelector("#draw-title")?.textContent || "",
        stage: document.querySelector("#draw-stage")?.hidden === false,
        ink,
        engineInk,
        upperOnly,
        mirrored,
        clipped,
        erased,
        noticeText,
        setupPreview,
        setupPresets,
        portraitPreview,
        sheetWide: Math.round(setupSheet.width),
        sheetTall: Math.round(setupSheet.height),
        errors,
        width: canvas.width,
        height: canvas.height,
    });
    document.body.append(result);
}
</script>
</body>
</html>
