<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book Formatter</title>

  <!-- Connect CSS -->
  <link rel="stylesheet" href="format.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<button id="themeToggle">Toggle Theme</button>
  <h2>Formatter</h2>

  <!-- TRIM SIZE SELECTOR -->
  <label for="trimSize">Trim Size</label>
  <select id="trimSize">
    <option value="5x8">5 x 8 (KDP / Barnes & Noble)</option>
    <option value="6x9">6 x 9</option>
    <option value="5_5x8_5">5.5 x 8.5</option>
    <option value="mass">Mass Market</option>
  </select>

  <hr>

  <!-- ACTION BUTTONS -->
  <button id="renderBtn">Render Book</button>
  <button id="exportBtn">Export Book</button>

</div>

<!-- PREVIEW AREA -->
<div id="preview" class="preview"></div>

<!-- CONNECT JS (must be at bottom) -->
<script src="format.js"></script>

</body>
</html>
