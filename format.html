<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Alysum Formatter Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --ui-bg: #e8edf3;
      --ui-panel: #ffffff;
      --ui-border: #d7dee7;
      --ui-text: #1f2937;
      --ui-muted: #6b7280;
      --ui-purple: #6d28d9;

      --page-width: 816px;
      --page-height: 1056px;

      --margin-top: 84px;
      --margin-bottom: 84px;
      --margin-inside: 92px;
      --margin-outside: 72px;

      --header-height: 22px;
      --footer-height: 22px;

      --content-width: calc(var(--page-width) - var(--margin-inside) - var(--margin-outside));
      --content-height: calc(var(--page-height) - var(--margin-top) - var(--margin-bottom) - var(--header-height) - var(--footer-height));

      --book-font-size: 18px;
      --book-line-height: 1.8;
      --chapter-title-size: 34px;
      --chapter-opener-top-space: 72px;
      --paragraph-spacing: 1.2em;
      --paragraph-indent: 2em;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--ui-bg);
      color: var(--ui-text);
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
    }

    .sidebar {
      background: #f9fbfd;
      border-right: 1px solid var(--ui-border);
      padding: 16px;
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      overflow: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .sidebar h1 {
      margin: 0 0 10px;
      font-size: 22px;
      color: var(--ui-purple);
    }

    .sidebar .sub {
      color: var(--ui-muted);
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.45;
    }

    .group {
      border: 1px solid var(--ui-border);
      border-radius: 14px;
      background: var(--ui-panel);
      padding: 12px;
      margin-bottom: 14px;
    }

    .group h2 {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ui-muted);
    }

    .row {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }

    .row.two {
      grid-template-columns: 1fr 1fr;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: var(--ui-text);
    }

    input[type="text"],
    input[type="number"],
    select {
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--ui-border);
      padding: 0 10px;
      background: #fff;
      color: var(--ui-text);
      font-size: 14px;
    }

    input[type="checkbox"] {
      transform: translateY(1px);
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      height: 40px;
      border: 1px solid var(--ui-border);
      border-radius: 10px;
      background: #fff;
      color: var(--ui-text);
      font-weight: 800;
      padding: 0 12px;
      cursor: pointer;
    }

    button.primary {
      background: var(--ui-purple);
      color: #fff;
      border-color: var(--ui-purple);
    }

    .main {
      min-width: 0;
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .titleblock {
      min-width: 0;
    }

    .doc-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 4px;
    }

    .status {
      font-size: 13px;
      color: var(--ui-muted);
      font-weight: 700;
    }

    .stack {
      max-width: 980px;
      margin: 0 auto;
    }

    .page {
      position: relative;
      width: var(--page-width);
      height: var(--page-height);
      background: #fff;
      margin: 0 auto 28px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    .page.right {
      padding: var(--margin-top) var(--margin-outside) var(--margin-bottom) var(--margin-inside);
    }

    .page.left {
      padding: var(--margin-top) var(--margin-inside) var(--margin-bottom) var(--margin-outside);
    }

    .page.blank .page-header,
    .page.blank .page-footer {
      display: none;
    }

    .page-header,
    .page-footer {
      position: absolute;
      left: 0;
      width: 100%;
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      pointer-events: none;
    }

    .page-header {
      top: 24px;
    }

    .page-footer {
      bottom: 22px;
    }

    .page-content {
      width: var(--content-width);
      height: var(--content-height);
      overflow: hidden;
      position: relative;
    }

    .render-root {
      width: 100%;
      color: #111827;
      font-size: var(--book-font-size);
      line-height: var(--book-line-height);
      word-break: break-word;
    }

    .render-root p {
      margin: 0 0 var(--paragraph-spacing);
      text-indent: var(--paragraph-indent);
    }

    .render-root p.first-para,
    .render-root p.no-indent,
    .render-root .chapter-title,
    .render-root .chapter-number,
    .render-root .front-title,
    .render-root .front-author,
    .render-root .front-subtitle,
    .render-root .section-heading,
    .render-root .scene-break,
    .render-root .toc-title,
    .render-root .toc-entry,
    .render-root blockquote,
    .render-root ul,
    .render-root ol {
      text-indent: 0;
    }

    .render-root .chapter-opener {
      padding-top: var(--chapter-opener-top-space);
    }

    .render-root .chapter-number {
      text-align: center;
      color: #6b7280;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 14px;
      margin: 0 0 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .render-root .chapter-title {
      text-align: center;
      font-size: var(--chapter-title-size);
      line-height: 1.2;
      margin: 0 0 48px;
      font-weight: 700;
    }

    .render-root .front-title {
      margin: 170px 0 14px;
      text-align: center;
      font-size: 38px;
      line-height: 1.15;
      font-weight: 700;
    }

    .render-root .front-subtitle {
      text-align: center;
      color: #6b7280;
      margin: 0 0 12px;
      font-size: 18px;
    }

    .render-root .front-author {
      text-align: center;
      font-size: 22px;
      margin: 72px 0 0;
    }

    .render-root .section-heading {
      font-size: 1.22em;
      line-height: 1.3;
      font-weight: 700;
      margin: 0 0 1em;
    }

    .render-root blockquote {
      border-left: 4px solid #8b5cf6;
      padding-left: 16px;
      margin: 0 0 1.2em;
      color: #4b5563;
    }

    .render-root ul,
    .render-root ol {
      margin: 0 0 1.2em 1.5em;
      padding: 0;
    }

    .render-root li {
      margin: 0 0 0.45em;
    }

    .render-root .scene-break {
      text-align: center;
      letter-spacing: 0.35em;
      margin: 1.6em 0;
    }

    .render-root .spacer {
      height: 1.2em;
    }

    .render-root .toc-title {
      text-align: center;
      font-size: 28px;
      margin: 80px 0 36px;
    }

    .render-root .toc-entry {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 0.85em;
    }

    .render-root .copyright-block {
      margin-top: 200px;
      font-size: 15px;
      line-height: 1.75;
    }

    .measure-host {
      position: absolute;
      left: -99999px;
      top: 0;
      width: var(--content-width);
      height: var(--content-height);
      overflow: hidden;
      visibility: hidden;
      pointer-events: none;
    }

    .measure-root {
      width: 100%;
    }

    @media (max-width: 1100px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--ui-border);
      }
    }

    @media (max-width: 920px) {
      .main {
        padding: 10px;
      }

      .page {
        width: calc(var(--page-width) * 0.5);
        height: calc(var(--page-height) * 0.5);
        transform-origin: top center;
      }

      .page.right {
        padding:
          calc(var(--margin-top) * 0.5)
          calc(var(--margin-outside) * 0.5)
          calc(var(--margin-bottom) * 0.5)
          calc(var(--margin-inside) * 0.5);
      }

      .page.left {
        padding:
          calc(var(--margin-top) * 0.5)
          calc(var(--margin-inside) * 0.5)
          calc(var(--margin-bottom) * 0.5)
          calc(var(--margin-outside) * 0.5);
      }

      .page-content {
        width: calc(var(--content-width) * 0.5);
        height: calc(var(--content-height) * 0.5);
        transform: scale(0.5);
        transform-origin: top left;
      }
    }

    @media print {
      @page {
        size: 6in 9in;
        margin: 0;
      }

      html, body {
        background: #fff;
      }

      .sidebar,
      .topbar .actions {
        display: none !important;
      }

      .app {
        display: block;
      }

      .main {
        padding: 0;
      }

      .topbar {
        margin: 0;
      }

      .topbar .titleblock {
        display: none;
      }

      .page {
        margin: 0;
        box-shadow: none;
        break-after: page;
        page-break-after: always;
        width: 6in;
        height: 9in;
      }

      .page.right {
        padding: 0.875in 0.75in 0.875in 0.958in;
      }

      .page.left {
        padding: 0.875in 0.958in 0.875in 0.75in;
      }

      .page-content {
        width: calc(6in - 0.958in - 0.75in);
        height: calc(9in - 0.875in - 0.875in - 0.22in - 0.22in);
        transform: none !important;
      }

      .page-header {
        top: 0.28in;
      }

      .page-footer {
        bottom: 0.2in;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>Alysum Formatter</h1>
      <div class="sub">This page is the formatter engine, not the editor. It reads your saved manuscript and lays it out as printable pages.</div>

      <div class="group">
        <h2>Layout</h2>
        <div class="row">
          <label for="trimSelect">Trim size</label>
          <select id="trimSelect">
            <option value="6x9">6 × 9</option>
            <option value="5.5x8.5">5.5 × 8.5</option>
          </select>
        </div>

        <div class="row two">
          <div>
            <label for="fontSizeInput">Font size</label>
            <input id="fontSizeInput" type="number" min="10" max="24" step="1" value="18" />
          </div>
          <div>
            <label for="lineHeightInput">Line height</label>
            <input id="lineHeightInput" type="number" min="1.2" max="2.4" step="0.05" value="1.8" />
          </div>
        </div>

        <div class="row two">
          <div>
            <label for="indentInput">Paragraph indent</label>
            <input id="indentInput" type="number" min="0" max="4" step="0.1" value="2" />
          </div>
          <div>
            <label for="spacingInput">Paragraph spacing</label>
            <input id="spacingInput" type="number" min="0.5" max="2.5" step="0.1" value="1.2" />
          </div>
        </div>
      </div>

      <div class="group">
        <h2>Structure</h2>
        <label class="checkbox"><input id="includeFrontInput" type="checkbox" checked /> Include front matter</label>
        <label class="checkbox"><input id="includeBackInput" type="checkbox" checked /> Include back matter</label>
        <label class="checkbox"><input id="forceRectoInput" type="checkbox" checked /> Start sections on right-hand pages</label>
        <label class="checkbox"><input id="showHeadersInput" type="checkbox" checked /> Show running headers</label>
        <label class="checkbox"><input id="showPageNumsInput" type="checkbox" checked /> Show page numbers</label>
        <label class="checkbox"><input id="romanFrontInput" type="checkbox" checked /> Roman numerals in front matter</label>
        <label class="checkbox"><input id="keepHeadingsInput" type="checkbox" checked /> Keep headings with next block</label>
        <label class="checkbox"><input id="widowControlInput" type="checkbox" checked /> Basic widow/orphan protection</label>
      </div>

      <div class="group">
        <h2>Actions</h2>
        <div class="actions">
          <button id="repaginateBtn" type="button">Repaginate</button>
          <button id="exportBtn" type="button" class="primary">Export PDF</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="titleblock">
          <div class="doc-title" id="docTitle">Loading…</div>
          <div class="status" id="status">Preparing formatter…</div>
        </div>
        <div class="actions">
          <button id="repaginateBtnTop" type="button">Repaginate</button>
          <button id="exportBtnTop" type="button" class="primary">Export PDF</button>
        </div>
      </div>

      <div class="stack" id="pageStack"></div>
    </main>
  </div>

  <div class="measure-host">
    <div class="render-root measure-root" id="measureRoot"></div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    const bookId = params.get("book");
    const selectedChapterIds = (params.get("chapters") || "").split(",").map(s => s.trim()).filter(Boolean);

    const docTitle = document.getElementById("docTitle");
    const statusEl = document.getElementById("status");
    const pageStack = document.getElementById("pageStack");
    const measureRoot = document.getElementById("measureRoot");

    const trimSelect = document.getElementById("trimSelect");
    const fontSizeInput = document.getElementById("fontSizeInput");
    const lineHeightInput = document.getElementById("lineHeightInput");
    const indentInput = document.getElementById("indentInput");
    const spacingInput = document.getElementById("spacingInput");

    const includeFrontInput = document.getElementById("includeFrontInput");
    const includeBackInput = document.getElementById("includeBackInput");
    const forceRectoInput = document.getElementById("forceRectoInput");
    const showHeadersInput = document.getElementById("showHeadersInput");
    const showPageNumsInput = document.getElementById("showPageNumsInput");
    const romanFrontInput = document.getElementById("romanFrontInput");
    const keepHeadingsInput = document.getElementById("keepHeadingsInput");
    const widowControlInput = document.getElementById("widowControlInput");

    const repaginateBtn = document.getElementById("repaginateBtn");
    const exportBtn = document.getElementById("exportBtn");
    const repaginateBtnTop = document.getElementById("repaginateBtnTop");
    const exportBtnTop = document.getElementById("exportBtnTop");

    let currentUser = null;
    let currentBook = null;

    const settings = {
      trim: "6x9",
      fontSize: 18,
      lineHeight: 1.8,
      indentEm: 2,
      paragraphSpacingEm: 1.2,
      includeFrontMatter: true,
      includeBackMatter: true,
      forceRectoSections: true,
      showHeaders: true,
      showPageNumbers: true,
      romanFrontMatter: true,
      keepHeadingWithNext: true,
      basicWidowControl: true
    };

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function safeString(value, fallback = "") {
      return typeof value === "string" ? value : fallback;
    }

    function safeArray(value, fallback = []) {
      return Array.isArray(value) ? value : fallback;
    }

    function safeObject(value, fallback = {}) {
      return value && typeof value === "object" && !Array.isArray(value) ? value : fallback;
    }

    function generateId() {
      return "ch_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    }

    function normalizeChapter(raw, fallbackTitle = "Untitled") {
      const chapter = safeObject(raw, {});
      return {
        id: safeString(chapter.id, generateId()),
        title: safeString(chapter.title, fallbackTitle),
        content: safeString(chapter.content, "")
      };
    }

    function normalizeSections(rawSections) {
      const sections = safeObject(rawSections, {});
      const frontRaw = safeArray(sections.front, []);
      const bodyRaw = safeArray(sections.body, []);
      const backRaw = safeArray(sections.back, []);

      const front = frontRaw.length
        ? frontRaw.map((ch, i) => normalizeChapter(ch, i === 0 ? "Copyright" : "Table of Contents"))
        : [
            { id: generateId(), title: "Copyright", content: "" },
            { id: generateId(), title: "Table of Contents", content: "" }
          ];

      const body = bodyRaw.length
        ? bodyRaw.map((ch, i) => normalizeChapter(ch, `Chapter ${i + 1}`))
        : [{ id: generateId(), title: "Chapter 1", content: "" }];

      const back = backRaw.map((ch, i) => normalizeChapter(ch, `Back Matter ${i + 1}`));

      return { front, body, back };
    }

    function normalizeBookData(rawData) {
      const data = safeObject(rawData, {});
      return {
        title: safeString(data.title, "Untitled Book"),
        sections: normalizeSections(data.sections)
      };
    }

    function toRoman(num) {
      const map = [
        ["M", 1000], ["CM", 900], ["D", 500], ["CD", 400],
        ["C", 100], ["XC", 90], ["L", 50], ["XL", 40],
        ["X", 10], ["IX", 9], ["V", 5], ["IV", 4], ["I", 1]
      ];
      let n = num;
      let out = "";
      for (const [sym, val] of map) {
        while (n >= val) {
          out += sym;
          n -= val;
        }
      }
      return out.toLowerCase();
    }

    function applyCSSVariables() {
      const root = document.documentElement;

      if (settings.trim === "5.5x8.5") {
        root.style.setProperty("--page-width", "744px");
        root.style.setProperty("--page-height", "984px");
        root.style.setProperty("--margin-top", "78px");
        root.style.setProperty("--margin-bottom", "78px");
        root.style.setProperty("--margin-inside", "88px");
        root.style.setProperty("--margin-outside", "68px");
      } else {
        root.style.setProperty("--page-width", "816px");
        root.style.setProperty("--page-height", "1056px");
        root.style.setProperty("--margin-top", "84px");
        root.style.setProperty("--margin-bottom", "84px");
        root.style.setProperty("--margin-inside", "92px");
        root.style.setProperty("--margin-outside", "72px");
      }

      root.style.setProperty("--book-font-size", settings.fontSize + "px");
      root.style.setProperty("--book-line-height", String(settings.lineHeight));
      root.style.setProperty("--paragraph-indent", settings.indentEm + "em");
      root.style.setProperty("--paragraph-spacing", settings.paragraphSpacingEm + "em");
    }

    function syncSettingsFromUI() {
      settings.trim = trimSelect.value;
      settings.fontSize = Number(fontSizeInput.value) || 18;
      settings.lineHeight = Number(lineHeightInput.value) || 1.8;
      settings.indentEm = Number(indentInput.value) || 2;
      settings.paragraphSpacingEm = Number(spacingInput.value) || 1.2;

      settings.includeFrontMatter = includeFrontInput.checked;
      settings.includeBackMatter = includeBackInput.checked;
      settings.forceRectoSections = forceRectoInput.checked;
      settings.showHeaders = showHeadersInput.checked;
      settings.showPageNumbers = showPageNumsInput.checked;
      settings.romanFrontMatter = romanFrontInput.checked;
      settings.keepHeadingWithNext = keepHeadingsInput.checked;
      settings.basicWidowControl = widowControlInput.checked;
    }

    function readPlainTextFromHTML(html) {
      const div = document.createElement("div");
      div.innerHTML = html;
      return div.textContent.replace(/\s+/g, " ").trim();
    }

    function normalizeEditorHTML(html) {
      return safeString(html, "").replace(/&nbsp;/g, " ").trim();
    }

    function htmlToBlocks(html) {
      const normalized = normalizeEditorHTML(html);
      const wrap = document.createElement("div");
      wrap.innerHTML = normalized || "<div></div>";

      const sourceNodes = [...wrap.childNodes];
      const blocks = [];

      function pushParagraph(innerHTML) {
        const text = readPlainTextFromHTML(innerHTML);
        if (!text) return;
        if (text === "***" || text === "* * *" || text === "• • •") {
          blocks.push({ type: "scene_break" });
          return;
        }
        blocks.push({ type: "paragraph", html: innerHTML });
      }

      for (const node of sourceNodes) {
        if (node.nodeType === Node.TEXT_NODE) {
          const text = (node.textContent || "").trim();
          if (text) {
            blocks.push({ type: "paragraph", html: text });
          }
          continue;
        }

        if (node.nodeType !== Node.ELEMENT_NODE) continue;

        const tag = node.tagName.toLowerCase();

        if (tag === "div" || tag === "p") {
          const inner = node.innerHTML.trim();
          const text = node.textContent.replace(/\s+/g, " ").trim();
          if (!text && !inner) {
            blocks.push({ type: "spacer" });
          } else {
            pushParagraph(inner || text);
          }
          continue;
        }

        if (tag === "h2" || tag === "h3") {
          blocks.push({ type: "heading", html: node.innerHTML.trim() || node.textContent.trim() });
          continue;
        }

        if (tag === "blockquote") {
          blocks.push({ type: "blockquote", html: node.innerHTML.trim() });
          continue;
        }

        if (tag === "ul" || tag === "ol") {
          blocks.push({ type: "list", ordered: tag === "ol", html: node.outerHTML });
          continue;
        }

        if (tag === "hr") {
          blocks.push({ type: "scene_break" });
          continue;
        }

        if (tag === "br") {
          blocks.push({ type: "spacer" });
          continue;
        }

        blocks.push({ type: "paragraph", html: node.outerHTML });
      }

      return collapseBlocks(blocks);
    }

    function collapseBlocks(blocks) {
      const out = [];
      for (const block of blocks) {
        if (!block) continue;
        if (block.type === "spacer") {
          if (!out.length) continue;
          const prev = out[out.length - 1];
          if (prev.type === "spacer") continue;
        }
        out.push(block);
      }
      while (out.length && out[out.length - 1].type === "spacer") {
        out.pop();
      }
      return out;
    }

    function makeElementFromBlock(block, context = {}) {
      let el;

      if (block.type === "chapter_open") {
        el = document.createElement("div");
        el.className = "chapter-opener";

        if (block.numberLabel) {
          const num = document.createElement("div");
          num.className = "chapter-number";
          num.textContent = block.numberLabel;
          el.appendChild(num);
        }

        const title = document.createElement("div");
        title.className = "chapter-title";
        title.textContent = block.title || "Untitled";
        el.appendChild(title);
        return el;
      }

      if (block.type === "front_title_page") {
        el = document.createElement("div");

        const title = document.createElement("div");
        title.className = "front-title";
        title.textContent = block.title || currentBook.title || "Untitled Book";

        const subtitle = document.createElement("div");
        subtitle.className = "front-subtitle";
        subtitle.textContent = "Alysum Writing";

        el.appendChild(title);
        el.appendChild(subtitle);

        if (block.author) {
          const author = document.createElement("div");
          author.className = "front-author";
          author.textContent = block.author;
          el.appendChild(author);
        }

        return el;
      }

      if (block.type === "toc_title") {
        el = document.createElement("div");
        el.className = "toc-title";
        el.textContent = block.title || "Contents";
        return el;
      }

      if (block.type === "toc_entry") {
        el = document.createElement("div");
        el.className = "toc-entry";

        const left = document.createElement("span");
        left.textContent = block.label || "";

        const right = document.createElement("span");
        right.textContent = block.pageLabel || "";

        el.appendChild(left);
        el.appendChild(right);
        return el;
      }

      if (block.type === "copyright") {
        el = document.createElement("div");
        el.className = "copyright-block";
        appendHTML(el, block.html || "");
        return el;
      }

      if (block.type === "heading") {
        el = document.createElement("div");
        el.className = "section-heading";
        appendHTML(el, block.html || "");
        return el;
      }

      if (block.type === "blockquote") {
        el = document.createElement("blockquote");
        appendHTML(el, block.html || "");
        return el;
      }

      if (block.type === "list") {
        const temp = document.createElement("div");
        temp.innerHTML = block.html || (block.ordered ? "<ol></ol>" : "<ul></ul>");
        return temp.firstElementChild || document.createElement(block.ordered ? "ol" : "ul");
      }

      if (block.type === "scene_break") {
        el = document.createElement("div");
        el.className = "scene-break";
        el.textContent = "• • •";
        return el;
      }

      if (block.type === "spacer") {
        el = document.createElement("div");
        el.className = "spacer";
        return el;
      }

      el = document.createElement("p");
      if (context.firstParagraph) el.classList.add("first-para");
      if (block.noIndent) el.classList.add("no-indent");
      appendHTML(el, block.html || "");
      return el;
    }

    function appendHTML(target, html) {
      const temp = document.createElement("div");
      temp.innerHTML = html;
      while (temp.firstChild) {
        target.appendChild(temp.firstChild);
      }
    }

    function measureFits(elements) {
      measureRoot.innerHTML = "";
      for (const el of elements) {
        measureRoot.appendChild(el.cloneNode(true));
      }
      const host = measureRoot.parentElement;
      return measureRoot.scrollHeight <= host.clientHeight;
    }

    function splitParagraphBlock(block, context = {}) {
      const text = readPlainTextFromHTML(block.html);
      if (!text) return null;

      const words = text.split(/\s+/).filter(Boolean);
      if (words.length < 8) return null;

      let low = 1;
      let high = words.length - 1;
      let best = 0;

      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        const headText = words.slice(0, mid).join(" ");
        const el = makeElementFromBlock({ type: "paragraph", html: headText }, context);

        if (measureFits([el])) {
          best = mid;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      if (best < 3 || best >= words.length - 2) {
        return null;
      }

      return {
        head: { ...block, html: words.slice(0, best).join(" ") },
        tail: { ...block, html: words.slice(best).join(" ") }
      };
    }

    function pageSide(pageNumber) {
      return pageNumber % 2 === 0 ? "left" : "right";
    }

    function makePageNumberLabel(pageNumber, meta) {
      if (!settings.showPageNumbers) return "";
      if (meta.kind === "front" && settings.romanFrontMatter) {
        return toRoman(meta.frontDisplayIndex);
      }
      return String(meta.bodyDisplayIndex);
    }

    function makeHeaderLabel(meta, side) {
      if (!settings.showHeaders) return "";
      if (meta.kind === "front") return "";
      return side === "left" ? currentBook.title : meta.title;
    }

    function createPageShell(pageNumber, meta, blank = false) {
      const side = pageSide(pageNumber);

      const page = document.createElement("div");
      page.className = `page ${side}${blank ? " blank" : ""}`;

      const header = document.createElement("div");
      header.className = "page-header";
      header.textContent = blank ? "" : makeHeaderLabel(meta, side);

      const content = document.createElement("div");
      content.className = "page-content";

      const footer = document.createElement("div");
      footer.className = "page-footer";
      footer.textContent = blank ? "" : makePageNumberLabel(pageNumber, meta);

      page.appendChild(header);
      page.appendChild(content);
      page.appendChild(footer);

      return { page, content, header, footer };
    }

    function buildDocumentPlan(book, selectedIds) {
      const plan = [];
      const body = safeArray(book.sections.body, []);
      const selectedBody = selectedIds.length ? body.filter(ch => selectedIds.includes(ch.id)) : body;

      let frontCounter = 0;
      let bodyCounter = 0;

      if (settings.includeFrontMatter) {
        frontCounter += 1;
        plan.push({
          kind: "front",
          title: "Title Page",
          rectoStart: true,
          blocks: [{ type: "front_title_page", title: book.title, author: "" }],
          frontDisplayIndex: frontCounter,
          bodyDisplayIndex: 0,
          isTOC: false
        });

        const front = safeArray(book.sections.front, []);
        for (const ch of front) {
          if (ch.title.toLowerCase().includes("table of contents")) {
            frontCounter += 1;
            plan.push({
              kind: "front",
              title: ch.title,
              rectoStart: true,
              blocks: [{ type: "toc_title", title: "Contents" }],
              frontDisplayIndex: frontCounter,
              bodyDisplayIndex: 0,
              isTOC: true
            });
            continue;
          }

          if (ch.title.toLowerCase().includes("copyright")) {
            frontCounter += 1;
            plan.push({
              kind: "front",
              title: ch.title,
              rectoStart: true,
              blocks: [
                {
                  type: "copyright",
                  html: ch.content || `Copyright © ${new Date().getFullYear()} ${book.title}`
                }
              ],
              frontDisplayIndex: frontCounter,
              bodyDisplayIndex: 0,
              isTOC: false
            });
            continue;
          }

          frontCounter += 1;
          plan.push({
            kind: "front",
            title: ch.title,
            rectoStart: true,
            blocks: [
              {
                type: "chapter_open",
                numberLabel: "",
                title: ch.title
              },
              ...htmlToBlocks(ch.content)
            ],
            frontDisplayIndex: frontCounter,
            bodyDisplayIndex: 0,
            isTOC: false
          });
        }
      }

      selectedBody.forEach((ch, index) => {
        bodyCounter += 1;

        const blocks = htmlToBlocks(ch.content);
        const chapterTitle = ch.title || `Chapter ${index + 1}`;

        plan.push({
          kind: "body",
          title: chapterTitle,
          rectoStart: settings.forceRectoSections,
          blocks: [
            {
              type: "chapter_open",
              numberLabel: `Chapter ${index + 1}`,
              title: chapterTitle
            },
            ...(blocks.length ? blocks : [{ type: "paragraph", html: " " }])
          ],
          frontDisplayIndex: 0,
          bodyDisplayIndex: bodyCounter,
          isTOC: false
        });
      });

      if (settings.includeBackMatter) {
        const back = safeArray(book.sections.back, []);
        for (const ch of back) {
          bodyCounter += 1;
          plan.push({
            kind: "back",
            title: ch.title,
            rectoStart: true,
            blocks: [
              {
                type: "chapter_open",
                numberLabel: "",
                title: ch.title
              },
              ...htmlToBlocks(ch.content)
            ],
            frontDisplayIndex: 0,
            bodyDisplayIndex: bodyCounter,
            isTOC: false
          });
        }
      }

      return plan;
    }

    function shouldKeepWithNext(block) {
      if (!settings.keepHeadingWithNext) return false;
      return block.type === "heading";
    }

    function candidateElementsForBlocks(blocks, firstParagraphPending) {
      const result = [];
      let localFirst = firstParagraphPending;

      for (const block of blocks) {
        const isParagraph = block.type === "paragraph";
        result.push(
          makeElementFromBlock(block, {
            firstParagraph: isParagraph && localFirst
          })
        );
        if (isParagraph) localFirst = false;
      }

      return result;
    }

    function protectWidowOrphan(pageBlocks, overflowBlocks) {
      if (!settings.basicWidowControl) {
        return { pageBlocks, overflowBlocks };
      }

      if (!pageBlocks.length || !overflowBlocks.length) {
        return { pageBlocks, overflowBlocks };
      }

      const last = pageBlocks[pageBlocks.length - 1];
      const firstOverflow = overflowBlocks[0];

      if (last.type === "paragraph") {
        const lastText = readPlainTextFromHTML(last.html);
        const lastWords = lastText.split(/\s+/).filter(Boolean).length;
        if (lastWords < 4 && pageBlocks.length > 1) {
          overflowBlocks.unshift(pageBlocks.pop());
        }
      }

      if (firstOverflow.type === "paragraph") {
        const nextText = readPlainTextFromHTML(firstOverflow.html);
        const nextWords = nextText.split(/\s+/).filter(Boolean).length;
        if (nextWords < 4 && pageBlocks.length > 1) {
          overflowBlocks.unshift(pageBlocks.pop());
        }
      }

      return { pageBlocks, overflowBlocks };
    }

    function paginateSection(section, tocEntries, counters) {
      const output = [];
      let blocks = [...section.blocks];
      let firstParagraphPending = true;
      let started = false;
      let firstRealPageNumber = null;

      while (blocks.length) {
        if (!started && section.rectoStart && settings.forceRectoSections && pageSide(counters.physical + 1) !== "right") {
          counters.physical += 1;
          const blankMeta = { ...section };
          const blankPage = createPageShell(counters.physical, blankMeta, true);
          output.push({
            physicalPage: counters.physical,
            node: blankPage.page,
            kind: "blank",
            title: section.title
          });
          continue;
        }

        counters.physical += 1;
        started = true;

        if (firstRealPageNumber === null) {
          firstRealPageNumber = counters.physical;
        }

        const pageMeta = { ...section };
        const shell = createPageShell(counters.physical, pageMeta, false);

        const pageBlocks = [];
        let blockIndex = 0;

        while (blockIndex < blocks.length) {
          const current = blocks[blockIndex];

          if (shouldKeepWithNext(current) && blocks[blockIndex + 1]) {
            const pair = [current, blocks[blockIndex + 1]];
            const pairEls = candidateElementsForBlocks(pair, firstParagraphPending);
            const allEls = candidateElementsForBlocks(pageBlocks, firstParagraphPending).concat(pairEls);

            if (measureFits(allEls)) {
              pageBlocks.push(current, blocks[blockIndex + 1]);
              if (blocks[blockIndex].type === "paragraph") firstParagraphPending = false;
              if (blocks[blockIndex + 1].type === "paragraph") firstParagraphPending = false;
              blockIndex += 2;
              continue;
            }

            if (pageBlocks.length) break;
          }

          const testEls = candidateElementsForBlocks(pageBlocks.concat(current), firstParagraphPending);
          if (measureFits(testEls)) {
            pageBlocks.push(current);
            if (current.type === "paragraph") firstParagraphPending = false;
            blockIndex += 1;
            continue;
          }

          if (!pageBlocks.length && current.type === "paragraph") {
            const split = splitParagraphBlock(current, {
              firstParagraph: firstParagraphPending
            });

            if (split) {
              const headEls = candidateElementsForBlocks([split.head], firstParagraphPending);
              if (measureFits(headEls)) {
                pageBlocks.push(split.head);
                firstParagraphPending = false;
                blocks.splice(blockIndex, 1, split.tail);
              } else {
                pageBlocks.push(current);
                blockIndex += 1;
              }
            } else {
              pageBlocks.push(current);
              blockIndex += 1;
            }
          }

          break;
        }

        let overflow = blocks.slice(blockIndex);
        const adjusted = protectWidowOrphan(pageBlocks, overflow);
        const finalPageBlocks = adjusted.pageBlocks;
        overflow = adjusted.overflowBlocks;

        shell.content.innerHTML = "";
        const finalEls = candidateElementsForBlocks(finalPageBlocks, false);
        finalEls.forEach(el => shell.content.appendChild(el));

        output.push({
          physicalPage: counters.physical,
          node: shell.page,
          kind: section.kind,
          title: section.title,
          isTOC: section.isTOC
        });

        blocks = overflow;
      }

      if (section.kind === "body") {
        tocEntries.push({
          title: section.title,
          pageLabel: firstRealPageNumber != null ? String(firstRealPageNumber - counters.frontPhysicalCount) : ""
        });
      }

      return output;
    }

    function buildTOCBlocks(entries) {
      return [
        { type: "toc_title", title: "Contents" },
        ...entries.map(entry => ({
          type: "toc_entry",
          label: entry.title,
          pageLabel: entry.pageLabel
        }))
      ];
    }

    function repaginateWithTOC(plan) {
      let counters = {
        physical: 0,
        frontPhysicalCount: 0
      };

      const tocEntries = [];
      let pages = [];
      let tocSectionIndexes = [];

      for (let i = 0; i < plan.length; i++) {
        const section = {
          ...plan[i],
          blocks: [...plan[i].blocks]
        };

        const sectionPages = paginateSection(section, tocEntries, counters);
        if (section.kind === "front") {
          counters.frontPhysicalCount += sectionPages.filter(p => p.kind !== "blank").length;
        }

        if (section.isTOC) {
          const startIndex = pages.length;
          pages.push(...sectionPages);
          tocSectionIndexes = [];
          for (let j = 0; j < sectionPages.length; j++) {
            tocSectionIndexes.push(startIndex + j);
          }
        } else {
          pages.push(...sectionPages);
        }
      }

      if (tocSectionIndexes.length) {
        const tocBlocks = buildTOCBlocks(tocEntries);

        const oldPages = pages;
        const newPages = [];
        let currentPhysical = 0;

        for (let i = 0; i < oldPages.length; i++) {
          if (tocSectionIndexes.includes(i)) continue;
          newPages.push(oldPages[i]);
          currentPhysical = oldPages[i].physicalPage;
        }

        const tocPlaceholderIndex = tocSectionIndexes[0];
        const before = oldPages.slice(0, tocPlaceholderIndex);
        const after = oldPages.filter((_, i) => !tocSectionIndexes.includes(i) && i > tocSectionIndexes[tocSectionIndexes.length - 1]);

        counters = {
          physical: before.length ? before[before.length - 1].physicalPage : 0,
          frontPhysicalCount: before.filter(p => p.kind === "front").length
        };

        const fakeTOCSection = {
          kind: "front",
          title: "Contents",
          rectoStart: false,
          blocks: tocBlocks,
          frontDisplayIndex: 1,
          bodyDisplayIndex: 0,
          isTOC: true
        };

        const tocPages = paginateSection(fakeTOCSection, [], counters);

        const rebuilt = [...before, ...tocPages];
        let renumberBase = rebuilt.length ? rebuilt[rebuilt.length - 1].physicalPage : 0;

        for (const page of after) {
          renumberBase += 1;
          const newPage = page.node.cloneNode(true);
          const side = pageSide(renumberBase);
          newPage.classList.remove("left", "right");
          newPage.classList.add(side);

          const footer = newPage.querySelector(".page-footer");
          const header = newPage.querySelector(".page-header");

          if (footer && !newPage.classList.contains("blank")) {
            if (page.kind === "front" && settings.romanFrontMatter) {
              const frontIndex = rebuilt.filter(p => p.kind === "front" && p.kind !== "blank").length + 1;
              footer.textContent = settings.showPageNumbers ? toRoman(frontIndex) : "";
            } else {
              const bodyPageNumber = renumberBase - rebuilt.filter(p => p.kind === "front").length;
              footer.textContent = settings.showPageNumbers ? String(bodyPageNumber) : "";
            }
          }

          if (header && !newPage.classList.contains("blank")) {
            header.textContent = settings.showHeaders
              ? (side === "left" ? currentBook.title : page.title)
              : "";
          }

          rebuilt.push({
            ...page,
            physicalPage: renumberBase,
            node: newPage
          });
        }

        return rebuilt;
      }

      return pages;
    }

    function renderPages(pages) {
      pageStack.innerHTML = "";
      pages.forEach(page => pageStack.appendChild(page.node));
      setStatus(`${pages.length} pages formatted`);
    }

    function buildAndRender() {
      if (!currentBook) return;

      syncSettingsFromUI();
      applyCSSVariables();

      const plan = buildDocumentPlan(currentBook, selectedChapterIds);
      const pages = repaginateWithTOC(plan);
      renderPages(pages);
    }

    async function loadBook(uid) {
      if (!bookId) {
        setStatus("No book selected");
        return;
      }

      const snap = await getDoc(doc(db, "users", uid, "books", bookId));
      if (!snap.exists()) {
        setStatus("Book not found");
        docTitle.textContent = "Book not found";
        return;
      }

      currentBook = normalizeBookData(snap.data());
      docTitle.textContent = currentBook.title;
      document.title = `${currentBook.title} — Alysum Formatter`;
      buildAndRender();
    }

    function attachEvents() {
      [
        trimSelect,
        fontSizeInput,
        lineHeightInput,
        indentInput,
        spacingInput,
        includeFrontInput,
        includeBackInput,
        forceRectoInput,
        showHeadersInput,
        showPageNumsInput,
        romanFrontInput,
        keepHeadingsInput,
        widowControlInput
      ].forEach(el => {
        el.addEventListener("change", () => {
          setStatus("Repaginating…");
          requestAnimationFrame(buildAndRender);
        });
      });

      [repaginateBtn, repaginateBtnTop].forEach(btn => {
        btn.addEventListener("click", () => {
          setStatus("Repaginating…");
          requestAnimationFrame(buildAndRender);
        });
      });

      [exportBtn, exportBtnTop].forEach(btn => {
        btn.addEventListener("click", () => {
          window.print();
        });
      });
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "/login.html";
        return;
      }

      currentUser = user;
      attachEvents();
      applyCSSVariables();
      setStatus("Loading manuscript…");

      try {
        await loadBook(user.uid);
      } catch (err) {
        console.error(err);
        setStatus("Formatter load failed");
      }
    });
  </script>
</body>
</html>
