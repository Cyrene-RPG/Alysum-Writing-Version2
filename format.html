<!DOCTYPE html>
<html>
<head>
<title>Alysum Typesetter Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#0b1220;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.topbar{
    padding:16px 20px;
    border-bottom:1px solid rgba(255,255,255,0.1);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.preview{
    padding:40px;
}

/* PAGE */
.page{
    width:5in;
    height:8in;
    background:white;
    color:black;
    margin:20px auto;
    padding:0.8in 0.7in;
    box-shadow:0 25px 80px rgba(0,0,0,0.5);
    position:relative;
    overflow:hidden;
}

/* TEXT */
.book{
    font-family:"Garamond", serif;
    font-size:11pt;
    line-height:1.5;
    text-align:justify;
}

.book p{
    margin:0 0 0.9em 0;
    text-indent:1.2em;
}

.book p.no-indent{
    text-indent:0;
}

.chapter{
    text-align:center;
    font-size:18pt;
    margin-bottom:1.5em;
}

.header{
    position:absolute;
    top:0.3in;
    left:0.7in;
    right:0.7in;
    font-size:9pt;
    display:flex;
    justify-content:space-between;
    color:#666;
}

.page-number{
    position:absolute;
    bottom:0.4in;
    left:0;
    right:0;
    text-align:center;
    font-size:10pt;
}
</style>
</head>

<body>

<div class="topbar">
    <div id="title">Loading...</div>
    <div id="status"></div>
</div>

<div id="preview" class="preview"></div>

<script type="module">

import { db, auth } from "./firebase.js";
import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

let currentUser = null;

/* =========================
   GET BOOK ID
========================= */

function getBookId(){
    return new URLSearchParams(window.location.search).get("book");
}

/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, (user)=>{
    if(!user){
        document.getElementById("status").textContent = "Not logged in";
        return;
    }

    currentUser = user;
    loadBook();
});

/* =========================
   LOAD FROM EDITOR (REAL SOURCE)
========================= */

async function loadBook(){

    const bookId = getBookId();
    if(!bookId) return alert("Missing book ID");

    const ref = doc(db,"users",currentUser.uid,"books",bookId);
    const snap = await getDoc(ref);

    if(!snap.exists()) return alert("Book not found");

    const data = snap.data();

    document.getElementById("title").textContent = data.title || "Untitled";

    const chapters = (data.chapters || [])
        .sort((a,b)=>(a.order||0)-(b.order||0));

    buildBook(chapters, data);
}

/* =========================
   PAGE CREATION
========================= */

function createPage(num, data){

    const page = document.createElement("div");
    page.className = "page";

    const header = document.createElement("div");
    header.className = "header";

    header.innerHTML = `
        <span>${num % 2 === 0 ? data.author || "" : ""}</span>
        <span>${num % 2 !== 0 ? data.title || "" : ""}</span>
    `;

    const book = document.createElement("div");
    book.className = "book";

    const number = document.createElement("div");
    number.className = "page-number";
    number.textContent = num;

    page.appendChild(header);
    page.appendChild(book);
    page.appendChild(number);

    return page;
}

/* =========================
   PLACEHOLDER (ENGINE COMES NEXT)
========================= */

function buildBook(chapters, data){
    console.log("Loaded chapters:", chapters.length);
}

</script>

</body>
</html>
