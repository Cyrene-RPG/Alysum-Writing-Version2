<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="Alysum-3.png">
    <script src="js/pwa-register.js" defer></script>
    <script type="module" src="js/vercel-analytics.js"></script>
    <meta charset="UTF-8" />
    <title>Geography & World Terrain — Terrain Codex — Alysum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/alysum-appearance-boot.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/site-responsive.css?v=1" />
    <link rel="stylesheet" href="css/gradient-themes.css?v=4" />
    <link rel="stylesheet" href="css/workspace-nav.css?v=2" />
    <link rel="stylesheet" href="css/magic-codex.css?v=6" />
    <script src="js/gradient-theme-sync.js" defer></script>
</head>
<body class="mc-page mc-geography">
    <div id="alysum-workspace-nav" data-active="encyclopedia"></div>
    <script type="module" src="js/workspace-nav.js?v=2"></script>

    <div class="mc-veil" aria-hidden="true"></div>
    <header class="mc-top">
        <div>
            <p class="mc-top-brand">Terrain Codex</p>
            <p class="mc-top-title" id="pageTitle">Geography & World Terrain</p>
        </div>
        <div class="mc-top-actions">
            <span class="mc-chip">Geography & terrain</span>
            <a class="mc-link" href="#" id="hubBack">← All geographies</a>
            <a class="mc-link" href="#" id="encBack">Encyclopedia</a>
        </div>
    </header>
    <div class="mc-body" id="codexRoot"></div>
    <script type="module">
        import { GEOGRAPHY_SECTIONS, GEOGRAPHY_INTRO } from "./js/geography-sections.js?v=2";
        import { mountMagicCodex } from "./js/magic-codex-ui.js?v=6";
        import {
            worldStorageKey,
            getGeographyWorldMeta,
            touchGeographyWorld,
            renameGeographyWorld
        } from "./js/geography-store.js?v=2";
        import { supabase } from "./firebase.js";
        import { wireSupabaseSession } from "./js/supabase-session.js?v=1";
        import { getEncyclopedia } from "./js/world-encyclopedia-store.js?v=6";
        import { initEncyclopediaSession } from "./js/encyclopedia-session.js?v=3";

        const params = new URLSearchParams(location.search);
        const encId = params.get("encyclopedia");
        const worldId = params.get("world");
        let cloudReady = false;
        let codexMounted = false;

        function bootPage() {
            const meta = encId && worldId ? getGeographyWorldMeta(encId, worldId) : null;
            const enc = encId ? getEncyclopedia(encId) : null;
            if (!encId || !worldId || !meta || !enc) {
                if (!cloudReady) return;
                window.location.href = encId
                    ? "geography-worlds.html?encyclopedia=" + encodeURIComponent(encId)
                    : "world-encyclopedia.html";
                return;
            }
            void touchGeographyWorld(encId, worldId);
            document.getElementById("pageTitle").textContent = meta.name;
            document.title = meta.name + " — Terrain Codex — Alysum";
            document.getElementById("hubBack").href =
                "geography-worlds.html?encyclopedia=" + encodeURIComponent(encId);
            document.getElementById("encBack").href =
                "encyclopedia.html?id=" + encodeURIComponent(encId);

            if (codexMounted) return;
            codexMounted = true;

            mountMagicCodex(document.getElementById("codexRoot"), {
                theme: "geography",
                sections: GEOGRAPHY_SECTIONS,
                intro: GEOGRAPHY_INTRO,
                storageKey: worldStorageKey(encId, worldId),
                compileHeading: "Geography & World Terrain",
                nameLabel: "Name of this world or region",
                taglineLabel: "Epithet, map label, or scholar's name",
                namePlaceholder: "Unnamed world",
                taglinePlaceholder: "Optional",
                manuscriptTitle: "Your terrain manuscript",
                onFieldChange: (key, value) => {
                    if (key === "systemName" && value.trim()) {
                        void renameGeographyWorld(encId, worldId, value.trim());
                        document.getElementById("pageTitle").textContent = value.trim();
                    }
                },
                linkContext: {
                    page: "geography-world.html",
                    queryParams: { encyclopedia: encId, world: worldId },
                    storageKey: worldStorageKey(encId, worldId),
                    sheetLabel: meta.name
                }
            });
        }

        let storageLoaded = false;

        bootPage();

        wireSupabaseSession(async (session) => {
            if (storageLoaded) return;
            storageLoaded = true;
            try {
                await initEncyclopediaSession(supabase, session);
            } catch (err) {
                console.warn("Encyclopedia init:", err);
            }
            cloudReady = true;
            bootPage();
        });
    </script>
</body>
</html>
