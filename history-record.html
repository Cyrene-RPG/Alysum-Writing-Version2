<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="Alysum-3.png">
    <script src="js/pwa-register.js" defer></script>
    <script type="module" src="js/vercel-analytics.js"></script>
    <meta charset="UTF-8" />
    <title>History — Chronicle Codex — Alysum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/alysum-appearance-boot.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/site-responsive.css?v=1" />
    <link rel="stylesheet" href="css/gradient-themes.css?v=4" />
    <link rel="stylesheet" href="css/magic-codex.css?v=7" />
    <script src="js/gradient-theme-sync.js" defer></script>
</head>
<body class="mc-page mc-history">
    <div class="mc-veil" aria-hidden="true"></div>
    <header class="mc-top">
        <div>
            <p class="mc-top-brand">Chronicle Codex</p>
            <p class="mc-top-title" id="pageTitle">History</p>
        </div>
        <div class="mc-top-actions">
            <span class="mc-chip">History</span>
            <a class="mc-link" href="#" id="hubBack">← All chronicles</a>
            <a class="mc-link" href="#" id="encBack">Encyclopedia</a>
        </div>
    </header>
    <div class="mc-body" id="codexRoot"></div>
    <script type="module">
        import { HISTORY_SECTIONS, HISTORY_INTRO } from "./js/history-sections.js?v=2";
        import { mountMagicCodex } from "./js/magic-codex-ui.js?v=3";
        import {
            recordStorageKey,
            getHistoryRecordMeta,
            touchHistoryRecord,
            renameHistoryRecord
        } from "./js/history-store.js?v=1";
        import { getEncyclopedia } from "./js/world-encyclopedia-store.js?v=2";

        const params = new URLSearchParams(location.search);
        const encId = params.get("encyclopedia");
        const recordId = params.get("record");
        const meta = encId && recordId ? getHistoryRecordMeta(encId, recordId) : null;

        if (!encId || !recordId || !meta) {
            window.location.href = encId
                ? "histories.html?encyclopedia=" + encodeURIComponent(encId)
                : "world-encyclopedia.html";
        } else {
            touchHistoryRecord(encId, recordId);
            document.getElementById("pageTitle").textContent = meta.name;
            document.title = meta.name + " — Chronicle Codex — Alysum";
            document.getElementById("hubBack").href =
                "histories.html?encyclopedia=" + encodeURIComponent(encId);
            document.getElementById("encBack").href =
                "encyclopedia.html?id=" + encodeURIComponent(encId);

            mountMagicCodex(document.getElementById("codexRoot"), {
                theme: "history",
                sections: HISTORY_SECTIONS,
                intro: HISTORY_INTRO,
                storageKey: recordStorageKey(encId, recordId),
                compileHeading: "History",
                nameLabel: "Name of this chronicle or timeline",
                taglineLabel: "Era, realm, or scholar's label",
                namePlaceholder: "Unnamed chronicle",
                taglinePlaceholder: "Optional",
                manuscriptTitle: "Your chronicle manuscript",
                onFieldChange: (key, value) => {
                    if (key === "systemName" && value.trim()) {
                        renameHistoryRecord(encId, recordId, value.trim());
                        document.getElementById("pageTitle").textContent = value.trim();
                    }
                }
            });
        }
    </script>
</body>
</html>
