<!DOCTYPE html>
<html>
<head>
    <title>Alysum Studio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b1220;
            color: white;
        }

        /* HERO (UNCHANGED STYLE) */
        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #5b21b6, #7c3aed, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .hero-box {
            max-width: 520px;
            width: 100%;
        }

        /* LOGO (REPLACES TITLE) */
        .logo {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 10px;
            display: block;
        }

        .tagline {
            margin-top: 12px;
            font-size: 20px;
            color: #ede9fe;
        }

        /* BUTTONS (UPGRADED BUT SAME FEEL) */
        .actions {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            padding: 18px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 18px;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        /* PRIMARY */
        .primary {
            background: white;
            color: #4c1d95;
        }

        .primary:hover {
            transform: translateY(-2px);
        }

        .primary:active {
            transform: scale(0.96);
        }

        /* LIBRARY BUTTON */
        .library-btn {
            background: #ede9fe;
            color: #4c1d95;
        }

        .library-btn:hover {
            transform: translateY(-2px);
        }

        /* LOGIN */
        .secondary {
            color: white;
            opacity: 0.9;
            text-decoration: underline;
            font-size: 15px;
        }

        /* FEATURES */
        .features {
            background: #0b1220;
            padding: 60px 20px;
        }

        .features h2 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 30px;
        }

        .card {
            background: #111827;
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .card-text {
            color: #d1d5db;
            font-size: 16px;
        }

        footer {
            text-align: center;
            padding: 30px;
            font-size: 14px;
            color: #9ca3af;
        }

        /* DESKTOP FIX */
        @media (min-width: 900px) {

            .hero-box {
                max-width: 650px;
            }

            .logo {
                max-width: 420px;
            }

            .actions {
                flex-direction: row;
                justify-content: center;
            }

            .btn {
                width: 220px;
            }
        }

        /* MOBILE */
        @media (max-width: 480px) {
            .logo {
                max-width: 260px;
            }

            .tagline {
                font-size: 18px;
            }
        }

    </style>
</head>

<body>

<section class="hero">
    <div class="hero-box">

        <!-- YOUR LOGO -->
        <img src="Alysum-3.png" class="logo" alt="Alysum Logo">

        <div class="tagline">Every writer needs a studio</div>

        <div class="actions">
            <a href="/signup.html" class="btn primary">Create Account</a>

            <a href="/library.html" class="btn library-btn">
                Browse Library
            </a>
        </div>

        <div style="margin-top: 14px;">
            <a href="/login.html" class="secondary">
                Already have an account?
            </a>
        </div>

    </div>
</section>

<section class="features">
    <h2>Why Alysum?</h2>

    <div class="card">
        <div class="card-title">✍️ Focused Writing</div>
        <div class="card-text">No distractions. Just you and your words.</div>
    </div>

    <div class="card">
        <div class="card-title">📚 Your Stories</div>
        <div class="card-text">Organize everything in one place.</div>
    </div>

    <div class="card">
        <div class="card-title">🚀 Built for Writers</div>
        <div class="card-text">Simple, fast, and made for creativity.</div>
    </div>
</section>

<footer>
    © 2026 Alysum Studio
</footer>

</body>
</html>
