<!DOCTYPE html>
<html>
<head>
    <title>Alysum Studio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #081633;
            color: white;
        }

        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 45%, #a78bfa 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .hero-content {
            width: 100%;
            max-width: 360px;
        }

        .hero h1 {
            margin: 0;
            font-size: 54px;
            font-weight: 700;
            line-height: 1.05;
        }

        .hero p {
            margin: 18px 0 0;
            font-size: 19px;
            color: #e9ddff;
            line-height: 1.4;
        }

        .hero-btn {
            display: inline-block;
            margin-top: 34px;
            background: white;
            color: #34126b;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            padding: 20px 42px;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.16);
        }

        .hero-btn:active {
            transform: scale(0.98);
        }

        .features {
            background: #081633;
            padding: 70px 22px 40px;
        }

        .features h2 {
            text-align: center;
            font-size: 44px;
            margin: 0 0 34px;
            font-weight: 700;
        }

        .cards {
            max-width: 560px;
            margin: 0 auto;
        }

        .card {
            background: #020b24;
            border-radius: 26px;
            padding: 34px 26px;
            margin-bottom: 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
        }

        .card-title {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 22px;
        }

        .card-text {
            font-size: 18px;
            line-height: 1.6;
            color: #e5e7eb;
        }

        footer {
            background: #020b24;
            text-align: center;
            padding: 26px 18px 34px;
            color: #aeb7c8;
            font-size: 18px;
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 42px;
            }

            .features h2 {
                font-size: 34px;
            }

            .card-title {
                font-size: 24px;
            }

            .hero-btn {
                width: 100%;
                max-width: 260px;
                padding: 18px 28px;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <h1>Alysum Studio</h1>
            <p>Every writer needs a studio</p>
            <a href="write.html" class="hero-btn">Enter Studio</a>
        </div>
    </section>

    <section class="features">
        <h2>Why Alysum?</h2>

        <div class="cards">
            <div class="card">
                <div class="card-title">✍️ Distraction-Free</div>
                <div class="card-text">Focus on your writing without clutter.</div>
            </div>

            <div class="card">
                <div class="card-title">📚 Organize Stories</div>
                <div class="card-text">Keep all your ideas in one place.</div>
            </div>

            <div class="card">
                <div class="card-title">🚀 Simple Publishing</div>
                <div class="card-text">Write and share your work easily.</div>
            </div>
        </div>
    </section>

    <footer>
        © 2026 Alysum Studio
    </footer>
    <script type="module" src="firebase.js"></script>

</body>
</html>
