<!DOCTYPE html>
<html>
<head>
    <title>Alysum Studio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        :root {
            --bg: #0b1220;
            --panel: #111827;
            --text: #ffffff;
            --muted: #9ca3af;
            --purple: #6d28d9;
            --purple-dark: #5b21b6;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;

            background:
                radial-gradient(circle at top, rgba(124,58,237,0.35), transparent 40%),
                radial-gradient(circle at bottom, rgba(0,0,0,0.6), transparent 60%),
                linear-gradient(135deg, #0b1220, #111827);
        }

        .hero-box {
            width: 100%;
            max-width: 620px;
            text-align: center;

            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 36px 24px;

            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        /* LOGO */
        .hero-logo {
            width: 100%;
            max-width: 380px;
            margin: 0 auto 10px;
            display: block;

            filter: drop-shadow(0 18px 50px rgba(0,0,0,0.6));
        }

        .tagline {
            margin-top: 14px;
            font-size: 18px;
            color: var(--muted);
        }

        /* BUTTONS */
        .actions {
            margin-top: 34px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            padding: 18px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 17px;
            text-decoration: none;
            transition: all 0.2s ease;
            text-align: center;
        }

        /* PRIMARY */
        .primary {
            background: linear-gradient(135deg, var(--purple), #9333ea);
            color: white;
            box-shadow: 0 10px 30px rgba(109,40,217,0.45);
        }

        .primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(109,40,217,0.6);
        }

        .primary:active {
            transform: scale(0.96);
        }

        /* SECOND BUTTON */
        .secondary-btn {
            background: var(--panel);
            border: 1px solid var(--border);
            color: white;
        }

        .secondary-btn:hover {
            background: #1f2937;
        }

        /* LOGIN LINK */
        .login-link {
            margin-top: 16px;
            display: block;
            color: var(--muted);
            font-size: 14px;
        }

        /* FEATURES */
        .features {
            padding: 70px 20px;
            max-width: 900px;
            margin: auto;
        }

        .features h2 {
            text-align: center;
            font-size: 34px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--panel);
            padding: 24px;
            border-radius: 22px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .card-text {
            color: var(--muted);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--muted);
            font-size: 14px;
        }

        /* DESKTOP */
        @media (min-width: 900px) {
            .actions {
                flex-direction: row;
                justify-content: center;
            }

            .btn {
                flex: 1;
                max-width: 220px;
            }

            .hero-box {
                padding: 48px 40px;
            }

            .hero-logo {
                max-width: 460px;
            }
        }

    </style>
</head>

<body>

<section class="hero">
    <div class="hero-box">

        <!-- LOGO -->
        <img src="/images/logo.png" class="hero-logo">

        <div class="tagline">Every writer needs a studio</div>

        <div class="actions">
            <a href="/signup.html" class="btn primary">Create Account</a>

            <a href="/library.html" class="btn secondary-btn">
                Browse Library
            </a>
        </div>

        <a href="/login.html" class="login-link">
            Already have an account?
        </a>

    </div>
</section>

<section class="features">
    <h2>Why Alysum?</h2>

    <div class="card">
        <div class="card-title">✍️ Focused Writing</div>
        <div class="card-text">No distractions. Just you and your words.</div>
    </div>

    <div class="card">
        <div class="card-title">📚 Your Stories</div>
        <div class="card-text">Organize everything in one place.</div>
    </div>

    <div class="card">
        <div class="card-title">🚀 Built for Writers</div>
        <div class="card-text">Simple, fast, and made for creativity.</div>
    </div>
</section>

<footer>
    © 2026 Alysum Studio
</footer>

</body>
</html>
