<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neo Leaderboard</title>
<style>
:root{
  --bg:#171d2c;
  --panel:#23293b;
  --panel-dark:#1d2333;
  --line:#36405b;
  --text:#eef3ff;
  --muted:#8d98b5;
  --blue:#5aa2ff;
  --purple:#af52ff;
  --mint:#6ce2bf;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#d9d9d9;
  font-family:Inter,system-ui,sans-serif;
  padding:34px;
}
.shell{
  height:88vh;
  min-height:760px;
  max-width:1400px;
  margin:auto;
  background:var(--panel);
  border-radius:2px;
  overflow:hidden;
  box-shadow:0 18px 60px rgba(0,0,0,.35);
  display:grid;
  grid-template-rows:56px 1fr;
}
.topbar{
  background:#121827;
  display:flex;
  align-items:center;
  gap:28px;
  padding:0 24px;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.topBtn{
  background:none;
  border:0;
  color:#7783a6;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.14em;
  padding:18px 0 14px;
  border-bottom:3px solid transparent;
  cursor:pointer;
}
.topBtn.active{
  color:white;
  border-color:var(--blue);
}
.main{
  display:grid;
  grid-template-columns:40% 60%;
  min-height:0;
}
.left{
  background:linear-gradient(145deg,#2d3449,#22293b);
  border-right:1px solid rgba(255,255,255,.06);
  padding:28px;
  overflow:auto;
}
.right{
  background:linear-gradient(145deg,#303850,#262d40);
  overflow:auto;
}
.pageSwitch,
.tierSwitch{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.switchBtn{
  border:0;
  background:rgba(255,255,255,.06);
  color:#9ca7c3;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-weight:900;
  padding:10px 12px;
  cursor:pointer;
}
.switchBtn.active{
  color:white;
  background:linear-gradient(90deg,var(--blue),var(--purple));
}
.kicker{
  text-align:center;
  color:#b6c0d8;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  font-weight:900;
}
h1{
  margin:12px 0 20px;
  text-align:center;
  font-size:68px;
  line-height:.9;
  text-transform:uppercase;
  letter-spacing:-.06em;
}
.ring{
  width:360px;
  height:360px;
  margin:0 auto 28px;
  border-radius:50%;
  background:conic-gradient(from 180deg,var(--blue),#7a7cff,var(--purple),var(--blue));
  padding:14px;
  position:relative;
}
.ring::after{
  content:"";
  position:absolute;
  inset:16px;
  background:var(--panel-dark);
  border-radius:50%;
  box-shadow:inset 0 0 0 4px rgba(120,140,255,.18);
}
.inner{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  z-index:1;
  text-align:center;
}
.inner small{
  color:#b4bdd3;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.18em;
  font-weight:900;
}
.inner strong{
  display:block;
  margin-top:8px;
  font-size:88px;
  letter-spacing:-.08em;
  color:#a78cff;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.stat{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.05);
  padding:14px;
  text-align:center;
}
.stat strong{
  display:block;
  font-size:26px;
}
.stat span{
  color:var(--muted);
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:.16em;
  font-weight:900;
}
.graph{
  margin-top:22px;
  border:1px solid rgba(255,255,255,.05);
  padding:14px;
}
.graph h3{
  text-align:center;
  margin:0 0 10px;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
}
svg{width:100%;height:200px;display:block}
.header{
  position:sticky;
  top:0;
  background:#2b3349;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 24px;
  z-index:5;
}
.header h2{
  margin:0;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.16em;
  color:#c8d2ea;
}
.refresh{
  border:0;
  background:rgba(255,255,255,.07);
  color:white;
  padding:10px 14px;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.14em;
  cursor:pointer;
}
.row{
  display:grid;
  grid-template-columns:70px 1fr 220px 110px;
  align-items:center;
  gap:20px;
  min-height:112px;
  padding:18px 26px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.01);
  transition:transform .9s cubic-bezier(.2,.8,.2,1), background .2s ease;
}
.row:hover{background:rgba(255,255,255,.03)}
.rank{
  font-size:34px;
  font-weight:900;
  color:#f0f5ff;
}
.person{
  display:flex;
  align-items:center;
  gap:18px;
}
.avatar{
  width:64px;
  height:64px;
  border-radius:50%;
  background:linear-gradient(135deg,#5d6d92,#30384f);
  display:grid;
  place-items:center;
  font-size:22px;
  font-weight:900;
}
.meta small{
  display:block;
  color:#7d88a7;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.18em;
  margin-bottom:6px;
  font-weight:900;
}
.meta strong{
  font-size:20px;
  letter-spacing:.01em;
}
.track{
  height:6px;
  background:#7784ab;
  position:relative;
}
.fill{
  position:absolute;
  inset:0 auto 0 0;
  width:70%;
  background:linear-gradient(90deg,var(--blue),var(--purple));
}
.fill.mint{
  background:linear-gradient(90deg,var(--mint),#86a4ff);
}
.score{
  text-align:right;
}
.score small{
  display:block;
  color:#8d98b5;
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:.16em;
  margin-bottom:4px;
  font-weight:900;
}
.score strong{
  font-size:42px;
  letter-spacing:-.06em;
}
@media(max-width:950px){
  body{padding:0;background:#121827}
  .shell{height:auto;min-height:100vh;max-width:none}
  .main{grid-template-columns:1fr}
  .ring{width:280px;height:280px}
  .inner strong{font-size:62px}
  h1{font-size:46px}
  .row{grid-template-columns:54px 1fr 90px;padding:16px;gap:12px}
  .track{display:none}
  .avatar{width:48px;height:48px;font-size:16px}
  .score strong{font-size:24px}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="topbar">
    <button class="topBtn">Dashboard</button>
    <button class="topBtn active">Leaderboard</button>
  </nav>  <main class="main">
    <section class="left">
      <div class="pageSwitch">
        <button class="switchBtn active" onclick="setPeriod('daily')">Daily</button>
        <button class="switchBtn" onclick="setPeriod('weekly')">Weekly</button>
        <button class="switchBtn" onclick="setPeriod('monthly')">Monthly</button>
      </div><div class="tierSwitch" id="tierSwitch"></div>

  <div class="kicker">Leaderboard</div>
  <h1 id="title">Daily Gold</h1>

  <div class="ring">
    <div class="inner">
      <div>
        <small>Current Score</small>
        <strong id="myWords">4000</strong>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><strong id="myRank">#4</strong><span>Rank</span></div>
    <div class="stat"><strong id="myMove">↑2</strong><span>Movement</span></div>
    <div class="stat"><strong id="myPct">72%</strong><span>Tier</span></div>
  </div>

  <div class="graph">
    <h3>Leaderboard</h3>
    <svg viewBox="0 0 500 200" preserveAspectRatio="none">
      <defs>
        <linearGradient id="grad" x1="0" x2="1">
          <stop offset="0" stop-color="#63e2bf"/>
          <stop offset=".5" stop-color="#75a7ff"/>
          <stop offset="1" stop-color="#b145ff"/>
        </linearGradient>
      </defs>
      <path d="M0 150 L110 40 L220 170 L320 70 L420 160 L500 110" fill="none" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</section>

<section class="right">
  <div class="header">
    <h2 id="listTitle">Daily Gold Rankings</h2>
    <button class="refresh" onclick="refreshStandings()">Refresh</button>
  </div>

  <div id="list"></div>
</section>

  </main>
</div><script>
const ranges={
  daily:{Bronze:[100,500],Silver:[501,1000],Gold:[1001,3000],Diamond:[3001,6000],Platinum:[6001,10000]},
  weekly:{Bronze:[1000,5000],Silver:[5001,10000],Gold:[10001,20000],Diamond:[20001,40000],Platinum:[40001,70000]},
  monthly:{Bronze:[5000,15000],Silver:[15001,30000],Gold:[30001,50000],Diamond:[50001,80000],Platinum:[80001,120000]}
};

const names=['Sam Robinson','Jason Bass','Leah Vaughn','Hulda Atkins','Pearl Lee','Adele Lloyd','Glenn Goodman','Anya Romanova','Nova Quill','Rain Mercer'];
const state={period:'daily',tier:{daily:'Gold',weekly:'Silver',monthly:'Silver'},prev:null,current:null};

function fmt(n){return n.toLocaleString()}
function cap(s){return s[0].toUpperCase()+s.slice(1)}

function makeBoard(period,tier,shuffle=false){
  const [min,max]=ranges[period][tier];
  const rows=names.map((name,i)=>{
    let score=Math.round(max-(i*((max-min)/(names.length+1)))-Math.random()*100);
    if(name==='Anya Romanova') score=period==='daily'?2400:period==='weekly'?9200:31500;
    if(shuffle) score+=Math.round(Math.random()*600-300);
    score=Math.max(min,Math.min(max,score));
    return {name,score};
  }).sort((a,b)=>b.score-a.score);
  return rows.map((r,i)=>({...r,rank:i+1}));
}

function generate(shuffle=false){
  const all={};
  Object.keys(ranges).forEach(period=>{
    all[period]={};
    Object.keys(ranges[period]).forEach(tier=>all[period][tier]=makeBoard(period,tier,shuffle));
  });
  return all;
}

state.prev=generate(false);
state.current=generate(true);

function rows(){return state.current[state.period][state.tier[state.period]]}
function oldRows(){return state.prev[state.period][state.tier[state.period]]}

function renderButtons(){
  tierSwitch.innerHTML=Object.keys(ranges[state.period]).map(t=>`<button class="switchBtn ${t===state.tier[state.period]?'active':''}" onclick="setTier('${t}')">${t}</button>`).join('');
}

function renderLeft(){
  const period=state.period;
  const tier=state.tier[period];
  const me=rows().find(r=>r.name==='Anya Romanova');
  const old=oldRows().find(r=>r.name==='Anya Romanova');
  const move=old.rank-me.rank;
  const [min,max]=ranges[period][tier];
  const pct=Math.round(((me.score-min)/(max-min))*100);
  title.textContent=`${cap(period)} ${tier}`;
  listTitle.textContent=`${cap(period)} ${tier} Rankings`;
  myWords.textContent=fmt(me.score);
  myRank.textContent='#'+me.rank;
  myMove.textContent=move>0?'↑'+move:move<0?'↓'+Math.abs(move):'—';
  myPct.textContent=pct+'%';
  renderButtons();
}

function rowHTML(r){
  const prev=oldRows().find(x=>x.name===r.name);
  const pct=Math.min(100,Math.round((r.score/rows()[0].score)*100));
  const initials=r.name.split(' ').map(x=>x[0]).join('').slice(0,2);
  return `<div class="row" data-prev="${prev.rank}" data-new="${r.rank}">
    <div class="rank">${r.rank}</div>
    <div class="person">
      <div class="avatar">${initials}</div>
      <div class="meta">
        <small>Player Name</small>
        <strong>${r.name}</strong>
      </div>
    </div>
    <div class="track"><div class="fill ${r.rank%2===0?'mint':''}" style="width:${pct}%"></div></div>
    <div class="score"><small>Score</small><strong>${fmt(r.score)}</strong></div>
  </div>`;
}

function renderRows(){
  list.innerHTML=rows().map(rowHTML).join('');
}

function animate(){
  const h=112;
  document.querySelectorAll('.row').forEach(r=>{
    const diff=Number(r.dataset.prev)-Number(r.dataset.new);
    r.style.transform=`translateY(${diff*-h}px)`;
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.row').forEach(r=>r.style.transform='translateY(0)');
  }));
}

function render(anim=true){
  document.querySelectorAll('.pageSwitch .switchBtn').forEach(btn=>btn.classList.toggle('active',btn.textContent.toLowerCase()===state.period));
  renderLeft();
  renderRows();
  if(anim) setTimeout(animate,60);
}

function setPeriod(p){state.period=p;render()}
function setTier(t){state.tier[state.period]=t;render()}
function refreshStandings(){state.prev=state.current;state.current=generate(true);render()}

// ===== REAL SUPABASE CONNECTION =====
// 1. Replace with your own values
const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';

// 2. Load Supabase
const script = document.createElement('script');
script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
document.head.appendChild(script);

script.onload = async () => {
  const { createClient } = supabase;
  window.sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // FIRST LOAD
  await loadRealLeaderboard();
};

async function loadRealLeaderboard() {
  state.prev = state.current;

  const period = state.period;
  const tier = state.tier[period];

  const [min,max] = ranges[period][tier];

  // CHANGE THIS TABLE NAME IF NEEDED
  const { data, error } = await sb
    .from('writing_sessions')
    .select(`
      word_count,
      created_at,
      profiles:user_id (
        username
      )
    `);

  if(error){
    console.error(error);
    return;
  }

  // FILTER BY TIME PERIOD
  const now = new Date();

  const filtered = data.filter(row => {
    const date = new Date(row.created_at);

    if(period === 'daily') {
      return date.toDateString() === now.toDateString();
    }

    if(period === 'weekly') {
      const weekAgo = new Date();
      weekAgo.setDate(now.getDate() - 7);
      return date >= weekAgo;
    }

    if(period === 'monthly') {
      return date.getMonth() === now.getMonth() &&
             date.getFullYear() === now.getFullYear();
    }
  });

  // GROUP USER SCORES
  const totals = {};

  filtered.forEach(row => {
    const name = row.profiles?.username || 'Unknown';

    if(!totals[name]) {
      totals[name] = 0;
    }

    totals[name] += Number(row.word_count || 0);
  });

  // CONVERT TO LEADERBOARD
  let leaderboard = Object.entries(totals)
    .map(([name, score]) => ({
      name,
      score
    }))
    .filter(user => user.score >= min && user.score <= max)
    .sort((a,b) => b.score - a.score)
    .map((user,index) => ({
      ...user,
      rank:index + 1
    }));

  // SAVE
  state.current[state.period][state.tier[state.period]] = leaderboard;

  render();
}

// OVERRIDE BUTTONS
async function setPeriod(p){
  state.period=p;
  await loadRealLeaderboard();
}

async function setTier(t){
  state.tier[state.period]=t;
  await loadRealLeaderboard();
}

async function refreshStandings(){
  await loadRealLeaderboard();
}

render(false);
</script></body>
</html>
