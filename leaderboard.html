<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alysum Writing Leaderboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #131926;
      --top: #101521;
      --left: #222a3b;
      --left2: #1d2535;
      --right: #2c354b;
      --right2: #232b3d;
      --text: #f7f8ff;
      --muted: #a5aec7;
      --muted2: #7d88a6;
      --blue: #55a8ff;
      --purple: #b546ff;
      --mint: #69e5c2;
      --danger: #ff8ca3;
      --line: rgba(255,255,255,.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #151c2a, #0c111c);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      min-height: 100vh;
      background: linear-gradient(145deg, #222a3b, #1d2535 70%);
    }

    .topbar {
      height: 88px;
      background: var(--top);
      display: flex;
      align-items: flex-end;
      gap: 32px;
      padding: 0 30px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .topBtn {
      background: transparent;
      border: 0;
      color: #8e98b3;
      font-size: 24px;
      font-weight: 950;
      letter-spacing: .04em;
      padding: 0 0 32px;
      cursor: pointer;
    }

    .topBtn.active {
      color: white;
      border-bottom: 5px solid var(--blue);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(360px, 44%) 1fr;
      min-height: calc(100vh - 88px);
    }

    .left {
      padding: 40px 30px;
      background:
        radial-gradient(circle at 50% 38%, rgba(94,123,255,.18), transparent 38%),
        linear-gradient(145deg, var(--left), var(--left2));
      border-right: 1px solid rgba(255,255,255,.07);
      overflow: auto;
    }

    .right {
      background: linear-gradient(145deg, var(--right), var(--right2));
      overflow: auto;
      max-height: calc(100vh - 88px);
    }

    .switches {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .periodBtn,
    .tierBtn,
    .refreshBtn {
      border: 0;
      cursor: pointer;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-weight: 950;
      transition: .2s ease;
    }

    .periodBtn,
    .tierBtn {
      color: #a7b0c7;
      background: rgba(255,255,255,.055);
      border-radius: 999px;
      font-size: 22px;
      padding: 17px 25px;
      min-width: 116px;
    }

    .tierBtn {
      font-size: 21px;
      min-width: 142px;
      padding: 16px 24px;
    }

    .periodBtn.active,
    .tierBtn.active {
      color: white;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      box-shadow: 0 0 28px rgba(120,80,255,.28);
    }

    .kicker {
      text-align: center;
      color: #c5cde0;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 24px;
      font-weight: 950;
      margin: 26px 0 14px;
    }

    h1 {
      margin: 0 0 32px;
      text-align: center;
      text-transform: uppercase;
      font-size: clamp(46px, 7vw, 76px);
      line-height: .95;
      letter-spacing: -.055em;
    }

    .ring {
      width: min(520px, 82vw);
      aspect-ratio: 1;
      margin: 0 auto 34px;
      border-radius: 50%;
      padding: 18px;
      background:
        conic-gradient(
          from 210deg,
          var(--blue) 0 23%,
          #637cff 23% 52%,
          var(--purple) 52% 82%,
          rgba(255,255,255,.07) 82% 100%
        );
      box-shadow: 0 0 80px rgba(80,110,255,.18);
      position: relative;
    }

    .ring::before {
      content: "";
      position: absolute;
      inset: 26px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1f2635, #1b2231);
      box-shadow:
        inset 0 0 0 7px rgba(62,73,115,.75),
        inset 0 0 0 16px rgba(126,84,255,.26);
    }

    .ringInner {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      z-index: 1;
    }

    .ringInner small {
      display: block;
      color: #b9c1d5;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: 22px;
      font-weight: 950;
      margin-bottom: 18px;
    }

    .ringInner strong {
      display: block;
      font-size: clamp(72px, 14vw, 116px);
      line-height: .8;
      letter-spacing: -.08em;
      color: #a98cff;
      text-shadow: 0 0 34px rgba(181,70,255,.42);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 650px;
      margin: 0 auto 24px;
    }

    .stat {
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);
      text-align: center;
      padding: 26px 12px;
      border-radius: 22px;
    }

    .stat strong {
      display: block;
      font-size: 44px;
      letter-spacing: -.04em;
      color: white;
    }

    .stat span {
      display: block;
      margin-top: 8px;
      color: #aab3c9;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-size: 20px;
      font-weight: 950;
    }

    .note {
      max-width: 650px;
      margin: 0 auto;
      color: #b8c1d7;
      text-align: center;
      line-height: 1.5;
      font-size: 15px;
    }

    .leaderHead {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(38,47,68,.96);
      border-bottom: 1px solid var(--line);
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .leaderHead h2 {
      margin: 0;
      color: #cad3e8;
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 16px;
      font-weight: 950;
    }

    .refreshBtn {
      background: rgba(255,255,255,.075);
      color: white;
      border-radius: 999px;
      padding: 12px 16px;
      font-size: 12px;
    }

    .leaderList {
      position: relative;
    }

    .row {
      min-height: 116px;
      display: grid;
      grid-template-columns: 72px 1fr 250px 116px;
      align-items: center;
      gap: 18px;
      padding: 20px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.012);
      transition: transform .9s cubic-bezier(.2,.82,.2,1), background .25s ease;
    }

    .row:hover {
      background: rgba(255,255,255,.035);
    }

    .row.me {
      background: rgba(85,168,255,.08);
    }

    .row.empty {
      display: block;
      text-align: center;
      color: #aab3c9;
      padding: 42px 20px;
      min-height: auto;
    }

    .rank {
      font-size: 32px;
      font-weight: 950;
      color: #e8eeff;
    }

    .person {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #5e6e94, #31394f);
      color: white;
      font-size: 21px;
      font-weight: 950;
      border: 2px solid rgba(255,255,255,.08);
      flex: 0 0 auto;
    }

    .meta {
      min-width: 0;
    }

    .label {
      color: #7f8aa6;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-weight: 950;
      margin-bottom: 5px;
    }

    .name {
      font-size: 20px;
      font-weight: 950;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .move {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 950;
      color: #8d98b5;
    }

    .move.up {
      color: var(--mint);
    }

    .move.down {
      color: var(--danger);
    }

    .track {
      height: 6px;
      background: #7a86a9;
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 60%;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      border-radius: inherit;
    }

    .fill.mint {
      background: linear-gradient(90deg, var(--mint), #89a4ff);
    }

    .score {
      text-align: right;
    }

    .score .label {
      text-align: right;
    }

    .score strong {
      font-size: 40px;
      letter-spacing: -.06em;
    }

    .row.flashUp {
      animation: flashUp 1s ease;
    }

    .row.flashDown {
      animation: flashDown 1s ease;
    }

    @keyframes flashUp {
      35% { background: rgba(105,229,194,.12); }
    }

    @keyframes flashDown {
      35% { background: rgba(255,140,163,.10); }
    }

    .loading {
      color: #c8d2ea;
      padding: 40px;
      text-align: center;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    @media(max-width: 980px) {
      .topbar {
        height: 88px;
        padding: 0 30px;
        align-items: end;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .left {
        padding: 40px 32px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .right {
        max-height: none;
        overflow: visible;
      }

      .periodBtn,
      .tierBtn {
        font-size: 22px;
        min-width: auto;
      }

      .leaderHead {
        position: relative;
      }

      .row {
        grid-template-columns: 56px 1fr 95px;
        min-height: 96px;
        padding: 16px 22px;
      }

      .track {
        display: none;
      }

      .avatar {
        width: 52px;
        height: 52px;
        font-size: 17px;
      }

      .name {
        font-size: 17px;
      }

      .score strong {
        font-size: 25px;
      }

      .score .label {
        display: none;
      }
    }

    @media(max-width: 560px) {
      .topbar {
        gap: 26px;
        padding: 0 30px;
      }

      .topBtn {
        font-size: 24px;
      }

      .left {
        padding: 40px 30px;
      }

      .periodBtn,
      .tierBtn {
        font-size: 22px;
        padding: 17px 24px;
      }

      .kicker {
        font-size: 24px;
      }

      .ring {
        width: min(520px, 86vw);
      }

      .ringInner small {
        font-size: 22px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .stat {
        padding: 26px 12px;
      }

      .leaderHead {
        align-items: flex-start;
        flex-direction: column;
      }

      .refreshBtn {
        width: 100%;
      }

      .row {
        grid-template-columns: 44px 1fr 76px;
        gap: 10px;
        padding: 15px 16px;
      }

      .rank {
        font-size: 22px;
      }

      .avatar {
        width: 42px;
        height: 42px;
      }

      .person {
        gap: 10px;
      }

      .score strong {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <nav class="topbar">
      <button class="topBtn">Dashboard</button>
      <button class="topBtn active">Leaderboard</button>
    </nav>

    <main class="layout">
      <section class="left">
        <div class="switches">
          <button class="periodBtn active" onclick="setPeriod('daily')">Daily</button>
          <button class="periodBtn" onclick="setPeriod('weekly')">Weekly</button>
          <button class="periodBtn" onclick="setPeriod('monthly')">Monthly</button>
        </div>

        <div class="switches" id="tierButtons"></div>

        <div class="kicker">Leaderboard</div>
        <h1 id="boardTitle">Daily Gold</h1>

        <div class="ring">
          <div class="ringInner">
            <div>
              <small>Your Words</small>
              <strong id="myWords">0</strong>
            </div>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <strong id="myRank">—</strong>
            <span>Rank</span>
          </div>
          <div class="stat">
            <strong id="myMove">—</strong>
            <span>Movement</span>
          </div>
          <div class="stat">
            <strong id="myPct">0%</strong>
            <span>Tier</span>
          </div>
        </div>

        <p class="note" id="statusNote">Loading real Supabase data...</p>
      </section>

      <section class="right">
        <div class="leaderHead">
          <h2 id="listTitle">Daily Gold Rankings</h2>
          <button class="refreshBtn" onclick="refreshStandings()">Refresh Standings</button>
        </div>

        <div class="leaderList" id="leaderList">
          <div class="loading">Loading leaderboard...</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://tiqmhozzxhiydjnyuuaw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_jZvjeBX2jKnVcQMBrZ6K8A_Rn7uVJAg';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const BOOKS_TABLE = 'books';
    const USERS_TABLE = 'users';

    const ranges = {
      daily: {
        Bronze: [100, 500],
        Silver: [501, 1000],
        Gold: [1001, 3000],
        Diamond: [3001, 6000],
        Platinum: [6001, 10000]
      },
      weekly: {
        Bronze: [1000, 5000],
        Silver: [5001, 10000],
        Gold: [10001, 20000],
        Diamond: [20001, 40000],
        Platinum: [40001, 70000]
      },
      monthly: {
        Bronze: [5000, 15000],
        Silver: [15001, 30000],
        Gold: [30001, 50000],
        Diamond: [50001, 80000],
        Platinum: [80001, 120000]
      }
    };

    const state = {
      period: 'daily',
      tier: {
        daily: 'Gold',
        weekly: 'Silver',
        monthly: 'Silver'
      },
      previousRows: [],
      currentRows: [],
      currentUserId: null,
      usersById: {}
    };

    function fmt(n) {
      return Number(n || 0).toLocaleString();
    }

    function cap(s) {
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function startOfPeriod(period) {
      const d = new Date();

      if (period === 'daily') {
        d.setHours(0, 0, 0, 0);
      }

      if (period === 'weekly') {
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        d.setDate(diff);
        d.setHours(0, 0, 0, 0);
      }

      if (period === 'monthly') {
        d.setDate(1);
        d.setHours(0, 0, 0, 0);
      }

      return d.getTime();
    }

    function bestName(userId) {
      const u = state.usersById[userId];

      if (!u) {
        return 'Writer ' + String(userId || '').slice(0, 6);
      }

      return (
        u.username ||
        u.display_name ||
        u.name ||
        u.full_name ||
        u.email ||
        ('Writer ' + String(userId || '').slice(0, 6))
      );
    }

    async function getCurrentUser() {
      const { data } = await sb.auth.getUser();
      state.currentUserId = data?.user?.id || null;
    }

    async function fetchUsers(userIds) {
      state.usersById = {};

      if (!userIds.length) {
        return;
      }

      const { data, error } = await sb
        .from(USERS_TABLE)
        .select('*')
        .in('id', userIds);

      if (error) {
        console.warn('Could not load users table. Falling back to user ids.', error);
        return;
      }

      (data || []).forEach(user => {
        state.usersById[user.id] = user;
      });
    }

    async function fetchLeaderboard() {
      const period = state.period;
      const tier = state.tier[period];
      const [min, max] = ranges[period][tier];
      const start = startOfPeriod(period);

      const { data, error } = await sb
        .from(BOOKS_TABLE)
        .select('id,user_id,title,words,updated')
        .gte('updated', start)
        .not('user_id', 'is', null);

      if (error) {
        console.error('Books fetch error:', error);
        leaderList.innerHTML =
          `<div class="row empty">Could not load books: ${error.message}</div>`;
        statusNote.textContent =
          'Could not load Supabase data. Check RLS policies for the books table.';
        return [];
      }

      const books = data || [];
      const userIds = [...new Set(books.map(book => book.user_id).filter(Boolean))];

      await fetchUsers(userIds);

      const totals = {};

      books.forEach(book => {
        const id = book.user_id;

        if (!totals[id]) {
          totals[id] = 0;
        }

        totals[id] += Number(book.words || 0);
      });

      return Object.entries(totals)
        .map(([user_id, score]) => ({
          user_id,
          name: bestName(user_id),
          score
        }))
        .filter(row => row.score >= min && row.score <= max)
        .sort((a, b) => b.score - a.score)
        .map((row, index) => ({
          ...row,
          rank: index + 1
        }));
    }

    function renderPeriodButtons() {
      document.querySelectorAll('.periodBtn').forEach(button => {
        button.classList.toggle(
          'active',
          button.textContent.toLowerCase() === state.period
        );
      });
    }

    function renderTierButtons() {
      const active = state.tier[state.period];

      tierButtons.innerHTML = Object.keys(ranges[state.period])
        .map(tier => `
          <button
            class="tierBtn ${tier === active ? 'active' : ''}"
            onclick="setTier('${tier}')"
          >
            ${tier}
          </button>
        `)
        .join('');
    }

    function renderLeft() {
      const period = state.period;
      const tier = state.tier[period];
      const [min, max] = ranges[period][tier];
      const rows = state.currentRows;

      let me = null;

      if (state.currentUserId) {
        me = rows.find(row => row.user_id === state.currentUserId);
      }

      if (!me) {
        me = rows[0] || {
          rank: '—',
          score: 0,
          user_id: null
        };
      }

      const old = state.previousRows.find(row => row.user_id === me.user_id);
      const move = old && typeof me.rank === 'number'
        ? old.rank - me.rank
        : 0;

      const pct = Math.max(
        0,
        Math.min(
          100,
          Math.round(((Number(me.score || 0) - min) / (max - min)) * 100)
        )
      );

      boardTitle.textContent = `${cap(period)} ${tier}`;
      listTitle.textContent = `${cap(period)} ${tier} Rankings`;
      myWords.textContent = fmt(me.score);
      myRank.textContent = typeof me.rank === 'number' ? '#' + me.rank : '—';
      myMove.textContent =
        move > 0 ? '↑' + move :
        move < 0 ? '↓' + Math.abs(move) :
        '—';

      myMove.style.color =
        move > 0 ? 'var(--mint)' :
        move < 0 ? 'var(--danger)' :
        '#aab3c9';

      myPct.textContent = pct + '%';

      if (rows.length) {
        statusNote.textContent =
          `Showing ${rows.length} writer${rows.length === 1 ? '' : 's'} in ${cap(period)} ${tier}.`;
      } else {
        statusNote.textContent =
          `No writers are currently in ${cap(period)} ${tier}. Try another tier.`;
      }
    }

    function initials(name) {
      return String(name || '?')
        .split(' ')
        .map(part => part[0])
        .join('')
        .slice(0, 2)
        .toUpperCase();
    }

    function rowHTML(row) {
      const old = state.previousRows.find(item => item.user_id === row.user_id);
      const move = old ? old.rank - row.rank : 0;

      const moveClass =
        move > 0 ? 'up' :
        move < 0 ? 'down' :
        '';

      const moveText =
        move > 0 ? '↑ ' + move :
        move < 0 ? '↓ ' + Math.abs(move) :
        '—';

      const topScore = state.currentRows[0]?.score || row.score || 1;
      const pct = Math.max(6, Math.round((row.score / topScore) * 100));

      const isMe = state.currentUserId && row.user_id === state.currentUserId;

      return `
        <div
          class="row ${isMe ? 'me' : ''}"
          data-prev="${old ? old.rank : row.rank}"
          data-new="${row.rank}"
        >
          <div class="rank">${row.rank}</div>

          <div class="person">
            <div class="avatar">${initials(row.name)}</div>

            <div class="meta">
              <div class="label">Writer Name</div>
              <div class="name">${row.name}${isMe ? ' · You' : ''}</div>
              <div class="move ${moveClass}">${moveText}</div>
            </div>
          </div>

          <div class="track">
            <div
              class="fill ${row.rank % 3 === 0 ? 'mint' : ''}"
              style="width:${pct}%"
            ></div>
          </div>

          <div class="score">
            <div class="label">Words</div>
            <strong>${fmt(row.score)}</strong>
          </div>
        </div>
      `;
    }

    function renderRows() {
      if (!state.currentRows.length) {
        leaderList.innerHTML =
          `<div class="row empty">No writers found for this board.</div>`;
        return;
      }

      leaderList.innerHTML = state.currentRows.map(rowHTML).join('');
    }

    function animateRows() {
      const rowHeight = window.innerWidth <= 980 ? 96 : 116;

      document.querySelectorAll('.row[data-prev]').forEach(row => {
        const prev = Number(row.dataset.prev);
        const now = Number(row.dataset.new);
        const diff = prev - now;

        row.style.transform = `translateY(${diff * -rowHeight}px)`;
        row.classList.remove('flashUp', 'flashDown');

        if (diff > 0) {
          row.classList.add('flashUp');
        }

        if (diff < 0) {
          row.classList.add('flashDown');
        }
      });

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.querySelectorAll('.row[data-prev]').forEach(row => {
            row.style.transform = 'translateY(0)';
          });
        });
      });
    }

    async function loadBoard(animate = true) {
      renderPeriodButtons();
      renderTierButtons();

      leaderList.innerHTML =
        `<div class="loading">Loading leaderboard...</div>`;

      const freshRows = await fetchLeaderboard();

      state.previousRows = state.currentRows;
      state.currentRows = freshRows;

      renderLeft();
      renderRows();

      if (animate) {
        setTimeout(animateRows, 60);
      }
    }

    async function setPeriod(period) {
      state.period = period;
      await loadBoard(true);
    }

    async function setTier(tier) {
      state.tier[state.period] = tier;
      await loadBoard(true);
    }

    async function refreshStandings() {
      await loadBoard(true);
    }

    async function init() {
      await getCurrentUser();
      await loadBoard(false);
    }

    init();
  </script>
</body>
</html>
