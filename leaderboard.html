<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ALYSUM:PWA:START -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020b18" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="dark light">
    <meta name="application-name" content="Alysum">
    <link rel="icon" type="image/png" sizes="any" href="Alysum-3.png">
    <script src="js/pwa-register.js" defer></script>
    <!-- ALYSUM:PWA:END -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboards - Alysum</title>
    <script src="js/alysum-appearance-boot.js"></script>
    <link rel="stylesheet" href="css/gradient-themes.css?v=4" />
    <script src="js/gradient-theme-sync.js" defer></script>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(ellipse 120% 60% at 50% -10%, var(--theme-body-spot, rgba(124, 58, 237, 0.28)) 0%, transparent 55%),
                linear-gradient(180deg, #0d1426 0%, #0b1220 100%);
            color: #fff;
        }

        .lb-header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px clamp(16px, 3vw, 28px);
            background: linear-gradient(135deg, var(--purple-dark, #5b21b6), var(--theme-header-mid, #7c3aed), var(--theme-header-end, #ec4899));
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.35);
        }

        .lb-back {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: none;
            background: rgba(0, 0, 0, 0.22);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .lb-title {
            font-size: 20px;
            font-weight: 900;
            color: #fff7ed;
        }

        .lb-main {
            max-width: 720px;
            margin: 0 auto;
            padding: 32px clamp(16px, 3vw, 28px) 48px;
        }

        .lb-empty {
            padding: 48px 24px;
            text-align: center;
            border-radius: 20px;
            border: 1px dashed rgba(255, 255, 255, 0.12);
            background: rgba(17, 24, 39, 0.5);
            color: #9ca3af;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <header class="lb-header">
        <button type="button" class="lb-back" id="backBtn" aria-label="Back">←</button>
        <div class="lb-title">Leaderboards</div>
    </header>

    <main class="lb-main">
        <p class="lb-empty">Leaderboards are coming soon.</p>
    </main>

    <script type="module">
        import { supabase } from "./firebase.js";

        document.getElementById("backBtn").addEventListener("click", () => {
            if (history.length > 1) history.back();
            else window.location.href = "writer-dashboard.html";
        });

        const { data } = await supabase.auth.getUser();
        if (!data?.user) window.location.href = "login.html";
    </script>
</body>
</html>
