<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library violations & appeals — Alysum</title>
    <link rel="stylesheet" href="css/library-reports.css?v=1">
    <script src="js/alysum-appearance-boot.js"></script>
    <link rel="stylesheet" href="css/workspace-nav.css?v=2" />
</head>
<body class="mod-page">
    <div id="alysum-workspace-nav" data-active="settings"></div>
    <script type="module" src="js/workspace-nav.js?v=2"></script>

<div class="mod-shell">
    <header class="mod-header">
        <h1>Library violations & appeals</h1>
        <p>When Alysum Support confirms a policy issue, you will see the required corrections and deadline here. You may appeal a decision you believe was made in error.</p>
    </header>

    <div class="mod-status hidden" id="violStatus"></div>

    <div class="mod-toolbar">
        <a class="mod-btn" href="settings.html">← Settings</a>
        <a class="mod-btn" href="writer-dashboard.html">Studio</a>
        <a class="mod-btn" href="library.html">Library</a>
    </div>

    <div id="violList" class="mod-panel">
        <p class="mod-detail-empty">Loading…</p>
    </div>
</div>

<script type="module">
    import { supabase } from "./firebase.js";
    import { listMyViolations, submitAppeal } from "./js/library-reports-api.js?v=1";

    const violList = document.getElementById("violList");
    const violStatus = document.getElementById("violStatus");

    function showStatus(msg, type = "ok") {
        violStatus.textContent = msg;
        violStatus.className = "mod-status " + type;
        violStatus.classList.remove("hidden");
        if (type === "ok") setTimeout(() => violStatus.classList.add("hidden"), 4000);
    }

    function escapeHtml(str) {
        return String(str || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
    }

    function formatDate(iso) {
        if (!iso) return "—";
        return new Date(iso).toLocaleString();
    }

    function statusLabel(status) {
        const map = {
            open: "Open — correction required",
            corrected: "Corrected",
            deadline_missed: "Deadline missed",
            appealed: "Appeal pending",
            overturned: "Overturned",
            closed: "Closed",
        };
        return map[status] || status;
    }

    function renderViolations(violations) {
        if (!violations.length) {
            violList.innerHTML = '<p class="mod-detail-empty">No library violations on your account.</p>';
            return;
        }

        violList.innerHTML = violations.map((v) => `
            <article class="mod-queue-item" style="margin-bottom:12px;cursor:default" data-violation-id="${v.id}">
                <div class="mod-queue-title">Book: ${escapeHtml(v.book_id)}</div>
                <div class="mod-queue-meta">
                    <span class="mod-badge ${v.is_severe ? "critical" : ""}">Strike ${v.strike_number}${v.is_severe ? " · Severe" : ""}</span>
                    <span>${escapeHtml(statusLabel(v.status))}</span>
                    <span>Deadline: ${escapeHtml(formatDate(v.deadline))}</span>
                </div>
                <div class="mod-detail-block" style="margin-top:12px">
                    <h3>Policy violated</h3>
                    <p>${escapeHtml(v.policy_violated)}</p>
                </div>
                ${v.correction_requirements ? `
                <div class="mod-detail-block">
                    <h3>Corrections required</h3>
                    <pre>${escapeHtml(v.correction_requirements)}</pre>
                </div>` : ""}
                ${["open", "deadline_missed"].includes(v.status) ? `
                <div class="mod-form appeal-form">
                    <h3>Request appeal</h3>
                    <p class="mod-detail-empty" style="margin-bottom:8px">Appeals are reviewed by a moderator who was not involved in the original decision when possible.</p>
                    <textarea class="mod-textarea appeal-text" rows="4" placeholder="Explain why you believe this decision was made in error…"></textarea>
                    <div class="mod-actions">
                        <button type="button" class="mod-btn primary submit-appeal-btn">Submit appeal</button>
                    </div>
                </div>` : ""}
            </article>
        `).join("");

        violList.querySelectorAll(".submit-appeal-btn").forEach((btn) => {
            btn.addEventListener("click", async () => {
                const article = btn.closest("[data-violation-id]");
                const violationId = article?.dataset.violationId;
                const text = article?.querySelector(".appeal-text")?.value?.trim() || "";
                if (!violationId || text.length < 10) {
                    showStatus("Appeal must be at least 10 characters.", "error");
                    return;
                }
                btn.disabled = true;
                try {
                    await submitAppeal(violationId, text);
                    showStatus("Appeal submitted. Alysum Support will review it.");
                    await load();
                } catch (err) {
                    showStatus(err.message || "Could not submit appeal.", "error");
                    btn.disabled = false;
                }
            });
        });
    }

    async function load() {
        const violations = await listMyViolations();
        renderViolations(violations);
    }

    const { data: authData } = await supabase.auth.getUser();
    if (!authData?.user) {
        window.location.href = "login.html?next=" + encodeURIComponent("library-violations.html");
    } else {
        try {
            await load();
        } catch (err) {
            violList.innerHTML = `<p class="mod-detail-empty">Could not load violations. If this is a new feature, run <code>supabase-library-reports.sql</code> in Supabase first.</p>`;
            console.error(err);
        }
    }
</script>
</body>
</html>
