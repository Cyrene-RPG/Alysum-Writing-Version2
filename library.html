<style>
    * { box-sizing: border-box; }
    :root {

    .card { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00)), var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; min-width: 0; cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease; position: relative; overflow: hidden; isolation: isolate; }
    .card > * { position: relative; z-index: 1; }
    .card-watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; user-select: none; overflow: hidden; z-index: 0; }
    .card-watermark span { font-size: clamp(34px, 7vw, 64px); font-weight: 900; letter-spacing: 0.06em; text-transform: lowercase; white-space: nowrap; color: #ffffff; opacity: 0.035; transform: rotate(-18deg); text-shadow: 0 0 12px rgba(255,255,255,0.18); }

    .cover-wrap { width: 100%; aspect-ratio: 2 / 3; border-radius: 18px; overflow: hidden; background: linear-gradient(135deg, rgba(109,40,217,0.28), rgba(255,255,255,0.06)); border: 1px solid rgba(255,255,255,0.08); position: relative; isolation: isolate; }

        radial-gradient(ellipse 120% 80% at 100% 0%, hsla(var(--cover-ph-hue, 265), 72%, 58%, 0.22), transparent 55%),

    .rating-badge { flex: 0 0 auto; border-radius: 999px; padding: 8px 12px; background: rgba(109,40,217,0.18); color: #ddd6fe; font-size: 12px; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; }

    .warning-block { display: flex; flex-direction: column; gap: 8px; }
    .block-label { font-size: 12px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-soft); }
    .warning-chips, .genre-chips, .tag-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .card-footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
    .footer-meta { color: var(--text-soft); font-size: 13px; font-weight: 700; }
    .read-btn { border: none; background: linear-gradient(135deg, var(--alysum-purple-dark), var(--alysum-purple)); color: white; border-radius: 12px; padding: 11px 14px; font-size: 14px; font-weight: 900; cursor: pointer; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .report-card-btn { border: 1px solid rgba(239,68,68,0.25); background: rgba(127,29,29,0.12); color: #fecaca; border-radius: 12px; padding: 11px 12px; font-size: 13px; font-weight: 800; cursor: pointer; }
    .empty, .loading, .error { background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 34px 22px; text-align: center; color: var(--text-soft); font-size: 15px; line-height: 1.6; }
    .hidden { display: none !important; }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 1000px) { .wd-nav { justify-content: flex-start; } }
    @media (max-width: 700px) { html, body { overflow-x: hidden; } .topbar { top: var(--alysum-nav-sticky-offset, 45px); } .topbar-inner, .page { padding-left: 14px; padding-right: 14px; } .library-tools { padding: 10px; border-radius: 18px; } .grid { grid-template-columns: 1fr; } .card-title { font-size: 20px; } .card-footer { align-items: stretch; } .read-btn { width: 100%; } }
</style>

</main><script type="module">
    import { supabase } from "./firebase.js";
    import { openLibraryReportModal } from "./js/library-report-modal.js?v=1";
    import {
        isComicFormat,
        mediaFormatLabel,
        normalizeMediaFormat,
    } from "./js/book-media-format.js?v=1";
    import {
        authorLinkHtml,
        authorPageUrl,
        fetchUsernamesByIds,
    } from "./js/author-profile.js?v=2";
    import {
        formatChapterProgress,
        serializationFromBookData,
        serializationStatusLabel,
    } from "./js/story-serialization.js?v=1";
    import { processDueChapterReleases } from "./js/scheduled-chapter-releases.js?v=4";

    const navButtons = document.querySelectorAll(".nav-btn");
    const searchInput = document.getElementById("searchInput");
    const refreshBtn = document.getElementById("refreshBtn");
    const resultsText = document.getElementById("resultsText");
    const loadingState = document.getElementById("loadingState");
    const errorState = document.getElementById("errorState");
    const emptyState = document.getElementById("emptyState");
    const bookGrid = document.getElementById("bookGrid");

    let allBooks = [];
    let currentFilter = "all";
    let currentUserId = null;
    const readCounts = new Map();
    let authorUsernameMap = new Map();

    async function loadCurrentUser() {
        const { data: authData, error: authError } = await supabase.auth.getUser();
        if (authError) console.warn(authError);
        const user = authData?.user;
        currentUserId = user?.id || null;
    }

    function safeString(value, fallback = "") { return typeof value === "string" ? value : fallback; }
    function safeNumber(value, fallback = 0) { return typeof value === "number" && Number.isFinite(value) ? value : fallback; }
    function safeArray(value, fallback = []) { return Array.isArray(value) ? value : fallback; }
    function safeObject(value, fallback = {}) { return value && typeof value === "object" && !Array.isArray(value) ? value : fallback; }

    function flattenWarnings(warningsObj) {
        const warnings = [];
        const source = safeObject(warningsObj, {});
        Object.values(source).forEach(group => {
            safeArray(group).forEach(item => {
                if (typeof item === "string" && item.trim()) warnings.push(item.trim());
            });
        });
        return [...new Set(warnings)];
    }

    function libraryRowData(row) {
        const data = safeObject(row?.data, {});
        return Object.keys(data).length ? data : safeObject(row, {});
    }

    function normalizeBook(row) {
        const data = libraryRowData(row);
        const id = safeString(row?.id || data.id || data.bookId, "");
        const publishGenres = safeArray(data.genres);
        const publishTags = safeArray(data.extraTags);
        const chapters = safeArray(data.chapters);
        const warnings = flattenWarnings(data.warnings);
        const serialization = serializationFromBookData(data);
        return {
            id,
            title: safeString(data.title, "Untitled"),
            author: safeString(data.author, "unknown"),
            type: safeString(data.type, "fiction"),
            mediaFormat: normalizeMediaFormat(data.mediaFormat ?? data.media_format),
            rating: safeString(data.rating, ""),
            summary: safeString(data.summary, ""),
            coverUrl: safeString(data.coverUrl || data.cover_url, ""),
            genres: publishGenres.filter(v => typeof v === "string" && v.trim()),
            tags: publishTags.filter(v => typeof v === "string" && v.trim()),
            warnings,
            chapterCount: serialization.chapterCount,
            publishedChapterCount: serialization.publishedCount,
            serializationStatus: serialization.status,
            plannedChapterCount: serialization.plannedChapterCount,
            words: safeNumber(data.words, 0),
            views: safeNumber(data.views, 0),
            ownerUid: safeString(data.ownerUid || data.user_id || row?.user_id, ""),
            isAnonymous: !!(data.isAnonymous ?? data.is_anonymous),
            updated: safeNumber(data.updated, 0),
            isPublished: data.isPublished !== false
        };
    }

    function authorMarkup(book) {
        const label = escapeHtml(book.author);
        if (book.isAnonymous) return `@${label}`;
        const username = authorUsernameMap.get(book.ownerUid);
        if (!username) return `@${label}`;
        return authorLinkHtml({ username, label: book.author, className: "card-author-link" });
    }

    function coverAuthorMarkup(book) {
        const label = escapeHtml(book.author);
        if (book.isAnonymous) return `@${label}`;
        const username = authorUsernameMap.get(book.ownerUid);
        if (!username) return `@${label}`;
        const url = authorPageUrl(username);
        return `<a class="cover-author-link" href="${escapeAttribute(url)}">@${label}</a>`;
    }

    async function loadAuthorUsernames() {
        authorUsernameMap = new Map();
        const ownerIds = allBooks
            .filter((book) => !book.isAnonymous && book.ownerUid)
            .map((book) => book.ownerUid);
        try {
            authorUsernameMap = await fetchUsernamesByIds(supabase, ownerIds);
        } catch (err) {
            console.warn("Could not load author usernames for library links.", err);
        }
    }

    function bindAuthorLinkStopPropagation(root) {
        root.querySelectorAll(".card-author-link, .cover-author-link").forEach((link) => {
            link.addEventListener("click", (e) => e.stopPropagation());
        });
    }

    function formatNumber(num) { return new Intl.NumberFormat().format(num || 0); }
    function realReadCount(book) { return Math.max(safeNumber(book.views, 0), readCounts.get(book.id) || 0); }
    function formatRelativeUpdate(timestamp) {
        if (!timestamp) return "Updated recently";
        const diffMs = Date.now() - timestamp;
        const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
        const diffDays = Math.floor(diffHours / 24);
        if (diffHours < 1) return "Updated just now";
        if (diffHours < 24) return `Updated ${diffHours}h ago`;
        if (diffDays < 30) return `Updated ${diffDays}d ago`;
        const date = new Date(timestamp);
        return `Updated ${date.toLocaleDateString()}`;
    }

    function placeholderHue(seed) {
        const s = safeString(seed, "0");
        let h = 2166136261 >>> 0;
        for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
        return Math.abs(h) % 360;
    }

    function coverPlaceholderMarkup(book, hue) {
        return `
                <div class="cover-placeholder" style="--cover-ph-hue:${hue}" aria-hidden="true">
                    <div class="cover-placeholder-inner">
                        <div class="cover-placeholder-title-wrap">
                            <div class="cover-placeholder-title">${escapeHtml(book.title)}</div>
                        </div>
                        <div class="cover-placeholder-author">${coverAuthorMarkup(book)}</div>
                    </div>
                </div>`;
    }

    function showState(type) {
        loadingState.classList.add("hidden");
        errorState.classList.add("hidden");
        emptyState.classList.add("hidden");
        bookGrid.classList.add("hidden");
        if (type === "loading") loadingState.classList.remove("hidden");
        if (type === "error") errorState.classList.remove("hidden");
        if (type === "empty") emptyState.classList.remove("hidden");
        if (type === "grid") bookGrid.classList.remove("hidden");
    }

    function matchesSearch(book, q) {
        if (!q) return true;
        const haystack = [book.title, book.author, book.summary, mediaFormatLabel(book.mediaFormat), ...book.genres, ...book.tags, ...book.warnings, book.rating, book.type].join(" ").toLowerCase();
        return haystack.includes(q);
    }

    function matchesShelfFilter(book) {
        if (currentFilter === "all") return true;
        if (currentFilter === "comics") return isComicFormat(book.mediaFormat);
        return book.type === currentFilter;
    }

    function filteredBooks() {
        const q = searchInput.value.trim().toLowerCase();
        return allBooks
            .filter(book => book.isPublished === true)
            .filter(book => matchesShelfFilter(book))
            .filter(book => matchesSearch(book, q))
            .sort((a, b) => (b.updated || 0) - (a.updated || 0));
    }

    function setResultsText(count) {
        const filterLabel = currentFilter === "all"
            ? "all shelves"
            : currentFilter === "comics"
                ? "Comics"
                : currentFilter.charAt(0).toUpperCase() + currentFilter.slice(1);
        if (searchInput.value.trim()) resultsText.textContent = `${count} result${count === 1 ? "" : "s"} in ${filterLabel}`;
        else resultsText.textContent = `${count} stor${count === 1 ? "y" : "ies"} in ${filterLabel}`;
    }

    function renderBooks() {
        const books = filteredBooks();
        bookGrid.innerHTML = "";
        setResultsText(books.length);
        if (!books.length) { showState("empty"); return; }
        showState("grid");
        books.forEach(book => {
            const card = document.createElement("article");
            card.className = "card";
            const rating = book.rating || "Unrated";
            const topGenres = book.genres.slice(0, 4);
            const topWarnings = book.warnings.filter(w => w.toLowerCase() !== "none").slice(0, 4);
            const topTags = book.tags.slice(0, 4);
            const phHue = placeholderHue(book.id + "\0" + book.title);
            const trimmedCover = book.coverUrl.trim();
            const hasCover = !!trimmedCover;
            const comic = isComicFormat(book.mediaFormat);
            const formatChip = comic ? mediaFormatLabel(book.mediaFormat) : book.type;
            const countChip = formatChapterProgress({
                publishedCount: book.publishedChapterCount ?? book.chapterCount,
                plannedChapterCount: book.plannedChapterCount,
                chapterCount: book.chapterCount,
                serializationStatus: book.serializationStatus,
                comic,
            });
            const statusChip = serializationStatusLabel(book.serializationStatus);
            const coverInner = hasCover
                ? `${coverPlaceholderMarkup(book, phHue)}
                    <img class="cover-img" src="${escapeAttribute(trimmedCover)}" alt="${escapeAttribute(book.title)} cover" loading="lazy" onerror="this.style.display='none'">`
                : coverPlaceholderMarkup(book, phHue);
            card.innerHTML = `
                <div class="card-watermark" aria-hidden="true"><span>@${escapeHtml(book.author)}</span></div>
                <div class="cover-wrap">
                    ${coverInner}
                </div>
                <div class="card-top">
                    <div class="card-title-wrap">
                        <div class="card-title">${escapeHtml(book.title)}</div>
                        <div class="card-author">${authorMarkup(book)}</div>
                    </div>
                    <div class="rating-badge">${escapeHtml(rating)}</div>
                </div>
                <div class="meta-row">
                    <div class="chip">${escapeHtml(formatChip)}</div>
                    <div class="chip soft">${escapeHtml(countChip)}</div>
                    <div class="chip soft">${escapeHtml(statusChip)}</div>
                    ${comic ? "" : `<div class="chip soft">${formatNumber(book.words)} words</div>`}
                    <div class="chip soft">${formatNumber(realReadCount(book))} reads</div>
                </div>
                <div class="summary">${escapeHtml(book.summary || "No summary yet.")}</div>
                ${topGenres.length ? `<div class="warning-block"><div class="block-label">Genres</div><div class="genre-chips">${topGenres.map(item => `<div class="chip">${escapeHtml(item)}</div>`).join("")}</div></div>` : ""}
                ${topWarnings.length ? `<div class="warning-block"><div class="block-label">Warnings</div><div class="warning-chips">${topWarnings.map(item => `<div class="chip soft">${escapeHtml(item)}</div>`).join("")}</div></div>` : ""}
                ${topTags.length ? `<div class="warning-block"><div class="block-label">Extra Tags</div><div class="tag-chips">${topTags.map(item => `<div class="chip soft">${escapeHtml(item)}</div>`).join("")}</div></div>` : ""}
                <div class="card-footer">
                    <div class="footer-meta">${escapeHtml(formatRelativeUpdate(book.updated))}</div>
                    <div class="card-actions">
                        ${currentUserId && book.ownerUid !== currentUserId ? '<button class="report-card-btn" type="button">Report</button>' : ""}
                        <button class="read-btn" type="button">Read Story</button>
                    </div>
                </div>
            `;
            const openBook = () => { window.location.href = "read.html?book=" + encodeURIComponent(book.id); };
            card.addEventListener("click", openBook);
            bindAuthorLinkStopPropagation(card);
            card.querySelector(".read-btn").addEventListener("click", (e) => { e.stopPropagation(); openBook(); });
            const reportBtn = card.querySelector(".report-card-btn");
            reportBtn?.addEventListener("click", (e) => {
                e.stopPropagation();
                if (!currentUserId) {
                    window.location.href = "login.html?next=" + encodeURIComponent(window.location.href);
                    return;
                }
                openLibraryReportModal({ bookId: book.id, title: book.title, author: book.author });
            });
            bookGrid.appendChild(card);
        });
    }

    function escapeHtml(str) {
        return safeString(str).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }
    function escapeAttribute(str) { return escapeHtml(str).replaceAll("`", "&#096;"); }

    async function loadReadCountsBatchFallback(ids) {
        const { data, error } = await supabase.from("reads").select("book_id").in("book_id", ids);
        if (error) throw error;
        for (const id of ids) readCounts.set(id, 0);
        for (const row of data || []) {
            const id = row?.book_id;
            if (id) readCounts.set(id, (readCounts.get(id) || 0) + 1);
        }
    }

    async function loadReadCounts() {
        readCounts.clear();
        const ids = allBooks.map((book) => book.id).filter(Boolean);
        if (!ids.length) return;
        try {
            const { data, error } = await supabase.rpc("get_library_read_counts", {
                p_book_ids: ids,
            });
            if (error) throw error;
            for (const id of ids) readCounts.set(id, 0);
            for (const row of data || []) {
                const bookId = row?.book_id;
                const count = Number(row?.read_count);
                if (bookId) readCounts.set(bookId, Number.isFinite(count) ? count : 0);
            }
        } catch (err) {
            const msg = String(err?.message || err || "");
            if (/function.*does not exist|get_library_read_counts/i.test(msg)) {
                console.warn("Read-count RPC unavailable — using single batch query.", err);
            } else {
                console.warn("Read-count RPC failed — using single batch query.", err);
            }
            try {
                await loadReadCountsBatchFallback(ids);
            } catch (fallbackErr) {
                console.warn("Could not load library read counts.", fallbackErr);
            }
        }
    }

    async function loadBooks() {
        showState("loading");
        resultsText.textContent = "Loading stories...";
        try {
            try {
                await processDueChapterReleases();
            } catch (releaseErr) {
                console.warn("Could not process scheduled chapter releases.", releaseErr);
            }
            const { data, error } = await supabase
                .from("library_catalog")
                .select("*");

            if (error && /library_catalog|relation.*does not exist/i.test(String(error.message || error))) {
                const fallback = await supabase.from("library").select("*");
                if (fallback.error) throw fallback.error;
                allBooks = (fallback.data || []).map(normalizeBook).filter(book => book.id);
            } else {
                if (error) throw error;
                allBooks = (data || []).map(normalizeBook).filter(book => book.id);
            }
            await Promise.all([loadReadCounts(), loadAuthorUsernames()]);
            renderBooks();
        } catch (error) {
            console.error(error);
            showState("error");
            resultsText.textContent = "Library unavailable";
        }
    }

    navButtons.forEach(btn => {
        btn.addEventListener("click", () => {
            navButtons.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentFilter = btn.dataset.filter || "fiction";
            renderBooks();
        });
    });

    searchInput.addEventListener("input", renderBooks);
    refreshBtn.addEventListener("click", loadBooks);

    await loadCurrentUser();
    await loadBooks();
</script></body>
</html>
