<!DOCTYPE html>
<html>
<head>

    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020b18" media="(prefers-color-scheme: dark)">

    <title>Login - Alysum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        try {
            var __g = localStorage.getItem("alysum-gradient-theme");
            if (__g && __g !== "classic") {
                document.documentElement.setAttribute("data-gradient-theme", __g);
            }
        } catch (e) {}
    </script>

    <link rel="stylesheet" href="css/site-responsive.css?v=1" />

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--login-page-bg);
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #4c1d95;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #6d28d9;
            color: white;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }

        button:active { transform: scale(0.97); }

        .signup-link {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
        }

        .signup-link a {
            color: #6d28d9;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a.is-busy {
            pointer-events: none;
            opacity: 0.65;
        }

        #success-msg {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
            color: #14532d;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
        }

        #success-msg.visible { display: block; }

        #error-msg {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
            color: #7f1d1d;
            background: #fee2e2;
            border: 1px solid #fecaca;
        }

        #error-msg.visible { display: block; }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 14px;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .btn-oauth {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            background: #fff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .btn-oauth svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .btn-oauth-discord svg {
            fill: #5865f2;
        }

        .support-footnote {
            margin: 18px 0 0;
            text-align: center;
            font-size: 12px;
            line-height: 1.45;
            color: #64748b;
        }

        .support-footnote a {
            color: #6d28d9;
            font-weight: 600;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-left: max(12px, env(safe-area-inset-left, 0px));
                padding-right: max(12px, env(safe-area-inset-right, 0px));
                padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
            }
        }
    </style>

    <link rel="stylesheet" href="css/gradient-themes.css?v=3" />
    <script src="js/gradient-theme-sync.js" defer></script>
</head>

<body>

<div class="card">
    <h2>Welcome Back</h2>

    <button type="button" id="google-btn" class="btn-oauth" aria-label="Sign in with Google">
        Continue with Google
    </button>

    <button type="button" id="discord-btn" class="btn-oauth btn-oauth-discord" aria-label="Sign in with Discord">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20.317 4.369A19.791 19.791 0 0 0 16.558 3a13.74 13.74 0 0 0-.481.974 18.27 18.27 0 0 0-4.154 0A12.64 12.64 0 0 0 11.442 3a19.736 19.736 0 0 0-3.76 1.37C5.303 7.91 4.657 11.36 4.98 14.76a19.9 19.9 0 0 0 4.607 2.339c.37-.504.701-1.04.984-1.602a12.83 12.83 0 0 1-1.55-.744c.13-.095.258-.193.382-.294 2.987 1.38 6.226 1.38 9.177 0 .125.101.253.199.383.294-.494.29-1.013.54-1.553.745.283.56.612 1.097.984 1.601A19.86 19.86 0 0 0 23 14.76c.378-3.953-.646-7.371-2.683-10.391ZM10.19 12.67c-.897 0-1.635-.826-1.635-1.842 0-1.016.723-1.843 1.635-1.843.92 0 1.65.834 1.635 1.843 0 1.016-.723 1.842-1.635 1.842Zm6.19 0c-.897 0-1.635-.826-1.635-1.842 0-1.016.723-1.843 1.635-1.843.92 0 1.65.834 1.635 1.843 0 1.016-.715 1.842-1.635 1.842Z" />
        </svg>
        Continue with Discord
    </button>

    <div class="auth-divider" role="presentation"><span>or with email</span></div>

    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button type="button" id="login-btn" onclick="login()">Enter Studio</button>

    <p id="success-msg" role="status"></p>
    <p id="error-msg" role="alert"></p>

    <div class="signup-link">
        <a href="#" id="forgot-link">Forgot password?</a>
    </div>

    <div class="signup-link">
        New here? <a href="signup.html">Create account</a>
    </div>

    <p class="support-footnote" id="support-footnote">
        Questions or no email after a reset?
        <a href="mailto:alysum.support@gmail.com">alysum.support@gmail.com</a>
    </p>
</div>

<script type="module">
import { supabase } from "./firebase.js";
import { homeUrlForUserData } from "./js/account-mode.js?v=1";
import { authRedirectUrl } from "./js/auth-redirect.js?v=1";
import { wireSupabaseSession } from "./js/supabase-session.js?v=1";

const OAUTH_PENDING_KEY = "alysum-oauth-pending";
let oauthRedirectHandled = false;

const errorEl = document.getElementById("error-msg");
const successEl = document.getElementById("success-msg");
const loginBtn = document.getElementById("login-btn");
const googleBtn = document.getElementById("google-btn");
const discordBtn = document.getElementById("discord-btn");
const forgotLink = document.getElementById("forgot-link");

const oauthButtons = [googleBtn, discordBtn];

function setOAuthButtonsDisabled(disabled) {
    for (const btn of oauthButtons) {
        btn.disabled = disabled;
    }
}

function showError(text) {
    successEl.textContent = "";
    successEl.classList.remove("visible");
    errorEl.textContent = text;
    errorEl.classList.add("visible");
}

function clearError() {
    errorEl.textContent = "";
    errorEl.classList.remove("visible");
}

function showSuccess(text) {
    clearError();
    successEl.textContent = text;
    successEl.classList.add("visible");
}

function clearSuccess() {
    successEl.textContent = "";
    successEl.classList.remove("visible");
}

function authMessage(message) {
    if (!message) return "Sign-in failed.";

    const lower = message.toLowerCase();

    if (lower.includes("invalid login") || lower.includes("invalid credentials")) {
        return "Email or password is incorrect.";
    }

    if (lower.includes("email not confirmed")) {
        return "Check your email and confirm your account before logging in.";
    }

    if (lower.includes("network")) {
        return "Network error. Check your connection and try again.";
    }

    return message;
}

const RESET_EMAIL_COOLDOWN_MS = 60 * 60 * 1000;
const RESET_EMAIL_COOLDOWN_PREFIX = "alysum-reset-email-until:";

function isAuthEmailRateLimitError(errorOrMessage) {
    const err =
        errorOrMessage && typeof errorOrMessage === "object"
            ? errorOrMessage
            : { message: errorOrMessage };
    if (err.code === "over_email_send_rate_limit") return true;
    const lower = String(err.message || "").toLowerCase();
    return (
        lower.includes("rate limit") ||
        lower.includes("too many requests") ||
        lower.includes("email rate") ||
        lower.includes("rate exceeded")
    );
}

function resetCooldownKey(email) {
    return RESET_EMAIL_COOLDOWN_PREFIX + email.trim().toLowerCase();
}

function resetEmailCooldownRemainingMs(email) {
    try {
        const until = Number(localStorage.getItem(resetCooldownKey(email)) || 0);
        return Math.max(0, until - Date.now());
    } catch {
        return 0;
    }
}

function markResetEmailSent(email) {
    try {
        localStorage.setItem(
            resetCooldownKey(email),
            String(Date.now() + RESET_EMAIL_COOLDOWN_MS)
        );
    } catch {
        /* ignore */
    }
}

function resetEmailCooldownMessage(remainingMs) {
    const minutes = Math.max(1, Math.ceil(remainingMs / 60000));
    return `A reset email was sent recently. Wait about ${minutes} minute${minutes === 1 ? "" : "s"}, then try once. For help: alysum.support@gmail.com`;
}

function resetEmailMessage(errorOrMessage) {
    if (isAuthEmailRateLimitError(errorOrMessage)) {
        return "Too many auth emails were sent from Alysum this hour (Supabase project limit). Wait about an hour, then try once — or email alysum.support@gmail.com for help.";
    }

    const message =
        errorOrMessage && typeof errorOrMessage === "object"
            ? errorOrMessage.message
            : errorOrMessage;
    if (!message) return "Could not send reset email.";

    const lower = message.toLowerCase();

    if (lower.includes("redirect") || lower.includes("invalid")) {
        return "Reset is not configured yet. Email alysum.support@gmail.com and we will reset your password.";
    }

    return message;
}

/** Same-origin navigation only; supports root-relative and same-folder relative ?next= values. */
function resolveInternalRedirect(next) {
    if (!next || typeof next !== "string") return null;
    if (next.startsWith("//")) return null;
    try {
        const resolved = new URL(next, window.location.href);
        if (resolved.origin !== window.location.origin) return null;
        return resolved.href;
    } catch {
        return null;
    }
}

async function redirectAfterLogin() {
    const params = new URLSearchParams(window.location.search);
    let next = params.get("next");
    const oauthReturn =
        (window.location.hash && window.location.hash.length > 2) ||
        !!params.get("code");
    if (!next && oauthReturn) {
        try {
            next = sessionStorage.getItem("alysum-login-next");
            if (next) sessionStorage.removeItem("alysum-login-next");
        } catch {
            /* ignore */
        }
    }
    const safe = resolveInternalRedirect(next);

    if (safe) {
        window.location.href = safe;
        return;
    }

    const { data: userData } = await supabase.auth.getUser();
    const user = userData && userData.user;

    if (!user) {
        window.location.href = "studio.html";
        return;
    }

    try {
        const { data, error } = await supabase
            .from("users")
            .select("*")
            .eq("id", user.id)
            .single();

        if (error || !data) {
            window.location.href = "studio.html";
            return;
        }

        const firebaseStyleData = {
            username: data.username,
            displayName: data.display_name,
            accountType: data.account_type,
            words: data.words,
            books: data.books,
            streak: data.streak,
            dailyWordGoal: data.daily_word_goal,
            writingDayTotals: data.writing_day_totals || {}
        };

        window.location.href = homeUrlForUserData(firebaseStyleData);
    } catch (e) {
        console.error(e);
        window.location.href = "studio.html";
    }
}

async function goToStudioAfterAuth() {
    if (oauthRedirectHandled || isRecoveryLanding) return;
    oauthRedirectHandled = true;
    try {
        sessionStorage.removeItem(OAUTH_PENDING_KEY);
    } catch {
        /* ignore */
    }
    await redirectAfterLogin();
}

async function startOAuth(provider) {
    clearSuccess();
    clearError();

    setOAuthButtonsDisabled(true);
    loginBtn.disabled = true;

    try {
        sessionStorage.setItem(OAUTH_PENDING_KEY, "1");
        const p = new URLSearchParams(window.location.search);
        const next = p.get("next");
        if (resolveInternalRedirect(next)) {
            sessionStorage.setItem("alysum-login-next", next);
        } else {
            sessionStorage.removeItem("alysum-login-next");
        }
    } catch {
        /* ignore */
    }

    const { error } = await supabase.auth.signInWithOAuth({
        provider,
        options: {
            redirectTo: authRedirectUrl("login.html")
        }
    });

    if (error) {
        try {
            sessionStorage.removeItem(OAUTH_PENDING_KEY);
        } catch {
            /* ignore */
        }
        showError(error.message);
        setOAuthButtonsDisabled(false);
        loginBtn.disabled = false;
    }
}

googleBtn.addEventListener("click", () => startOAuth("google"));
discordBtn.addEventListener("click", () => startOAuth("discord"));

const isRecoveryLanding = (window.location.hash || "").includes("type=recovery");
if (isRecoveryLanding) {
    window.location.replace(
        authRedirectUrl("reset-password.html") + (window.location.hash || "")
    );
}

function isOAuthReturn() {
    const hash = window.location.hash || "";
    if (hash.includes("type=recovery")) return false;
    const params = new URLSearchParams(window.location.search);
    return hash.length > 2 || !!params.get("code");
}

function hasOAuthPending() {
    try {
        return sessionStorage.getItem(OAUTH_PENDING_KEY) === "1";
    } catch {
        return false;
    }
}

/** Only leave login automatically after OAuth return or a fresh sign-in — not an old saved session. */
function shouldAutoLeaveLogin(session, event) {
    if (!session || event === "SIGNED_OUT") return false;
    if (event === "SIGNED_IN") return true;
    return hasOAuthPending() || isOAuthReturn();
}

const resetParams = new URLSearchParams(window.location.search);
if (resetParams.get("reset") === "success") {
    showSuccess("Password updated. Sign in with your new password.");
}

if (!isRecoveryLanding) {
    if (!isOAuthReturn()) {
        try {
            sessionStorage.removeItem(OAUTH_PENDING_KEY);
        } catch {
            /* ignore */
        }
    }

    wireSupabaseSession(async (session, event) => {
        if (!shouldAutoLeaveLogin(session, event)) return;
        await goToStudioAfterAuth();
    });

    if (isOAuthReturn()) {
        void (async () => {
            for (let i = 0; i < 50; i++) {
                if (oauthRedirectHandled) return;
                const { data } = await supabase.auth.getSession();
                if (data.session) {
                    await goToStudioAfterAuth();
                    return;
                }
                await new Promise((resolve) => setTimeout(resolve, 200));
            }
            if (!oauthRedirectHandled) {
                showError(
                    "Sign-in did not finish. Try again, or use email login."
                );
            }
        })();
    }
}

let resetInFlight = false;

forgotLink.addEventListener("click", async (e) => {
    e.preventDefault();

    if (resetInFlight) return;

    const email = document.getElementById("email").value.trim();

    if (!email) {
        showError("Enter your email address, then tap Forgot password.");
        return;
    }

    clearError();
    clearSuccess();

    const cooldownMs = resetEmailCooldownRemainingMs(email);
    if (cooldownMs > 0) {
        showError(resetEmailCooldownMessage(cooldownMs));
        return;
    }

    resetInFlight = true;
    forgotLink.classList.add("is-busy");

    try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: authRedirectUrl("reset-password.html")
        });

        if (error) {
            showError(resetEmailMessage(error));
            return;
        }

        markResetEmailSent(email);
        showSuccess("If that address has an account, a reset email was sent. Check spam and Promotions too.");
    } catch (err) {
        showError(resetEmailMessage(err));
    } finally {
        resetInFlight = false;
        forgotLink.classList.remove("is-busy");
    }
});

let loginInFlight = false;

window.login = async function () {
    if (loginInFlight) return;

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        showError("Enter email and password.");
        return;
    }

    clearSuccess();
    clearError();

    loginInFlight = true;
    loginBtn.disabled = true;
    setOAuthButtonsDisabled(true);

    try {
        const { error } = await supabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            showError(authMessage(error.message));
            return;
        }

        await redirectAfterLogin();
    } catch (e) {
        showError((e && e.message) || "Sign-in failed.");
    } finally {
        loginInFlight = false;
        loginBtn.disabled = false;
        setOAuthButtonsDisabled(false);
    }
};

document.getElementById("password").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") {
        ev.preventDefault();
        window.login();
    }
});
</script>

</body>
</html>
