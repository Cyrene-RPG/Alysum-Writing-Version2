<!DOCTYPE html>
<html>
<head>
    <!-- ALYSUM:PWA:START -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020b18" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="dark light">
    <meta name="application-name" content="Alysum">
    <meta name="msapplication-TileColor" content="#7c3aed">
    <meta name="msapplication-TileImage" content="Alysum-3.png">
    <link rel="icon" type="image/png" sizes="any" href="Alysum-3.png">
    <link rel="apple-touch-icon" href="Alysum-3.png">
    <link rel="apple-touch-icon" sizes="180x180" href="Alysum-3.png">
    <script src="js/pwa-register.js" defer></script>
    <!-- ALYSUM:PWA:END -->
    <!-- ALYSUM:ANALYTICS:START -->
    <script type="module" src="js/vercel-analytics.js"></script>
    <!-- ALYSUM:ANALYTICS:END -->



    <title>Login - Alysum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        try {
            var __g = localStorage.getItem("alysum-gradient-theme");
            if (__g && __g !== "classic") {
                document.documentElement.setAttribute("data-gradient-theme", __g);
            }
        } catch (e) {}
    </script>

    <link rel="stylesheet" href="css/site-responsive.css?v=1" />

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--login-page-bg);
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #4c1d95;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #6d28d9;
            color: white;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }

        button:active { transform: scale(0.97); }

        .signup-link {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
        }

        .signup-link a {
            color: #6d28d9;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a.is-busy {
            pointer-events: none;
            opacity: 0.65;
        }

        #success-msg {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
            color: #14532d;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
        }

        #success-msg.visible { display: block; }

        #error-msg {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
            color: #7f1d1d;
            background: #fee2e2;
            border: 1px solid #fecaca;
        }

        #error-msg.visible { display: block; }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 14px;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .btn-oauth {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            background: #fff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .support-footnote {
            margin: 18px 0 0;
            text-align: center;
            font-size: 12px;
            line-height: 1.45;
            color: #64748b;
        }

        .support-footnote a {
            color: #6d28d9;
            font-weight: 600;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-left: max(12px, env(safe-area-inset-left, 0px));
                padding-right: max(12px, env(safe-area-inset-right, 0px));
                padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
            }
        }
    </style>

    <link rel="stylesheet" href="css/gradient-themes.css?v=2" />
</head>

<body>

<div class="card">
    <h2>Welcome Back</h2>

    <button type="button" id="google-btn" class="btn-oauth" aria-label="Sign in with Google">
        Continue with Google
    </button>

    <div class="auth-divider" role="presentation"><span>or with email</span></div>

    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button type="button" id="login-btn" onclick="login()">Enter Studio</button>

    <p id="success-msg" role="status"></p>
    <p id="error-msg" role="alert"></p>

    <div class="signup-link">
        <a href="#" id="forgot-link">Forgot password?</a>
    </div>

    <div class="signup-link">
        New here? <a href="signup.html">Create account</a>
    </div>

    <p class="support-footnote" id="support-footnote">
        Questions or no email after a reset?
        <a href="mailto:alysum.support@gmail.com">alysum.support@gmail.com</a>
    </p>
</div>

<script type="module">
import { supabase } from "./firebase.js";
import { homeUrlForUserData } from "./js/account-mode.js?v=1";

const errorEl = document.getElementById("error-msg");
const successEl = document.getElementById("success-msg");
const loginBtn = document.getElementById("login-btn");
const googleBtn = document.getElementById("google-btn");
const forgotLink = document.getElementById("forgot-link");

function showError(text) {
    successEl.textContent = "";
    successEl.classList.remove("visible");
    errorEl.textContent = text;
    errorEl.classList.add("visible");
}

function clearError() {
    errorEl.textContent = "";
    errorEl.classList.remove("visible");
}

function showSuccess(text) {
    clearError();
    successEl.textContent = text;
    successEl.classList.add("visible");
}

function clearSuccess() {
    successEl.textContent = "";
    successEl.classList.remove("visible");
}

function authMessage(message) {
    if (!message) return "Sign-in failed.";

    const lower = message.toLowerCase();

    if (lower.includes("invalid login") || lower.includes("invalid credentials")) {
        return "Email or password is incorrect.";
    }

    if (lower.includes("email not confirmed")) {
        return "Check your email and confirm your account before logging in.";
    }

    if (lower.includes("network")) {
        return "Network error. Check your connection and try again.";
    }

    return message;
}

/** Same-origin navigation only; supports root-relative and same-folder relative ?next= values. */
function resolveInternalRedirect(next) {
    if (!next || typeof next !== "string") return null;
    if (next.startsWith("//")) return null;
    try {
        const resolved = new URL(next, window.location.href);
        if (resolved.origin !== window.location.origin) return null;
        return resolved.href;
    } catch {
        return null;
    }
}

async function redirectAfterLogin() {
    const params = new URLSearchParams(window.location.search);
    let next = params.get("next");
    const oauthReturn =
        (window.location.hash && window.location.hash.length > 2) ||
        !!params.get("code");
    if (!next && oauthReturn) {
        try {
            next = sessionStorage.getItem("alysum-login-next");
            if (next) sessionStorage.removeItem("alysum-login-next");
        } catch {
            /* ignore */
        }
    }
    const safe = resolveInternalRedirect(next);

    if (safe) {
        window.location.href = safe;
        return;
    }

    const { data: userData } = await supabase.auth.getUser();
    const user = userData && userData.user;

    if (!user) {
        window.location.href = "studio.html";
        return;
    }

    try {
        const { data, error } = await supabase
            .from("users")
            .select("*")
            .eq("id", user.id)
            .single();

        if (error || !data) {
            window.location.href = "studio.html";
            return;
        }

        const firebaseStyleData = {
            username: data.username,
            displayName: data.display_name,
            accountType: data.account_type,
            words: data.words,
            books: data.books,
            streak: data.streak,
            dailyWordGoal: data.daily_word_goal,
            writingDayTotals: data.writing_day_totals || {}
        };

        window.location.href = homeUrlForUserData(firebaseStyleData);
    } catch (e) {
        console.error(e);
        window.location.href = "studio.html";
    }
}

googleBtn.addEventListener("click", async () => {
    clearSuccess();
    clearError();

    googleBtn.disabled = true;
    loginBtn.disabled = true;

    try {
        const p = new URLSearchParams(window.location.search);
        const next = p.get("next");
        if (resolveInternalRedirect(next)) {
            sessionStorage.setItem("alysum-login-next", next);
        } else {
            sessionStorage.removeItem("alysum-login-next");
        }
    } catch {
        /* ignore */
    }

    const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: {
            redirectTo: new URL("login.html", window.location.href).href
        }
    });

    if (error) {
        showError(error.message);
        googleBtn.disabled = false;
        loginBtn.disabled = false;
    }
});

const isRecoveryLanding = (window.location.hash || "").includes("type=recovery");
if (isRecoveryLanding) {
    window.location.replace(
        new URL("reset-password.html" + window.location.hash, window.location.href).href
    );
}

function isOAuthReturn() {
    const hash = window.location.hash || "";
    if (hash.includes("type=recovery")) return false;
    const params = new URLSearchParams(window.location.search);
    return hash.length > 2 || !!params.get("code");
}

const resetParams = new URLSearchParams(window.location.search);
if (resetParams.get("reset") === "success") {
    showSuccess("Password updated. Sign in with your new password.");
}

const { data: sessionData } = await supabase.auth.getSession();

if (!isRecoveryLanding && sessionData && sessionData.session && isOAuthReturn()) {
    await redirectAfterLogin();
}

let resetInFlight = false;

forgotLink.addEventListener("click", async (e) => {
    e.preventDefault();

    if (resetInFlight) return;

    const email = document.getElementById("email").value.trim();

    if (!email) {
        showError("Enter your email address, then tap Forgot password.");
        return;
    }

    clearError();
    clearSuccess();

    resetInFlight = true;
    forgotLink.classList.add("is-busy");

    try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: new URL("reset-password.html", window.location.href).href
        });

        if (error) {
            showError(error.message);
            return;
        }

        showSuccess("If that address has an account, a reset email was sent. Check spam and Promotions too.");
    } catch (err) {
        showError((err && err.message) || "Could not send reset email.");
    } finally {
        resetInFlight = false;
        forgotLink.classList.remove("is-busy");
    }
});

let loginInFlight = false;

window.login = async function () {
    if (loginInFlight) return;

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        showError("Enter email and password.");
        return;
    }

    clearSuccess();
    clearError();

    loginInFlight = true;
    loginBtn.disabled = true;
    googleBtn.disabled = true;

    try {
        const { error } = await supabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            showError(authMessage(error.message));
            return;
        }

        await redirectAfterLogin();
    } catch (e) {
        showError((e && e.message) || "Sign-in failed.");
    } finally {
        loginInFlight = false;
        loginBtn.disabled = false;
        googleBtn.disabled = false;
    }
};

document.getElementById("password").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") {
        ev.preventDefault();
        window.login();
    }
});
</script>

</body>
</html>
