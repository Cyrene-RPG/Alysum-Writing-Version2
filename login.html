<!DOCTYPE html>
<html>
<head>
    <title>Login - Alysum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        try {
            var __g = localStorage.getItem("alysum-gradient-theme");
            if (__g && __g !== "classic") document.documentElement.setAttribute("data-gradient-theme", __g);
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="/css/site-responsive.css?v=1" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--login-page-bg);
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #4c1d95;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #6d28d9;
            color: white;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.97);
        }

        .signup-link {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
        }

        .signup-link a {
            color: #6d28d9;
            text-decoration: none;
            font-weight: 600;
        }

        #error-msg {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
            color: #7f1d1d;
            background: #fee2e2;
            border: 1px solid #fecaca;
        }

        #error-msg.visible {
            display: block;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-left: max(12px, env(safe-area-inset-left, 0px));
                padding-right: max(12px, env(safe-area-inset-right, 0px));
                padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
    <link rel="stylesheet" href="/css/gradient-themes.css?v=2" />
</head>

<body>

<div class="card">
    <h2>Welcome Back</h2>

    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button type="button" id="login-btn" onclick="login()">Enter Studio</button>
    <p id="error-msg" role="alert"></p>

    <div class="signup-link">
        New here? <a href="/signup.html">Create account</a>
    </div>
</div>

<script type="module">
import { auth } from "./firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const errorEl = document.getElementById("error-msg");
const loginBtn = document.getElementById("login-btn");

function showError(text) {
    errorEl.textContent = text;
    errorEl.classList.add("visible");
}

function clearError() {
    errorEl.textContent = "";
    errorEl.classList.remove("visible");
}

function authMessage(code) {
    switch (code) {
        case "auth/too-many-requests":
            return "Too many sign-in attempts. Wait 15–30 minutes before trying again, or try from another network if you were testing with the wrong password.";
        case "auth/wrong-password":
        case "auth/invalid-credential":
        case "auth/invalid-login-credentials":
            return "Email or password is incorrect.";
        case "auth/user-not-found":
            return "No account found for this email.";
        case "auth/user-disabled":
            return "This account has been disabled.";
        case "auth/invalid-email":
            return "That email address does not look valid.";
        case "auth/network-request-failed":
            return "Network error. Check your connection and try again.";
        default:
            return null;
    }
}

let loginInFlight = false;
let cooldownUntil = 0;

window.login = async function () {
    if (loginInFlight) return;
    if (Date.now() < cooldownUntil) {
        const s = Math.ceil((cooldownUntil - Date.now()) / 1000);
        showError(`Please wait ${s}s before trying again.`);
        return;
    }

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        showError("Enter email and password.");
        return;
    }

    clearError();
    loginInFlight = true;
    loginBtn.disabled = true;

    try {
        await signInWithEmailAndPassword(auth, email, password);
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next");
        const safe =
            next && next.startsWith("/") && !next.startsWith("//") ? next : "/studio.html";
        window.location.href = safe;
    } catch (e) {
        const code = e && e.code;
        const friendly = authMessage(code) || (e && e.message) || "Sign-in failed.";
        showError(friendly);
        if (code === "auth/too-many-requests") {
            cooldownUntil = Date.now() + 90_000;
        }
    } finally {
        loginInFlight = false;
        loginBtn.disabled = false;
    }
};

document.getElementById("password").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") {
        ev.preventDefault();
        window.login();
    }
});
</script>

</body>
</html>
