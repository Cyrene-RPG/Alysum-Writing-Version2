<!DOCTYPE html>
<html>
<head>
    <!-- ALYSUM:PWA:START -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020b18" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="dark light">
    <meta name="application-name" content="Alysum">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Alysum">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#7c3aed">
    <meta name="msapplication-TileImage" content="/Alysum-3.png">
    <link rel="icon" type="image/png" sizes="any" href="/Alysum-3.png">
    <link rel="apple-touch-icon" href="/Alysum-3.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/Alysum-3.png">
    <script src="/js/pwa-register.js" defer></script>
    <!-- ALYSUM:PWA:END -->
    <title>Login - Alysum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        try {
            var __g = localStorage.getItem("alysum-gradient-theme");
            if (__g && __g !== "classic") document.documentElement.setAttribute("data-gradient-theme", __g);
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="/css/site-responsive.css?v=1" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--login-page-bg);
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #4c1d95;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #6d28d9;
            color: white;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.97);
        }

        .signup-link {
            text-align: center;
            margin-top: 14px;
            font-size: 14px;
        }

        .signup-link a {
            color: #6d28d9;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a.is-busy {
            pointer-events: none;
            opacity: 0.65;
        }

        #success-msg {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
            color: #14532d;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
        }

        #success-msg.visible {
            display: block;
        }

        #error-msg {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
            color: #7f1d1d;
            background: #fee2e2;
            border: 1px solid #fecaca;
        }

        #error-msg.visible {
            display: block;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 14px;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .btn-oauth {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            background: #fff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .btn-oauth:first-of-type {
            margin-top: 0;
        }

        .btn-oauth svg {
            flex-shrink: 0;
        }

        .btn-oauth:disabled {
            opacity: 0.65;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-left: max(12px, env(safe-area-inset-left, 0px));
                padding-right: max(12px, env(safe-area-inset-right, 0px));
                padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
    <link rel="stylesheet" href="/css/gradient-themes.css?v=2" />
</head>

<body>

<div class="card">
    <h2>Welcome Back</h2>

    <button type="button" id="google-btn" class="btn-oauth" aria-label="Sign in with Google">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="22" height="22" aria-hidden="true">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
            <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.94 11.94 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
        </svg>
        Continue with Google
    </button>

    <div class="auth-divider" role="presentation"><span>or with email</span></div>

    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button type="button" id="login-btn" onclick="login()">Enter Studio</button>
    <p id="success-msg" role="status"></p>
    <p id="error-msg" role="alert"></p>

    <div class="signup-link">
        <a href="#" id="forgot-link">Forgot password?</a>
    </div>
    <div class="signup-link">
        New here? <a href="/signup.html">Create account</a>
    </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { homeUrlForUserData } from "./js/account-mode.js?v=1";
import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    GoogleAuthProvider,
    signInWithPopup,
    signInWithRedirect,
    getRedirectResult,
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const errorEl = document.getElementById("error-msg");
const successEl = document.getElementById("success-msg");
const loginBtn = document.getElementById("login-btn");
const googleBtn = document.getElementById("google-btn");
const forgotLink = document.getElementById("forgot-link");

const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: "select_account" });

function showError(text) {
    successEl.textContent = "";
    successEl.classList.remove("visible");
    errorEl.textContent = text;
    errorEl.classList.add("visible");
}

function clearError() {
    errorEl.textContent = "";
    errorEl.classList.remove("visible");
}

function showSuccess(text) {
    clearError();
    successEl.textContent = text;
    successEl.classList.add("visible");
}

function clearSuccess() {
    successEl.textContent = "";
    successEl.classList.remove("visible");
}

function authMessage(code) {
    switch (code) {
        case "auth/too-many-requests":
            return "Too many sign-in attempts. Wait 15–30 minutes before trying again, or try from another network if you were testing with the wrong password.";
        case "auth/wrong-password":
        case "auth/invalid-credential":
        case "auth/invalid-login-credentials":
            return "Email or password is incorrect.";
        case "auth/user-not-found":
            return "No account found for this email.";
        case "auth/user-disabled":
            return "This account has been disabled.";
        case "auth/invalid-email":
            return "That email address does not look valid.";
        case "auth/network-request-failed":
            return "Network error. Check your connection and try again.";
        case "auth/missing-email":
            return "Enter your email address first.";
        case "auth/operation-not-allowed":
            return "This sign-in method is turned off in Firebase. Enable it under Authentication → Sign-in method.";
        case "auth/popup-closed-by-user":
        case "auth/cancelled-popup-request":
            return "Sign-in was cancelled. Try again when you are ready.";
        case "auth/popup-blocked":
            return "Your browser blocked the sign-in popup. Allow popups for this site or try again.";
        case "auth/account-exists-with-different-credential":
            return "This email is already registered with a different sign-in method. Try email and password, or the provider you used before.";
        case "auth/web-storage-unsupported":
            return "This browser blocks storage needed for sign-in. Try a normal (non-private) window or another browser.";
        case "auth/internal-error":
            return "Sign-in had an internal error. For Google, check OAuth consent in Google Cloud for this Firebase project.";
        case "auth/unauthorized-domain":
            return "This website’s domain is not allowed for sign-in yet. In Firebase Console go to Authentication → Settings → Authorized domains, and add the exact host from your address bar (for example www.yoursite.com or your-preview-url.web.app).";
        case "auth/unauthorized-continue-uri":
        case "auth/invalid-continue-uri":
            return "This site’s address is not allowed for that link. In Firebase Console → Authentication → Settings, add this exact domain under Authorized domains (include localhost if you test locally).";
        case "auth/missing-continue-uri":
            return "Password reset could not build a valid return link. Open the login page over http(s), not as a saved file.";
        default:
            return null;
    }
}

/** Continue URL in the reset email; domain must be listed under Authentication → Settings → Authorized domains. */
function passwordResetActionCodeSettings() {
    if (typeof window === "undefined" || window.location.protocol === "file:") {
        return undefined;
    }
    const origin = window.location.origin;
    if (!origin || origin === "null") {
        return undefined;
    }
    return {
        url: `${origin}/login.html`,
        handleCodeInApp: false,
    };
}

let resetInFlight = false;

forgotLink.addEventListener("click", async (e) => {
    e.preventDefault();
    if (resetInFlight) return;

    const email = document.getElementById("email").value.trim();
    if (!email) {
        showError("Enter your email address, then tap Forgot password.");
        return;
    }

    clearError();
    clearSuccess();
    resetInFlight = true;
    forgotLink.classList.add("is-busy");

    try {
        const actionCodeSettings = passwordResetActionCodeSettings();
        if (actionCodeSettings) {
            await sendPasswordResetEmail(auth, email, actionCodeSettings);
        } else {
            await sendPasswordResetEmail(auth, email);
        }
        showSuccess(
            "If that email is on file, a reset link usually arrives within a few minutes. Check spam and promotions. Use the exact address you use to sign in with email and password."
        );
    } catch (err) {
        const code = err && err.code;
        const friendly = authMessage(code) || (err && err.message) || "Could not send reset email.";
        showError(friendly);
    } finally {
        resetInFlight = false;
        forgotLink.classList.remove("is-busy");
    }
});

async function redirectAfterLogin() {
    const params = new URLSearchParams(window.location.search);
    const next = params.get("next");
    const safe =
        next && next.startsWith("/") && !next.startsWith("//") ? next : null;
    if (safe) {
        window.location.href = safe;
        return;
    }
    const user = auth.currentUser;
    if (!user) {
        window.location.href = "/studio.html";
        return;
    }
    try {
        const snap = await getDoc(doc(db, "users", user.uid));
        const data = snap.exists() ? snap.data() || {} : {};
        window.location.href = homeUrlForUserData(data);
    } catch (e) {
        console.error(e);
        window.location.href = "/studio.html";
    }
}

/** After signInWithRedirect, Firebase sends the user back here; finish sign-in. */
getRedirectResult(auth)
    .then(async (result) => {
        if (result && result.user) {
            await redirectAfterLogin();
        }
    })
    .catch((err) => {
        const code = err && err.code;
        if (!code) return;
        const friendly = authMessage(code) || (err && err.message);
        if (friendly) showError(friendly);
    });

let googleLoginInFlight = false;

googleBtn.addEventListener("click", async () => {
    if (googleLoginInFlight || loginInFlight) return;

    clearSuccess();
    clearError();
    googleLoginInFlight = true;
    googleBtn.disabled = true;
    loginBtn.disabled = true;

    try {
        await signInWithPopup(auth, googleProvider);
        await redirectAfterLogin();
    } catch (err) {
        const code = err && err.code;
        if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") {
            clearError();
        } else if (code === "auth/popup-blocked") {
            clearError();
            try {
                await signInWithRedirect(auth, googleProvider);
            } catch (e2) {
                const c2 = e2 && e2.code;
                showError(authMessage(c2) || (e2 && e2.message) || "Could not start Google sign-in.");
            }
        } else {
            const friendly = authMessage(code) || (err && err.message) || "Google sign-in failed.";
            showError(friendly);
        }
    } finally {
        googleLoginInFlight = false;
        googleBtn.disabled = false;
        loginBtn.disabled = false;
    }
});

let loginInFlight = false;
let cooldownUntil = 0;

window.login = async function () {
    if (loginInFlight || googleLoginInFlight) return;
    if (Date.now() < cooldownUntil) {
        const s = Math.ceil((cooldownUntil - Date.now()) / 1000);
        showError(`Please wait ${s}s before trying again.`);
        return;
    }

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        showError("Enter email and password.");
        return;
    }

    clearSuccess();
    clearError();
    loginInFlight = true;
    loginBtn.disabled = true;
    googleBtn.disabled = true;

    try {
        await signInWithEmailAndPassword(auth, email, password);
        await redirectAfterLogin();
    } catch (e) {
        const code = e && e.code;
        const friendly = authMessage(code) || (e && e.message) || "Sign-in failed.";
        showError(friendly);
        if (code === "auth/too-many-requests") {
            cooldownUntil = Date.now() + 90_000;
        }
    } finally {
        loginInFlight = false;
        loginBtn.disabled = false;
        googleBtn.disabled = false;
    }
};

document.getElementById("password").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") {
        ev.preventDefault();
        window.login();
    }
});
</script>

</body>
</html>
