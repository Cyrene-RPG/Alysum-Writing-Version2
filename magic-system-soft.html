                    <img id="welcomePfpImg" alt="" hidden />
                    <span class="wd-pfp-initial" id="welcomePfpInitial" aria-hidden="true"></span>
                </div>
                <div class="wd-welcome-copy">
                    <h1 class="wd-welcome-title" id="welcomeTitle">Welcome back.</h1>
                    <p class="wd-welcome-sub is-hidden" id="welcomeSubtitle"></p>
                </div>
            </div>
        </header>
        <nav class="wd-nav-wrap" aria-label="Workspace" data-active="encyclopedia">
            <div class="wd-nav">
                <button type="button" id="navContinue">Continue writing</button>
                <span class="wd-nav-divider" aria-hidden="true"></span>
                <a href="writer-dashboard.html">Studio</a>

                <a href="beta-rooms.html">Beta rooms</a>
                <a href="author-dashboard.html" id="navAuthorStats">
                    Author stats
                    <span class="wd-nav-badge is-hidden" id="navDashBadge" aria-hidden="true">0</span>
                </a>
                <a href="world-encyclopedia.html" class="is-active">Encyclopedia</a>
                <span class="wd-nav-divider" aria-hidden="true"></span>

                <a href="index.html">Home</a>
            </div>
        </nav>
        <script type="module" src="js/workspace-nav.js?v=9"></script>


    <div class="mc-veil" aria-hidden="true"></div>
    <header class="mc-top">
        <div>
            <p class="mc-top-brand">Arcane Codex</p>
            <p class="mc-top-title">Soft Magic</p>
        </div>
        <div class="mc-top-actions">
            <span class="mc-chip">Mystery & wonder</span>
            <a class="mc-link" href="world-encyclopedia.html" data-enc-back>← Encyclopedia</a>
            <button type="button" class="mc-link" id="changeMagicType" hidden>Change approach</button>
        </div>
    </header>
    <div class="mc-body" id="codexRoot"></div>
    <script type="module">
        import { SOFT_SECTIONS, SOFT_MAGIC_INTRO } from "./js/magic-system-sections.js?v=2";
        import { mountMagicCodex, magicStorageKey } from "./js/magic-codex-ui.js?v=6";
        import { bootMagicSystemPage } from "./js/magic-system-page-boot.js?v=5";

        bootMagicSystemPage((encId) => {
        mountMagicCodex(document.getElementById("codexRoot"), {
            theme: "soft",
            sections: SOFT_SECTIONS,
            intro: SOFT_MAGIC_INTRO,
            storageKey: magicStorageKey("soft", encId),
            compileHeading: "Soft Magic System",
            linkContext: encId
                ? {
                      page: "magic-system-soft.html",
                      queryParams: { encyclopedia: encId },
                      storageKey: magicStorageKey("soft", encId),
                      sheetLabel: "Soft Magic System"
                  }
                : null
        });

        const back = document.querySelector("[data-enc-back]");
        if (encId && back) {
            back.href = "encyclopedia.html?id=" + encodeURIComponent(encId);
        }

        const changeBtn = document.getElementById("changeMagicType");
        if (encId && changeBtn) {
            changeBtn.hidden = false;
            changeBtn.addEventListener("click", () => {
                if (confirm("Pick a different magic approach? Your answers stay saved.")) {
                    location.href = "encyclopedia.html?id=" + encodeURIComponent(encId) + "&pickMagic=1";
                }
            });
        }
        });
    </script>
