<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="Alysum-3.png">
    <script src="js/pwa-register.js" defer></script>
    <script type="module" src="js/vercel-analytics.js"></script>
    <meta charset="UTF-8" />
    <title>Magic System — Arcane Codex — Alysum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/alysum-appearance-boot.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/site-responsive.css?v=1" />
    <link rel="stylesheet" href="css/gradient-themes.css?v=4" />
    <link rel="stylesheet" href="css/magic-codex.css?v=4" />
    <script src="js/gradient-theme-sync.js" defer></script>
</head>
<body class="mc-page mc-soft" id="codexBody">
    <div class="mc-veil" aria-hidden="true"></div>
    <header class="mc-top">
        <div>
            <p class="mc-top-brand">Arcane Codex</p>
            <p class="mc-top-title">Both paths open</p>
        </div>
        <div class="mc-top-actions">
            <div class="mc-mode-switch" role="group" aria-label="Soft or hard magic">
                <button type="button" class="mc-mode-seg active" data-mode="soft">Soft</button>
                <button type="button" class="mc-mode-seg" data-mode="hard">Hard</button>
            </div>
            <a class="mc-link" href="world-encyclopedia.html" data-enc-back>← Encyclopedia</a>
            <button type="button" class="mc-link" id="changeMagicType" hidden>Change approach</button>
        </div>
    </header>
    <div class="mc-body" id="codexRoot"></div>
    <script type="module">
        import {
            SOFT_SECTIONS,
            HARD_SECTIONS,
            SOFT_MAGIC_INTRO,
            HARD_MAGIC_INTRO
        } from "./js/magic-system-sections.js?v=2";
        import { mountMagicCodex, magicStorageKey } from "./js/magic-codex-ui.js?v=2";

        const encId = new URLSearchParams(location.search).get("encyclopedia");
        const body = document.getElementById("codexBody");
        const root = document.getElementById("codexRoot");
        const switcher = document.querySelector(".mc-mode-switch");

        let activeCodex = null;

        const configs = {
            soft: {
                theme: "soft",
                sections: SOFT_SECTIONS,
                intro: SOFT_MAGIC_INTRO,
                storageKey: magicStorageKey("soft", encId),
                compileHeading: "Soft Magic System"
            },
            hard: {
                theme: "hard",
                sections: HARD_SECTIONS,
                intro: HARD_MAGIC_INTRO,
                storageKey: magicStorageKey("hard", encId),
                compileHeading: "Hard Magic System"
            }
        };

        function showMode(mode) {
            activeCodex?.destroy();
            root.replaceChildren();
            activeCodex = mountMagicCodex(root, configs[mode]);
            body.classList.toggle("mc-soft", mode === "soft");
            body.classList.toggle("mc-hard", mode === "hard");
            switcher.querySelectorAll(".mc-mode-seg").forEach((btn) => {
                btn.classList.toggle("active", btn.dataset.mode === mode);
            });
            try {
                history.replaceState(null, "", "#" + mode);
            } catch (_) {}
        }

        switcher.querySelectorAll(".mc-mode-seg").forEach((btn) => {
            btn.addEventListener("click", () => {
                if (!btn.classList.contains("active")) showMode(btn.dataset.mode);
            });
        });

        const hash = (location.hash || "").replace(/^#/, "");
        showMode(hash === "hard" ? "hard" : "soft");

        window.addEventListener("hashchange", () => {
            const h = (location.hash || "").replace(/^#/, "");
            if (h === "soft" || h === "hard") showMode(h);
        });

        const back = document.querySelector("[data-enc-back]");
        if (encId && back) {
            back.href = "encyclopedia.html?id=" + encodeURIComponent(encId);
        }

        const changeBtn = document.getElementById("changeMagicType");
        if (encId && changeBtn) {
            changeBtn.hidden = false;
            changeBtn.addEventListener("click", () => {
                if (confirm("Pick a different magic approach? Your answers stay saved.")) {
                    location.href = "encyclopedia.html?id=" + encodeURIComponent(encId) + "&pickMagic=1";
                }
            });
        }
    </script>
</body>
</html>
