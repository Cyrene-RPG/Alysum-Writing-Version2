<body class="mod-page mod-console-page">
<header class="mod-topbar">
    <div class="mod-topbar-inner">
        <a class="mod-brand" href="writer-dashboard.html">Alysum <span>Support</span></a>
        <a class="mod-btn" href="moderation-dashboard.html?view=people">← People</a>
    </div>
</header>

<div class="mod-shell" id="modApp">
    <div class="mod-denied hidden" id="modDenied">
        <p class="mod-detail-empty"><a href="moderation-dashboard.html">Staff access required</a></p>
    </div>
    <div class="hidden" id="modContent">
        <div class="mod-status hidden" id="modStatus"></div>
        <div id="modUserRoot"></div>
    </div>
</div>

<script type="module">
    import { bootModerationPage } from "./js/moderation-access.js";
    import { mountUserDetail } from "./js/moderation-user-detail.js";

    const modStatus = document.getElementById("modStatus");
    const modUserRoot = document.getElementById("modUserRoot");
    const userId = new URLSearchParams(window.location.search).get("user");

    function showStatus(msg, type = "ok") {
        modStatus.textContent = msg;
        modStatus.className = "mod-status " + type;
        modStatus.classList.remove("hidden");
        if (type === "ok") setTimeout(() => modStatus.classList.add("hidden"), 4000);
    }

    const access = await bootModerationPage({ returnPath: window.location.pathname + window.location.search });
    if (access) {
        if (!userId) {
            modUserRoot.innerHTML = '<p class="mod-detail-empty">Missing user ID. <a href="moderation-dashboard.html?view=people">Back to People</a></p>';
        } else {
            try {
                const data = await mountUserDetail(userId, modUserRoot, { showStatus });
                const pageTitle = `@${data.detail.profile?.username || "user"} — Moderation`;
                window.AlysumSeo?.apply({ title: pageTitle, robots: "noindex, nofollow" });
            } catch (err) {
                modUserRoot.innerHTML = `<p class="mod-detail-empty">Could not load user: ${err.message}</p>`;
            }
        }
    }
</script>
</body>
</html>
