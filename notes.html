<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Alysum Notes</title>
  <link rel="stylesheet" href="/css/notes-app.css" />
</head>
<body>
  <header class="na-topbar">
    <div class="na-brand">
      <div class="na-badge" aria-hidden="true">N</div>
      <div class="na-title-block">
        <div class="na-title">Alysum Notes</div>
        <div class="na-sub" id="naBookLabel"></div>
      </div>
    </div>
    <div class="na-actions">
      <a class="na-btn na-btn-primary" id="naEditorLink" href="/editor.html">Open editor</a>
      <button type="button" class="na-btn" id="naNewFolder">New folder</button>
      <button type="button" class="na-btn" id="naNewNote">New note</button>
      <button type="button" class="na-btn na-btn-danger" id="naDeleteNote">Delete note</button>
    </div>
  </header>

  <div class="na-shell">
    <aside class="na-pane">
      <div class="na-search">
        <input id="naSearch" type="search" placeholder="Search vault…" autocomplete="off" />
      </div>
      <div class="na-tree" id="naTree" role="tree"></div>
    </aside>

    <main class="na-pane">
      <div class="na-editor-head">
        <input id="naNoteTitle" class="na-editor-title" type="text" placeholder="Note title" />
      </div>
      <div class="na-editor">
        <textarea id="naNoteBody" placeholder="Markdown-ish notes. Use [[wikilinks]] and #tags"></textarea>
      </div>
      <div class="na-editor-foot">
        <span id="naWordCount">0 words</span>
        <span id="naStatus">…</span>
      </div>
    </main>

    <aside class="na-pane na-right">
      <div class="na-card">
        <h3>Outgoing links</h3>
        <div class="body" id="naOutlinks"></div>
      </div>
      <div class="na-card">
        <h3>Backlinks</h3>
        <div class="body" id="naBacklinks"></div>
      </div>
      <div class="na-card">
        <h3>Tags</h3>
        <div class="body" id="naTags"></div>
      </div>
    </aside>
  </div>

  <script type="module" src="/js/notes-app.js"></script>
</body>
</html>
