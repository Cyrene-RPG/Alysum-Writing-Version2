<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alysum Notes</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0a1020;
      --bg-2: #0f172a;
      --panel: #111827;
      --panel-2: #182235;
      --panel-3: #1e293b;
      --panel-4: #243246;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --muted-2: #64748b;
      --line: rgba(255,255,255,0.08);
      --line-2: rgba(255,255,255,0.14);
      --accent: #8b5cf6;
      --accent-2: #6d28d9;
      --accent-soft: rgba(139,92,246,0.18);
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --shadow: 0 20px 50px rgba(0,0,0,0.35);
      --radius: 18px;
      --radius-sm: 12px;
      --topbar-h: 64px;
      --sidebar-w: 320px;
      --rightbar-w: 320px;
    }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at top left, rgba(139,92,246,0.10), transparent 22%),
        radial-gradient(circle at top right, rgba(59,130,246,0.08), transparent 20%),
        linear-gradient(180deg, #09101d 0%, #0b1020 100%);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body { display: flex; flex-direction: column; }
    button, input, textarea, select { font: inherit; }
    .hidden { display: none !important; }

    .app-topbar {
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      background: rgba(10, 15, 28, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      z-index: 20;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: white;
      box-shadow: 0 12px 24px rgba(109,40,217,0.35);
      flex-shrink: 0;
    }

    .brand-text { min-width: 0; }
    .brand-title {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .ghost-btn,
    .primary-btn,
    .danger-btn,
    .soft-btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 12px;
      height: 42px;
      padding: 0 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.14s ease, background 0.14s ease, border-color 0.14s ease;
    }

    .ghost-btn:hover,
    .primary-btn:hover,
    .danger-btn:hover,
    .soft-btn:hover {
      transform: translateY(-1px);
    }

    .ghost-btn.compact,
    .soft-btn.compact {
      width: 42px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: white;
      border-color: transparent;
    }

    .danger-btn {
      background: rgba(239,68,68,0.12);
      color: #fecaca;
      border-color: rgba(239,68,68,0.30);
    }

    .soft-btn {
      background: rgba(255,255,255,0.04);
    }

    .shell {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--rightbar-w);
      gap: 14px;
      padding: 14px;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      background: rgba(17,24,39,0.88);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .sidebar-top {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
      background: rgba(255,255,255,0.02);
    }

    .search-wrap { position: relative; }

    .search-input {
      width: 100%;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }

    .search-input::placeholder,
    .editor-title::placeholder {
      color: var(--muted-2);
    }

    .sidebar-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .section-label {
      padding: 0 14px;
      margin-top: 12px;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 900;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tree-scroll {
      flex: 1;
      overflow: auto;
      padding: 0 10px 12px;
    }

    .tree-group {
      margin-bottom: 8px;
    }

    .tree-folder {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      user-select: none;
      background: transparent;
    }

    .tree-folder:hover {
      background: rgba(255,255,255,0.04);
      border-color: var(--line);
    }

    .tree-folder.active {
      background: var(--accent-soft);
      border-color: rgba(139,92,246,0.28);
    }

    .tree-folder.drop-target {
      outline: 1px dashed rgba(139,92,246,0.65);
      background: rgba(139,92,246,0.10);
    }

    .tree-indent {
      margin-left: 18px;
      border-left: 1px solid rgba(255,255,255,0.05);
      padding-left: 8px;
    }

    .folder-caret {
      width: 14px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      flex-shrink: 0;
    }

    .folder-name {
      font-size: 13px;
      font-weight: 800;
      min-width: 0;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folder-badge {
      font-size: 10px;
      color: var(--muted);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .note-item {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      margin-bottom: 6px;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.14s ease;
      background: transparent;
    }

    .note-item:hover {
      background: rgba(255,255,255,0.04);
      border-color: var(--line);
      transform: translateY(-1px);
    }

    .note-item.active {
      background: var(--accent-soft);
      border-color: rgba(139,92,246,0.28);
    }

    .note-item.dragging {
      opacity: 0.45;
    }

    .note-item-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pin-dot {
      color: #fbbf24;
      font-size: 13px;
      flex-shrink: 0;
    }

    .note-item-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item-preview {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.45;
    }

    .note-item-meta {
      margin-top: 7px;
      font-size: 11px;
      color: var(--muted-2);
      font-weight: 700;
    }

    .empty-state {
      padding: 18px 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .editor-top {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
      background: rgba(255,255,255,0.02);
    }

    .editor-title {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 0 14px;
      font-size: 18px;
      font-weight: 800;
      outline: none;
    }

    .editor-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-btn {
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 0 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .editor-wrap {
      flex: 1;
      min-height: 0;
      padding: 20px;
      overflow: auto;
      background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent 120px), transparent;
      position: relative;
    }

    .editor-surface {
      min-height: 100%;
      border-radius: 18px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      padding: 24px;
      position: relative;
    }

    .editor {
      min-height: 60vh;
      outline: none;
      color: var(--text);
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .editor:empty::before {
      content: attr(data-placeholder);
      color: var(--muted-2);
    }

    .wiki-link {
      color: #a78bfa;
      cursor: pointer;
      font-weight: 800;
      text-decoration: none;
      border-bottom: 1px dashed rgba(167,139,250,0.4);
    }

    .wiki-link:hover {
      color: #d8b4fe;
    }

    .tag-highlight {
      color: #60a5fa;
      font-weight: 700;
    }

    .editor-footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      flex-wrap: wrap;
    }

    .suggestion-pop {
      position: fixed;
      width: 280px;
      max-height: 240px;
      overflow: auto;
      background: rgba(17,24,39,0.98);
      border: 1px solid var(--line-2);
      border-radius: 16px;
      box-shadow: var(--shadow);
      z-index: 200;
      padding: 8px;
      display: none;
    }

    .suggestion-pop.open {
      display: block;
    }

    .suggestion-item {
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .suggestion-item:hover,
    .suggestion-item.active {
      background: var(--accent-soft);
      border-color: rgba(139,92,246,0.28);
    }

    .suggestion-title {
      font-size: 13px;
      font-weight: 800;
    }

    .suggestion-sub {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .info-top {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
    }

    .info-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .info-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 14px;
    }

    .info-card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .info-card-title {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .stat {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
    }

    .backlink-item,
    .outlink-item,
    .tag-item,
    .search-hit {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      margin-bottom: 8px;
      cursor: pointer;
    }

    .backlink-item:hover,
    .outlink-item:hover,
    .tag-item:hover,
    .search-hit:hover {
      background: rgba(255,255,255,0.05);
    }

    .backlink-title,
    .outlink-title,
    .tag-title,
    .search-hit-title {
      font-size: 13px;
      font-weight: 800;
    }

    .backlink-preview,
    .outlink-preview,
    .tag-preview,
    .search-hit-preview {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .mobile-overlay {
      display: none;
    }

    @media (max-width: 1180px) {
      .shell {
        grid-template-columns: 300px minmax(0, 1fr);
      }

      .right-pane {
        display: none;
      }
    }

    @media (max-width: 760px) {
      .shell {
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .sidebar-pane {
        position: fixed;
        top: calc(var(--topbar-h) + 10px);
        left: 10px;
        bottom: 10px;
        width: min(88vw, 340px);
        z-index: 40;
        display: none;
      }

      .sidebar-pane.open {
        display: flex;
      }

      .mobile-overlay {
        display: none;
        position: fixed;
        inset: var(--topbar-h) 0 0 0;
        background: rgba(0,0,0,0.42);
        z-index: 30;
      }

      .mobile-overlay.open {
        display: block;
      }

      .editor-wrap {
        padding: 12px;
      }

      .editor-surface {
        padding: 16px;
      }

      .editor-footer {
        flex-direction: column;
      }

      .brand-sub {
        max-width: 120px;
      }
    }
  </style>
</head>
<body>
  <div class="mobile-overlay" id="mobileOverlay"></div>
  <div class="suggestion-pop" id="suggestionPop"></div>

  <div class="app-topbar">
    <div class="topbar-left">
      <button class="ghost-btn compact" id="toggleSidebarBtn">☰</button>
      <div class="brand">
        <div class="brand-badge">A</div>
        <div class="brand-text">
          <div class="brand-title">Alysum Notes</div>
          <div class="brand-sub" id="workspaceLabel">Connected to Firebase</div>
        </div>
      </div>
    </div>

    <div class="topbar-right">
      <button class="ghost-btn" id="copyLinkBtn">Copy [[link]]</button>
      <button class="ghost-btn" id="duplicateBtn">Duplicate</button>
      <button class="primary-btn" id="newNoteBtn">New Note</button>
      <button class="danger-btn" id="deleteBtn">Delete</button>
    </div>
  </div>

  <div class="shell">
    <aside class="pane sidebar-pane" id="sidebarPane">
      <div class="sidebar-top">
        <div class="search-wrap">
          <input id="searchInput" class="search-input" type="text" placeholder="Search notes, folders, tags..." />
        </div>

        <div class="sidebar-actions">
          <button class="ghost-btn" id="newFolderBtn">New Folder</button>
          <button class="ghost-btn" id="newChildFolderBtn">Child Folder</button>
          <button class="ghost-btn" id="sortUpdatedBtn">Recent</button>
          <button class="ghost-btn" id="sortAlphaBtn">A–Z</button>
        </div>
      </div>

      <div class="section-label">Pinned</div>
      <div class="tree-scroll" id="treeScroll">
        <div id="pinnedList"></div>
        <div class="section-label">Workspace</div>
        <div id="treeRoot"></div>
      </div>
    </aside>

    <main class="pane editor-pane">
      <div class="editor-top">
        <input id="noteTitle" class="editor-title" type="text" placeholder="Untitled note" />

        <div class="editor-toolbar">
          <button class="tool-btn" id="insertWikiBtn">[[Link]]</button>
          <button class="tool-btn" id="linkCurrentBtn">Link current</button>
          <button class="tool-btn" id="pinBtn">Pin</button>
          <button class="tool-btn" id="moveToRootBtn">Move Root</button>
          <button class="tool-btn" id="h2Btn">/heading</button>
          <button class="tool-btn" id="todoBtn">/todo</button>
          <button class="tool-btn" id="quoteBtn">Quote</button>
          <button class="tool-btn" id="copyNoteBtn">Copy Note</button>
        </div>
      </div>

      <div class="editor-wrap">
        <div class="editor-surface">
          <div
            id="editor"
            class="editor"
            contenteditable="true"
            data-placeholder="Write notes, ideas, scene planning, outlines, worldbuilding...

Type [[ to auto-suggest notes
Type / for slash commands
Use #tags anywhere in the note."
          ></div>

          <div class="editor-footer">
            <div id="saveStatus">Ready</div>
            <div id="noteMeta">0 words</div>
          </div>
        </div>
      </div>
    </main>

    <aside class="pane right-pane">
      <div class="info-top">
        <div class="info-title">Note Details</div>
      </div>

      <div class="info-body">
        <div class="info-card">
          <div class="info-card-title">Overview</div>
          <div class="stat" id="overviewStats">Select a note.</div>
        </div>

        <div class="info-card">
          <div class="info-card-title">Outgoing Links</div>
          <div id="outlinksBox" class="muted">No links yet.</div>
        </div>

        <div class="info-card">
          <div class="info-card-title">Backlinks</div>
          <div id="backlinksBox" class="muted">No backlinks yet.</div>
        </div>

        <div class="info-card">
          <div class="info-card-title">Tags</div>
          <div id="tagsBox" class="muted">No tags yet.</div>
        </div>

        <div class="info-card">
          <div class="info-card-title">Search Results</div>
          <div id="searchResultsBox" class="muted">Type in search to see matching notes.</div>
        </div>
      </div>
    </aside>
  </div>

  <script type="module">
    import { db, auth } from "./firebase.js";
    import {
      collection,
      doc,
      addDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const workspaceLabel = document.getElementById("workspaceLabel");
    const sidebarPane = document.getElementById("sidebarPane");
    const mobileOverlay = document.getElementById("mobileOverlay");
    const toggleSidebarBtn = document.getElementById("toggleSidebarBtn");
    const suggestionPop = document.getElementById("suggestionPop");

    const searchInput = document.getElementById("searchInput");
    const newFolderBtn = document.getElementById("newFolderBtn");
    const newChildFolderBtn = document.getElementById("newChildFolderBtn");
    const sortUpdatedBtn = document.getElementById("sortUpdatedBtn");
    const sortAlphaBtn = document.getElementById("sortAlphaBtn");
    const pinnedList = document.getElementById("pinnedList");
    const treeRoot = document.getElementById("treeRoot");

    const noteTitle = document.getElementById("noteTitle");
    const editor = document.getElementById("editor");
    const saveStatus = document.getElementById("saveStatus");
    const noteMeta = document.getElementById("noteMeta");

    const newNoteBtn = document.getElementById("newNoteBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const duplicateBtn = document.getElementById("duplicateBtn");
    const insertWikiBtn = document.getElementById("insertWikiBtn");
    const linkCurrentBtn = document.getElementById("linkCurrentBtn");
    const pinBtn = document.getElementById("pinBtn");
    const moveToRootBtn = document.getElementById("moveToRootBtn");
    const h2Btn = document.getElementById("h2Btn");
    const todoBtn = document.getElementById("todoBtn");
    const quoteBtn = document.getElementById("quoteBtn");
    const copyNoteBtn = document.getElementById("copyNoteBtn");
    const copyLinkBtn = document.getElementById("copyLinkBtn");

    const overviewStats = document.getElementById("overviewStats");
    const outlinksBox = document.getElementById("outlinksBox");
    const backlinksBox = document.getElementById("backlinksBox");
    const tagsBox = document.getElementById("tagsBox");
    const searchResultsBox = document.getElementById("searchResultsBox");

    let currentUser = null;
    let notes = [];
    let folders = [];
    let unsubscribeNotes = null;
    let unsubscribeFolders = null;
    let activeNoteId = null;
    let activeFolderId = null;
    let saveTimer = null;
    let sortMode = "updated";
    let filterText = "";
    let isRendering = false;
    let draggedNoteId = null;
    let draggedFolderId = null;
    const folderOpenState = {};
    const suggestionState = {
      open: false,
      mode: null,
      items: [],
      index: 0,
      query: ""
    };

    function setStatus(text) {
      saveStatus.textContent = text;
    }

    function setStatusBrief(text, reset = "Saved") {
      saveStatus.textContent = text;
      clearTimeout(window.__statusTimer);
      window.__statusTimer = setTimeout(() => {
        saveStatus.textContent = reset;
      }, 900);
    }

    function notesRef() {
      return collection(db, "users", currentUser.uid, "notes");
    }

    function noteDocRef(noteId) {
      return doc(db, "users", currentUser.uid, "notes", noteId);
    }

    function foldersRef() {
      return collection(db, "users", currentUser.uid, "folders");
    }

    function folderDocRef(folderId) {
      return doc(db, "users", currentUser.uid, "folders", folderId);
    }

    function escapeHtml(text = "") {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderLinks(text = "") {
      const escaped = escapeHtml(text).replace(/\n/g, "<br>");
      return escaped
        .replace(/(^|\s)(#[a-zA-Z0-9_-]+)/g, (m, lead, tag) => `${lead}<span class="tag-highlight">${tag}</span>`)
        .replace(/\[\[(.*?)\]\]/g, (match, name) => {
          const clean = name.trim();
          return `<span class="wiki-link" data-link="${clean}">[[${clean}]]</span>`;
        });
    }

    function extractLinks(text = "") {
      const matches = text.match(/\[\[(.*?)\]\]/g) || [];
      return [...new Set(matches.map(link => link.replace("[[", "").replace("]]", "").trim()).filter(Boolean))];
    }

    function extractTags(text = "") {
      const matches = text.match(/(^|\s)#([a-zA-Z0-9_-]+)/g) || [];
      return [...new Set(matches.map(tag => tag.trim().replace(/^.*#/, "#")))];
    }

    function stripWiki(text = "") {
      return text.replace(/\[\[(.*?)\]\]/g, "$1");
    }

    function previewText(text = "", length = 90) {
      const clean = stripWiki(text).replace(/\s+/g, " ").trim();
      return clean.length > length ? clean.slice(0, length) + "…" : clean || "Empty note";
    }

    function wordCount(text = "") {
      const clean = stripWiki(text).replace(/\s+/g, " ").trim();
      if (!clean) return 0;
      return clean.split(/\s+/).length;
    }

    function activeNote() {
      return notes.find(n => n.id === activeNoteId) || null;
    }

    function activeFolder() {
      return folders.find(f => f.id === activeFolderId) || null;
    }

    function findNoteByTitle(title) {
      return notes.find(n => (n.title || "").trim().toLowerCase() === (title || "").trim().toLowerCase());
    }

    function findFolderById(id) {
      return folders.find(f => f.id === id) || null;
    }

    function folderChildren(parentId = null) {
      return folders.filter(f => (f.parentId || null) === parentId);
    }

    function notesInFolder(folderId = null) {
      return notes.filter(n => (n.folderId || null) === folderId);
    }

    function sortNotes(list) {
      const next = [...list];
      if (sortMode === "alpha") {
        next.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
      } else {
        next.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      }
      return next;
    }

    function sortFolders(list) {
      return [...list].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    }

    function getFilteredNotes() {
      const q = filterText.trim().toLowerCase();
      if (!q) return notes;

      return notes.filter(note => {
        const hay = `${note.title || ""} ${note.body || ""}`.toLowerCase();
        return hay.includes(q);
      });
    }

    function getSearchHits() {
      const q = filterText.trim().toLowerCase();
      if (!q) return [];
      return sortNotes(getFilteredNotes()).slice(0, 12);
    }

    function renderSearchResults() {
      const hits = getSearchHits();

      if (!filterText.trim()) {
        searchResultsBox.innerHTML = `<div class="muted">Type in search to see matching notes.</div>`;
        return;
      }

      if (!hits.length) {
        searchResultsBox.innerHTML = `<div class="muted">No matching notes.</div>`;
        return;
      }

      searchResultsBox.innerHTML = "";
      hits.forEach(note => {
        const div = document.createElement("div");
        div.className = "search-hit";
        div.innerHTML = `
          <div class="search-hit-title">${escapeHtml(note.title || "Untitled")}</div>
          <div class="search-hit-preview">${escapeHtml(previewText(note.body || "", 80))}</div>
        `;
        div.addEventListener("click", () => openNote(note.id));
        searchResultsBox.appendChild(div);
      });
    }

    function renderPinned() {
      pinnedList.innerHTML = "";
      const pinned = sortNotes(notes.filter(n => !!n.pinned));

      if (!pinned.length) {
        pinnedList.innerHTML = `<div class="empty-state">No pinned notes yet.</div>`;
        return;
      }

      pinned.forEach(note => {
        const item = buildNoteItem(note);
        pinnedList.appendChild(item);
      });
    }

    function buildNoteItem(note) {
      const item = document.createElement("div");
      item.className = "note-item" + (note.id === activeNoteId ? " active" : "");
      item.draggable = true;

      item.innerHTML = `
        <div class="note-item-title-row">
          ${note.pinned ? '<span class="pin-dot">📌</span>' : ''}
          <div class="note-item-title">${escapeHtml(note.title || "Untitled")}</div>
        </div>
        <div class="note-item-preview">${escapeHtml(previewText(note.body || ""))}</div>
        <div class="note-item-meta">${new Date(note.updatedAt || Date.now()).toLocaleString()}</div>
      `;

      item.addEventListener("click", () => {
        openNote(note.id);
        if (window.innerWidth <= 760) closeSidebar();
      });

      item.addEventListener("dragstart", () => {
        draggedNoteId = note.id;
        item.classList.add("dragging");
      });

      item.addEventListener("dragend", () => {
        draggedNoteId = null;
        item.classList.remove("dragging");
      });

      return item;
    }

    function renderFolderTree() {
      treeRoot.innerHTML = "";

      const q = filterText.trim().toLowerCase();
      if (q) {
        const filteredNotes = sortNotes(getFilteredNotes().filter(n => !n.pinned));
        if (!filteredNotes.length) {
          treeRoot.innerHTML = `<div class="empty-state">No matching notes or folders.</div>`;
          return;
        }
        filteredNotes.forEach(note => treeRoot.appendChild(buildNoteItem(note)));
        return;
      }

      const rootWrap = document.createElement("div");
      rootWrap.className = "tree-group";

      const rootHeader = document.createElement("div");
      rootHeader.className = "tree-folder" + (activeFolderId === null ? " active" : "");
      rootHeader.innerHTML = `
        <div class="folder-caret">•</div>
        <div class="folder-name">Root</div>
        <div class="folder-badge">${notesInFolder(null).length}</div>
      `;
      rootHeader.addEventListener("click", () => {
        activeFolderId = null;
        renderFolderTree();
      });

      rootHeader.addEventListener("dragover", e => {
        e.preventDefault();
        rootHeader.classList.add("drop-target");
      });

      rootHeader.addEventListener("dragleave", () => {
        rootHeader.classList.remove("drop-target");
      });

      rootHeader.addEventListener("drop", async e => {
        e.preventDefault();
        rootHeader.classList.remove("drop-target");
        try {
          if (draggedNoteId) {
            await updateDoc(noteDocRef(draggedNoteId), { folderId: null, updatedAt: Date.now() });
          }
          if (draggedFolderId) {
            await updateDoc(folderDocRef(draggedFolderId), { parentId: null });
          }
        } catch (err) {
          console.error(err);
          setStatus("Move failed");
        }
      });

      rootWrap.appendChild(rootHeader);

      const rootNotes = sortNotes(notesInFolder(null).filter(n => !n.pinned));
      rootNotes.forEach(note => rootWrap.appendChild(buildNoteItem(note)));

      treeRoot.appendChild(rootWrap);

      sortFolders(folderChildren(null)).forEach(folder => {
        treeRoot.appendChild(buildFolderNode(folder, 0));
      });
    }

    function buildFolderNode(folder, depth) {
      const wrap = document.createElement("div");
      wrap.className = "tree-group";

      const open = folderOpenState[folder.id] !== false;
      const childFolders = sortFolders(folderChildren(folder.id));
      const childNotes = sortNotes(notesInFolder(folder.id).filter(n => !n.pinned));

      const header = document.createElement("div");
      header.className = "tree-folder" + (activeFolderId === folder.id ? " active" : "");
      header.draggable = true;
      header.innerHTML = `
        <div class="folder-caret">${open ? "▼" : "▶"}</div>
        <div class="folder-name">📁 ${escapeHtml(folder.name || "Untitled Folder")}</div>
        <div class="folder-badge">${childFolders.length + childNotes.length}</div>
      `;

      header.addEventListener("click", (e) => {
        if (e.detail === 2) return;
        activeFolderId = folder.id;
        folderOpenState[folder.id] = !open;
        renderFolderTree();
      });

      header.addEventListener("dblclick", async () => {
        const name = prompt("Rename folder?", folder.name || "");
        if (!name) return;
        try {
          await updateDoc(folderDocRef(folder.id), { name: name.trim() || "Untitled Folder" });
          setStatusBrief("Folder renamed");
        } catch (err) {
          console.error(err);
          setStatus("Rename failed");
        }
      });

      header.addEventListener("dragstart", () => {
        draggedFolderId = folder.id;
      });

      header.addEventListener("dragend", () => {
        draggedFolderId = null;
      });

      header.addEventListener("dragover", e => {
        e.preventDefault();
        header.classList.add("drop-target");
      });

      header.addEventListener("dragleave", () => {
        header.classList.remove("drop-target");
      });

      header.addEventListener("drop", async e => {
        e.preventDefault();
        header.classList.remove("drop-target");

        try {
          if (draggedNoteId) {
            await updateDoc(noteDocRef(draggedNoteId), { folderId: folder.id, updatedAt: Date.now() });
          }

          if (draggedFolderId && draggedFolderId !== folder.id) {
            const bad = isDescendantFolder(folder.id, draggedFolderId);
            if (bad) {
              setStatusBrief("Invalid nested move", "Saved");
              return;
            }
            await updateDoc(folderDocRef(draggedFolderId), { parentId: folder.id });
          }
        } catch (err) {
          console.error(err);
          setStatus("Move failed");
        }
      });

      wrap.appendChild(header);

      if (open) {
        const body = document.createElement("div");
        body.className = "tree-indent";
        childNotes.forEach(note => body.appendChild(buildNoteItem(note)));
        childFolders.forEach(child => body.appendChild(buildFolderNode(child, depth + 1)));
        wrap.appendChild(body);
      }

      return wrap;
    }

    function isDescendantFolder(targetId, candidateAncestorId) {
      let current = findFolderById(targetId);
      while (current) {
        if ((current.parentId || null) === candidateAncestorId) return true;
        current = current.parentId ? findFolderById(current.parentId) : null;
      }
      return false;
    }

    function renderRightPanel() {
      const note = activeNote();

      if (!note) {
        overviewStats.textContent = "Select a note.";
        outlinksBox.innerHTML = `<div class="muted">No links yet.</div>`;
        backlinksBox.innerHTML = `<div class="muted">No backlinks yet.</div>`;
        tagsBox.innerHTML = `<div class="muted">No tags yet.</div>`;
        noteMeta.textContent = "0 words";
        renderSearchResults();
        return;
      }

      const links = extractLinks(note.body || "");
      const tags = extractTags(note.body || "");
      const backlinks = notes.filter(other => {
        if (other.id === note.id) return false;
        return extractLinks(other.body || "").some(link => link.toLowerCase() === (note.title || "").toLowerCase());
      });

      const folder = note.folderId ? findFolderById(note.folderId) : null;
      overviewStats.innerHTML = `
        <div><strong>Title:</strong> ${escapeHtml(note.title || "Untitled")}</div>
        <div><strong>Words:</strong> ${wordCount(note.body || "")}</div>
        <div><strong>Outgoing:</strong> ${links.length}</div>
        <div><strong>Backlinks:</strong> ${backlinks.length}</div>
        <div><strong>Pinned:</strong> ${note.pinned ? "Yes" : "No"}</div>
        <div><strong>Folder:</strong> ${escapeHtml(folder?.name || "Root")}</div>
        <div><strong>Updated:</strong> ${new Date(note.updatedAt || Date.now()).toLocaleString()}</div>
      `;

      noteMeta.textContent = `${wordCount(note.body || "")} words`;

      if (!links.length) {
        outlinksBox.innerHTML = `<div class="muted">No links yet.</div>`;
      } else {
        outlinksBox.innerHTML = "";
        links.forEach(link => {
          const div = document.createElement("div");
          div.className = "outlink-item";
          div.innerHTML = `
            <div class="outlink-title">${escapeHtml(link)}</div>
            <div class="outlink-preview">Open or create this note.</div>
          `;
          div.addEventListener("click", async () => {
            await openOrCreateNote(link);
          });
          outlinksBox.appendChild(div);
        });
      }

      if (!backlinks.length) {
        backlinksBox.innerHTML = `<div class="muted">No backlinks yet.</div>`;
      } else {
        backlinksBox.innerHTML = "";
        backlinks.forEach(back => {
          const div = document.createElement("div");
          div.className = "backlink-item";
          div.innerHTML = `
            <div class="backlink-title">${escapeHtml(back.title || "Untitled")}</div>
            <div class="backlink-preview">${escapeHtml(previewText(back.body || "", 70))}</div>
          `;
          div.addEventListener("click", () => openNote(back.id));
          backlinksBox.appendChild(div);
        });
      }

      if (!tags.length) {
        tagsBox.innerHTML = `<div class="muted">No tags yet.</div>`;
      } else {
        tagsBox.innerHTML = "";
        tags.forEach(tag => {
          const div = document.createElement("div");
          div.className = "tag-item";
          div.innerHTML = `
            <div class="tag-title">${escapeHtml(tag)}</div>
            <div class="tag-preview">Filter by this tag.</div>
          `;
          div.addEventListener("click", () => {
            searchInput.value = tag;
            filterText = tag.toLowerCase();
            renderSidebar();
            renderSearchResults();
          });
          tagsBox.appendChild(div);
        });
      }

      renderSearchResults();
    }

    function renderSidebar() {
      renderPinned();
      renderFolderTree();
      pinBtn.textContent = activeNote()?.pinned ? "Unpin" : "Pin";
    }

    function renderEditor() {
      const note = activeNote();

      if (!note) {
        noteTitle.value = "";
        editor.innerHTML = "";
        renderRightPanel();
        renderSidebar();
        return;
      }

      isRendering = true;
      noteTitle.value = note.title || "";
      editor.innerHTML = renderLinks(note.body || "");
      isRendering = false;

      renderSidebar();
      renderRightPanel();
    }

    function openNote(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      activeNoteId = id;
      activeFolderId = note.folderId || null;
      renderEditor();
    }

    function getEditorPlainText() {
      return editor.innerText.replace(/\u00A0/g, " ").trimEnd();
    }

    async function createNote(title = "Untitled", folderId = null) {
      const payload = {
        title,
        body: "",
        folderId,
        pinned: false,
        createdAt: Date.now(),
        updatedAt: Date.now()
      };

      const ref = await addDoc(notesRef(), payload);
      return { id: ref.id, ...payload };
    }

    async function createFolder(name = "New Folder", parentId = null) {
      const payload = {
        name,
        parentId,
        createdAt: Date.now()
      };

      const ref = await addDoc(foldersRef(), payload);
      folderOpenState[ref.id] = true;
      return { id: ref.id, ...payload };
    }

    async function updateActiveNote(fields) {
      if (!activeNoteId) return;
      await updateDoc(noteDocRef(activeNoteId), {
        ...fields,
        updatedAt: Date.now()
      });
    }

    async function duplicateActiveNote() {
      const note = activeNote();
      if (!note) return;

      const title = `${note.title || "Untitled"} Copy`;
      const ref = await addDoc(notesRef(), {
        title,
        body: note.body || "",
        folderId: note.folderId || null,
        pinned: false,
        createdAt: Date.now(),
        updatedAt: Date.now()
      });

      activeNoteId = ref.id;
      setStatusBrief("Duplicated");
    }

    async function deleteActiveNote() {
      const note = activeNote();
      if (!note) return;

      if (!confirm(`Delete "${note.title || "Untitled"}"?`)) return;

      await deleteDoc(noteDocRef(note.id));
      activeNoteId = null;
      setStatusBrief("Deleted", "Ready");
    }

    function scheduleSave() {
      if (isRendering || !activeNoteId) return;

      clearTimeout(saveTimer);
      setStatus("Saving...");

      saveTimer = setTimeout(async () => {
        try {
          await updateActiveNote({
            title: noteTitle.value.trim() || "Untitled",
            body: getEditorPlainText()
          });
          setStatus("Saved");
        } catch (err) {
          console.error(err);
          setStatus("Save failed");
        }
      }, 500);
    }

    function insertTextAtCaret(text) {
      editor.focus();
      document.execCommand("insertText", false, text);
      scheduleSave();
    }

    async function openOrCreateNote(title) {
      const existing = findNoteByTitle(title);
      if (existing) {
        openNote(existing.id);
        return;
      }

      const created = await createNote(title.trim() || "Untitled", activeFolderId || null);
      activeNoteId = created.id;
      setStatusBrief("Created linked note");
    }

    async function copyCurrentNote() {
      const note = activeNote();
      if (!note) return;

      const text = `# ${note.title || "Untitled"}\n\n${note.body || ""}`;
      try {
        await navigator.clipboard.writeText(text);
        setStatusBrief("Copied note");
      } catch {
        setStatusBrief("Copy failed", "Saved");
      }
    }

    async function copyCurrentLink() {
      const note = activeNote();
      if (!note) return;

      try {
        await navigator.clipboard.writeText(`[[${note.title || "Untitled"}]]`);
        setStatusBrief("Copied link");
      } catch {
        setStatusBrief("Copy failed", "Saved");
      }
    }

    function openSidebar() {
      sidebarPane.classList.add("open");
      mobileOverlay.classList.add("open");
    }

    function closeSidebar() {
      sidebarPane.classList.remove("open");
      mobileOverlay.classList.remove("open");
    }

    function getCurrentRange() {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount) return null;
      return sel.getRangeAt(0);
    }

    function getTextBeforeCaret() {
      const range = getCurrentRange();
      if (!range) return "";
      const pre = range.cloneRange();
      pre.selectNodeContents(editor);
      pre.setEnd(range.endContainer, range.endOffset);
      return pre.toString();
    }

    function getCaretRect() {
      const range = getCurrentRange();
      if (!range) return null;
      const rect = range.getBoundingClientRect();
      if (rect && (rect.top || rect.left || rect.width || rect.height)) return rect;

      const span = document.createElement("span");
      span.textContent = "\u200b";
      range.insertNode(span);
      const nextRect = span.getBoundingClientRect();
      span.parentNode.removeChild(span);
      return nextRect;
    }

    function closeSuggestion() {
      suggestionState.open = false;
      suggestionState.mode = null;
      suggestionState.items = [];
      suggestionState.index = 0;
      suggestionState.query = "";
      suggestionPop.classList.remove("open");
      suggestionPop.innerHTML = "";
    }

    function openSuggestion(mode, items, queryText) {
      if (!items.length) {
        closeSuggestion();
        return;
      }

      suggestionState.open = true;
      suggestionState.mode = mode;
      suggestionState.items = items;
      suggestionState.index = 0;
      suggestionState.query = queryText || "";

      renderSuggestion();
    }

    function renderSuggestion() {
      if (!suggestionState.open || !suggestionState.items.length) {
        closeSuggestion();
        return;
      }

      const rect = getCaretRect();
      if (!rect) return;

      suggestionPop.innerHTML = "";
      suggestionState.items.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "suggestion-item" + (index === suggestionState.index ? " active" : "");
        div.innerHTML = `
          <div class="suggestion-title">${escapeHtml(item.label)}</div>
          <div class="suggestion-sub">${escapeHtml(item.sub || "")}</div>
        `;
        div.addEventListener("mousedown", (e) => {
          e.preventDefault();
          applySuggestion(index);
        });
        suggestionPop.appendChild(div);
      });

      suggestionPop.style.left = `${Math.min(window.innerWidth - 300, Math.max(8, rect.left))}px`;
      suggestionPop.style.top = `${Math.min(window.innerHeight - 260, rect.bottom + 8)}px`;
      suggestionPop.classList.add("open");
    }

    function getLinkSuggestionSource(queryText) {
      const q = queryText.toLowerCase();
      const items = sortNotes([...notes])
        .filter(n => !q || (n.title || "").toLowerCase().includes(q))
        .slice(0, 8)
        .map(n => ({
          type: "wiki",
          value: n.title || "Untitled",
          label: n.title || "Untitled",
          sub: previewText(n.body || "", 60)
        }));

      if (!q || !items.find(i => i.value.toLowerCase() === q)) {
        items.unshift({
          type: "wiki",
          value: queryText.trim() || "Untitled",
          label: `Create "${queryText.trim() || "Untitled"}"`,
          sub: "New linked note"
        });
      }

      return items;
    }

    function getSlashCommands(queryText) {
      const commands = [
        { type: "slash", value: "heading", label: "/heading", sub: "Insert a level-2 heading", insert: "## Heading" },
        { type: "slash", value: "todo", label: "/todo", sub: "Insert a task checkbox", insert: "- [ ] Todo" },
        { type: "slash", value: "quote", label: "/quote", sub: "Insert a block quote", insert: "> Quote" },
        { type: "slash", value: "link", label: "/link", sub: "Insert a wiki link", insert: "[[Note]]" },
        { type: "slash", value: "tag", label: "/tag", sub: "Insert a tag", insert: "#tag" }
      ];

      const q = queryText.toLowerCase();
      return commands.filter(c => !q || c.value.includes(q) || c.label.includes(q));
    }

    function replaceTextNearCaret(pattern, replacement) {
      const range = getCurrentRange();
      if (!range) return;

      const before = getTextBeforeCaret();
      const match = before.match(pattern);
      if (!match) return;

      const charsToRemove = match[0].length;

      const sel = window.getSelection();
      const workingRange = range.cloneRange();

      for (let i = 0; i < charsToRemove; i++) {
        workingRange.setStart(workingRange.startContainer, Math.max(0, workingRange.startOffset - 1));
      }

      workingRange.deleteContents();
      document.execCommand("insertText", false, replacement);
    }

    async function applySuggestion(index) {
      const item = suggestionState.items[index];
      if (!item) return;

      if (suggestionState.mode === "wiki") {
        replaceTextNearCaret(/\[\[([^\]]*)$/, `[[${item.value}]]`);
        closeSuggestion();
        scheduleSave();
        return;
      }

      if (suggestionState.mode === "slash") {
        replaceTextNearCaret(/\/([a-z]*)$/, item.insert);
        closeSuggestion();
        scheduleSave();
      }
    }

    function updateSuggestionState() {
      const before = getTextBeforeCaret();

      const wikiMatch = before.match(/\[\[([^\]]*)$/);
      if (wikiMatch) {
        openSuggestion("wiki", getLinkSuggestionSource(wikiMatch[1]), wikiMatch[1]);
        return;
      }

      const slashMatch = before.match(/\/([a-z]*)$/i);
      if (slashMatch) {
        openSuggestion("slash", getSlashCommands(slashMatch[1]), slashMatch[1]);
        return;
      }

      closeSuggestion();
    }

    function attachEvents() {
      toggleSidebarBtn.addEventListener("click", () => {
        if (window.innerWidth <= 760) {
          if (sidebarPane.classList.contains("open")) closeSidebar();
          else openSidebar();
        }
      });

      mobileOverlay.addEventListener("click", closeSidebar);

      searchInput.addEventListener("input", () => {
        filterText = searchInput.value.trim().toLowerCase();
        renderSidebar();
        renderSearchResults();
      });

      sortUpdatedBtn.addEventListener("click", () => {
        sortMode = "updated";
        renderSidebar();
      });

      sortAlphaBtn.addEventListener("click", () => {
        sortMode = "alpha";
        renderSidebar();
      });

      newFolderBtn.addEventListener("click", async () => {
        const name = prompt("Folder name?");
        if (!name) return;
        try {
          await createFolder(name.trim() || "New Folder", null);
          setStatusBrief("Folder created");
        } catch (err) {
          console.error(err);
          setStatus("Folder failed");
        }
      });

      newChildFolderBtn.addEventListener("click", async () => {
        const name = prompt("Child folder name?");
        if (!name) return;
        try {
          await createFolder(name.trim() || "New Folder", activeFolderId || null);
          setStatusBrief("Child folder created");
        } catch (err) {
          console.error(err);
          setStatus("Folder failed");
        }
      });

      newNoteBtn.addEventListener("click", async () => {
        try {
          const created = await createNote("Untitled", activeFolderId || null);
          activeNoteId = created.id;
          setStatusBrief("Created");
        } catch (err) {
          console.error(err);
          setStatus("Create failed");
        }
      });

      deleteBtn.addEventListener("click", async () => {
        try {
          await deleteActiveNote();
        } catch (err) {
          console.error(err);
          setStatus("Delete failed");
        }
      });

      duplicateBtn.addEventListener("click", async () => {
        try {
          await duplicateActiveNote();
        } catch (err) {
          console.error(err);
          setStatus("Duplicate failed");
        }
      });

      noteTitle.addEventListener("input", scheduleSave);
      editor.addEventListener("input", () => {
        scheduleSave();
        updateSuggestionState();
      });

      editor.addEventListener("keyup", updateSuggestionState);
      editor.addEventListener("click", async (e) => {
        const linkEl = e.target.closest(".wiki-link");
        if (linkEl) {
          e.preventDefault();
          await openOrCreateNote(linkEl.dataset.link?.trim() || "");
          return;
        }
        updateSuggestionState();
      });

      editor.addEventListener("keydown", async (e) => {
        if (suggestionState.open) {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            suggestionState.index = (suggestionState.index + 1) % suggestionState.items.length;
            renderSuggestion();
            return;
          }

          if (e.key === "ArrowUp") {
            e.preventDefault();
            suggestionState.index = (suggestionState.index - 1 + suggestionState.items.length) % suggestionState.items.length;
            renderSuggestion();
            return;
          }

          if (e.key === "Enter" || e.key === "Tab") {
            e.preventDefault();
            await applySuggestion(suggestionState.index);
            return;
          }

          if (e.key === "Escape") {
            e.preventDefault();
            closeSuggestion();
            return;
          }
        }

        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          clearTimeout(saveTimer);
          try {
            await updateActiveNote({
              title: noteTitle.value.trim() || "Untitled",
              body: getEditorPlainText()
            });
            setStatusBrief("Saved now");
          } catch (err) {
            console.error(err);
            setStatus("Save failed");
          }
        }
      });

      insertWikiBtn.addEventListener("click", () => {
        const name = prompt("Link to which note?");
        if (!name) return;
        insertTextAtCaret(`[[${name.trim()}]]`);
      });

      linkCurrentBtn.addEventListener("click", () => {
        const note = activeNote();
        if (!note) return;
        insertTextAtCaret(`[[${note.title || "Untitled"}]]`);
      });

      pinBtn.addEventListener("click", async () => {
        const note = activeNote();
        if (!note) return;
        try {
          await updateActiveNote({ pinned: !note.pinned });
          setStatusBrief(note.pinned ? "Unpinned" : "Pinned");
        } catch (err) {
          console.error(err);
          setStatus("Pin failed");
        }
      });

      moveToRootBtn.addEventListener("click", async () => {
        const note = activeNote();
        if (!note) return;
        try {
          await updateActiveNote({ folderId: null });
          activeFolderId = null;
          setStatusBrief("Moved to root");
        } catch (err) {
          console.error(err);
          setStatus("Move failed");
        }
      });

      h2Btn.addEventListener("click", () => insertTextAtCaret("## Heading"));
      todoBtn.addEventListener("click", () => insertTextAtCaret("- [ ] Todo"));
      quoteBtn.addEventListener("click", () => insertTextAtCaret("> Quote"));
      copyNoteBtn.addEventListener("click", copyCurrentNote);
      copyLinkBtn.addEventListener("click", copyCurrentLink);

      document.addEventListener("click", (e) => {
        if (!suggestionPop.contains(e.target) && e.target !== editor) {
          closeSuggestion();
        }
      });
    }

    function subscribeCollections() {
      if (unsubscribeNotes) unsubscribeNotes();
      if (unsubscribeFolders) unsubscribeFolders();

      const notesQ = query(notesRef(), orderBy("updatedAt", "desc"));
      unsubscribeNotes = onSnapshot(notesQ, (snap) => {
        notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));

        if (!notes.length) {
          treeRoot.innerHTML = `<div class="empty-state">No notes yet. Create one to begin.</div>`;
          pinnedList.innerHTML = `<div class="empty-state">No pinned notes yet.</div>`;
          noteTitle.value = "";
          editor.innerHTML = "";
          renderRightPanel();
          return;
        }

        const existingActive = notes.find(n => n.id === activeNoteId);
        if (!activeNoteId || !existingActive) {
          activeNoteId = notes[0].id;
        }

        const userIsEditing = document.activeElement === editor || document.activeElement === noteTitle;
        if (!userIsEditing) {
          renderEditor();
        } else {
          renderSidebar();
          renderRightPanel();
        }
      });

      unsubscribeFolders = onSnapshot(foldersRef(), (snap) => {
        folders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderSidebar();
      });
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "/login.html";
        return;
      }

      currentUser = user;
      const handle = user.displayName || (user.email ? user.email.split("@")[0] : "writer");
      workspaceLabel.textContent = `@${handle} notes`;

      attachEvents();
      subscribeCollections();
      setStatus("Ready");
    }, (err) => {
      console.error(err);
      setStatus("Auth failed");
    });
  </script>
</body>
</html>
