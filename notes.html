<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vault</title>
  <link rel="stylesheet" href="/css/vault.css" />
</head>
<body>
  <div class="ob-app ob-root-full">
    <header class="ob-top-hat">
      <span class="ob-vault-name" id="naBookLabel">Vault</span>
      <div class="ob-hat-actions">
        <a class="ob-hat-btn" id="naEditorLink" href="/editor.html" title="Open editor">↗</a>
        <button type="button" class="ob-hat-btn" id="naNewFolder" title="New folder">▣</button>
        <button type="button" class="ob-hat-btn" id="naNewNote" title="New note">＋</button>
        <button type="button" class="ob-hat-btn ob-hat-danger" id="naDeleteNote" title="Delete note">⌫</button>
      </div>
    </header>
    <div class="ob-body">
      <nav class="ob-ribbon" aria-label="Ribbon">
        <button type="button" class="ob-rib-btn is-active" title="Files">≡</button>
        <button type="button" class="ob-rib-btn" title="Search">⌕</button>
        <button type="button" class="ob-rib-btn" title="Bookmarks">🔖</button>
      </nav>
      <div class="ob-work">
        <div class="ob-columns">
          <aside class="ob-left">
            <input id="naSearch" class="ob-quick-open" type="search" placeholder="Search vault..." autocomplete="off" />
            <div id="naTree" class="ob-nav-list"></div>
          </aside>
          <main class="ob-main">
            <div id="naTabBar" class="ob-tab-strip" role="tablist"></div>
            <input id="naNoteTitle" type="text" class="ob-inline-title" placeholder="Untitled" />
            <div class="ob-mode-bar">
              <button type="button" class="ob-mode-btn" id="naViewSource" data-mode="source">Source</button>
              <button type="button" class="ob-mode-btn" id="naViewPreview" data-mode="preview">Reading</button>
              <button type="button" class="ob-mode-btn" id="naViewSplit" data-mode="split">Split</button>
            </div>
            <div id="naEditorShell" class="ob-editor-shell ob-pane-split">
              <div id="naEditorHost" class="ob-cm-host"></div>
              <div id="naPreviewHost" class="ob-preview-host ob-markdown-preview"></div>
            </div>
            <footer class="ob-status">
              <span id="naWordCount" class="ob-status-left"></span>
              <span id="naStatus" class="ob-status-right"></span>
            </footer>
          </main>
          <aside class="ob-right">
            <div class="ob-side-scroll">
              <div class="ob-side-card">
                <div class="ob-side-card-h">Outgoing links</div>
                <div class="ob-side-card-b" id="naOutlinks"></div>
              </div>
              <div class="ob-side-card">
                <div class="ob-side-card-h">Backlinks</div>
                <div class="ob-side-card-b" id="naBacklinks"></div>
              </div>
              <div class="ob-side-card">
                <div class="ob-side-card-h">Tags</div>
                <div class="ob-side-card-b" id="naTags"></div>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </div>

  <div id="naPalette" class="ob-palette hidden" aria-hidden="true">
    <div class="ob-palette-backdrop" id="naPaletteBackdrop"></div>
    <div class="ob-palette-panel" role="dialog" aria-modal="true" aria-labelledby="naPaletteHint">
      <div id="naPaletteHint" class="ob-palette-hint">Quick switcher</div>
      <input id="naPaletteInput" type="text" class="ob-palette-input" autocomplete="off" spellcheck="false" />
      <div id="naPaletteList" class="ob-palette-list"></div>
    </div>
  </div>

  <script type="module" src="/js/vault-app.js"></script>
</body>
</html>
