<!DOCTYPE html>
<!-- BUILD:notebook-20260503d -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Notes</title>
  <link rel="stylesheet" href="/css/notebook.css?v=20260503d" />
</head>
<body>
  <div class="nb-app nb-root-full">
    <header class="nb-top-hat">
      <span class="nb-workspace-title" id="nbPageBook">Notes</span>
      <div class="nb-hat-actions">
        <a class="nb-hat-btn" id="nbPageEditorHref" href="/editor.html" title="Editor">↗</a>
        <button type="button" class="nb-hat-btn" id="nbPageFolder" title="New folder">▣</button>
        <button type="button" class="nb-hat-btn" id="nbPageNew" title="New note">＋</button>
        <button type="button" class="nb-hat-btn nb-hat-danger" id="nbPageDel" title="Delete note">⌫</button>
      </div>
    </header>
    <div class="nb-frame">
      <nav class="nb-ribbon" aria-label="Ribbon">
        <button type="button" class="nb-rib-btn is-active" title="Files">≡</button>
        <button type="button" class="nb-rib-btn" title="Search">⌕</button>
        <button type="button" class="nb-rib-btn" title="Bookmarks">🔖</button>
      </nav>
      <div class="nb-work">
        <div class="nb-columns">
          <aside class="nb-left">
            <input id="nbPageFind" class="nb-quick-open" type="search" placeholder="Search…" autocomplete="off" />
            <div id="nbPageTree" class="nb-nav-list"></div>
          </aside>
          <main class="nb-main">
            <div id="nbPageTabs" class="nb-tab-strip" role="tablist"></div>
            <input id="nbPageTitle" type="text" class="nb-inline-title" placeholder="Untitled" />
            <div class="nb-mode-bar">
              <button type="button" class="nb-mode-btn" id="nbViewSrc" data-mode="source">Source</button>
              <button type="button" class="nb-mode-btn" id="nbViewRead" data-mode="preview">Reading</button>
              <button type="button" class="nb-mode-btn" id="nbViewSplit" data-mode="split">Split</button>
            </div>
            <div id="nbPageShell" class="nb-editor-shell nb-pane-split">
              <div id="nbPageBody" class="nb-editor-host"></div>
              <div id="nbPagePreview" class="nb-preview-host nb-markdown-preview"></div>
            </div>
            <footer class="nb-status">
              <span id="nbPageWords" class="nb-status-left"></span>
              <span id="nbPageStat" class="nb-status-right"></span>
            </footer>
          </main>
          <aside class="nb-right">
            <div class="nb-side-scroll">
              <div class="nb-side-card">
                <div class="nb-side-card-h">Outgoing links</div>
                <div class="nb-side-card-b" id="nbPageOut"></div>
              </div>
              <div class="nb-side-card">
                <div class="nb-side-card-h">Backlinks</div>
                <div class="nb-side-card-b" id="nbPageBack"></div>
              </div>
              <div class="nb-side-card">
                <div class="nb-side-card-h">Tags</div>
                <div class="nb-side-card-b" id="nbPageTags"></div>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </div>

  <div id="nbPal" class="nb-palette hidden" aria-hidden="true">
    <div class="nb-palette-backdrop" id="nbPalBd"></div>
    <div class="nb-palette-panel" role="dialog" aria-modal="true" aria-labelledby="nbPalHint">
      <div id="nbPalHint" class="nb-palette-hint">Quick switcher</div>
      <input id="nbPalQ" type="text" class="nb-palette-input" autocomplete="off" spellcheck="false" />
      <div id="nbPalList" class="nb-palette-list"></div>
    </div>
  </div>

  <script type="module">
    import { bootNotebookPage } from "/js/notebook.js?v=20260503d";
    bootNotebookPage();
  </script>
</body>
</html>
