<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alysum Notes</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #0b1020;
      --bg-2: #0f172a;
      --panel: #111827;
      --panel-2: #182235;
      --panel-3: #1e293b;
      --panel-4: #243246;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --muted-2: #64748b;
      --line: rgba(255,255,255,0.08);
      --line-2: rgba(255,255,255,0.12);
      --accent: #8b5cf6;
      --accent-2: #6d28d9;
      --accent-soft: rgba(139,92,246,0.18);
      --danger: #ef4444;
      --success: #22c55e;
      --shadow: 0 20px 50px rgba(0,0,0,0.35);
      --radius: 18px;
      --radius-sm: 12px;
      --topbar-h: 64px;
      --sidebar-w: 300px;
      --rightbar-w: 320px;
    }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at top left, rgba(139,92,246,0.10), transparent 22%),
        radial-gradient(circle at top right, rgba(59,130,246,0.08), transparent 20%),
        linear-gradient(180deg, #09101d 0%, #0b1020 100%);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    button, input, textarea, select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .app-topbar {
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      background: rgba(10, 15, 28, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      z-index: 20;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: white;
      box-shadow: 0 12px 24px rgba(109,40,217,0.35);
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .ghost-btn,
    .primary-btn,
    .danger-btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 12px;
      height: 42px;
      padding: 0 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.14s ease, background 0.14s ease, border-color 0.14s ease;
    }

    .ghost-btn:hover,
    .primary-btn:hover,
    .danger-btn:hover {
      transform: translateY(-1px);
    }

    .ghost-btn.compact {
      width: 42px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      color: white;
      border-color: transparent;
    }

    .danger-btn {
      background: rgba(239,68,68,0.12);
      color: #fecaca;
      border-color: rgba(239,68,68,0.30);
    }

    .shell {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--rightbar-w);
      gap: 14px;
      padding: 14px;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      background: rgba(17,24,39,0.88);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .sidebar-top {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
      background: rgba(255,255,255,0.02);
    }

    .search-wrap {
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }

    .search-input::placeholder,
    .editor-title::placeholder {
      color: var(--muted-2);
    }

    .sidebar-actions {
      display: flex;
      gap: 8px;
    }

    .sidebar-actions button {
      flex: 1;
    }

    .section-label {
      padding: 0 14px;
      margin-top: 12px;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 900;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .note-list {
      flex: 1;
      overflow: auto;
      padding: 0 10px 12px;
    }

    .note-item {
      padding: 12px;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.14s ease;
      background: transparent;
    }

    .note-item:hover {
      background: rgba(255,255,255,0.04);
      border-color: var(--line);
      transform: translateY(-1px);
    }

    .note-item.active {
      background: var(--accent-soft);
      border-color: rgba(139,92,246,0.28);
    }

    .note-item-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item-preview {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.45;
    }

    .note-item-meta {
      margin-top: 7px;
      font-size: 11px;
      color: var(--muted-2);
      font-weight: 700;
    }

    .empty-state {
      padding: 18px 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .editor-top {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
      background: rgba(255,255,255,0.02);
    }

    .editor-title {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 0 14px;
      font-size: 18px;
      font-weight: 800;
      outline: none;
    }

    .editor-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-btn {
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 0 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .editor-wrap {
      flex: 1;
      min-height: 0;
      padding: 20px;
      overflow: auto;
      background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent 120px), transparent;
    }

    .editor-surface {
      min-height: 100%;
      border-radius: 18px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      padding: 24px;
    }

    .editor {
      min-height: 60vh;
      outline: none;
      color: var(--text);
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .editor:empty::before {
      content: attr(data-placeholder);
      color: var(--muted-2);
    }

    .wiki-link {
      color: #a78bfa;
      cursor: pointer;
      font-weight: 800;
      text-decoration: none;
      border-bottom: 1px dashed rgba(167,139,250,0.4);
    }

    .editor-footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      flex-wrap: wrap;
    }

    .info-top {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
    }

    .info-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .info-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 14px;
    }

    .info-card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .info-card-title {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .stat {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
    }

    .backlink-item,
    .outlink-item,
    .tag-item {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      margin-bottom: 8px;
      cursor: pointer;
    }

    .backlink-item:hover,
    .outlink-item:hover,
    .tag-item:hover {
      background: rgba(255,255,255,0.05);
    }

    .backlink-title,
    .outlink-title,
    .tag-title {
      font-size: 13px;
      font-weight: 800;
    }

    .backlink-preview,
    .outlink-preview,
    .tag-preview {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .mobile-overlay {
      display: none;
    }

    @media (max-width: 1180px) {
      .shell {
        grid-template-columns: 280px minmax(0, 1fr);
      }

      .right-pane {
        display: none;
      }
    }

    @media (max-width: 760px) {
      .shell {
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .sidebar-pane {
        position: fixed;
        top: calc(var(--topbar-h) + 10px);
        left: 10px;
        bottom: 10px;
        width: min(88vw, 320px);
        z-index: 40;
        display: none;
      }

      .sidebar-pane.open {
        display: flex;
      }

      .mobile-overlay {
        display: none;
        position: fixed;
        inset: var(--topbar-h) 0 0 0;
        background: rgba(0,0,0,0.42);
        z-index: 30;
      }

      .mobile-overlay.open {
        display: block;
      }

      .editor-wrap {
        padding: 12px;
      }

      .editor-surface {
        padding: 16px;
      }

      .editor-footer {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="mobile-overlay" id="mobileOverlay"></div>

  <div class="app-topbar">
    <div class="topbar-left">
      <button class="ghost-btn compact" id="toggleSidebarBtn">☰</button>

      <div class="brand">
        <div class="brand-badge">A</div>
        <div class="brand-text">
          <div class="brand-title">Alysum Notes</div>
          <div class="brand-sub" id="workspaceLabel">Connected to Firebase</div>
        </div>
      </div>
    </div>

    <div class="topbar-right">
      <button class="ghost-btn" id="copyLinkBtn">Copy [[link]]</button>
      <button class="ghost-btn" id="duplicateBtn">Duplicate</button>
      <button class="primary-btn" id="newNoteBtn">New Note</button>
      <button class="danger-btn" id="deleteBtn">Delete</button>
    </div>
  </div>

  <div class="shell">
    <aside class="pane sidebar-pane" id="sidebarPane">
      <div class="sidebar-top">
        <div class="search-wrap">
          <input id="searchInput" class="search-input" type="text" placeholder="Search notes..." />
        </div>

        <div class="sidebar-actions">
          <button class="ghost-btn" id="sortUpdatedBtn">Recent</button>
          <button class="ghost-btn" id="sortAlphaBtn">A–Z</button>
        </div>
      </div>

      <div class="section-label">Notes</div>
      <div class="note-list" id="noteList"></div>
    </aside>

    <main class="pane editor-pane">
      <div class="editor-top">
        <input id="noteTitle" class="editor-title" type="text" placeholder="Untitled note" />

        <div class="editor-toolbar">
          <button class="tool-btn" id="insertWikiBtn">[[Link]]</button>
          <button class="tool-btn" id="linkCurrentBtn">Link current</button>
          <button class="tool-btn" id="h2Btn">H2</button>
          <button class="tool-btn" id="quoteBtn">Quote</button>
          <button class="tool-btn" id="copyNoteBtn">Copy Note</button>
        </div>
      </div>

      <div class="editor-wrap">
        <div class="editor-surface">
          <div
            id="editor"
            class="editor"
            contenteditable="true"
            data-placeholder="Write notes, ideas, scene planning, outlines, worldbuilding...

Try typing [[Chapter 1]], [[Character Arc]], or [[Magic System]]."
          ></div>

          <div class="editor-footer">
            <div id="saveStatus">Ready</div>
            <div id="noteMeta">0 words</div>
          </div>
        </div>
      </div>
    </main>

    <aside class="pane right-pane">
      <div class="info-top">
        <div class="info-title">Note Details</div>
      </div>

      <div class="info-body">
        <div class="info-card">
          <div class="info-card-title">Overview</div>
          <div class="stat" id="overviewStats">Select a note.</div>
        </div>

        <div class="info-card">
          <div class="info-card-title">Outgoing Links</div>
          <div id="outlinksBox" class="muted">No links yet.</div>
        </div>

        <div class="info-card">
          <div class="info-card-title">Backlinks</div>
          <div id="backlinksBox" class="muted">No backlinks yet.</div>
        </div>

        <div class="info-card">
          <div class="info-card-title">Tags</div>
          <div id="tagsBox" class="muted">No tags yet.</div>
        </div>
      </div>
    </aside>
  </div>

  <script type="module">
    import { db, auth } from "./firebase.js";
    import {
      collection,
      doc,
      addDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const workspaceLabel = document.getElementById("workspaceLabel");
    const sidebarPane = document.getElementById("sidebarPane");
    const mobileOverlay = document.getElementById("mobileOverlay");
    const toggleSidebarBtn = document.getElementById("toggleSidebarBtn");

    const noteList = document.getElementById("noteList");
    const searchInput = document.getElementById("searchInput");
    const noteTitle = document.getElementById("noteTitle");
    const editor = document.getElementById("editor");
    const saveStatus = document.getElementById("saveStatus");
    const noteMeta = document.getElementById("noteMeta");

    const sortUpdatedBtn = document.getElementById("sortUpdatedBtn");
    const sortAlphaBtn = document.getElementById("sortAlphaBtn");

    const newNoteBtn = document.getElementById("newNoteBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const duplicateBtn = document.getElementById("duplicateBtn");
    const insertWikiBtn = document.getElementById("insertWikiBtn");
    const linkCurrentBtn = document.getElementById("linkCurrentBtn");
    const h2Btn = document.getElementById("h2Btn");
    const quoteBtn = document.getElementById("quoteBtn");
    const copyNoteBtn = document.getElementById("copyNoteBtn");
    const copyLinkBtn = document.getElementById("copyLinkBtn");

    const overviewStats = document.getElementById("overviewStats");
    const outlinksBox = document.getElementById("outlinksBox");
    const backlinksBox = document.getElementById("backlinksBox");
    const tagsBox = document.getElementById("tagsBox");

    let currentUser = null;
    let unsubscribeNotes = null;
    let notes = [];
    let activeNoteId = null;
    let saveTimer = null;
    let isRendering = false;
    let sortMode = "updated";
    let filterText = "";

    function setStatus(text) {
      saveStatus.textContent = text;
    }

    function setStatusBrief(text, reset = "Saved") {
      saveStatus.textContent = text;
      clearTimeout(window.__statusTimer);
      window.__statusTimer = setTimeout(() => {
        saveStatus.textContent = reset;
      }, 900);
    }

    function notesRef() {
      return collection(db, "users", currentUser.uid, "notes");
    }

    function noteDocRef(noteId) {
      return doc(db, "users", currentUser.uid, "notes", noteId);
    }

    function escapeHtml(text = "") {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderLinks(text = "") {
      const escaped = escapeHtml(text).replace(/\n/g, "<br>");
      return escaped.replace(/\[\[(.*?)\]\]/g, (match, name) => {
        const clean = name.trim();
        return `<span class="wiki-link" data-link="${clean}">[[${clean}]]</span>`;
      });
    }

    function extractLinks(text = "") {
      const matches = text.match(/\[\[(.*?)\]\]/g) || [];
      return [...new Set(matches.map(link => link.replace("[[", "").replace("]]", "").trim()).filter(Boolean))];
    }

    function extractTags(text = "") {
      const matches = text.match(/(^|\s)#([a-zA-Z0-9_-]+)/g) || [];
      return [...new Set(matches.map(tag => tag.trim().replace(/^.*#/, "#")))];
    }

    function stripWiki(text = "") {
      return text.replace(/\[\[(.*?)\]\]/g, "$1");
    }

    function previewText(text = "", length = 90) {
      const clean = stripWiki(text).replace(/\s+/g, " ").trim();
      return clean.length > length ? clean.slice(0, length) + "…" : clean || "Empty note";
    }

    function wordCount(text = "") {
      const clean = stripWiki(text).replace(/\s+/g, " ").trim();
      if (!clean) return 0;
      return clean.split(" ").length;
    }

    function activeNote() {
      return notes.find(n => n.id === activeNoteId) || null;
    }

    function findNoteByTitle(title) {
      return notes.find(n => (n.title || "").trim().toLowerCase() === (title || "").trim().toLowerCase());
    }

    function sortAndFilterNotes(list) {
      let filtered = list.filter(note => {
        const hay = `${note.title || ""} ${note.body || ""}`.toLowerCase();
        return !filterText || hay.includes(filterText);
      });

      if (sortMode === "alpha") {
        filtered.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
      } else {
        filtered.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      }

      return filtered;
    }

    function renderList() {
      noteList.innerHTML = "";
      const list = sortAndFilterNotes([...notes]);

      if (!list.length) {
        noteList.innerHTML = `<div class="empty-state">No notes found. Create one to begin.</div>`;
        return;
      }

      list.forEach(note => {
        const item = document.createElement("div");
        item.className = "note-item" + (note.id === activeNoteId ? " active" : "");
        item.innerHTML = `
          <div class="note-item-title">${escapeHtml(note.title || "Untitled")}</div>
          <div class="note-item-preview">${escapeHtml(previewText(note.body || ""))}</div>
          <div class="note-item-meta">${new Date(note.updatedAt || Date.now()).toLocaleString()}</div>
        `;
        item.addEventListener("click", () => {
          openNote(note.id);
          if (window.innerWidth <= 760) closeSidebar();
        });
        noteList.appendChild(item);
      });
    }

    function renderRightPanel() {
      const note = activeNote();

      if (!note) {
        overviewStats.textContent = "Select a note.";
        outlinksBox.innerHTML = `<div class="muted">No links yet.</div>`;
        backlinksBox.innerHTML = `<div class="muted">No backlinks yet.</div>`;
        tagsBox.innerHTML = `<div class="muted">No tags yet.</div>`;
        noteMeta.textContent = "0 words";
        return;
      }

      const links = extractLinks(note.body || "");
      const tags = extractTags(note.body || "");
      const backlinks = notes.filter(other => {
        if (other.id === note.id) return false;
        return extractLinks(other.body || "").some(link => link.toLowerCase() === (note.title || "").toLowerCase());
      });

      overviewStats.innerHTML = `
        <div><strong>Title:</strong> ${escapeHtml(note.title || "Untitled")}</div>
        <div><strong>Words:</strong> ${wordCount(note.body || "")}</div>
        <div><strong>Outgoing:</strong> ${links.length}</div>
        <div><strong>Backlinks:</strong> ${backlinks.length}</div>
        <div><strong>Updated:</strong> ${new Date(note.updatedAt || Date.now()).toLocaleString()}</div>
      `;

      noteMeta.textContent = `${wordCount(note.body || "")} words`;

      if (!links.length) {
        outlinksBox.innerHTML = `<div class="muted">No links yet.</div>`;
      } else {
        outlinksBox.innerHTML = "";
        links.forEach(link => {
          const div = document.createElement("div");
          div.className = "outlink-item";
          div.innerHTML = `
            <div class="outlink-title">${escapeHtml(link)}</div>
            <div class="outlink-preview">Open or create this note.</div>
          `;
          div.addEventListener("click", async () => {
            await openOrCreateNote(link);
          });
          outlinksBox.appendChild(div);
        });
      }

      if (!backlinks.length) {
        backlinksBox.innerHTML = `<div class="muted">No backlinks yet.</div>`;
      } else {
        backlinksBox.innerHTML = "";
        backlinks.forEach(back => {
          const div = document.createElement("div");
          div.className = "backlink-item";
          div.innerHTML = `
            <div class="backlink-title">${escapeHtml(back.title || "Untitled")}</div>
            <div class="backlink-preview">${escapeHtml(previewText(back.body || "", 70))}</div>
          `;
          div.addEventListener("click", () => openNote(back.id));
          backlinksBox.appendChild(div);
        });
      }

      if (!tags.length) {
        tagsBox.innerHTML = `<div class="muted">No tags yet.</div>`;
      } else {
        tagsBox.innerHTML = "";
        tags.forEach(tag => {
          const div = document.createElement("div");
          div.className = "tag-item";
          div.innerHTML = `
            <div class="tag-title">${escapeHtml(tag)}</div>
            <div class="tag-preview">Filter by this tag.</div>
          `;
          div.addEventListener("click", () => {
            searchInput.value = tag;
            filterText = tag.toLowerCase();
            renderList();
          });
          tagsBox.appendChild(div);
        });
      }
    }

    function renderEditor() {
      const note = activeNote();

      if (!note) {
        noteTitle.value = "";
        editor.innerHTML = "";
        renderRightPanel();
        return;
      }

      isRendering = true;
      noteTitle.value = note.title || "";
      editor.innerHTML = renderLinks(note.body || "");
      isRendering = false;

      renderRightPanel();
    }

    function openNote(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;

      activeNoteId = id;
      renderList();
      renderEditor();
    }

    function getEditorPlainText() {
      return editor.innerText.replace(/\u00A0/g, " ").trimEnd();
    }

    async function createNote(title = "Untitled") {
      const payload = {
        title,
        body: "",
        createdAt: Date.now(),
        updatedAt: Date.now()
      };

      const ref = await addDoc(notesRef(), payload);
      return { id: ref.id, ...payload };
    }

    async function updateActiveNote(fields) {
      if (!activeNoteId) return;
      await updateDoc(noteDocRef(activeNoteId), {
        ...fields,
        updatedAt: Date.now()
      });
    }

    async function duplicateActiveNote() {
      const note = activeNote();
      if (!note) return;

      const title = `${note.title || "Untitled"} Copy`;
      const ref = await addDoc(notesRef(), {
        title,
        body: note.body || "",
        createdAt: Date.now(),
        updatedAt: Date.now()
      });

      activeNoteId = ref.id;
      setStatusBrief("Duplicated");
    }

    async function deleteActiveNote() {
      const note = activeNote();
      if (!note) return;

      if (!confirm(`Delete "${note.title || "Untitled"}"?`)) return;

      await deleteDoc(noteDocRef(note.id));
      activeNoteId = null;
      setStatusBrief("Deleted", "Ready");
    }

    function scheduleSave() {
      if (isRendering || !activeNoteId) return;

      clearTimeout(saveTimer);
      setStatus("Saving...");

      saveTimer = setTimeout(async () => {
        try {
          await updateActiveNote({
            title: noteTitle.value.trim() || "Untitled",
            body: getEditorPlainText()
          });
          setStatus("Saved");
        } catch (err) {
          console.error(err);
          setStatus("Save failed");
        }
      }, 500);
    }

    function insertAtCursor(text) {
      editor.focus();
      document.execCommand("insertText", false, text);
      scheduleSave();
    }

    async function openOrCreateNote(title) {
      const existing = findNoteByTitle(title);
      if (existing) {
        openNote(existing.id);
        return;
      }

      const created = await createNote(title.trim() || "Untitled");
      activeNoteId = created.id;
      setStatusBrief("Created linked note");
    }

    async function copyCurrentNote() {
      const note = activeNote();
      if (!note) return;

      const text = `# ${note.title || "Untitled"}\n\n${note.body || ""}`;
      try {
        await navigator.clipboard.writeText(text);
        setStatusBrief("Copied note");
      } catch {
        setStatusBrief("Copy failed", "Saved");
      }
    }

    async function copyCurrentLink() {
      const note = activeNote();
      if (!note) return;

      try {
        await navigator.clipboard.writeText(`[[${note.title || "Untitled"}]]`);
        setStatusBrief("Copied link");
      } catch {
        setStatusBrief("Copy failed", "Saved");
      }
    }

    function openSidebar() {
      sidebarPane.classList.add("open");
      mobileOverlay.classList.add("open");
    }

    function closeSidebar() {
      sidebarPane.classList.remove("open");
      mobileOverlay.classList.remove("open");
    }

    function attachEvents() {
      toggleSidebarBtn.addEventListener("click", () => {
        if (window.innerWidth <= 760) {
          if (sidebarPane.classList.contains("open")) closeSidebar();
          else openSidebar();
        }
      });

      mobileOverlay.addEventListener("click", closeSidebar);

      searchInput.addEventListener("input", () => {
        filterText = searchInput.value.trim().toLowerCase();
        renderList();
      });

      sortUpdatedBtn.addEventListener("click", () => {
        sortMode = "updated";
        renderList();
      });

      sortAlphaBtn.addEventListener("click", () => {
        sortMode = "alpha";
        renderList();
      });

      newNoteBtn.addEventListener("click", async () => {
        try {
          const created = await createNote("Untitled");
          activeNoteId = created.id;
          setStatusBrief("Created");
        } catch (err) {
          console.error(err);
          setStatus("Create failed");
        }
      });

      deleteBtn.addEventListener("click", async () => {
        try {
          await deleteActiveNote();
        } catch (err) {
          console.error(err);
          setStatus("Delete failed");
        }
      });

      duplicateBtn.addEventListener("click", async () => {
        try {
          await duplicateActiveNote();
        } catch (err) {
          console.error(err);
          setStatus("Duplicate failed");
        }
      });

      noteTitle.addEventListener("input", scheduleSave);
      editor.addEventListener("input", scheduleSave);

      editor.addEventListener("click", async (e) => {
        if (!e.target.classList.contains("wiki-link")) return;
        const name = e.target.dataset.link;
        try {
          await openOrCreateNote(name);
        } catch (err) {
          console.error(err);
          setStatus("Link failed");
        }
      });

      insertWikiBtn.addEventListener("click", () => {
        const name = prompt("Link to which note?");
        if (!name) return;
        insertAtCursor(`[[${name.trim()}]]`);
      });

      linkCurrentBtn.addEventListener("click", () => {
        const note = activeNote();
        if (!note) return;
        insertAtCursor(`[[${note.title || "Untitled"}]]`);
      });

      h2Btn.addEventListener("click", () => {
        insertAtCursor(`\n## Heading\n`);
      });

      quoteBtn.addEventListener("click", () => {
        insertAtCursor(`\n> Quote\n`);
      });

      copyNoteBtn.addEventListener("click", copyCurrentNote);
      copyLinkBtn.addEventListener("click", copyCurrentLink);

      document.addEventListener("keydown", async (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          clearTimeout(saveTimer);
          try {
            await updateActiveNote({
              title: noteTitle.value.trim() || "Untitled",
              body: getEditorPlainText()
            });
            setStatusBrief("Saved now");
          } catch (err) {
            console.error(err);
            setStatus("Save failed");
          }
        }
      });
    }

    function subscribeNotes() {
      if (unsubscribeNotes) unsubscribeNotes();

      const q = query(notesRef(), orderBy("updatedAt", "desc"));

      unsubscribeNotes = onSnapshot(q, (snap) => {
        notes = snap.docs.map(docSnap => ({
          id: docSnap.id,
          ...docSnap.data()
        }));

        if (!notes.length) {
          noteList.innerHTML = `<div class="empty-state">No notes yet. Create one to begin.</div>`;
          noteTitle.value = "";
          editor.innerHTML = "";
          renderRightPanel();
          return;
        }

        const existingActive = notes.find(n => n.id === activeNoteId);

        if (!activeNoteId || !existingActive) {
          activeNoteId = notes[0].id;
        }

        renderList();

        const userIsEditing = document.activeElement === editor || document.activeElement === noteTitle;
        if (!userIsEditing) {
          renderEditor();
        } else {
          renderRightPanel();
        }
      });
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "/login.html";
        return;
      }

      currentUser = user;
      workspaceLabel.textContent = `@${user.displayName || (user.email ? user.email.split("@")[0] : "writer")} notes`;
      attachEvents();
      subscribeNotes();
      setStatus("Ready");
    }, (err) => {
      console.error(err);
      setStatus("Auth failed");
    });
  </script>
</body>
</html>
