<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alysum Reader</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --alysum-purple: #6d28d9;
    --alysum-purple-dark: #5b21b6;
    --alysum-purple-soft: rgba(109, 40, 217, 0.18);
    --bg: #07101f;
    --bg-2: #0a1529;
    --panel: #0d1830;
    --panel-2: #101d39;
    --panel-3: #152445;
    --text: #edf2ff;
    --text-soft: #cfd8f3;
    --muted: #a7b4d1;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.16);
    --shadow: 0 20px 50px rgba(0,0,0,0.34);
    --highlight: rgba(255,235,59,0.35);
    --danger: #ef4444;
    --success: #22c55e;
    --max-width: 980px;
    --reader-width: 860px;
    --ui-radius: 20px;
    --card-radius: 24px;
    --font-size: 22px;
    --line-height: 1.9;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top center, rgba(109,40,217,0.14), transparent 26%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* ===== APP FRAME ===== */
.app-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ===== TOPBAR ===== */
.topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(14px);
    background: rgba(7, 16, 31, 0.82);
    border-bottom: 1px solid var(--border);
}

.topbar-inner {
    max-width: 1280px;
    margin: 0 auto;
    min-height: 72px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 12px 16px;
}

.topbar-left,
.topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.topbar-center {
    min-width: 0;
    text-align: center;
}

.topbar-book-title {
    font-size: 16px;
    font-weight: 900;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.topbar-chapter {
    margin-top: 2px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.icon-btn,
.pill-btn,
.mode-btn {
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}

.icon-btn:hover,
.pill-btn:hover,
.mode-btn:hover {
    background: rgba(255,255,255,0.06);
    border-color: var(--border-strong);
}

.icon-btn:active,
.pill-btn:active,
.mode-btn:active {
    transform: scale(0.98);
}

.icon-btn {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.pill-btn {
    min-height: 42px;
    border-radius: 999px;
    padding: 0 14px;
    font-size: 14px;
    font-weight: 800;
    white-space: nowrap;
}

.mode-btn {
    min-height: 38px;
    border-radius: 12px;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 800;
}

.primary-btn {
    background: linear-gradient(135deg, var(--alysum-purple-dark), var(--alysum-purple));
    color: white;
    border: 1px solid transparent;
}

.primary-btn:hover {
    filter: brightness(1.06);
}

/* ===== PAGE LAYOUT ===== */
.page {
    width: 100%;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 20px 16px 120px;
}

/* ===== STORY META ===== */
.story-meta {
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)), var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
    padding: 22px;
    margin-bottom: 18px;
}

.story-kicker {
    color: #c7b8ff;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
}

.story-title {
    margin: 0;
    font-size: 34px;
    line-height: 1.1;
    font-weight: 900;
    color: var(--text);
}

.story-author {
    margin-top: 8px;
    color: var(--text-soft);
    font-size: 15px;
    font-weight: 700;
}

.story-summary {
    margin-top: 14px;
    color: var(--muted);
    line-height: 1.7;
    font-size: 15px;
}

.meta-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-top: 18px;
}

.meta-stat {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px 12px;
}

.meta-stat-label {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 900;
}

.meta-stat-value {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 900;
    color: var(--text);
}

.meta-chips-block {
    margin-top: 16px;
}

.meta-block-title {
    font-size: 12px;
    font-weight: 900;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 8px;
}

.chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.chip {
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--text-soft);
    border-radius: 999px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 800;
    line-height: 1.2;
}

.chip.warning {
    background: rgba(239,68,68,0.10);
    color: #fecaca;
}

.chip.tag {
    background: rgba(109,40,217,0.12);
    color: #ddd6fe;
}

/* ===== CHAPTER BAR ===== */
.chapter-bar {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
    margin-bottom: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 12px;
}

.chapter-center {
    min-width: 0;
    text-align: center;
}

.chapter-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 800;
}

.chapter-current {
    margin-top: 3px;
    font-size: 18px;
    color: var(--text);
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ===== READER CARD ===== */
.reader-card {
    max-width: var(--reader-width);
    margin: 0 auto;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)), var(--panel);
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow);
    overflow: hidden;
}

.reader-head {
    padding: 22px 22px 0;
    text-align: center;
}

.reader-chapter-title {
    margin: 0;
    font-size: 34px;
    line-height: 1.15;
    color: var(--text);
    font-weight: 900;
}

.reader-subtitle {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
}

.reader-body {
    padding: 24px 22px 30px;
}

.content {
    font-family: Georgia, "Times New Roman", serif;
    font-size: var(--font-size);
    line-height: var(--line-height);
    color: var(--text);
    word-wrap: break-word;
}

.content p {
    margin: 0 0 1.15em;
}

.content h1,
.content h2,
.content h3,
.content h4 {
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.25;
    margin: 1.3em 0 0.7em;
    color: var(--text);
}

.content blockquote {
    margin: 1.2em 0;
    padding: 0.2em 0 0.2em 1em;
    border-left: 3px solid var(--alysum-purple);
    color: var(--text-soft);
}

.content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2em 0;
}

.content img {
    max-width: 100%;
    border-radius: 16px;
}

/* ===== PART 2 continues ===== */

/* ===== HIGHLIGHT + COMMENTS ===== */

.highlight {
    background: var(--highlight);
    border-radius: 4px;
    transition: background 0.25s ease;
}

.highlight.active {
    background: rgba(255,235,59,0.65);
}

.comment-anchor {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    margin-left: 4px;
    border-radius: 50%;
    background: var(--alysum-purple);
    color: white;
    font-size: 11px;
    font-weight: 900;
    line-height: 18px;
    cursor: pointer;
    vertical-align: middle;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
}

/* ===== COMMENT PANEL ===== */

.comments-panel {
    max-width: var(--reader-width);
    margin: 18px auto 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 18px;
}

.comments-title {
    font-size: 16px;
    font-weight: 900;
    margin-bottom: 12px;
}

.comment-item {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 10px;
    background: rgba(255,255,255,0.02);
}

.comment-user {
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 6px;
}

.comment-quote {
    font-size: 13px;
    color: var(--muted);
    border-left: 3px solid var(--alysum-purple);
    padding-left: 10px;
    margin-bottom: 8px;
}

.comment-text {
    font-size: 14px;
    line-height: 1.5;
}

/* ===== SELECTION BUBBLE ===== */

.selection-bubble {
    position: absolute;
    display: none;
    z-index: 200;
}

.selection-bubble.open {
    display: block;
}

.selection-inner {
    background: black;
    border-radius: 999px;
    padding: 8px 12px;
    display: flex;
    gap: 8px;
}

.selection-inner button {
    border: none;
    background: transparent;
    color: white;
    font-size: 14px;
    font-weight: 900;
}

/* ===== THREAD MODAL ===== */

.thread-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 300;
}

.thread-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 310;
    padding: 10px;
}

.thread-card {
    max-width: 760px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px 24px 16px 16px;
    padding: 16px;
    max-height: 80vh;
    overflow: auto;
}

.thread-handle {
    width: 54px;
    height: 6px;
    border-radius: 999px;
    background: var(--border);
    margin: 0 auto 14px;
}

.thread-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.thread-title {
    font-size: 20px;
    font-weight: 900;
}

.thread-close {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
}

.thread-quote {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    font-size: 14px;
    margin-bottom: 12px;
}

.thread-messages {
    display: grid;
    gap: 10px;
    margin-bottom: 12px;
}

.thread-msg {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
}

.thread-msg-user {
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 6px;
}

.thread-msg-text {
    font-size: 14px;
    line-height: 1.5;
}

.thread-input {
    width: 100%;
    min-height: 100px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 12px;
    margin-bottom: 10px;
}

.thread-actions {
    display: flex;
    gap: 8px;
}

.thread-actions button {
    flex: 1;
    height: 46px;
    border-radius: 14px;
    font-weight: 900;
}

/* ===== PROGRESS BAR ===== */

.progress-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 4px;
    width: 0%;
    background: linear-gradient(135deg, var(--alysum-purple-dark), var(--alysum-purple));
    z-index: 500;
}

/* ===== MOBILE ===== */

@media (max-width: 760px) {
    .reader-chapter-title {
        font-size: 26px;
    }

    .content {
        font-size: 18px;
    }

    .story-title {
        font-size: 26px;
    }
}

/* ===== END PART 2 CSS ===== */
</style>
</head>
<body>

<div class="app-shell">

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-inner">

        <div class="topbar-left">
            <button class="icon-btn" id="backBtn">←</button>
        </div>

        <div class="topbar-center">
            <div class="topbar-book-title" id="topBookTitle">Loading…</div>
            <div class="topbar-chapter" id="topChapterTitle"></div>
        </div>

        <div class="topbar-right">
            <button class="mode-btn" id="fontBtn">Aa</button>
        </div>

    </div>
</div>

<div class="page">

<!-- STORY META -->
<div class="story-meta" id="storyMeta">
    <div class="story-kicker">Alysum</div>
    <h1 class="story-title" id="metaTitle">Title</h1>
    <div class="story-author" id="metaAuthor">@author</div>
    <div class="story-summary" id="metaSummary"></div>

    <div class="meta-grid">
        <div class="meta-stat">
            <div class="meta-stat-label">Chapters</div>
            <div class="meta-stat-value" id="metaChapters">0</div>
        </div>
        <div class="meta-stat">
            <div class="meta-stat-label">Words</div>
            <div class="meta-stat-value" id="metaWords">0</div>
        </div>
        <div class="meta-stat">
            <div class="meta-stat-label">Type</div>
            <div class="meta-stat-value" id="metaType">—</div>
        </div>
        <div class="meta-stat">
            <div class="meta-stat-label">Rating</div>
            <div class="meta-stat-value" id="metaRating">—</div>
        </div>
    </div>

    <div class="meta-chips-block">
        <div class="meta-block-title">Tags</div>
        <div class="chip-row" id="metaTags"></div>
    </div>

    <div class="meta-chips-block">
        <div class="meta-block-title">Warnings</div>
        <div class="chip-row" id="metaWarnings"></div>
    </div>
</div>
<!-- CHAPTER NAV -->
<div class="chapter-bar">
    <button class="pill-btn" id="prevBtn">◀ Prev</button>

    <div class="chapter-center">
        <div class="chapter-label">Current Chapter</div>
        <div class="chapter-current" id="chapterCurrent">Loading…</div>
    </div>

    <button class="pill-btn" id="nextBtn">Next ▶</button>
</div>

<!-- READER -->
<div class="reader-card">

    <div class="reader-head">
        <h2 class="reader-chapter-title" id="chapterTitle">Chapter</h2>
        <div class="reader-subtitle" id="chapterSubtitle"></div>
    </div>

    <div class="reader-body">
        <div class="content" id="content"></div>
    </div>

</div>

<!-- COMMENTS LIST -->
<div class="comments-panel" id="commentList">
    <div class="comments-title">Comments</div>
</div>

</div> <!-- END PAGE -->

<!-- SELECTION BUBBLE -->
<div class="selection-bubble" id="selectionBubble">
    <div class="selection-inner">
        <button id="commentSelectionBtn">💬 Comment</button>
    </div>
</div>

<!-- PROGRESS -->
<div class="progress-bar" id="progressBar"></div>

</div> <!-- END APP -->

<script type="module">

import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
    doc,
    getDoc,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ===== STATE ===== */

const params = new URLSearchParams(window.location.search);
const bookId = params.get("book");
const startChapterId = params.get("chapter");

let currentUser = null;
let currentBook = null;
let currentChapterIndex = 0;

let selectedQuote = "";
let selectionRange = null;

/* ===== ELEMENTS ===== */

const backBtn = document.getElementById("backBtn");

const topBookTitle = document.getElementById("topBookTitle");
const topChapterTitle = document.getElementById("topChapterTitle");

const metaTitle = document.getElementById("metaTitle");
const metaAuthor = document.getElementById("metaAuthor");
const metaSummary = document.getElementById("metaSummary");

const metaChapters = document.getElementById("metaChapters");
const metaWords = document.getElementById("metaWords");
const metaType = document.getElementById("metaType");
const metaRating = document.getElementById("metaRating");

const metaTags = document.getElementById("metaTags");
const metaWarnings = document.getElementById("metaWarnings");

const chapterTitle = document.getElementById("chapterTitle");
const chapterSubtitle = document.getElementById("chapterSubtitle");
const chapterCurrent = document.getElementById("chapterCurrent");

const content = document.getElementById("content");
const commentList = document.getElementById("commentList");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const selectionBubble = document.getElementById("selectionBubble");
const commentSelectionBtn = document.getElementById("commentSelectionBtn");

const progressBar = document.getElementById("progressBar");

/* ===== HELPERS ===== */

function safeString(v, f=""){ return typeof v==="string" ? v : f; }
function safeArray(v, f=[]){ return Array.isArray(v) ? v : f; }
function safeObject(v, f={}){ return v && typeof v==="object" ? v : f; }

function escapeHtml(str){
    return safeString(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

/* ===== NORMALIZE ===== */

function normalizeBook(raw){
    const data = safeObject(raw,{});

    const chapters = safeArray(data.chapters,[]).map((ch,i)=>{
        const c = safeObject(ch,{});
        return {
            id: safeString(c.id,`ch-${i+1}`),
            title: safeString(c.title,`Chapter ${i+1}`),
            content: safeString(c.content,""),
            order: typeof c.order==="number" ? c.order : i+1
        };
    });

    return {
        id: bookId,
        title: safeString(data.title,"Untitled"),
        author: safeString(data.author,"unknown"),
        summary: safeString(data.summary,""),
        rating: safeString(data.rating,""),
        type: safeString(data.type,""),
        tags: safeArray(data.tags),
        warnings: safeArray(data.warnings),
        chapters
    };
}

/* ===== LOAD BOOK ===== */

async function loadBook(){

    if(!bookId){
        topBookTitle.textContent="No book";
        return;
    }

    try{
        const snap = await getDoc(doc(db,"library",bookId));

        if(!snap.exists()){
            topBookTitle.textContent="Not found";
            return;
        }

        currentBook = normalizeBook(snap.data());

        metaTitle.textContent = currentBook.title;
        metaAuthor.textContent = "@" + currentBook.author;
        metaSummary.textContent = currentBook.summary;

        metaChapters.textContent = currentBook.chapters.length;
        metaWords.textContent = "—";
        metaType.textContent = currentBook.type || "—";
        metaRating.textContent = currentBook.rating || "—";

        metaTags.innerHTML = "";
        currentBook.tags.forEach(t=>{
            const el = document.createElement("div");
            el.className="chip tag";
            el.textContent=t;
            metaTags.appendChild(el);
        });

        metaWarnings.innerHTML = "";
        currentBook.warnings.forEach(w=>{
            const el = document.createElement("div");
            el.className="chip warning";
            el.textContent=w;
            metaWarnings.appendChild(el);
        });

        if(startChapterId){
            const i = currentBook.chapters.findIndex(c=>c.id===startChapterId);
            if(i>=0) currentChapterIndex=i;
        }

        renderChapter();

    }catch(e){
        console.error(e);
        topBookTitle.textContent="Error";
    }
}

/* ===== PART 4 continues ===== */

/* ===== RENDER CHAPTER ===== */

function currentChapter(){
    return currentBook.chapters[currentChapterIndex];
}

function renderChapter(){
    if(!currentBook) return;

    const ch = currentChapter();

    topBookTitle.textContent = currentBook.title;
    topChapterTitle.textContent = ch.title;

    chapterTitle.textContent = ch.title;
    chapterSubtitle.textContent = `Chapter ${currentChapterIndex + 1}`;
    chapterCurrent.textContent = ch.title;

    content.innerHTML = ch.content || "<p>No content yet.</p>";

    clearSelectionUI();
    loadComments();
}

/* ===== NAVIGATION ===== */

prevBtn.addEventListener("click",()=>{
    if(currentChapterIndex > 0){
        currentChapterIndex--;
        renderChapter();
        window.scrollTo({top:0,behavior:"smooth"});
    }
});

nextBtn.addEventListener("click",()=>{
    if(currentChapterIndex < currentBook.chapters.length - 1){
        currentChapterIndex++;
        renderChapter();
        window.scrollTo({top:0,behavior:"smooth"});
    }
});

/* ===== COMMENTS LOAD ===== */

async function loadComments(){
    if(!currentBook) return;

    const ch = currentChapter();
    commentList.innerHTML = `<div class="comments-title">Comments</div>`;

    try{
        const q = query(
            collection(db,"library",bookId,"comments"),
            orderBy("createdAt","desc")
        );

        const snap = await getDocs(q);

        const list = snap.docs
            .map(d=>safeObject(d.data()))
            .filter(c=>safeString(c.chapterId)===safeString(ch.id));

        if(!list.length){
            commentList.innerHTML += `<div class="comment-item">No comments yet.</div>`;
            return;
        }

        list.forEach(c=>{
            const el = document.createElement("div");
            el.className="comment-item";

            el.innerHTML = `
                <div class="comment-user">@${escapeHtml(c.username||"reader")}</div>
                <div class="comment-quote">${escapeHtml(c.quote||"")}</div>
                <div class="comment-text">${escapeHtml(c.text||"")}</div>
            `;

            commentList.appendChild(el);
        });

    }catch(e){
        console.error(e);
        commentList.innerHTML += `<div class="comment-item">Error loading comments.</div>`;
    }
}

/* ===== SELECTION ===== */

function clearSelectionUI(){
    selectionBubble.classList.remove("open");
    selectedQuote="";
    selectionRange=null;
}

function detectSelection(){
    const sel = window.getSelection();

    if(!sel || sel.rangeCount===0){
        clearSelectionUI();
        return;
    }

    const text = sel.toString().trim();

    if(text.length < 3){
        clearSelectionUI();
        return;
    }

    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();

    selectedQuote = text;
    selectionRange = range.cloneRange();

    positionBubble(rect);
}

function positionBubble(rect){
    const bubbleWidth = 140;

    let left = rect.left + window.scrollX + rect.width/2 - bubbleWidth/2;
    let top = rect.top + window.scrollY - 50;

    if(left < 10) left = 10;
    if(left + bubbleWidth > window.innerWidth) left = window.innerWidth - bubbleWidth - 10;

    if(top < 0) top = rect.bottom + window.scrollY + 10;

    selectionBubble.style.left = left + "px";
    selectionBubble.style.top = top + "px";
    selectionBubble.classList.add("open");
}

/* ===== COMMENT CREATE (FIXED AUTH SAFE) ===== */

async function createComment(){
    if(!selectedQuote || !selectionRange){
        alert("Select text first");
        return;
    }

    if(!currentUser){
        alert("You must log in to comment");
        return;
    }

    const text = prompt("Write your comment:");
    if(!text) return;

    const ch = currentChapter();

    try{
        await addDoc(collection(db,"library",bookId,"comments"),{
            uid: currentUser.uid,
            username: currentUser.displayName || currentUser.email || "reader",
            text: text.trim(),
            quote: selectedQuote,
            chapterId: ch.id,
            createdAt: Date.now()
        });

        window.getSelection().removeAllRanges();
        clearSelectionUI();

        await loadComments();

    }catch(e){
        console.error(e);
        alert("Failed to send comment");
    }
}
