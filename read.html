<!DOCTYPE html>
<html>
<head>
<title>Alysum Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>                                               * { box-sizing: border-box; }                         
:root {
    --alysum-purple: #6d28d9;
    --bg: #07101f;                                        --panel: #0d1830;
    --panel-2: #101d39;                                   --text: #edf2ff;
    --muted: #a7b4d1;
    --border: rgba(255,255,255,0.10);
}
                                                      body {
    margin:0;
    background: var(--bg);                                color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}                                                     
/* ===== TOPBAR ===== */
.topbar {                                                 height:70px;
    display:flex;                                         align-items:center;
    justify-content:space-between;
    padding:0 16px;                                       border-bottom:1px solid var(--border);
}                                                     
.icon-btn {
    width:44px;
    height:44px;
    border-radius:14px;
    border:1px solid var(--border);
    background:transparent;
    color:white;
    font-size:20px;                                   }
                                                      /* ===== READER ===== */
.shell {
    max-width:860px;
    margin:auto;
    padding:20px;
}

.reader-card {
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:24px;                                   padding:20px;
}                                                     
.chapter-title {                                          text-align:center;
    font-size:32px;
    margin-bottom:20px;
}

.content {
    font-family: Georgia, serif;                          font-size:24px;                                       line-height:1.9;
}

/* ===== HIGHLIGHT ===== */
.highlight {
    background: rgba(255,235,59,0.35);
    border-radius:4px;
}

/* ===== INLINE COMMENT MARKER ===== */
.comment-anchor {
    display:inline-block;
    width:18px;
    height:18px;
    margin-left:4px;
    border-radius:50%;
    background:var(--alysum-purple);
    color:white;
    font-size:12px;
    font-weight:900;
    text-align:center;
    line-height:18px;
    cursor:pointer;
}

/* ===== COMMENTS ===== */
.comments-card {
    margin-top:20px;
}

.comment-item {
    padding:10px;
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:10px;                               }

/* ===== SELECTION BUBBLE ===== */
.selection-bubble {
    position:absolute;
    display:none;
    background:black;
    padding:8px 12px;                                     border-radius:999px;
    z-index:100;
}

.selection-bubble.open {
    display:block;
}

/* ===== MOBILE ===== */
@media(max-width:760px){
    .content { font-size:20px; }                      }
</style>                                              </head>
                                                      <body>

<div class="topbar">
    <button class="icon-btn" id="backBtn">←</button>
    <div id="topBookTitle">Loading...</div>
</div>

<div class="shell">

<div class="reader-card">
    <div class="chapter-title" id="chapterTitle">Chapter</div>
    <div class="content" id="content"></div>
</div>

<div class="comments-card" id="commentList"></div>
                                                      </div>
                                                      <div class="selection-bubble" id="selectionBubble">
    <button id="commentSelectionBtn">💬 Comment</button>
</div>
<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
    doc,
    getDoc,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);
const bookId = params.get("book");
const startChapterId = params.get("chapter");

const backBtn = document.getElementById("backBtn");
const topBookTitle = document.getElementById("topBookTitle");
const chapterTitle = document.getElementById("chapterTitle");
const content = document.getElementById("content");
const commentList = document.getElementById("commentList");

const selectionBubble = document.getElementById("selectionBubble");
const commentSelectionBtn = document.getElementById("commentSelectionBtn");

let currentUser = null;
let currentBook = null;                               let currentChapterIndex = 0;

let selectedQuote = "";
let selectionRange = null;
let selectedHighlightId = null;
let activeThreadId = null;

function safeString(value, fallback = "") {
    return typeof value === "string" ? value : fallback;
}

function safeArray(value, fallback = []) {                return Array.isArray(value) ? value : fallback;
}                                                     
function safeObject(value, fallback = {}) {
    return value && typeof value === "object" && !Array.isArray(value) ? value : fallback;
}

function escapeHtml(str) {
    return safeString(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function normalizeBook(raw) {
    const data = safeObject(raw, {});
    const chapters = safeArray(data.chapters, []).map((chapter, index) => {
        const item = safeObject(chapter, {});                 return {
            id: safeString(item.id, `chapter-${index + 1}`),
            title: safeString(item.title, `Chapter ${index + 1}`),
            content: safeString(item.content, ""),
            order: typeof item.order === "number" ? item.order : index + 1
        };
    });

    return {
        id: bookId,
        title: safeString(data.title, "Untitled"),
        author: safeString(data.author, "unknown"),
        summary: safeString(data.summary, ""),
        rating: safeString(data.rating, ""),
        type: safeString(data.type, ""),
        tags: safeArray(data.tags, []).filter(tag => typeof tag === "string"),
        warnings: safeArray(data.warnings, []).filter(tag => typeof tag === "string"),
        chapters
    };
}

function currentChapter() {
    return currentBook.chapters[currentChapterIndex];
}

function showToast(text) {
    alert(text);
}

function clearSelectionUI() {
    selectionBubble.classList.remove("open");
    selectedQuote = "";
    selectionRange = null;
    selectedHighlightId = null;

    const threadBackdrop = document.getElementById("threadBackdrop");
    const threadSheet = document.getElementById("threadSheet");
    if (threadBackdrop) threadBackdrop.remove();
    if (threadSheet) threadSheet.remove();
}

function positionSelectionBubble(rect) {                  const bubbleWidth = 160;
    let left = rect.left + window.scrollX + (rect.width / 2) - (bubbleWidth / 2);
    let top = rect.top + window.scrollY - 48;

    if (left < 10) left = 10;
    if (left + bubbleWidth > window.innerWidth - 10) {
        left = window.innerWidth - bubbleWidth - 10;
    }

    if (top < window.scrollY + 10) {
        top = rect.bottom + window.scrollY + 10;
    }                                                 
    selectionBubble.style.left = left + "px";
    selectionBubble.style.top = top + "px";
    selectionBubble.classList.add("open");
}

function selectionInsideContent(range) {
    if (!range) return false;
    const container = range.commonAncestorContainer;
    const element = container.nodeType === 1 ? container : container.parentElement;
    return content.contains(element);
}

function detectSelection() {
    const selection = window.getSelection();

    if (!selection || selection.rangeCount === 0) {
        clearSelectionUI();
        return;
    }

    const text = selection.toString().trim();
    if (text.length < 3) {
        clearSelectionUI();
        return;
    }

    const range = selection.getRangeAt(0);
    if (!selectionInsideContent(range)) {
        clearSelectionUI();
        return;
    }

    const rect = range.getBoundingClientRect();
    if (!rect || (!rect.width && !rect.height)) {
        clearSelectionUI();                                   return;
    }

    selectedQuote = text;
    selectionRange = range.cloneRange();
    positionSelectionBubble(rect);
}

async function loadBook() {
    if (!bookId) {
        topBookTitle.textContent = "No book selected";
        chapterTitle.textContent = "No chapter";
        return;
    }

    try {
        const snap = await getDoc(doc(db, "library", bookId));

        if (!snap.exists()) {
            topBookTitle.textContent = "Story not found";
            chapterTitle.textContent = "Missing story";
            content.innerHTML = "<p>This story does not exist in Alysum Library.</p>";
            return;
        }

        currentBook = normalizeBook(snap.data());

        if (!currentBook.chapters.length) {
            topBookTitle.textContent = currentBook.title;
            chapterTitle.textContent = "No published chapters";
            content.innerHTML = "<p>This story has no published chapters yet.</p>";
            return;
        }

        if (startChapterId) {
            const idx = currentBook.chapters.findIndex(ch => ch.id === startChapterId);
            if (idx >= 0) currentChapterIndex = idx;
        }

        renderChapter();
    } catch (e) {
        console.error(e);
        topBookTitle.textContent = "Error loading";
        chapterTitle.textContent = "Error";
        content.innerHTML = "<p>Something went wrong while loading this story.</p>";
    }                                                 }

function renderChapter() {
    if (!currentBook) return;

    const chapter = currentChapter();

    topBookTitle.textContent = currentBook.title;
    chapterTitle.textContent = chapter.title || `Chapter ${currentChapterIndex + 1}`;
    content.innerHTML = chapter.content || "<p>No chapter text yet.</p>";

    clearSelectionUI();
    loadCommentsForCurrentChapter();
    bindAnchorClicks();
}

async function loadCommentsForCurrentChapter() {
    if (!currentBook) return;

    const chapter = currentChapter();
    commentList.innerHTML = "";

    try {
        const q = query(
            collection(db, "library", bookId, "comments"),
            orderBy("createdAt", "desc")
        );

        const snap = await getDocs(q);

        const comments = snap.docs
            .map(docSnap => safeObject(docSnap.data(), {}))
            .filter(comment => safeString(comment.chapterId) === safeString(chapter.id));

        if (!comments.length) {
            commentList.innerHTML = `<div class="comment-item">No comments on this chapter yet.</div>`;
            return;
        }

        comments.forEach(comment => {
            const item = document.createElement("div");
            item.className = "comment-item";

            const username = safeString(comment.username, "reader");
            const quote = safeString(comment.quote, "");
            const text = safeString(comment.text, "");
            const highlightId = safeString(comment.highlightId, "");

            item.innerHTML = `
                <div><strong>@${escapeHtml(username)}</strong></div>
                <div style="margin:8px 0;color:#a7b4d1;border-left:3px solid #6d28d9;padding-left:10px;">${escapeHtml(quote)}</div>
                <div>${escapeHtml(text)}</div>
            `;

            if (highlightId) {
                item.style.cursor = "pointer";
                item.addEventListener("click", () => {
                    const anchor = document.querySelector(\`.comment-anchor[data-id="\${highlightId}"]\`);                      const highlight = document.querySelector(\`.highlight[data-id="\${highlightId}"]\`);

                    if (highlight) {
                        highlight.scrollIntoView({ behavior: "smooth", block: "center" });
                        highlight.style.background = "rgba(255,235,59,0.75)";
                        setTimeout(() => {
                            highlight.style.background = "";
                        }, 1200);
                    }
                                                                          if (anchor) {
                        anchor.style.transform = "scale(1.2)";
                        setTimeout(() => {
                            anchor.style.transform = "";
                        }, 900);
                    }
                });
            }

            commentList.appendChild(item);
        });
    } catch (e) {
        console.error(e);
        commentList.innerHTML = `<div class="comment-item">Couldn’t load comments right now.</div>`;
    }
}

function goBack() {
    if (document.referrer && document.referrer.includes(location.origin)) {
        history.back();
    } else {
        window.location.href = "/library.html";
    }
}

backBtn.addEventListener("click", goBack);            
onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = "/login.html";
        return;
    }

    currentUser = user;
    await loadBook();
});

document.addEventListener("mouseup", () => {
    requestAnimationFrame(detectSelection);
});

document.addEventListener("touchend", () => {
    setTimeout(detectSelection, 180);
}, { passive: true });

function bindAnchorClicks() {
    content.querySelectorAll(".comment-anchor").forEach(anchor => {
        anchor.addEventListener("click", async (e) => {
            e.stopPropagation();

            const id = anchor.dataset.id;
            if (!id) return;

            activeThreadId = id;
            await openThreadFromAnchor(id);
        });
    });
}

async function openThreadFromAnchor(highlightId) {
    const chapter = currentChapter();
    if (!chapter) return;

    try {
        const q = query(
            collection(db, "library", bookId, "comments"),
            orderBy("createdAt", "asc")
        );

        const snap = await getDocs(q);

        const threadComments = snap.docs
            .map(docSnap => ({ _id: docSnap.id, ...safeObject(docSnap.data(), {}) }))
            .filter(comment =>
                safeString(comment.chapterId) === safeString(chapter.id) &&
                safeString(comment.highlightId) === safeString(highlightId)
            );

        const existingSheet = document.getElementById("threadSheet");
        if (existingSheet) existingSheet.remove();    
        const existingBackdrop = document.getElementById("threadBackdrop");
        if (existingBackdrop) existingBackdrop.remove();

        const backdrop = document.createElement("div");
        backdrop.id = "threadBackdrop";
        backdrop.style.position = "fixed";
        backdrop.style.inset = "0";
        backdrop.style.background = "rgba(0,0,0,0.55)";
        backdrop.style.zIndex = "200";
        document.body.appendChild(backdrop);

        const sheet = document.createElement("div");
        sheet.id = "threadSheet";
        sheet.style.position = "fixed";
        sheet.style.left = "0";
        sheet.style.right = "0";
        sheet.style.bottom = "0";
        sheet.style.zIndex = "210";
        sheet.style.padding = "10px";
        sheet.innerHTML = `
            <div style="
                max-width:760px;
                margin:0 auto;
                background:var(--panel);
                border:1px solid var(--border);
                border-radius:24px 24px 16px 16px;
                box-shadow:0 18px 50px rgba(0,0,0,0.35);
                padding:16px;
                max-height:80vh;
                overflow:auto;
            ">
                <div style="
                    width:54px;
                    height:6px;
                    border-radius:999px;
                    background:var(--border);
                    margin:0 auto 14px;
                "></div>

                <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;">
                    <h3 style="margin:0;font-size:22px;font-weight:900;">Comment Thread</h3>
                    <button id="closeThreadBtn" style="
                        width:42px;
                        height:42px;
                        border-radius:14px;
                        border:1px solid var(--border);
                        background:transparent;
                        color:var(--text);                                    cursor:pointer;
                        font-size:18px;
                    ">✕</button>                                      </div>
                                                                      <div style="
                    background:var(--panel-2);                            border:1px solid var(--border);
                    border-radius:18px;
                    padding:14px;
                    color:var(--muted);
                    font-size:15px;
                    line-height:1.7;                                      white-space:pre-wrap;
                    margin-bottom:12px;
                ">${escapeHtml(threadComments[0]?.quote || "Selected text")}</div>

                <div id="threadMessages" style="display:grid;gap:10px;margin-bottom:12px;">                                     ${
                        threadComments.length                                     ? threadComments.map(comment => `
                                <div style="
                                    background:var(--panel-2);
                                    border:1px solid var(--border);
                                    border-radius:16px;
                                    padding:12px;
                                ">
                                    <div style="font-size:14px;font-weight:800;margin-bottom:6px;">
                                        @${escapeHtml(safeString(comment.username, "reader"))}
                                    </div>                                                <div style="font-size:15px;line-height:1.6;white-space:pre-wrap;">                                              ${escapeHtml(safeString(comment.text, ""))}
                                    </div>                                            </div>
                            `).join("")
                            : `<div style="color:var(--muted);text-align:center;padding:8px 0;">No comments in this thread yet.</div>`
                    }
                </div>
                                                                      <textarea id="threadReplyInput" placeholder="Reply to this highlighted section…" style="                        width:100%;
                    min-height:110px;                                     resize:vertical;
                    border-radius:18px;
                    border:1px solid var(--border);
                    background:var(--panel-2);
                    color:var(--text);                                    padding:14px;
                    outline:none;                                         font-size:16px;
                    line-height:1.6;                                      margin-bottom:12px;                                   font-family:inherit;
                "></textarea>                         
                <div style="display:flex;gap:10px;">
                    <button id="cancelThreadReplyBtn" style="                                                                       flex:1;
                        border:none;                                          border-radius:18px;
                        height:52px;
                        font-size:16px;
                        font-weight:900;
                        cursor:pointer;
                        background:var(--panel-2);
                        color:var(--text);
                        border:1px solid var(--border);
                    ">Close</button>                  
                    <button id="sendThreadReplyBtn" style="
                        flex:1;
                        border:none;                                          border-radius:18px;
                        height:52px;                                          font-size:16px;                                       font-weight:900;
                        cursor:pointer;                                       background:linear-gradient(135deg, var(--alysum-purple), #7c3aed);
                        color:white;
                    ">Send Reply</button>                             </div>
            </div>                                            `;                                                                                                          document.body.appendChild(sheet);
                                                              function closeThread() {                                  backdrop.remove();
            sheet.remove();
        }                                                                                                           backdrop.addEventListener("click", closeThread);                                                            sheet.querySelector("#closeThreadBtn").addEventListener("click", closeThread);
        sheet.querySelector("#cancelThreadReplyBtn").addEventListener("click", closeThread);
                                                              sheet.querySelector("#sendThreadReplyBtn").addEventListener("click", async () => {                              const input = sheet.querySelector("#threadReplyInput");                                                     const text = input.value.trim();

            if (!text) {
                showToast("Write a reply first.");
                return;                                           }                                                                                                           if (!currentUser) {
                showToast("Log in to reply.");
                return;
            }                                         
            try {                                                     await addDoc(collection(db, "library", bookId, "comments"), {
                    uid: currentUser.uid,                                 username: currentUser.displayName || currentUser.email || "reader",                                         text,
                    quote: threadComments[0]?.quote || "",
                    highlightId,                                          chapterId: chapter.id,
                    chapterTitle: chapter.title || `Chapter ${currentChapterIndex + 1}`,                                        createdAt: Date.now()
                });                                   
                closeThread();                                        await loadCommentsForCurrentChapter();
                showToast("Reply sent.");
            } catch (e) {
                console.error(e);                                     showToast("Couldn’t send reply.");
            }                                                 });

    } catch (e) {                                             console.error(e);
        showToast("Couldn’t open thread.");
    }
}

function insertHighlightAnchor(range, highlightId) {
    const mark = document.createElement("mark");          mark.className = "highlight";
    mark.dataset.id = highlightId;                                                                              try {                                                     range.surroundContents(mark);                     } catch (e) {                                             const text = range.toString();
        if (!text) return false;
                                                              const span = document.createElement("span");          span.className = "highlight";                         span.dataset.id = highlightId;                        span.textContent = text;                                                                                    range.deleteContents();                               range.insertNode(span);                           }                                                                                                           const target = content.querySelector(`.highlight[data-id="${highlightId}"]`);                               if (!target) return false;
                                                          const anchor = document.createElement("span");
    anchor.className = "comment-anchor";                  anchor.dataset.id = highlightId;
    anchor.textContent = "💬";                        
    target.insertAdjacentElement("afterend", anchor);     return true;
}                                                                                                           async function createCommentFromSelection() {             if (!selectedQuote || !selectionRange) {                  showToast("Select text first.");                      return;                                           }                                                                                                           if (!currentUser) {                                       showToast("Log in to comment.");
        return;                                           }
                                                          const text = prompt("Leave a comment for the author:");                                                     if (!text || !text.trim()) return;

    const chapter = currentChapter();                     const highlightId = "hl_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);                                                                            try {
        const inserted = insertHighlightAnchor(selectionRange, highlightId);                                                                                              if (!inserted) {
            showToast("Couldn’t anchor that selection.");                                                               return;                                           }
                                                              await addDoc(collection(db, "library", bookId, "comments"), {                                                   uid: currentUser.uid,
            username: currentUser.displayName || currentUser.email || "reader",
            text: text.trim(),
            quote: selectedQuote,                                 highlightId,
            chapterId: chapter.id,                                chapterTitle: chapter.title || `Chapter ${currentChapterIndex + 1}`,                                        createdAt: Date.now()                             });
                                                              bindAnchorClicks();
        clearSelectionUI();                                   window.getSelection()?.removeAllRanges();                                                                   await loadCommentsForCurrentChapter();                showToast("Comment sent.");
    } catch (e) {
        console.error(e);                                     showToast("Couldn’t send comment.");
    }
}                                                     
commentSelectionBtn.addEventListener("click", async () => {
    selectionBubble.classList.remove("open");             await createCommentFromSelection();               });                                                                                                         document.addEventListener("selectionchange", () => {      const selection = window.getSelection();
    if (!selection || !selection.toString().trim()) return;                                                                                                           if (window.innerWidth <= 760) {                           clearTimeout(window.__alysumSelectionTimer);          window.__alysumSelectionTimer = setTimeout(detectSelection, 180);                                       }                                                 });
                                                      document.addEventListener("scroll", () => {
    if (selectionBubble.classList.contains("open")) {         setTimeout(detectSelection, 20);                  }                                                 }, { passive: true });                                                                                      document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {                                 clearSelectionUI();                                   window.getSelection()?.removeAllRanges();     
        const threadBackdrop = document.getElementById("threadBackdrop");
        const threadSheet = document.getElementById("threadSheet");
        if (threadBackdrop) threadBackdrop.remove();          if (threadSheet) threadSheet.remove();
    }                                                 });                                                                                                         
</script>
