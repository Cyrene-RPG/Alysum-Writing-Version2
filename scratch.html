<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ALYSUM:PWA:START -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020b18" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="dark light">
    <meta name="application-name" content="Alysum">
    <meta name="msapplication-TileColor" content="#7c3aed">
    <meta name="msapplication-TileImage" content="Alysum-3.png">
    <link rel="icon" type="image/png" sizes="any" href="Alysum-3.png">
    <link rel="apple-touch-icon" href="Alysum-3.png">
    <link rel="apple-touch-icon" sizes="180x180" href="Alysum-3.png">
    <script src="js/pwa-register.js" defer></script>
    <!-- ALYSUM:PWA:END -->
    <!-- ALYSUM:ANALYTICS:START -->
    <script type="module" src="js/vercel-analytics.js"></script>
    <!-- ALYSUM:ANALYTICS:END -->


    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scratch notes — Alysum</title>
    <script src="js/alysum-appearance-boot.js"></script>
    <link rel="stylesheet" href="css/gradient-themes.css?v=4" />
    <link rel="stylesheet" href="css/workspace-nav.css?v=2" />
    <script src="js/gradient-theme-sync.js" defer></script>
    <link rel="stylesheet" href="css/notebook.css?v=9" />
    <link rel="stylesheet" href="css/site-responsive.css?v=1" />
</head>
<body class="scratch-page">
    <div id="alysum-workspace-nav" data-active="notes"></div>
    <script type="module" src="js/workspace-nav.js?v=2"></script>
    <div class="scratch-shell">
        <header class="scratch-hero">
            <div>
                <h1>Scratch notes</h1>
                <p>
                    Same vault as the full library, synced to your account when signed in. Open the library in another tab anytime.
                </p>
            </div>
            <div class="scratch-hero-actions">
                <a class="scratch-btn scratch-btn-primary" href="vault.html" target="_blank" rel="noopener noreferrer">Open library in new tab</a>
                <a class="scratch-btn scratch-btn-ghost" href="writer-dashboard.html">Studio</a>
            </div>
        </header>

        <div class="scratch-grid">
            <aside class="scratch-panel">
                <div class="scratch-side-head">Tree</div>
                <div class="scratch-side-tools">
                    <button type="button" class="scratch-tool-btn" id="scNewNote">＋ Note</button>
                    <button type="button" class="scratch-tool-btn" id="scNewFolder">📁</button>
                    <button type="button" class="scratch-tool-btn" id="scDel" style="flex:0 0 auto">⌫</button>
                </div>
                <input id="scFind" class="nb-quick-open" type="search" placeholder="Search…" autocomplete="off" style="margin:0;border-radius:0;border-left:none;border-right:none" />
                <div id="scTree" class="scratch-tree"></div>
            </aside>
            <section class="scratch-panel">
                <div class="scratch-editor-head">
                    <input id="scTitle" class="scratch-title-input" type="text" placeholder="Untitled" />
                </div>
                <div id="scBody" class="scratch-body nb-body-ce" contenteditable="false" spellcheck="true" data-placeholder="Jot ideas. [[Note title]] links; matching note titles auto-link after a pause."></div>
                <footer class="scratch-status" id="scStatus">Checking sign-in…</footer>
            </section>
        </div>
    </div>
    <script type="module">
        import { supabase } from "./firebase.js";
        import { bootVaultScratchPage } from "./js/local-studio-pages.js?v=1";

        (async () => {
            await bootVaultScratchPage(
                supabase,
                {
                    tree: document.getElementById("scTree"),
                    find: document.getElementById("scFind"),
                    title: document.getElementById("scTitle"),
                    body: document.getElementById("scBody"),
                    newNote: document.getElementById("scNewNote"),
                    newFolder: document.getElementById("scNewFolder"),
                    deleteItem: document.getElementById("scDel")
                },
                {
                    compact: true,
                    nextPath: "scratch.html",
                    setStatus: msg => {
                        const el = document.getElementById("scStatus");
                        if (el) el.textContent = msg;
                    }
                }
            );
        })();
    </script>
</body>
</html>
