<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Alysum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/site-responsive.css?v=1" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #5b21b6, #7c3aed, #a78bfa);
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        h2 {
            margin: 0 0 15px;
            text-align: center;
            color: #4c1d95;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #6d28d9;
            color: white;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }

        .link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .link a {
            color: #6d28d9;
            text-decoration: none;
            font-weight: 600;
        }

        #error-msg {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
            color: #7f1d1d;
            background: #fee2e2;
            border: 1px solid #fecaca;
        }

        #error-msg.visible {
            display: block;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-left: max(12px, env(safe-area-inset-left, 0px));
                padding-right: max(12px, env(safe-area-inset-right, 0px));
                padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Create Account</h2>

    <input id="username" placeholder="Username" autocomplete="username">
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="new-password">

    <button type="button" id="signup-btn" onclick="signup()">Create Account</button>
    <p id="error-msg" role="alert"></p>

    <div class="link">
        Already have an account? <a href="/login.html">Login</a>
    </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const errorEl = document.getElementById("error-msg");
const signupBtn = document.getElementById("signup-btn");

function showError(text) {
    errorEl.textContent = text;
    errorEl.classList.add("visible");
}

function clearError() {
    errorEl.textContent = "";
    errorEl.classList.remove("visible");
}

function signupAuthMessage(code) {
    switch (code) {
        case "auth/too-many-requests":
            return "Too many attempts from this network. Wait several minutes and try again.";
        case "auth/email-already-in-use":
            return "That email is already registered. Try logging in instead.";
        case "auth/invalid-email":
            return "That email address does not look valid.";
        case "auth/weak-password":
            return "Password is too weak. Use at least 6 characters.";
        case "auth/network-request-failed":
            return "Network error. Check your connection and try again.";
        default:
            return null;
    }
}

let signupInFlight = false;

window.signup = async function () {
    if (signupInFlight) return;

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !email || !password) {
        showError("Fill all fields.");
        return;
    }

    clearError();
    signupInFlight = true;
    signupBtn.disabled = true;

    try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);

        await setDoc(doc(db, "users", cred.user.uid), {
            username: username,
            words: 0,
            books: 0,
            streak: 0,
            dailyWordGoal: 2000,
            writingDayTotals: {}
        });

        window.location.href = "/studio.html";
    } catch (e) {
        const code = e && e.code;
        const friendly = signupAuthMessage(code) || (e && e.message) || "Could not create account.";
        showError(friendly);
    } finally {
        signupInFlight = false;
        signupBtn.disabled = false;
    }
};

document.getElementById("password").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") {
        ev.preventDefault();
        window.signup();
    }
});
</script>

</body>
</html>
