<!DOCTYPE html>
<html>
<head>
    <!-- ALYSUM:PWA:START -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020b18" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="dark light">
    <meta name="application-name" content="Alysum">
    <meta name="msapplication-TileColor" content="#7c3aed">
    <meta name="msapplication-TileImage" content="Alysum-3.png">
    <link rel="icon" type="image/png" sizes="any" href="Alysum-3.png">
    <link rel="apple-touch-icon" href="Alysum-3.png">
    <link rel="apple-touch-icon" sizes="180x180" href="Alysum-3.png">
    <script src="js/pwa-register.js" defer></script>
    <!-- ALYSUM:PWA:END -->
    <!-- ALYSUM:ANALYTICS:START -->
    <script type="module" src="js/vercel-analytics.js"></script>
    <!-- ALYSUM:ANALYTICS:END -->



    <title>Sign Up - Alysum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        try {
            var __g = localStorage.getItem("alysum-gradient-theme");
            if (__g && __g !== "classic") {
                document.documentElement.setAttribute("data-gradient-theme", __g);
            }
        } catch (e) {}
    </script>

    <link rel="stylesheet" href="css/site-responsive.css?v=1" />

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--login-page-bg);
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        h2 {
            margin: 0 0 15px;
            text-align: center;
            color: #4c1d95;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #6d28d9;
            color: white;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }

        .link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .link a {
            color: #6d28d9;
            text-decoration: none;
            font-weight: 600;
        }

        #error-msg {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
            color: #7f1d1d;
            background: #fee2e2;
            border: 1px solid #fecaca;
        }

        #error-msg.visible {
            display: block;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .account-type-label {
            display: block;
            margin: 14px 0 8px;
            font-size: 13px;
            font-weight: 800;
            color: #4c1d95;
            letter-spacing: 0.03em;
        }

        .account-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .account-option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 12px;
            border-radius: 12px;
            border: 2px solid #e9d5ff;
            cursor: pointer;
            background: #faf5ff;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .account-option:has(input:checked) {
            border-color: #6d28d9;
            background: #f3e8ff;
        }

        .account-option input {
            margin: 4px 0 0;
            width: auto;
            accent-color: #6d28d9;
        }

        .account-option-text strong {
            display: block;
            font-size: 14px;
            color: #4c1d95;
            margin-bottom: 2px;
        }

        .account-option-text span {
            font-size: 12px;
            color: #6b21a8;
            line-height: 1.35;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 14px;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .btn-oauth {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            background: #fff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .btn-oauth svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .btn-oauth-discord svg {
            fill: #5865f2;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-left: max(12px, env(safe-area-inset-left, 0px));
                padding-right: max(12px, env(safe-area-inset-right, 0px));
                padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
            }
        }
    </style>

    <link rel="stylesheet" href="css/gradient-themes.css?v=2" />
</head>

<body>

<div class="card">
    <h2>Create Account</h2>

    <span class="account-type-label" id="accountTypeLabel">How will you use Alysum?</span>

    <div class="account-options" role="radiogroup" aria-labelledby="accountTypeLabel">
        <label class="account-option">
            <input type="radio" name="accountType" value="author" checked />
            <span class="account-option-text">
                <strong>Author</strong>
                <span>Write in Studio, publish, and track your projects.</span>
            </span>
        </label>

        <label class="account-option">
            <input type="radio" name="accountType" value="reader" />
            <span class="account-option-text">
                <strong>Reader</strong>
                <span>Start on your Reading home, then browse the Library and leave feedback.</span>
            </span>
        </label>

        <label class="account-option">
            <input type="radio" name="accountType" value="both" />
            <span class="account-option-text">
                <strong>Both</strong>
                <span>Switch any time between Studio and Reading from the top bar.</span>
            </span>
        </label>
    </div>

    <button type="button" id="google-btn" class="btn-oauth" aria-label="Sign up with Google">
        Continue with Google
    </button>

    <button type="button" id="discord-btn" class="btn-oauth btn-oauth-discord" aria-label="Sign up with Discord">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20.317 4.369A19.791 19.791 0 0 0 16.558 3a13.74 13.74 0 0 0-.481.974 18.27 18.27 0 0 0-4.154 0A12.64 12.64 0 0 0 11.442 3a19.736 19.736 0 0 0-3.76 1.37C5.303 7.91 4.657 11.36 4.98 14.76a19.9 19.9 0 0 0 4.607 2.339c.37-.504.701-1.04.984-1.602a12.83 12.83 0 0 1-1.55-.744c.13-.095.258-.193.382-.294 2.987 1.38 6.226 1.38 9.177 0 .125.101.253.199.383.294-.494.29-1.013.54-1.553.745.283.56.612 1.097.984 1.601A19.86 19.86 0 0 0 23 14.76c.378-3.953-.646-7.371-2.683-10.391ZM10.19 12.67c-.897 0-1.635-.826-1.635-1.842 0-1.016.723-1.843 1.635-1.843.92 0 1.65.834 1.635 1.843 0 1.016-.723 1.842-1.635 1.842Zm6.19 0c-.897 0-1.635-.826-1.635-1.842 0-1.016.723-1.843 1.635-1.843.92 0 1.65.834 1.635 1.843 0 1.016-.715 1.842-1.635 1.842Z" />
        </svg>
        Continue with Discord
    </button>

    <div class="auth-divider" role="presentation"><span>or with email</span></div>

    <input id="username" placeholder="Username" autocomplete="username">
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="new-password">

    <button type="button" id="signup-btn" onclick="signup()">Create Account</button>
    <p id="error-msg" role="alert"></p>

    <div class="link">
        Already have an account? <a href="login.html">Login</a>
    </div>
</div>

<script type="module">
import { supabase } from "./firebase.js";
import { authRedirectUrl } from "./js/auth-redirect.js?v=1";
import { wireSupabaseSession } from "./js/supabase-session.js?v=1";
import {
    ACCOUNT_AUTHOR,
    ACCOUNT_BOTH,
    ACCOUNT_READER,
    READER_HOME_URL,
    homeUrlForUserData,
    setUiMode,
} from "./js/account-mode.js?v=1";

const OAUTH_PENDING_KEY = "alysum-oauth-pending";
let oauthSignupHandled = false;

const SIGNUP_ACCOUNT_TYPE_KEY = "alysum-signup-account-type";

const errorEl = document.getElementById("error-msg");
const signupBtn = document.getElementById("signup-btn");
const googleBtn = document.getElementById("google-btn");
const discordBtn = document.getElementById("discord-btn");

const oauthButtons = [googleBtn, discordBtn];

function setOAuthButtonsDisabled(disabled) {
    for (const btn of oauthButtons) {
        btn.disabled = disabled;
    }
}

function pickedAccountType() {
    const typeInput = document.querySelector('input[name="accountType"]:checked');
    return typeInput ? typeInput.value : ACCOUNT_BOTH;
}

function isValidAccountType(accountType) {
    return (
        accountType === ACCOUNT_AUTHOR ||
        accountType === ACCOUNT_READER ||
        accountType === ACCOUNT_BOTH
    );
}

function oauthUsernameFromUser(user) {
    const meta = user.user_metadata || {};
    const raw =
        meta.username ||
        meta.preferred_username ||
        meta.global_name ||
        meta.full_name ||
        meta.name ||
        (user.email ? user.email.split("@")[0] : "");
    const cleaned = String(raw || "")
        .trim()
        .replace(/^@/, "")
        .replace(/\s+/g, "")
        .slice(0, 32);
    return cleaned || `user${user.id.slice(0, 8)}`;
}

function redirectAfterSignup(accountType, userData) {
    if (accountType === ACCOUNT_READER) {
        setUiMode("library");
        window.location.href = READER_HOME_URL;
        return;
    }
    setUiMode("studio");
    window.location.href = userData
        ? homeUrlForUserData(userData)
        : "studio.html";
}

function showError(text) {
    errorEl.textContent = text;
    errorEl.classList.add("visible");
}

function clearError() {
    errorEl.textContent = "";
    errorEl.classList.remove("visible");
}

function signupAuthMessage(message) {
    if (!message) return "Could not create account.";

    const lower = message.toLowerCase();

    if (lower.includes("already registered") || lower.includes("already exists")) {
        return "That email is already registered. Try logging in instead.";
    }

    if (lower.includes("invalid email")) {
        return "That email address does not look valid.";
    }

    if (lower.includes("password")) {
        return "Password is too weak. Use at least 6 characters.";
    }

    if (lower.includes("network")) {
        return "Network error. Check your connection and try again.";
    }

    if (
        lower.includes("rate limit") ||
        lower.includes("too many requests") ||
        lower.includes("email rate") ||
        lower.includes("rate exceeded")
    ) {
        return "Too many sign-up emails were sent this hour (Supabase project limit). Wait about an hour or email alysum.support@gmail.com.";
    }

    return message;
}

async function goAfterOAuthSignup() {
    if (oauthSignupHandled) return;
    oauthSignupHandled = true;
    try {
        sessionStorage.removeItem(OAUTH_PENDING_KEY);
    } catch {
        /* ignore */
    }
    await completeOAuthSignup();
}

async function startOAuth(provider) {
    const accountType = pickedAccountType();

    if (!isValidAccountType(accountType)) {
        showError("Pick how you will use Alysum.");
        return;
    }

    clearError();
    setOAuthButtonsDisabled(true);
    signupBtn.disabled = true;

    try {
        sessionStorage.setItem(OAUTH_PENDING_KEY, "1");
        sessionStorage.setItem(SIGNUP_ACCOUNT_TYPE_KEY, accountType);
    } catch {
        /* ignore */
    }

    const { error } = await supabase.auth.signInWithOAuth({
        provider,
        options: {
            redirectTo: authRedirectUrl("signup.html"),
            data: {
                accountType
            }
        }
    });

    if (error) {
        try {
            sessionStorage.removeItem(OAUTH_PENDING_KEY);
        } catch {
            /* ignore */
        }
        showError(error.message);
        setOAuthButtonsDisabled(false);
        signupBtn.disabled = false;
    }
}

googleBtn.addEventListener("click", () => startOAuth("google"));
discordBtn.addEventListener("click", () => startOAuth("discord"));

function isOAuthReturn() {
    const hash = window.location.hash || "";
    const params = new URLSearchParams(window.location.search);
    return hash.length > 2 || !!params.get("code");
}

async function completeOAuthSignup() {
    const { data: userData } = await supabase.auth.getUser();
    const user = userData && userData.user;

    if (!user) return;

    let accountType = ACCOUNT_BOTH;
    try {
        const stored = sessionStorage.getItem(SIGNUP_ACCOUNT_TYPE_KEY);
        sessionStorage.removeItem(SIGNUP_ACCOUNT_TYPE_KEY);
        if (stored && isValidAccountType(stored)) accountType = stored;
    } catch {
        /* ignore */
    }

    const metaType = user.user_metadata && user.user_metadata.accountType;
    if (isValidAccountType(metaType)) accountType = metaType;

    const { data: row, error: rowError } = await supabase
        .from("users")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

    if (rowError) {
        showError(rowError.message);
        return;
    }

    if (row) {
        redirectAfterSignup(row.account_type, {
            accountType: row.account_type,
            account_type: row.account_type
        });
        return;
    }

    const username =
        (user.user_metadata && user.user_metadata.username) ||
        oauthUsernameFromUser(user);
    const displayName =
        (user.user_metadata && user.user_metadata.displayName) ||
        (user.user_metadata && user.user_metadata.full_name) ||
        username;

    const { error: profileError } = await supabase.from("users").insert({
        id: user.id,
        username,
        display_name: displayName,
        account_type: accountType,
        words: 0,
        streak: 0,
        daily_word_goal: 2000,
        writing_day_totals: {}
    });

    if (profileError) {
        showError(profileError.message);
        return;
    }

    redirectAfterSignup(accountType);
}

wireSupabaseSession(async (session, event) => {
    if (!session || event === "SIGNED_OUT") return;
    await goAfterOAuthSignup();
});

if (isOAuthReturn()) {
    void (async () => {
        for (let i = 0; i < 50; i++) {
            if (oauthSignupHandled) return;
            const { data } = await supabase.auth.getSession();
            if (data.session) {
                await goAfterOAuthSignup();
                return;
            }
            await new Promise((resolve) => setTimeout(resolve, 200));
        }
        if (!oauthSignupHandled) {
            showError("Discord sign-up did not finish. Try again.");
        }
    })();
}

let signupInFlight = false;

window.signup = async function () {
    if (signupInFlight) return;

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const accountType = pickedAccountType();

    if (!username || !email || !password) {
        showError("Fill all fields.");
        return;
    }

    if (!isValidAccountType(accountType)) {
        showError("Pick how you will use Alysum.");
        return;
    }

    clearError();
    signupInFlight = true;
    signupBtn.disabled = true;
    setOAuthButtonsDisabled(true);

    try {
        const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
                data: {
                    username,
                    displayName: username,
                    accountType
                }
            }
        });

        if (error) {
            const signupMsg =
                error.code === "over_email_send_rate_limit"
                    ? signupAuthMessage("email rate limit exceeded")
                    : signupAuthMessage(error.message);
            showError(signupMsg);
            return;
        }

        const user = data.user;

        if (!user) {
            showError("Account created, but login session was not started. Try logging in.");
            return;
        }

        const { error: profileError } = await supabase
            .from("users")
            .insert({
                id: user.id,
                username: username,
                display_name: username,
                account_type: accountType,
                words: 0,
                streak: 0,
                daily_word_goal: 2000,
                writing_day_totals: {}
            });

        if (profileError) {
            showError(profileError.message);
            return;
        }

        redirectAfterSignup(accountType);

    } catch (e) {
        showError((e && e.message) || "Could not create account.");
    } finally {
        signupInFlight = false;
        signupBtn.disabled = false;
        setOAuthButtonsDisabled(false);
    }
};

document.getElementById("password").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") {
        ev.preventDefault();
        window.signup();
    }
});
</script>

</body>
</html>
