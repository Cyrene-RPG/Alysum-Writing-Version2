<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020b18" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="dark light">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story Wiki — Alysum</title>
    <link rel="icon" type="image/png" href="Alysum-3.png" />
    <script src="js/alysum-appearance-boot.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/site-responsive.css?v=1" />
    <link rel="stylesheet" href="css/gradient-themes.css?v=4" />
    <link rel="stylesheet" href="css/workspace-nav.css?v=4" />
    <link rel="stylesheet" href="css/wiki-vector.css?v=10" />
    <script src="js/gradient-theme-sync.js" defer></script>
    <script type="module" src="js/vercel-analytics.js"></script>
</head>
<body class="alysum-with-workspace-nav alysum-tool-scroll wiki-page wiki-creator">
    <div id="alysum-workspace-nav" data-active="story-wiki"></div>
    <script type="module" src="js/workspace-nav.js?v=4"></script>

    <div class="mw-page-container">
        <header class="mw-header vector-header">
            <div class="vector-header-start">
                <a href="wiki.html" class="mw-logo" id="wikiLogoLink">
                    <span class="mw-logo-icon" aria-hidden="true">📖</span>
                    <span class="mw-logo-container">
                        <span class="mw-logo-wordmark">Story Wiki</span>
                        <span class="mw-logo-tagline">Create lore · publish when ready</span>
                    </span>
                </a>
            </div>
            <div class="vector-header-search">
                <form id="wikiSearchForm" class="vector-search-box" role="search">
                    <div class="cdx-search-input">
                        <input type="search" id="wikiSearchInput" class="cdx-text-input__input" placeholder="Filter articles in this book…" autocomplete="off" aria-label="Filter articles" />
                        <button type="submit" class="cdx-button cdx-button--action-progressive">Search</button>
                    </div>
                </form>
            </div>
            <div class="vector-header-end">
                <nav class="vector-user-links" id="wikiHeaderBrowseNav" aria-label="Personal tools">
                    <ul>
                        <li><a href="lore-wiki.html">Lore Wiki</a></li>
                        <li><a href="settings.html">Settings</a></li>
                        <li><button type="button" class="wiki-plain-btn" data-logout-btn>Log out</button></li>
                    </ul>
                </nav>
                <nav class="vector-user-links wiki-header-edit-nav" id="wikiHeaderEditNav" aria-label="Editor actions" hidden>
                    <ul>
                        <li><a class="wiki-header-articles" id="wikiHeaderArticles" href="wiki.html">← Articles</a></li>
                        <li><span class="wiki-badge wiki-badge-live" id="wikiHeaderEditBadge" hidden>On Lore Wiki</span></li>
                        <li><button type="button" class="wiki-header-btn" id="wikiHeaderCancel">Cancel</button></li>
                        <li><button type="submit" class="wiki-header-btn wiki-header-btn-primary" id="wikiHeaderSave" form="wikiEditForm">Save</button></li>
                    </ul>
                </nav>
            </div>
        </header>

        <div class="mw-body wiki-creator-body" id="wikiBody">
            <main class="mw-content-container wiki-creator-main" id="wikiMain">
                <div class="vector-page-toolbar" id="wikiPageToolbar" hidden>
                    <div class="vector-page-titlebar">
                        <h1 class="firstHeading mw-first-heading" id="wikiPageTitle"></h1>
                    </div>
                </div>

                <div class="mw-body-content" id="wikiContent">
                    <div id="wikiContentSub" class="mw-content-sub"></div>
                    <div id="wikiBodyContent" class="mw-body-content-inner">
                        <div class="mw-parser-output" id="wikiParserOutput">
                            <p>Loading…</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <footer class="mw-footer" id="wikiFooter">
            <ul id="wikiFooterInfo">
                <li id="wikiLastModified"></li>
            </ul>
            <div class="mw-footer-powered">Private drafts · publish articles to Lore Wiki for readers</div>
        </footer>
    </div>

    <script type="module">
        import { bootWiki } from "./js/wiki/boot.js?v=9";
        bootWiki().catch((e) => {
            console.error("[wiki]", e);
            document.getElementById("wikiParserOutput").innerHTML =
                '<div class="error">Story Wiki failed to start. <a href="login.html">Sign in</a> and refresh.</div>';
        });
    </script>
</body>
</html>
