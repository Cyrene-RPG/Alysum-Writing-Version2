<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.webmanifest">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word War sprint — Alysum</title>
    <script src="js/alysum-appearance-boot.js"></script>
    <link rel="stylesheet" href="css/site-responsive.css?v=1" />
    <link rel="stylesheet" href="css/gradient-themes.css?v=5" />
    <link rel="stylesheet" href="css/book-inline-images.css?v=1" />
    <script src="js/gradient-theme-sync.js" defer></script>
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #070b14;
            --panel: #0f1628;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255,255,255,0.08);
            --gold: #fbbf24;
            --mint: #34d399;
            --purple: var(--theme-header-end, #7c3aed);
            --editor-page-bg: #111827;
            --editor-page-text: #e5e7eb;
            --editor-workspace-bg: #0b1220;
        }
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .hidden { display: none !important; }
        .ww-sprint-shell {
            height: 100dvh;
            display: grid;
            grid-template-rows: auto 1fr;
            min-height: 0;
        }
        .ww-sprint-hud {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(8,12,22,0.94);
            backdrop-filter: blur(10px);
            z-index: 20;
        }
        .ww-sprint-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            min-width: 0;
        }
        .ww-sprint-book {
            font-size: 13px;
            font-weight: 800;
            color: var(--text);
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .ww-sprint-words {
            font-size: 11px;
            font-weight: 800;
            color: var(--gold);
            font-variant-numeric: tabular-nums;
        }
        .ww-sprint-code {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
        }
        .ww-share-pill {
            font-size: 11px;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--muted);
        }
        .ww-share-pill.is-live {
            color: #99f6e4;
            border-color: rgba(52,211,153,0.28);
            background: rgba(52,211,153,0.1);
        }
        .ww-share-pill.is-paused {
            color: #fde68a;
            border-color: rgba(251,191,36,0.28);
            background: rgba(251,191,36,0.1);
        }
        .ww-sprint-timer-wrap { text-align: center; }
        .ww-sprint-timer {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 900;
            letter-spacing: 0.06em;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .ww-sprint-timer.is-urgent {
            color: #fb7185;
            text-shadow: 0 0 24px rgba(251,113,133,0.35);
        }
        .ww-sprint-timer.is-paused {
            color: #fde68a;
            text-shadow: 0 0 24px rgba(251,191,36,0.25);
        }
        .ww-sprint-timer-mode {
            margin-top: 4px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .ww-sprint-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
            min-width: 0;
        }
        .btn {
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }
        .btn.primary {
            background: linear-gradient(135deg, var(--theme-header-mid, #5b21b6), var(--purple));
            border: none;
        }
        .btn.gold {
            background: linear-gradient(135deg, #b45309, var(--gold));
            border: none;
            color: #111827;
        }
        .btn.mint {
            background: rgba(52,211,153,0.14);
            border-color: rgba(52,211,153,0.35);
            color: #99f6e4;
        }
        .btn.pause {
            background: rgba(251,191,36,0.12);
            border-color: rgba(251,191,36,0.28);
            color: #fde68a;
        }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .ww-sprint-status {
            margin: 0 16px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(15,22,40,0.8);
            color: var(--muted);
            font-size: 13px;
        }
        .ww-sprint-status.error {
            color: #fecaca;
            border-color: rgba(239,68,68,0.35);
            background: rgba(127,29,29,0.2);
        }
        .ww-duel-grid {
            display: none;
        }
        .ww-sprint-body {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
            min-height: 0;
        }
        .ww-sprint-shell.is-writers-collapsed .ww-sprint-body {
            grid-template-columns: minmax(0, 1fr);
        }
        .ww-sprint-shell.is-writers-collapsed .ww-writers-rail {
            display: none;
        }
        .ww-editor-stage {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: 1fr;
            background: var(--editor-workspace-bg);
        }
        .ww-writers-rail {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: auto 1fr;
            border-left: 1px solid var(--border);
            background: rgba(8,12,22,0.72);
        }
        .ww-writers-rail-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.22);
        }
        .ww-writers-rail-head .ww-duel-label { margin: 0; }
        .ww-writers-rail-head .ww-duel-title {
            margin: 2px 0 0;
            font-size: 13px;
        }
        .btn.ghost {
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            padding: 8px 10px;
        }
        .btn.ghost.is-active {
            color: #c4b5fd;
            border-color: rgba(167,139,250,0.35);
            background: rgba(124,58,237,0.12);
        }
        @media (max-width: 900px) {
            .ww-sprint-body {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) minmax(180px, 34vh);
            }
            .ww-sprint-shell.is-writers-collapsed .ww-sprint-body {
                grid-template-rows: minmax(0, 1fr);
            }
            .ww-writers-rail {
                border-left: none;
                border-top: 1px solid var(--border);
            }
        }
        .ww-opponents-panel {
            height: 100%;
            overflow: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .ww-opponent-block {
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            background: rgba(255,255,255,0.02);
        }
        .ww-opponent-block-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .ww-opponent-block-name {
            margin: 0 0 4px;
            font-size: 16px;
            font-weight: 900;
        }
        .ww-opponent-block-book {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
        }
        .ww-opponent-block-score {
            font-size: 12px;
            font-weight: 800;
            color: var(--gold);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .ww-opponent-block-empty {
            padding: 16px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }
        .ww-opponent-block-page {
            border-radius: 12px;
            background: var(--editor-page-bg);
            color: var(--editor-page-text);
            padding: 20px 18px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
        }
        .ww-opponent-block-title {
            margin: 0 0 12px;
            font-size: 18px;
            font-weight: 900;
        }
        .ww-opponent-block-editor {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 16px;
            line-height: 1.7;
        }
        .ww-opponent-block-editor div,
        .ww-opponent-block-editor p { margin: 0; text-indent: 2em; }
        .ww-opponent-block-editor div:first-child,
        .ww-opponent-block-editor p:first-child { text-indent: 0; }
        .ww-duel-label {
            margin: 0;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .ww-duel-title {
            margin: 2px 0 0;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -0.02em;
        }
        .ww-duel-sub {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
        }
        .ww-duel-score {
            text-align: right;
            font-size: 12px;
            font-weight: 800;
            color: var(--gold);
            font-variant-numeric: tabular-nums;
        }
        .ww-duel-frame-wrap {
            min-height: 0;
            height: 100%;
            position: relative;
            background: var(--editor-workspace-bg);
        }
        .ww-duel-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: var(--editor-workspace-bg);
        }
        .ww-opponent-scroll {
            height: 100%;
            overflow: auto;
            padding: 20px clamp(16px, 3vw, 40px) 40px;
        }
        .ww-opponent-page {
            max-width: 760px;
            margin: 0 auto;
            background: var(--editor-page-bg);
            color: var(--editor-page-text);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            padding: clamp(32px, 5vw, 72px) clamp(24px, 4vw, 96px);
            min-height: 70vh;
        }
        .ww-opponent-chapter-title {
            margin: 0 0 18px;
            font-size: clamp(22px, 3vw, 30px);
            font-weight: 900;
            letter-spacing: -0.02em;
        }
        .ww-opponent-editor {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 20px;
            line-height: 1.75;
            color: var(--editor-page-text);
        }
        .ww-opponent-editor div,
        .ww-opponent-editor p { margin: 0; text-indent: 2em; }
        .ww-opponent-editor div:first-child,
        .ww-opponent-editor p:first-child { text-indent: 0; }
        .ww-opponent-empty {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
            background: rgba(8,12,22,0.88);
            color: var(--muted);
        }
        .ww-opponent-empty strong {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 16px;
        }
        .ww-recap-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(2,8,20,0.78);
            backdrop-filter: blur(8px);
        }
        .ww-recap-card {
            width: min(100%, 520px);
            border: 1px solid rgba(167,139,250,0.25);
            border-radius: 22px;
            padding: 28px;
            background: linear-gradient(180deg, rgba(26,35,54,0.98), rgba(10,14,26,0.98));
            box-shadow: 0 24px 64px rgba(0,0,0,0.45);
        }
        .ww-recap-card h2 { margin: 0 0 16px; font-size: 24px; font-weight: 900; }
        .ww-recap-headline { margin: 0 0 18px; color: var(--gold); font-size: 16px; font-weight: 800; }
        .ww-recap-scores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .ww-recap-score {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
        }
        .ww-recap-score strong { display: block; font-size: 32px; margin: 6px 0; }
        .ww-recap-label, .ww-recap-sub {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .ww-recap-note { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.5; }
        .ww-recap-actions { display: flex; flex-wrap: wrap; gap: 10px; }
        .ww-preview-banner {
            margin: 0;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(124, 58, 237, 0.35);
            background: rgba(124, 58, 237, 0.12);
            color: #ddd6fe;
            font-size: 12px;
            line-height: 1.45;
        }
    </style>
</head>
<body>
    <p id="previewBanner" class="ww-preview-banner hidden">
        Sprint preview — your real <strong>editor.html</strong> loads on the left. Side rail writers are mock data only.
    </p>
    <div class="ww-sprint-shell">
        <header class="ww-sprint-hud">
            <div class="ww-sprint-meta">
                <span class="ww-sprint-code">Word War · <span id="roomCode">------</span></span>
                <span id="myBookTitle" class="ww-sprint-book">Loading…</span>
                <span id="myWords" class="ww-sprint-words">0 words</span>
                <span id="sharePill" class="ww-share-pill">Draft hidden</span>
            </div>
            <div class="ww-sprint-timer-wrap">
                <div id="sprintTimer" class="ww-sprint-timer">00:00</div>
                <div id="timerMode" class="ww-sprint-timer-mode">Sprint</div>
            </div>
            <div class="ww-sprint-actions">
                <button type="button" class="btn ghost is-active" id="writersToggle">Writers</button>
                <button type="button" class="btn pause" id="pauseBtn">Request pause</button>
                <button type="button" class="btn mint" id="shareBtn">Share my draft</button>
                <button type="button" class="btn gold" id="finishBtn">End sprint</button>
                <button type="button" class="btn" id="leaveBtn">Lobby</button>
            </div>
        </header>

        <div id="pageStatus" class="ww-sprint-status hidden"></div>

        <div class="ww-sprint-body">
            <section class="ww-editor-stage">
                <div class="ww-duel-frame-wrap">
                    <iframe id="myEditorFrame" class="ww-duel-frame" title="Your editor"></iframe>
                </div>
            </section>

            <aside class="ww-writers-rail" id="writersRail">
                <div class="ww-writers-rail-head">
                    <div>
                        <p class="ww-duel-label">Other writers</p>
                        <p class="ww-duel-title" id="opponentsSummary">Waiting for friends…</p>
                    </div>
                </div>
                <div id="opponentsPanel" class="ww-opponents-panel"></div>
            </aside>
        </div>
    </div>

    <div id="recapOverlay" class="ww-recap-overlay hidden">
        <div class="ww-recap-card">
            <h2>Sprint recap</h2>
            <div id="recapBody"></div>
            <div class="ww-recap-actions">
                <button type="button" class="btn primary" id="recapLobbyBtn">Back to lobby</button>
                <a class="btn" href="word-wars-lobby.html">New Word War</a>
            </div>
        </div>
    </div>

    <script type="module" src="js/word-wars-sprint.js?v=7"></script>
</body>
</html>
