<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ALYSUM:PWA:START -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020b18" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="dark light">
    <meta name="application-name" content="Alysum">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Alysum">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#7c3aed">
    <meta name="msapplication-TileImage" content="/Alysum-3.png">
    <link rel="icon" type="image/png" sizes="any" href="/Alysum-3.png">
    <link rel="apple-touch-icon" href="/Alysum-3.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/Alysum-3.png">
    <script src="/js/pwa-register.js" defer></script>
    <!-- ALYSUM:PWA:END -->
    <meta charset="UTF-8" />
    <title>World building — Alysum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        try {
            var __g = localStorage.getItem("alysum-gradient-theme");
            if (__g && __g !== "classic") document.documentElement.setAttribute("data-gradient-theme", __g);
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="/css/site-responsive.css?v=1" />
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top center, var(--theme-body-spot) 0%, transparent 26%),
                linear-gradient(180deg, #0d1426 0%, #0b1220 100%);
            color: #fff;
        }
        .wb-header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 18px;
            background: linear-gradient(135deg, var(--purple-dark), var(--theme-header-mid), var(--theme-header-end));
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.28);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .wb-header-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: #fff7ed;
        }
        .wb-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .wb-btn {
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.22);
            color: #fff;
            padding: 8px 12px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .wb-btn:hover {
            background: rgba(0, 0, 0, 0.35);
        }
        .wb-btn-primary {
            background: linear-gradient(135deg, var(--purple-dark), var(--purple));
            border-color: transparent;
        }
        .wb-loading {
            max-width: 820px;
            margin: 0 auto;
            padding: 32px 18px;
            font-size: 15px;
            font-weight: 700;
            color: #94a3b8;
        }
        .wb-loading.hidden {
            display: none !important;
        }
        .hidden {
            display: none !important;
        }
        .wb-wrap {
            max-width: 820px;
            margin: 0 auto;
            padding: 20px 18px 48px;
        }
        .wb-wrap.hidden {
            display: none;
        }
        .wb-lead {
            margin: 0 0 8px;
            font-size: 15px;
            line-height: 1.55;
            color: #cbd5e1;
            font-weight: 600;
        }
        .wb-status {
            margin: 0 0 18px;
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
        }
        .wb-status.ok {
            color: #86efac;
        }
        .wb-status.warn {
            color: #fcd34d;
        }
        .wb-section {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            margin-bottom: 10px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(17, 24, 39, 0.95), rgba(15, 23, 42, 0.98));
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
        }
        .wb-section-head {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border: none;
            background: rgba(0, 0, 0, 0.22);
            color: var(--gold);
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -0.01em;
        }
        .wb-section-head:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .wb-section-head[aria-expanded="true"] {
            background: color-mix(in srgb, var(--purple-bright) 18%, rgba(0, 0, 0, 0.35));
        }
        .wb-chev {
            flex-shrink: 0;
            font-size: 11px;
            color: #cbd5e1;
            transition: transform 0.18s ease;
        }
        .wb-section-head[aria-expanded="true"] .wb-chev {
            transform: rotate(180deg);
        }
        .wb-section-panel {
            padding: 0 16px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .wb-section-panel[hidden] {
            display: none !important;
        }
        .wb-mini {
            margin: 12px 0 10px;
            padding-left: 18px;
            font-size: 12px;
            line-height: 1.5;
            color: #94a3b8;
            font-weight: 600;
        }
        .wb-mini li {
            margin-bottom: 4px;
        }
        .wb-ta {
            width: 100%;
            min-height: 140px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.28);
            color: #f1f5f9;
            font: inherit;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }
        .wb-ta:focus {
            border-color: color-mix(in srgb, var(--purple-bright) 45%, transparent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--purple-bright) 15%, transparent);
        }
        .wb-section-actions {
            margin-top: 10px;
        }
        .wb-toolbar {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .wb-danger {
            border-color: rgba(248, 113, 113, 0.35);
            color: #fecaca;
            background: rgba(127, 29, 29, 0.25);
        }
        .wb-danger:hover {
            background: rgba(127, 29, 29, 0.4);
        }
        @media (max-width: 560px) {
            .wb-header {
                flex-direction: column;
                align-items: stretch;
            }
            .wb-header-actions {
                justify-content: flex-start;
            }
        }
    </style>
    <link rel="stylesheet" href="/css/gradient-themes.css?v=2" />
</head>
<body>
    <header class="wb-header">
        <div class="wb-header-title">World building</div>
        <div class="wb-header-actions">
            <a class="wb-btn" href="/writer-resources.html">← Resources</a>
            <a class="wb-btn" href="/studio.html">Studio</a>
        </div>
    </header>

    <p class="wb-loading" id="wbLoading">Checking sign-in…</p>

    <main class="wb-wrap hidden" id="wbMain">
        <p class="wb-lead">
            Open one section at a time. No maps—text only. Syncs to your Alysum account like Studio books and the notes library (one sheet per signed-in user).
        </p>
        <p class="wb-status" id="saveStatus">Loading…</p>

        <div class="wb-acc-root" id="wbSections"></div>

        <div class="wb-toolbar">
            <button type="button" class="wb-btn wb-btn-primary" id="copyAllBtn">Copy all sections</button>
            <button type="button" class="wb-btn wb-danger" id="clearBtn">Clear all (cloud)</button>
        </div>
    </main>

    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const LEGACY_LOCAL_KEY = "alysum-worldbuilding-sheet-v1";
        const SECTION_KEYS = ["geo", "people", "power", "economy", "belief", "daily", "tension", "magic"];
        const SECTION_META = [
            {
                key: "geo",
                title: "Geography & environment",
                bullets: ["Landforms, climate, travel times, natural resources", "Where people feel safe vs exposed"],
                placeholder: "Terrain, seasons, borders, landmarks…"
            },
            {
                key: "people",
                title: "Peoples & cultures",
                bullets: ["Who lives here, languages, food, dress, manners", "What outsiders get wrong"],
                placeholder: "Groups, customs, slurs to avoid, celebrations…"
            },
            {
                key: "power",
                title: "Power & law",
                bullets: ["Who decides, who enforces, who pays for what", "Laws people break anyway"],
                placeholder: "Government, factions, courts, crime, surveillance…"
            },
            {
                key: "economy",
                title: "Economy & work",
                bullets: ["How most people earn a living", "What is scarce, cheap, or smuggled"],
                placeholder: "Trade, labor, guilds, debt, black markets…"
            },
            {
                key: "belief",
                title: "Beliefs & traditions",
                bullets: ["What people treat as sacred or taboo", "Rites of passage, superstitions, holidays"],
                placeholder: "Religion, myths, oaths, funerals, luck…"
            },
            {
                key: "daily",
                title: "Daily life",
                bullets: ["Homes, meals, noise, light after dark", "What a boring Tuesday looks like"],
                placeholder: "School, chores, entertainment, gossip…"
            },
            {
                key: "tension",
                title: "Conflicts & story hooks",
                bullets: ["Open fronts: who wants what, who blocks whom", "Secrets that could blow up"],
                placeholder: "Wars, feuds, shortages, prophecies, betrayals…"
            },
            {
                key: "magic",
                title: "Magic or technology",
                bullets: ["What exists, who can access it, what it costs", "How it changed ordinary life"],
                placeholder: "Rules, limits, accidents, black markets, fear…"
            }
        ];

        const saveStatus = document.getElementById("saveStatus");
        const wbMain = document.getElementById("wbMain");
        const wbLoading = document.getElementById("wbLoading");
        const wbSections = document.getElementById("wbSections");

        let sheetRef = null;
        let saveTimer = null;
        let migratedLocal = false;

        function sectionTitlesMap() {
            const o = {};
            for (const s of SECTION_META) o[s.key] = s.title;
            return o;
        }
        const SECTION_TITLES = sectionTitlesMap();

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function renderSections() {
            wbSections.innerHTML = SECTION_META.map(
                (s) => `
                <div class="wb-section" data-key="${s.key}">
                    <button type="button" class="wb-section-head" aria-expanded="false" aria-controls="wb-panel-${s.key}" id="wb-head-${s.key}">
                        <span>${escapeHtml(s.title)}</span>
                        <span class="wb-chev" aria-hidden="true">▼</span>
                    </button>
                    <div class="wb-section-panel" id="wb-panel-${s.key}" role="region" aria-labelledby="wb-head-${s.key}" hidden>
                        <ul class="wb-mini">
                            ${s.bullets.map((b) => `<li>${escapeHtml(b)}</li>`).join("")}
                        </ul>
                        <textarea class="wb-ta" id="wb-${s.key}" placeholder="${escapeHtml(s.placeholder)}" aria-label="${escapeHtml(s.title)}"></textarea>
                        <div class="wb-section-actions">
                            <button type="button" class="wb-btn" data-copy="${s.key}">Copy section</button>
                        </div>
                    </div>
                </div>
            `
            ).join("");

            wbSections.querySelectorAll(".wb-section-head").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const key = btn.closest(".wb-section")?.getAttribute("data-key");
                    if (!key) return;
                    toggleSection(key);
                });
            });

            wbSections.querySelectorAll("[data-copy]").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const key = btn.getAttribute("data-copy");
                    if (!key) return;
                    copyText(sectionBlock(key).trim());
                });
            });

            for (const k of SECTION_KEYS) {
                document.getElementById("wb-" + k)?.addEventListener("input", scheduleCloudSave);
            }
        }

        function toggleSection(key) {
            const section = wbSections.querySelector(`.wb-section[data-key="${key}"]`);
            if (!section) return;
            const head = section.querySelector(".wb-section-head");
            const panel = section.querySelector(".wb-section-panel");
            const open = head.getAttribute("aria-expanded") === "true";
            if (open) {
                head.setAttribute("aria-expanded", "false");
                panel.hidden = true;
                return;
            }
            wbSections.querySelectorAll(".wb-section").forEach((sec) => {
                const h = sec.querySelector(".wb-section-head");
                const p = sec.querySelector(".wb-section-panel");
                h.setAttribute("aria-expanded", "false");
                p.hidden = true;
            });
            head.setAttribute("aria-expanded", "true");
            panel.hidden = false;
        }

        function collectState() {
            const o = {};
            for (const k of SECTION_KEYS) {
                const el = document.getElementById("wb-" + k);
                o[k] = el ? el.value : "";
            }
            return o;
        }

        function applyState(state) {
            for (const k of SECTION_KEYS) {
                const el = document.getElementById("wb-" + k);
                if (el) el.value = typeof state[k] === "string" ? state[k] : "";
            }
        }

        function hasAnyContent(obj) {
            return SECTION_KEYS.some((k) => (obj[k] || "").trim().length > 0);
        }

        function stateFromDocData(data) {
            const state = {};
            for (const k of SECTION_KEYS) {
                state[k] = typeof data[k] === "string" ? data[k] : "";
            }
            return state;
        }

        function loadLegacyLocal() {
            try {
                const raw = localStorage.getItem(LEGACY_LOCAL_KEY);
                if (!raw) return {};
                const o = JSON.parse(raw);
                return o && typeof o === "object" ? o : {};
            } catch {
                return {};
            }
        }

        function sectionBlock(key) {
            const el = document.getElementById("wb-" + key);
            const body = (el && el.value.trim()) || "(empty)";
            return SECTION_TITLES[key] + "\n" + body + "\n\n";
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(
                () => alert("Copied."),
                () => alert("Could not copy — try selecting text manually.")
            );
        }

        function scheduleCloudSave() {
            if (!sheetRef) return;
            saveStatus.textContent = "Saving…";
            saveStatus.classList.remove("ok", "warn");
            clearTimeout(saveTimer);
            saveTimer = setTimeout(async () => {
                try {
                    const payload = { ...collectState(), updated: Date.now() };
                    await setDoc(sheetRef, payload, { merge: true });
                    saveStatus.textContent = "Saved to your account";
                    saveStatus.classList.add("ok");
                } catch (e) {
                    console.error(e);
                    saveStatus.textContent = "Could not save — check connection and try again.";
                    saveStatus.classList.add("warn");
                }
            }, 550);
        }

        async function tryMigrateLocalToCloud() {
            if (migratedLocal || !sheetRef) return;
            const local = loadLegacyLocal();
            if (!hasAnyContent(local)) return;
            migratedLocal = true;
            try {
                await setDoc(sheetRef, { ...local, updated: Date.now() }, { merge: true });
                applyState(local);
                localStorage.removeItem(LEGACY_LOCAL_KEY);
            } catch (e) {
                console.warn("Local worldbuilding migrate failed:", e);
                migratedLocal = false;
            }
        }

        renderSections();

        document.getElementById("copyAllBtn")?.addEventListener("click", () => {
            let out = "";
            for (const k of SECTION_KEYS) out += sectionBlock(k);
            copyText(out.trim());
        });

        document.getElementById("clearBtn")?.addEventListener("click", async () => {
            if (!sheetRef) return;
            if (!confirm("Erase all world building sections from your account? This cannot be undone.")) return;
            const empty = {};
            for (const k of SECTION_KEYS) empty[k] = "";
            empty.updated = Date.now();
            try {
                await setDoc(sheetRef, empty, { merge: true });
                applyState(empty);
                saveStatus.textContent = "Cleared";
                saveStatus.classList.remove("ok");
                saveStatus.classList.add("warn");
            } catch (e) {
                console.error(e);
                alert("Could not clear — try again.");
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "/login.html?next=" + encodeURIComponent("/worldbuilding.html");
                return;
            }

            sheetRef = doc(db, "users", user.uid, "worldbuilding", "data");
            wbLoading.classList.add("hidden");
            wbMain.classList.remove("hidden");
            saveStatus.textContent = "Loading…";
            saveStatus.classList.remove("ok", "warn");

            try {
                const snap = await getDoc(sheetRef);
                const data = snap.exists() ? snap.data() || {} : {};
                let state = stateFromDocData(data);
                applyState(state);

                if (!hasAnyContent(state)) {
                    await tryMigrateLocalToCloud();
                }

                saveStatus.textContent = "Saved to your account";
                saveStatus.classList.add("ok");
            } catch (err) {
                console.error(err);
                saveStatus.textContent = "Could not load sheet — refresh or try again.";
                saveStatus.classList.add("warn");
            }
        });
    </script>
</body>
</html>
