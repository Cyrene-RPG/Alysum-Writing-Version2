<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ALYSUM:PWA:START -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020b18" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="dark light">
    <meta name="application-name" content="Alysum">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Alysum">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#7c3aed">
    <meta name="msapplication-TileImage" content="/Alysum-3.png">
    <link rel="icon" type="image/png" sizes="any" href="/Alysum-3.png">
    <link rel="apple-touch-icon" href="/Alysum-3.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/Alysum-3.png">
    <script src="/js/pwa-register.js" defer></script>
    <!-- ALYSUM:PWA:END -->
    <meta charset="UTF-8" />
    <title>World building — Alysum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        try {
            var __g = localStorage.getItem("alysum-gradient-theme");
            if (__g && __g !== "classic") document.documentElement.setAttribute("data-gradient-theme", __g);
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="/css/site-responsive.css?v=1" />
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top center, var(--theme-body-spot) 0%, transparent 26%),
                linear-gradient(180deg, #0d1426 0%, #0b1220 100%);
            color: #fff;
        }
        .wb-bar {
            position: sticky;
            top: 0;
            z-index: 10;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 18px;
            background: linear-gradient(135deg, var(--purple-dark), var(--theme-header-mid), var(--theme-header-end));
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.28);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: #fff7ed;
        }
    </style>
    <link rel="stylesheet" href="/css/gradient-themes.css?v=2" />
</head>
<body>
    <header class="wb-bar">World building</header>
</body>
</html>
