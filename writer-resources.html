<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ALYSUM:PWA:START -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020b18" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="dark light">
    <meta name="application-name" content="Alysum">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Alysum">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#7c3aed">
    <meta name="msapplication-TileImage" content="/Alysum-3.png">
    <link rel="icon" type="image/png" sizes="any" href="/Alysum-3.png">
    <link rel="apple-touch-icon" href="/Alysum-3.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/Alysum-3.png">
    <script src="/js/pwa-register.js" defer></script>
    <!-- ALYSUM:PWA:END -->
    <meta charset="UTF-8" />
    <title>Writer Resources — Alysum</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        try {
            var __g = localStorage.getItem("alysum-gradient-theme");
            if (__g && __g !== "classic") document.documentElement.setAttribute("data-gradient-theme", __g);
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="/css/site-responsive.css?v=1" />
    <style>
        * { box-sizing: border-box; }

        :root {
            --wr-bg: #0b1220;
            --wr-border: rgba(255, 255, 255, 0.08);
            --wr-shadow: 0 20px 50px rgba(0, 0, 0, 0.42);
            --wr-soft: rgba(255, 255, 255, 0.04);
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top center, var(--theme-body-spot) 0%, transparent 26%),
                linear-gradient(180deg, #0d1426 0%, var(--wr-bg) 100%);
            color: #fff;
        }

        .wr-header {
            position: sticky;
            top: 0;
            z-index: 50;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 16px;
            background: linear-gradient(135deg, var(--purple-dark), var(--theme-header-mid), var(--theme-header-end));
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.28);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .wr-header-left,
        .wr-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .wr-brand {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--purple-bright), var(--pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: white;
            font-size: 15px;
            flex-shrink: 0;
        }

        .wr-kicker {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--theme-brand-kicker, #c4b5fd);
        }

        .wr-page-title {
            font-size: 17px;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: #fff7ed;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn,
        .link-btn {
            border: 1px solid var(--wr-border);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.22);
            color: #fff;
            padding: 8px 12px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
            transition: background 0.16s ease, border-color 0.16s ease;
        }

        .btn:hover,
        .link-btn:hover {
            background: rgba(0, 0, 0, 0.32);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .btn.primary,
        .link-btn.primary {
            background: linear-gradient(135deg, var(--purple-dark), var(--purple));
            border-color: transparent;
        }

        .layout {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px;
        }

        .wr-board {
            background: linear-gradient(180deg, rgba(17, 24, 39, 0.98), rgba(15, 23, 42, 0.98));
            border: 1px solid var(--wr-border);
            border-radius: 20px;
            box-shadow: var(--wr-shadow);
            overflow: hidden;
        }

        .wr-jump {
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            border-bottom: 1px solid var(--wr-border);
        }

        .wr-jump a {
            color: #e2e8f0;
            text-decoration: none;
            font-weight: 800;
        }

        .wr-jump a:hover {
            text-decoration: underline;
        }

        .wr-main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: stretch;
        }

        .wr-col {
            padding: 16px 18px 18px;
            min-width: 0;
        }

        .wr-col + .wr-col {
            border-left: 1px solid var(--wr-border);
        }

        .wr-h {
            margin: 0 0 12px;
            font-size: 15px;
            font-weight: 900;
            color: var(--gold);
            scroll-margin-top: 72px;
        }

        .name-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .name-toolbar input[type="search"] {
            flex: 1 1 160px;
            min-width: 0;
            border: 1px solid var(--wr-border);
            border-radius: 12px;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.65);
            color: #fff;
            outline: none;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
        }

        .name-toolbar input:focus {
            border-color: color-mix(in srgb, var(--purple-bright) 45%, transparent);
        }

        .name-meta {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            min-height: 1.25em;
        }

        .name-results-wrap {
            border: 1px solid var(--wr-border);
            border-radius: 12px;
            background: var(--wr-soft);
            max-height: min(40vh, 300px);
            overflow: auto;
        }

        .name-results-wrap::-webkit-scrollbar {
            width: 8px;
        }

        .name-results-wrap::-webkit-scrollbar-thumb {
            background: color-mix(in srgb, var(--purple-bright) 45%, transparent);
            border-radius: 999px;
        }

        .name-empty {
            padding: 16px;
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
        }

        .result-list {
            display: flex;
            flex-direction: column;
        }

        .result-item {
            border-bottom: 1px solid var(--wr-border);
            padding: 8px 12px;
            transition: background 0.12s ease;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .result-name {
            font-weight: 800;
            font-size: 14px;
            color: #fff7ed;
        }

        .result-meta {
            margin-top: 2px;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.35;
        }

        .tool-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tool-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 12px;
            border-radius: 12px;
            border: 1px solid var(--wr-border);
            background: var(--wr-soft);
        }

        .tool-row h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 900;
            color: #fff7ed;
        }

        .wr-roadmap {
            border-top: 1px solid var(--wr-border);
            padding: 12px 16px 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 10px;
            background: rgba(0, 0, 0, 0.12);
        }

        .wr-roadmap-label {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #64748b;
            width: 100%;
        }

        @media (min-width: 801px) {
            .wr-roadmap-label {
                width: auto;
                margin-right: 6px;
            }
        }

        .chip {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            color: #cbd5e1;
            border: 1px solid var(--wr-border);
            background: rgba(255, 255, 255, 0.03);
        }

        @media (max-width: 800px) {
            .wr-main-grid {
                grid-template-columns: 1fr;
            }

            .wr-col + .wr-col {
                border-left: none;
                border-top: 1px solid var(--wr-border);
            }

            .wr-header {
                flex-direction: column;
                align-items: stretch;
            }

            .wr-header-actions {
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .name-results-wrap {
                max-height: min(48vh, 280px);
            }
        }
    </style>
    <link rel="stylesheet" href="/css/gradient-themes.css?v=2" />
</head>
<body>
    <header class="wr-header">
        <div class="wr-header-left">
            <div class="wr-brand" aria-hidden="true">A</div>
            <div>
                <div class="wr-kicker">Alysum</div>
                <div class="wr-page-title">Writer resources</div>
            </div>
        </div>
        <div class="wr-header-actions">
            <a class="link-btn" href="/studio.html">← Studio</a>
            <a class="link-btn" href="/library.html">Library</a>
            <a class="link-btn" href="/editor.html">Editor</a>
            <a class="link-btn" href="/settings.html">⚙️ Theme</a>
        </div>
    </header>

    <main class="layout">
        <div class="wr-board">
            <div class="wr-jump">
                <a href="#name-finder">Names</a>
                ·
                <a href="#character-tools">Checklists</a>
                ·
                <a href="#coming-soon">Roadmap</a>
            </div>

            <div class="wr-main-grid">
                <section class="wr-col" id="name-finder">
                    <h2 class="wr-h">Names</h2>
                    <div class="name-toolbar">
                        <input
                            id="nameSearch"
                            type="search"
                            placeholder="Filter…"
                            autocomplete="off"
                            aria-describedby="nameLibraryStatus"
                        />
                        <button class="btn primary" id="randomNameBtn" type="button">Random 6</button>
                    </div>
                    <div class="name-meta" id="nameLibraryStatus">Loading…</div>
                    <div class="name-results-wrap">
                        <div class="result-list" id="nameResults"></div>
                    </div>
                </section>

                <section class="wr-col" id="character-tools">
                    <h2 class="wr-h">Checklists</h2>
                    <div class="tool-list">
                        <div class="tool-row">
                            <h3>Character profile</h3>
                            <button class="btn" type="button" onclick="copyChecklist()">Copy</button>
                        </div>
                        <div class="tool-row">
                            <h3>Worldbuilding</h3>
                            <button class="btn" type="button" onclick="copyWorldPrompts()">Copy</button>
                        </div>
                    </div>
                </section>
            </div>

            <div class="wr-roadmap" id="coming-soon">
                <span class="wr-roadmap-label">Roadmap</span>
                <span class="chip">Surnames</span>
                <span class="chip">Fantasy names</span>
                <span class="chip">Places</span>
                <span class="chip">Arc templates</span>
                <span class="chip">Tropes</span>
                <span class="chip">Publishing</span>
            </div>
        </div>
    </main>

    <script>
        let NAME_LIBRARY = [];
        const MAX_MATCH_DISPLAY = 120;

        const nameSearch = document.getElementById("nameSearch");
        const nameResults = document.getElementById("nameResults");
        const randomNameBtn = document.getElementById("randomNameBtn");
        const nameLibraryStatus = document.getElementById("nameLibraryStatus");

        function renderEmptyPrompt() {
            nameResults.innerHTML = `<div class="name-empty">Type to filter, or Random 6.</div>`;
        }

        function renderNames(items) {
            if (!items.length) {
                nameResults.innerHTML = `<div class="name-empty">No matches.</div>`;
                nameLibraryStatus.textContent = "0 matches";
                return;
            }

            const total = items.length;
            const shown = items.slice(0, MAX_MATCH_DISPLAY);
            const truncated = total > MAX_MATCH_DISPLAY;

            nameLibraryStatus.textContent = truncated
                ? `${shown.length} of ${total.toLocaleString()} (narrow search)`
                : `${total.toLocaleString()} shown`;

            nameResults.innerHTML = shown
                .map(
                    (item) => `
                <div class="result-item">
                    <div class="result-name">${escapeHtml(item.name)}</div>
                    <div class="result-meta">${escapeHtml(item.type)} · ${escapeHtml(item.origin)} · ${escapeHtml(item.meaning)}</div>
                </div>
            `
                )
                .join("");
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        async function loadNameLibrary() {
            try {
                const response = await fetch("/resources/names.json", { cache: "no-store" });
                if (!response.ok) throw new Error("names.json not found");
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error("names.json must be an array");

                NAME_LIBRARY = data.filter((item) => item && item.name && item.origin && item.meaning && item.type);
                nameLibraryStatus.textContent = `${NAME_LIBRARY.length.toLocaleString()} names`;
            } catch (error) {
                console.warn(error);
                NAME_LIBRARY = [];
                nameLibraryStatus.textContent = "Names file missing";
            }

            searchNames();
        }

        function searchNames() {
            if (!NAME_LIBRARY.length) {
                nameResults.innerHTML = `<div class="name-empty">Names data not available.</div>`;
                return;
            }

            const q = nameSearch.value.trim().toLowerCase();
            if (!q) {
                renderEmptyPrompt();
                nameLibraryStatus.textContent = `${NAME_LIBRARY.length.toLocaleString()} names`;
                return;
            }

            const filtered = NAME_LIBRARY.filter(
                (item) =>
                    item.name.toLowerCase().includes(q) ||
                    item.origin.toLowerCase().includes(q) ||
                    item.meaning.toLowerCase().includes(q) ||
                    item.type.toLowerCase().includes(q)
            );
            renderNames(filtered);
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => alert("Copied."));
        }

        function copyChecklist() {
            copyText(
                `Character Profile Checklist\n\nName:\nAliases:\nAge:\nRole in story:\nAppearance:\nVoice / speech style:\nPersonality:\nGoal:\nFear:\nSecret:\nStrength:\nFlaw:\nBackstory wound:\nImportant relationships:\nArc / how they change:\nContinuity notes:`
            );
        }

        function copyWorldPrompts() {
            copyText(
                `Worldbuilding Prompts\n\nWhat does this society value most?\nWho holds power?\nWhat do people fear?\nWhat is considered taboo?\nWhat technology or magic exists?\nWhat do people eat?\nWhat slang or greetings are common?\nWhat is the biggest current conflict?\nHow does daily life differ by class or region?`
            );
        }

        window.copyChecklist = copyChecklist;
        window.copyWorldPrompts = copyWorldPrompts;

        nameSearch.addEventListener("input", searchNames);
        randomNameBtn.addEventListener("click", () => {
            if (!NAME_LIBRARY.length) return;
            const shuffled = [...NAME_LIBRARY].sort(() => Math.random() - 0.5);
            nameSearch.value = "";
            renderNames(shuffled.slice(0, 6));
            nameLibraryStatus.textContent = "6 random";
        });

        loadNameLibrary();
    </script>
</body>
</html>
