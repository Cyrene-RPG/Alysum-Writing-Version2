<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#020b18" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="dark light">
    <title>Writer's Lounge — Alysum</title>
    <script src="js/alysum-appearance-boot.js"></script>
    <link rel="stylesheet" href="css/site-responsive.css?v=1" />
    <link rel="stylesheet" href="css/gradient-themes.css?v=7" />
    <link rel="stylesheet" href="css/workspace-nav.css?v=11" />
    <link rel="stylesheet" href="css/writer-camp.css?v=15" />
    <script src="js/gradient-theme-sync.js" defer></script>
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background: #0b1220;
            color: #f1f5f9;
        }
        html[data-lounge-theme="light"] body {
            background: #e8e4dc;
            color: #2d2d2d;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
        }
        .is-hidden { display: none !important; }
        #schemaBanner[hidden],
        #statusBanner[hidden] { display: none !important; }
        #statusBanner {
            padding: 8px 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            background: rgba(124, 58, 237, 0.18);
            border-bottom: 1px solid var(--lounge-border-strong, rgba(255,255,255,0.14));
        }
        #statusBanner[data-error="1"] {
            background: rgba(239, 68, 68, 0.16);
            color: #fecaca;
        }
        .camp-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 40;
        }
        .camp-modal-panel {
            width: min(560px, 100%);
            background: var(--lounge-panel, #111827);
            border: 1px solid var(--lounge-border-strong, rgba(255,255,255,0.14));
            border-radius: 0;
            overflow: hidden;
        }
        .camp-modal-panel .camp-reply-table {
            margin: 0;
            border: none;
        }
        .camp-modal-panel input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 0;
            padding: 6px 8px;
            border-radius: 0;
            border: 1px solid var(--lounge-border-strong, rgba(255,255,255,0.14));
            background: var(--lounge-panel-2, #151f35);
            color: inherit;
            font: inherit;
            font-size: 12px;
        }
        .camp-btn-ghost {
            background: transparent;
            border-color: var(--lounge-border-strong, rgba(255,255,255,0.14));
        }
    </style>
</head>
<body class="dark">
    <div id="alysum-workspace-nav" data-active="writers-lounge"></div>

    <div class="camp-design-banner" id="schemaBanner" hidden>
        Run <code>supabase-writer-lounge.sql</code> then <code>supabase-writer-lounge-realtime.sql</code> in Supabase.
    </div>
    <div id="statusBanner" hidden></div>

    <div class="camp-page">
        <div class="camp-shell">
            <div id="loungeRoot">
                <p class="camp-page-desc">Loading Writer's Lounge…</p>
            </div>
        </div>
    </div>

    <script type="module" src="js/workspace-nav.js?v=11"></script>
    <script type="module">
        import { supabase } from "./firebase.js";
        import { requireStudioSession } from "./js/studio-session.js?v=3";
        import { initWriterLoungeApp } from "./js/writer-lounge-app.js?v=13";

        async function boot() {
            const session = await requireStudioSession(
                supabase,
                window.location.pathname + window.location.search
            );
            if (!session?.user) return;

            initWriterLoungeApp(session);
        }

        boot();
    </script>
</body>
</html>
